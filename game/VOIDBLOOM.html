      blastDmg: 1 + lv('volatile') * 0.12,
      chill: lv('rime') * PASSIVES.rime.per,
      splash: lv('fate') * 0.32,
      splashR: lv('fate') * 28
    };
    // ---- relics that live in the stat block -------------------------------
    if (this.rel('secondbreath')) S.maxHp = Math.max(30, Math.round(S.maxHp * 0.8));
    if (this.rel('nullplate'))    S.dmgMul *= 0.92;
    if (this.rel('resonance'))  { S.extraProj += 1; S.cdMul *= 1.12; }
    if (this.rel('rimewalk'))     S.speed *= 0.9;
    if (this.rel('spool'))        S.speed *= 0.9;
    if (this.rel('seedheart'))    S.magnet *= 0.75;
    if (this.rel('emberskin'))    S.dr *= 1.10;
    if (this.rel('deafear'))      S.dr *= 0.85;
    if (this.rel('counterturn'))  S.cdMul *= 0.70;
    // ---- covenants -------------------------------------------------------
    if (this.cov('openhand'))   S.dmgMul *= 1.55;
    if (this.cov('longbreath')) { S.maxHp = Math.round(S.maxHp * 1.8); S.cdMul *= 1.2; }
    if (this.cov('glutton'))    S.magnet *= 0.5;
    if (this.cov('thorn'))      S.dr *= 1.25;
    if (this.cov('shallow'))  { S.speed *= 1.45; S.maxHp = Math.max(20, Math.round(S.maxHp * 0.5)); }
    if (this.cov('ironward'))  { S.dr *= 0.65; S.dmgMul *= 0.8; }
    this.stats = S;
    if (this.player) {
      const d = S.maxHp - this.player.maxHp;
      this.player.maxHp = S.maxHp;
      if (d > 0) this.player.hp += d;
      this.player.hp = Math.min(this.player.hp, this.player.maxHp);
    }
  },

  /* -------------------------------------------------------------- relics */
  relicTick(dt) {
    const p = this.player;
    if (!p || p.dead) return;

    // EMBERSKIN -- a burning aura for three seconds after you are hit
    if (this.rel('emberskin') && this.time < (this.relicT.ember || 0)) {
      if (!this.relicT.emberCd || this.time >= this.relicT.emberCd) {
        this.relicT.emberCd = this.time + 0.25;
        const near = this.queryEnemies(p.x, p.y, 145);
        for (const e of near) {
          if (e.dead || e.spawnT > 0) continue;
          if (dist2(e.x, e.y, p.x, p.y) < 145 * 145) this.hitEnemy(e, 26 * (this.stats.dmgMul || 1), { silent: true, col: '#ff9a3c' });
        }
        Particles.ring(p.x, p.y, 120, 150, { col: '#ff9a3c', life: 0.25, w: 3 });
      }
    }

    // RIMEWALK -- the ground near you is cold
    if (this.rel('rimewalk')) {
      const near = this.queryEnemies(p.x, p.y, 200);
      for (const e of near) {
        if (e.dead) continue;
        if (dist2(e.x, e.y, p.x, p.y) < 200 * 200) e.slow = Math.max(e.slow || 0, 0.3);
      }
    }

    // SPOOL -- a live wire paid out behind you
    if (this.rel('spool')) {
      const sp = this.spool;
      const last = sp[sp.length - 1];
      if (!last || dist2(last.x, last.y, p.x, p.y) > 26 * 26) sp.push({ x: p.x, y: p.y, life: 2.6 });
      for (let i = sp.length - 1; i >= 0; i--) {
        sp[i].life -= dt;
        if (sp[i].life <= 0) { sp.splice(i, 1); continue; }
      }
      while (sp.length > 42) sp.shift();
      if (!this.relicT.spoolCd || this.time >= this.relicT.spoolCd) {
        this.relicT.spoolCd = this.time + 0.18;
        for (const node of sp) {
          const near = this.queryEnemies(node.x, node.y, 22);
          for (const e of near) {
            if (e.dead || e.spawnT > 0) continue;
            if (dist2(e.x, e.y, node.x, node.y) < 22 * 22) this.hitEnemy(e, 16 * (this.stats.dmgMul || 1), { silent: true, col: '#e0a3ff' });
          }
        }
      }
    } else if (this.spool.length) this.spool.length = 0;
  },

  /* ---------------------------------------------------------- enemy utils */
  rebuildGrid() {
    this.grid.clear();
    for (const e of this.enemies) if (!e.dead) this.grid.insert(e);
  },
  queryEnemies(x, y, r) { return this.grid.query(x, y, r, this._q); },
  nearestEnemy(x, y, maxR, exclude) {
    let best = null, bd = maxR * maxR;
    const step = 220;
    for (let r = step; r <= maxR + step; r += step) {
      const list = this.grid.query(x, y, r, this._q);
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (e.dead || e.spawnT > 0) continue;
        if (exclude && exclude.has && exclude.has(e)) continue;
        const d = dist2(x, y, e.x, e.y);
        if (d < bd) { bd = d; best = e; }
      }
      if (best) return best;
    }
    return best;
  },
  randomEnemy(x, y, maxR) {
    const list = this.grid.query(x, y, maxR, this._q);
    const valid = [];
    for (let i = 0; i < list.length; i++) if (!list[i].dead && list[i].spawnT <= 0) valid.push(list[i]);
    if (!valid.length) return null;
    return valid[(rand() * valid.length) | 0];
  },

  hitEnemy(e, dmg, o) {
    o = o || {};
    if (e.dead) return;
    // a decoy takes the hit, and the crown drinks it
    if (e.isDecoy && e.decoyOf && !e.decoyOf.dead) {
      e.decoyOf.hp = Math.min(e.decoyOf.maxHp, e.decoyOf.hp + dmg * 0.45);
      if ((this.frame & 7) === 0) {
        Particles.spark(e.x, e.y, Math.atan2(e.decoyOf.y - e.y, e.decoyOf.x - e.x), rnd(180, 340), { col: '#ffd166', life: 0.4, w: 2 });
      }
    }
    // a downed antiphon half cannot be hurt further
    if (e.downed > 0) return;
    let crit = false;
    const S = this.stats;
    if (o.src === 'mire' && e.boss) dmg *= 0.4;
    if (e.elite || e.boss) dmg *= S.eliteDmg;
    if (e.amped > this.time) dmg *= 1.6;
    if (e.brandT > this.time) dmg *= 1 + e.brandAmp;
    if (e.sunder > this.time) dmg *= 1.25;
    if (e.def.bossKind === 'husk') {
      // its plated face eats almost everything -- get behind it
      const fa = e.face === undefined ? e.rot : e.face;
      const toP = Math.atan2(this.player.y - e.y, this.player.x - e.x);
      if (Math.abs(angDiff(fa, toP)) < 1.05) dmg *= 0.20;
      else dmg *= 1.35;
    }
    if (!o.silent && rand() < S.crit) { crit = true; dmg *= S.critMul; }
    if (this.cov('bloomsight') && e.boss) dmg *= 1.4;
    if (e.shield > this.time) dmg *= 0.55;
    if (e.shielded > 0) dmg *= 0.12;
    const armor = this.enemyArmor();
    if (armor > 0) dmg *= (1 - armor);
    if (this.rel('gullet') && dist2(e.x, e.y, this.player.x, this.player.y) > 600 * 600) dmg *= 0.5;
    if (e.def.bossKind === 'aperture') dmg *= (e.openT > 0 ? 2.2 : (this.D.bossGentle ? 0.16 : 0.08));
    if (S.chill > 0 && !o.silent && rand() < S.chill) e.slow = Math.max(e.slow, 0.9);
    dmg = Math.max(1, dmg);
    const over = dmg - e.hp;
    e.hp -= dmg;
    e.hurt = 1;
    this.runStats.dmgDealt += dmg;
    if (e.def.bossKind === 'sower') this.sowerBleed(e, dmg);
    if (o.kb && !o.noKb) {
      const res = 1 - (e.def.kbres || 0);
      const a = o.kbAngle === undefined ? Math.atan2(e.y - this.player.y, e.x - this.player.x) : o.kbAngle;
      const kb = o.kb * S.kbMul;
      e.kx += Math.cos(a) * kb * res / (e.def.mass * 0.35 + 0.7);
      e.ky += Math.sin(a) * kb * res / (e.def.mass * 0.35 + 0.7);
    }
    const col = o.col || '#fff';
    if (!o.silent) {
      if (crit || Pops.live.length < 46) {
        Pops.add(e.x, e.y - e.r * 0.7, crit ? Math.round(dmg) + '!' : String(Math.round(dmg)), {
          col: crit ? '#ffe066' : '#ffffff', size: crit ? 21 : 15, crit: crit
        });
      }
      Particles.burst(e.x, e.y, crit ? 7 : 3, col, { spd0: 60, spd1: crit ? 300 : 170, life: 0.3, w: crit ? 2.6 : 1.8 });
      if (crit) { Sound.crit(); Cam.shake(0.05); } else Sound.hit(rand());
    }
    if (e.hp <= 0) {
      if (S.splash > 0 && over > 0) {
        const r = 60 + S.splashR;
        const list = this.queryEnemies(e.x, e.y, r + 40);
        for (let i = 0; i < list.length; i++) {
          const o2 = list[i];
          if (o2 === e || o2.dead) continue;
          if (dist2(o2.x, o2.y, e.x, e.y) < (r + o2.r) * (r + o2.r)) {
            o2.hp -= over * S.splash; o2.hurt = 1;
            if (o2.hp <= 0) this.killEnemy(o2, col);
          }
        }
        Particles.ring(e.x, e.y, 6, r, { col: '#dfe6ff', life: 0.28, w: 3 });
      }
      this.killEnemy(e, col);
    }
  },
  rebloom() {
    const p = this.player;
    p.hp = p.maxHp;
    p.inv = 3.2;
    p.dead = false;
    this.banner('REBLOOM', PAL.xp);
    Flash.hit(PAL.xp, 0.5);
    Cam.shake(0.8);
    this.hitstop = 0.2;
    Sound.fanfare(true);
    Particles.ring(p.x, p.y, 14, 900, { col: PAL.xp, life: 1.0, w: 12 });
    const list = this.queryEnemies(p.x, p.y, 620);
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.dead || e.boss) continue;
      this.hitEnemy(e, e.elite ? 600 : e.hp, { col: PAL.xp, silent: true });
    }
    for (let i = this.ebullets.length - 1; i >= 0; i--) this.ebullets[i].dead = true;
  },

  killEnemy(e, col) {
    // THE SOWER does not die three times; it stands back up, smaller
    if (e.def.bossKind === 'sower' && (e.form | 0) < SOWER_FORMS.length - 1 && !e.dead) {
      e.hp = 1;
      this.sowerRevive(e);
      return;
    }
    if (e.took) this.titheReturn(e, true);
    if (e.boss) {
      const bk = e.def.bossKind;
      if (bk === 'cultivar' && !e.everMatured) Ach.grant('deeproot');
      if (bk === 'toll' && !this.tollSilenced) Ach.grant('untolled');
      if (bk === 'witness' && !e.echoTouched) Ach.grant('pathless');
    }
    if (e.boss && !e.isSpawn && !e.isDecoy && !e.def.underbloom && this.runStats && this.runStats.bossIds
        && this.runStats.bossIds.indexOf(e.def.id) < 0) this.runStats.bossIds.push(e.def.id);
    if (this.actII && this.og >= 2 && !e.boss && !e.elite && rand() < 0.2) {
      this.addPool(new Pool(e.x, e.y, 54, 0, 9, '#6b8f3a', { hostile: false, root: true }));
    }

    if (this.rel('gullet') && this.player && !this.player.dead &&
        dist2(e.x, e.y, this.player.x, this.player.y) < 120 * 120) {
      this.player.heal(Math.max(1, this.player.maxHp * 0.01), true);
    }
    if (this.rel('seedheart') && !e.boss && !e.elite && rand() < 0.2) this.pickups.push(new Pickup(e.x + rnd(-10, 10), e.y + rnd(-10, 10), 'mote', 1));
    if (e.dead) return;
    if (e.def.bossKind === 'longnight') this.arenaTarget = 1500;
    if (e.def.bossKind === 'antiphon' && e.twin && !e.twin.dead && e.twin.downed <= 0) {
      // one voice alone will not stay silent
      e.downed = 3.0;
      e.hp = 1;
      this.banner('SILENCE THE OTHER', e.def.col);
      Flash.hit(e.def.col, 0.25); Cam.shake(0.5);
      Particles.ring(e.x, e.y, 6, e.r * 4, { col: e.def.col, life: 0.7, w: 6 });
      Sound.bossHorn();
      return;
    }
    // both halves down together: they go for good
    if (e.def.bossKind === 'antiphon' && e.twin && e.twin.downed > 0) {
      e.twin.downed = 0; e.twin.hp = 0; e.twin.dead = true;
      if (e.twin === this.boss) this.boss = null;
    }
    e.dead = true;
    const def = e.def;
    this.kills++;
    this.combo++; this.comboT = 2.6;
    if (this.combo >= 50) Ach.grant('combo50');
    if (this.combo >= 120) Ach.grant('combo120');
    const mult = 1 + Math.min(this.combo, 60) * 0.02 + this.time / 420;
    this.score += def.score * mult * this.D.scoreMul * (this.endless ? (1 + this.tide * 0.02) : 1);
    Sound.kill(e.elite || e.boss);

    const n = e.boss ? 90 : (e.elite ? 46 : Math.min(16, 5 + def.r * 0.4));
    for (let i = 0; i < n; i++) {
      Particles.spark(e.x, e.y, rnd(TAU), rnd(60, e.boss ? 700 : (e.elite ? 460 : 280)), { col: def.col, life: rnd(0.25, e.boss ? 1.2 : 0.6), w: e.boss ? 3.4 : 2.2, len: 1.6 });
    }
    for (let i = 0; i < Math.min(9, 2 + def.r * 0.2); i++) {
      Particles.shard(e.x, e.y, rnd(TAU), rnd(40, 220), { col: def.col, r: rnd(3, 4 + def.r * 0.25), sides: 3 });
    }
    Particles.ring(e.x, e.y, e.r * 0.6, e.r * (e.boss ? 8 : 3.4), { col: def.col, life: e.boss ? 0.9 : 0.36, w: e.boss ? 10 : 3 });

    if (e.boss) {
      Cam.shake(1); Flash.hit('#fff', 0.6);
      this.hitstop = 0.5;
      if (!e.isSpawn && !e.isDecoy) this.noteBossKill(e);
      if ((def.finale || e.isFinale) && !this.endless) { this.gameOver(true); }
      else if (e.isSpawn) {
        // a shed body, not a fight of its own
        this.score += def.score * 0.2;
        Cam.tzoom = Cam.base;
      }
      else {
        this.banner(def.name + ' FALLS', def.col);
        Sound.fanfare(true);
        this.chestQueue += (this.endless ? 1 : 2) + (this.rel('bloomcrown') ? 1 : 0);
        this.rerolls++;
        this.player.heal(Math.round(this.player.maxHp * 0.3));
        Cam.tzoom = Cam.base;
        if (this.state === 'playing') { this.cards = this.buildCards(true); this.cardSel = 0; this.state = 'levelup'; Sound.levelUp(); }
      }
    } else if (e.elite) {
      Cam.shake(0.5); Flash.hit(def.col, 0.2); this.hitstop = 0.14;
      this.pickups.push(new Pickup(e.x, e.y, 'chest', 1));
    } else {
      Cam.shake(Math.min(0.12, 0.02 + def.r * 0.002));
      this.hitstop = Math.max(this.hitstop, def.r > 22 ? 0.035 : 0);
    }

    // ANATHEMA: the mark looks for a new host
    if (e.brandSpread && e.brandT > this.time) {
      const near = this.queryEnemies(e.x, e.y, 200);
      for (let i = 0; i < near.length; i++) {
        const o2 = near[i];
        if (o2 === e || o2.dead || o2.brandT > this.time) continue;
        o2.brandT = this.time + 4.0;
        o2.brandAmp = e.brandAmp;
        o2.brandSpread = 1;
        Particles.ring(o2.x, o2.y, 4, o2.r + 30, { col: '#ffb3cc', life: 0.4, w: 3 });
        break;
      }
    }
    Weapons.onKill(e);
    // permafrost: the frozen do not die quietly
    if (e.frozen > this.time) {
      const r = 92;
      Particles.ring(e.x, e.y, 6, r * 1.4, { col: '#d6f6ff', life: 0.45, w: 5 });
      for (let i = 0; i < 10; i++) Particles.shard(e.x, e.y, rnd(TAU), rnd(120, 380), { col: '#d6f6ff', r: rnd(2, 5), sides: 3 });
      const list = this.queryEnemies(e.x, e.y, r + 40);
      for (let i = 0; i < list.length; i++) {
        const o2 = list[i];
        if (o2 === e || o2.dead) continue;
        if (dist2(o2.x, o2.y, e.x, e.y) < (r + o2.r) * (r + o2.r)) {
          this.hitEnemy(o2, e.maxHp * 0.16 + 24, { col: '#d6f6ff', silent: true, noKb: true });
          if (!o2.dead) { o2.slow = Math.max(o2.slow, 1.4); o2.frozen = Math.max(o2.frozen, this.time + 1.0); }
        }
      }
      Sound.hit(0.1);
    }
    // death bursts (the rot, and the deep tide)
    const burstC = this.burstsOnDeath();
    if (burstC > 0 && !e.boss && rand() < (e.elite ? Math.min(1, burstC * 1.8) : burstC)) {
      const n = e.elite ? 12 : 4, off = rnd(TAU);
      for (let i = 0; i < n; i++) {
        const a = off + i / n * TAU;
        this.enemyBullet(e.x, e.y, Math.cos(a) * 190, Math.sin(a) * 190, 9 * this.dmgScale, def.col);
      }
    }
    // howlers leave a brood
    if (def.spawnsOnDeath) {
      for (let i = 0; i < def.spawnsOnDeath; i++) {
        const a = rnd(TAU);
        const c2 = new Enemy(ENEMY.swarmer, e.x + Math.cos(a) * 16, e.y + Math.sin(a) * 16, this.hpMul() * 0.6, this.dmgScale);
        c2.kx = Math.cos(a) * 230; c2.ky = Math.sin(a) * 230;
        this.enemies.push(c2);
      }
    }
    // splitters
    if (def.splits) {
      for (let i = 0; i < def.splits; i++) {
        const a = rnd(TAU);
        const c = new Enemy(ENEMY.swarmer, e.x + Math.cos(a) * 18, e.y + Math.sin(a) * 18, this.hpMul() * 0.7, this.dmgScale);
        c.kx = Math.cos(a) * 260; c.ky = Math.sin(a) * 260;
        this.enemies.push(c);
      }
    }
    // mire spread
    for (const p of this.pools) {
      if (p.spread && rand() < 0.3 && dist2(p.x, p.y, e.x, e.y) < p.r * p.r) {
        this.addPool(new Pool(e.x, e.y, p.r * 0.45, p.dps * 0.7, 2.0, p.col, { slowing: true }));
        break;
      }
    }
    // drops
    const xpv = def.xp;
    const chunks = xpv > 8 ? 6 : (xpv > 3 ? 3 : 1);
    for (let i = 0; i < chunks; i++) {
      this.pickups.push(new Pickup(e.x + rnd(-14, 14), e.y + rnd(-14, 14), 'mote', Math.max(1, Math.round(xpv / chunks))));
    }
    const luck = this.stats.luck * 0.004;
    const hurtFrac = 1 - this.player.hp / this.player.maxHp;
    const heartChance = 0.011 + luck + (hurtFrac > 0.45 ? (hurtFrac - 0.45) * 0.055 : 0);
    const r = rand();
    if (r < heartChance) this.pickups.push(new Pickup(e.x, e.y, 'heart', 1));
    else if (r < heartChance + 0.007 + luck) this.pickups.push(new Pickup(e.x, e.y, 'bomb', 1));
    if (this.pickups.length > 420) {
      let n = 0;
      for (let i = 0; i < this.pickups.length && n < 140; i++) {
        const pk = this.pickups[i];
        if (pk && pk.type === 'mote' && !pk.dead) { pk.dead = true; this.xp += pk.val * this.stats.xpMul; this.totalXp += pk.val; n++; }
      }
      while (this.xp >= this.xpNeed) { this.xp -= this.xpNeed; this.level++; this.xpNeed = this.needFor(this.level); this.pendingLevels++; }
    }
  },

  addPool(p) {
    this.pools.push(p);
    while (this.pools.length > 26) this.pools.shift();
  },
  enemyBullet(x, y, vx, vy, dmg, col, o) {
    if (this.cov('quiet')) { vx *= 0.7; vy *= 0.7; }
    if (this.ebullets.length > 520) this.ebullets.shift();
    const m = this.bulletMul();
    const dm = dmg * (1 + (this.D.bulletDmg - 1) * 0.5);
    this.ebullets.push(new EBullet(x, y, vx * m, vy * m, dm, col, o));
  },

  screenClear() {
    Flash.hit('#ffd166', 0.5);
    Cam.shake(0.7);
    this.hitstop = 0.1;
    Particles.ring(this.player.x, this.player.y, 20, 1400, { col: '#ffd166', life: 0.7, w: 12 });
    for (const e of this.enemies) {
      if (e.dead) continue;
      if (dist2(e.x, e.y, this.player.x, this.player.y) < 900 * 900) {
        this.hitEnemy(e, e.boss ? 900 : (e.elite ? 700 : e.hp), { col: '#ffd166', silent: true });
      }
    }
    this.ebullets.length = 0;
  },

  /* every boss death, weighed for the achievements that care */
  noteBossKill(e) {
    const kind = e.def.bossKind || e.def.id || 'boss';
    const d = Save.data;
    if (!d.bossSeen) d.bossSeen = {};
    if (!d.bossSeen[kind]) { d.bossSeen[kind] = 1; Save.save(); }
    Ach.grant('firstblood');
    if (kind === 'crown') Ach.grant('crowned');
    if (kind === 'antiphon') Ach.grant('harmony');
    if (kind === 'mirror') Ach.grant('mirrored');
    const rs = this.runStats;
    if (rs) {
      rs.bossKills++;
      if (this.time - e.bornT <= 20) Ach.grant('headsman');
      if (this.time - rs.lastBossT <= 10) Ach.grant('nowitness');
      rs.lastBossT = this.time;
      if (!e.def.finale && !this.endless) {
        rs.gauntletKills++;
        if (rs.gauntletKills >= 4) Ach.grant('gauntlet');
      }
    }
    Ach.sweepMeta();
  },

  banner(txt, col) {
    for (let i = 0; i < this.banners.length; i++) {
      if (this.banners[i].s === txt) { this.banners[i].life = this.banners[i].max; return; }
    }
    this.banners.push({ s: txt, col: col || PAL.text, life: 2.0, max: 2.0 });
    while (this.banners.length > 2) this.banners.shift();
  },

  /* ------------------------------------------------- hostile field shapes */
  hexCircle(x, y, r, delay, dmg, col) {
    delay = this.bossTele(delay);
    this.fx.push({ t: 'hex', x: x, y: y, r: r, life: delay, max: delay, col: col || '#c56bff', dmg: dmg, fired: false });
  },
  eShock(x, y, r, dmg, col) {
    this.fx.push({ t: 'eshock', x: x, y: y, r: 20, target: r, life: 0.85, max: 0.85, col: col || '#ffb347', dmg: dmg, hit: false });
  },
  rotWalls(b, n) {
    n = this.bossN(n);
    const life = this.bossTele(1.25);
    const base = rnd(TAU);
    for (let i = 0; i < n; i++) {
      const a = base + i / n * TAU;
      this.fx.push({ t: 'tele', x: b.x, y: b.y, a: a, len: 2400, w: 46, life: life, max: life, col: b.def.col, src: b, fired: false, rot: 0.55 * (this.D.bossGentle ? 0.6 : 1) });
    }
    Sound.bossHorn();
  },
  raiseDead(b, n) {
    n = this.bossN(n);
    this.banner('RISE', b.def.col);
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + rnd(0.3);
      const d = b.r + 70 + rnd(0, 160);
      const def = rand() < 0.25 ? ENEMY.monolith : (rand() < 0.5 ? ENEMY.howler : ENEMY.drifter);
      const e = new Enemy(def, b.x + Math.cos(a) * d, b.y + Math.sin(a) * d, this.hpMul() * 0.85, this.dmgScale);
      this.enemies.push(e);
      Particles.ring(e.x, e.y, 4, 54, { col: b.def.col, life: 0.45, w: 3 });
    }
    Sound.shoot('nova');
  },
  spawnShards(b, n) {
    n = this.bossN(n);
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU;
      const d = b.r + 120;
      const e = new Enemy(ENEMY.splitter, b.x + Math.cos(a) * d, b.y + Math.sin(a) * d, this.hpMul() * 2.4, this.dmgScale);
      e.isShard = true;
      this.enemies.push(e);
      out.push(e);
      Particles.ring(e.x, e.y, 4, 60, { col: b.def.col, life: 0.5, w: 3 });
    }
    return out;
  },
  spawnBrood(b, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(TAU);
      const e = new Enemy(ENEMY.swarmer, b.x + Math.cos(a) * (b.r + 24), b.y + Math.sin(a) * (b.r + 24), this.hpMul(), this.dmgScale);
      e.kx = Math.cos(a) * 380; e.ky = Math.sin(a) * 380;
      this.enemies.push(e);
    }
  },
  ignite(e, dps, dur, spread) {
    e.burn = Math.max(e.burn, dur);
    e.burnDps = Math.max(e.burnDps, dps);
    if (spread) {
      const near = this.queryEnemies(e.x, e.y, 90);
      for (let i = 0; i < near.length; i++) {
        const o = near[i];
        if (o === e || o.dead || o.burn > 0.4) continue;
        o.burn = Math.max(o.burn, dur * 0.6);
        o.burnDps = Math.max(o.burnDps, dps * 0.55);
      }
    }
  },
  /* ---- THE MIRROR turns your own arsenal back on you ---- */
  mirrorVolley(b, ph) {
    const p = this.player;
    const col = b.def.col;
    const owned = this.weapons.length ? this.weapons : [{ id: 'pulse' }];
    const w = owned[(rand() * owned.length) | 0];
    const id = w.id;
    const S = this.dmgScale;
    const a0 = Math.atan2(p.y - b.y, p.x - b.x);
    this.banner('MIRRORED: ' + (WEAPONS[id] ? WEAPONS[id].name : 'PULSE'), col);
    // each family of your weapons has an answer
    if (id === 'prism' || id === 'longshot' || id === 'pharos') {
      this.bossPetalLasers(b, 3 + ph * 2);
    } else if (id === 'nova' || id === 'toll' || id === 'undertow') {
      this.eShock(b.x, b.y, 760 + ph * 140, 32 + ph * 8, col);
    } else if (id === 'mire' || id === 'shroud' || id === 'cinder' || id === 'starfall') {
      for (let i = 0; i < this.bossN(3 + ph); i++) {
        this.hexCircle(p.x + rnd(-240, 240), p.y + rnd(-240, 240), 120, 1.15, 30 * S, col);
      }
    } else if (id === 'thorns' || id === 'veil' || id === 'pendulum') {
      const n = this.bossN(18 + ph * 6), off = rnd(TAU);
      for (let i = 0; i < n; i++) {
        const a = off + i / n * TAU;
        this.enemyBullet(b.x + Math.cos(a) * b.r, b.y + Math.sin(a) * b.r, Math.cos(a) * 200, Math.sin(a) * 200, 12 * S, col);
      }
    } else if (id === 'seeker' || id === 'familiar' || id === 'harvest') {
      for (let i = 0; i < this.bossN(5 + ph * 2); i++) {
        const a = a0 + rnd(-0.5, 0.5);
        this.enemyBullet(b.x, b.y, Math.cos(a) * 175, Math.sin(a) * 175, 12 * S, col);
      }
    } else if (id === 'rupture' || id === 'quake' || id === 'hunger') {
      this.eShock(b.x, b.y, 620, 28 + ph * 8, col);
      this.hexCircle(p.x, p.y, 140, 1.0, 34 * S, col);
    } else {
      // everything else answers as a spread of aimed shots
      const n = this.bossN(9 + ph * 4);
      for (let i = 0; i < n; i++) {
        const a = a0 + (i - (n - 1) / 2) * 0.15;
        this.enemyBullet(b.x, b.y, Math.cos(a) * 250, Math.sin(a) * 250, 13 * S, col);
      }
    }
    Sound.bossHorn();
  },

  /* ---- THE HOLLOW CROWN hides among its own court ---- */
  spawnDecoys(b, n) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = rand() * TAU, d = 190 + rand() * 150;
      const e = new Enemy(ENEMY.crown, b.x + Math.cos(a) * d, b.y + Math.sin(a) * d, 1, this.dmgScale);
      e.maxHp = e.hp = Math.max(700, Math.round(b.maxHp * 0.06));
      e.isDecoy = true; e.decoyOf = b; e.boss = false;
      e.spawnT = 0.5;
      this.enemies.push(e);
      out.push(e);
      Particles.ring(e.x, e.y, 6, 90, { col: b.def.col, life: 0.5, w: 4 });
    }
    return out;
  },

  /* ---- ANTIPHON: two voices, and one alone will not stay down ---- */
  spawnAntiphon(mul) {
    const p = this.player;
    const a = rand() * TAU;
    const d = Math.max(VW, VH) * 0.5 + 120;
    const pair = [];
    for (let i = 0; i < 2; i++) {
      const aa = a + i * Math.PI;
      let x = p.x + Math.cos(aa) * d, y = p.y + Math.sin(aa) * d;
      const m = Math.hypot(x, y);
      if (m > this.arenaR - 160) { x = x / m * (this.arenaR - 160); y = y / m * (this.arenaR - 160); }
      const e = new Enemy(ENEMY.antiphon, x, y, (this.D.bossHp || 1) * (mul || 1), this.dmgScale);
      e.spawnT = 1.2;
      e.twinIdx = i;
      this.enemies.push(e);
      pair.push(e);
    }
    pair[0].twin = pair[1];
    pair[1].twin = pair[0];
    this.boss = pair[0];
    this.banner('ANTIPHON', ENEMY.antiphon.col);
    Sound.bossHorn(); Flash.hit(ENEMY.antiphon.col, 0.45); Cam.shake(0.9);
    return pair;
  },
  /* ---- THE LOOM strings the arena with live wire ---- */
  weaveWeb(b, n) {
    this.banner('WEAVE', b.def.col);
    for (let i = 0; i < n; i++) {
      const a1 = rnd(TAU), a2 = a1 + rnd(1.2, TAU - 1.2);
      const R = this.arenaR * 0.78;
      this.fx.push({
        t: 'web', x1: Math.cos(a1) * R, y1: Math.sin(a1) * R,
        x2: Math.cos(a2) * R, y2: Math.sin(a2) * R,
        life: this.bossTele(7.0), max: this.bossTele(7.0), grow: this.bossTele(0.8),
        col: b.def.col, dmg: 22 * this.dmgScale, tick: 0
      });
    }
    Sound.shoot('arc');
  },
  /* ---- THE TITHE: it fights you with your own best thing ---- */
  titheTake(b) {
    b.tookLevel = 1;
    if (!this.weapons || this.weapons.length <= 1) return;   // never leave you empty-handed
    let best = 0;
    for (let i = 1; i < this.weapons.length; i++) {
      if (this.weapons[i].level > this.weapons[best].level) best = i;
    }
    const w = this.weapons.splice(best, 1)[0];
    b.took = w; b.tookLevel = w.level; b.tookAt = this.time;
    this.recomputeStats();
    const nm = WEAPONS[w.id] ? WEAPONS[w.id].name : w.id.toUpperCase();
    this.banner('TITHE  ·  ' + nm, b.def.col);
    Flash.hit(b.def.col, 0.3);
  },
  titheReturn(b, killed) {
    if (!b || !b.took) return;
    const w = b.took; b.took = null;
    const fast = killed && (this.time - (b.tookAt || 0)) <= 55;
    if (fast) w.level = Math.min(7, w.level + 1);
    if (this.weapons.length < 6) this.weapons.push(w);
    this.recomputeStats();
    const nm = WEAPONS[w.id] ? WEAPONS[w.id].name : w.id.toUpperCase();
    if (killed) this.banner(fast ? (nm + '  LV ' + w.level) : ('RETURNED  ·  ' + nm), fast ? PAL.gold : b.def.col);
  },
  // nothing it holds may leave the run with it
  titheReleaseAll(killed) {
    for (const e of this.enemies) if (e && e.took) this.titheReturn(e, !!killed);
  },

  /* ---- THE CULTIVAR plants, and what it plants grows teeth ---- */
  plantSeeds(b, n) {
    n = Math.max(1, this.bossN(n));
    if (!b.seedList) b.seedList = [];
    const mature = this.D.bossGentle ? 14 : (this.D.bossExtra ? 6 : 9);
    for (let i = 0; i < n; i++) {
      const a = rnd(TAU), d = rnd(200, Math.min(900, this.arenaR - 120));
      let x = this.player.x + Math.cos(a) * d, y = this.player.y + Math.sin(a) * d;
      const m = Math.hypot(x, y), lim = this.arenaR - 80;
      if (m > lim) { x = x / m * lim; y = y / m * lim; }
      const e = new Enemy(ENEMY.seedpod, x, y, this.hpMul() * 1.4 * this.D.bossHp, this.dmgScale);
      e.isSeed = true; e.seedT = mature; e.matured = false; e.spawnT = 0.8;
      this.enemies.push(e);
      b.seedList.push(e);
      Particles.ring(x, y, 4, 70, { col: b.def.col, life: 0.5, w: 3 });
    }
  },
  /* ---- THE MAW's throats ---- */
  spawnThroats(b, n) {
    const out = [];
    const base = b.anchorA === undefined ? Math.atan2(b.y, b.x) : b.anchorA;
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * 0.34;
      const d = Math.hypot(b.x, b.y) - 40;
      const e = new Enemy(ENEMY.mawthroat, Math.cos(a) * d, Math.sin(a) * d, this.hpMul() * 1.6 * this.D.bossHp, this.dmgScale);
      e.isMoon = true; e.moonOf = b; e.isThroat = true;
      this.enemies.push(e);
      out.push(e);
      Particles.ring(e.x, e.y, 6, 90, { col: b.def.col, life: 0.6, w: 4 });
    }
    return out;
  },
  /* ---- THE TOLL: a ring of silence, expanding or closing ---- */
  silenceRing(b, inward) {
    if (b && b.def.bossKind === 'toll' && this.tollSilenced === undefined) this.tollSilenced = 0;
    if (!this.silRings) this.silRings = [];
    const thick = this.D.bossGentle ? 60 : (this.D.bossExtra ? 140 : 90);
    this.silRings.push({
      x: b.x, y: b.y, r: inward ? this.arenaR : 20, inward: !!inward,
      thick: thick, col: b.def.col, live: true
    });
    Particles.ring(b.x, b.y, b.r, b.r + 120, { col: b.def.col, life: 0.5, w: 6 });
    Cam.shake(0.3);
  },
  drawSilence(c) {
    const rings = this.silRings;
    if (!rings || !rings.length) return;
    c.save();
    for (const R of rings) {
      if (R.r <= 2) continue;
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = R.col; c.globalAlpha = 0.5;
      c.lineWidth = R.thick;
      c.beginPath(); c.arc(R.x, R.y, Math.max(1, R.r), 0, TAU); c.stroke();
      c.globalAlpha = 0.95; c.lineWidth = 2.4;
      c.beginPath(); c.arc(R.x, R.y, Math.max(1, R.r - R.thick * 0.5), 0, TAU); c.stroke();
      c.beginPath(); c.arc(R.x, R.y, Math.max(1, R.r + R.thick * 0.5), 0, TAU); c.stroke();
    }
    c.restore();
  },
  tickSilence(dt) {
    const rings = this.silRings;
    if (!rings || !rings.length) return;
    const p = this.player, sp = 260;
    for (let i = rings.length - 1; i >= 0; i--) {
      const R = rings[i];
      R.r += (R.inward ? -sp : sp) * dt;
      if (R.inward ? R.r < 30 : R.r > this.arenaR + 120) { rings.splice(i, 1); continue; }
      if (p && !p.dead) {
        const d = Math.hypot(p.x - R.x, p.y - R.y);
        if (Math.abs(d - R.r) < R.thick * 0.5) { this.silenceT = this.time + 0.12; this.tollSilenced = 1; }
      }
    }
  },

  /* ---- THE ORRERY's moons: kill them to strip it ---- */
  spawnMoons(b, n) {
    b.contain();
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU;
      const e = new Enemy(ENEMY.bulwark, b.x + Math.cos(a) * 150, b.y + Math.sin(a) * 150, this.hpMul() * 9 * this.D.bossHp, this.dmgScale);
      e.isMoon = true; e.moonOf = b; e.moonI = i; e.moonN = n;
      this.enemies.push(e);
      out.push(e);
      Particles.ring(e.x, e.y, 4, 60, { col: b.def.col, life: 0.5, w: 3 });
    }
    return out;
  },
  /* ---- CARRION KING sheds smaller kings ---- */
  splitCarrion(b) {
    if (b.splitGen >= 1) return;
    for (let i = 0; i < 2; i++) {
      const a = rnd(TAU);
      const e = new Enemy(ENEMY.carrion, b.x + Math.cos(a) * 90, b.y + Math.sin(a) * 90, 1, this.dmgScale);
      e.maxHp = e.hp = Math.max(400, Math.round(b.maxHp * 0.32));
      e.r = Math.max(34, b.r * 0.62);
      e.scale = e.r / ENEMY.carrion.r;
      e.splitGen = (b.splitGen || 0) + 1;
      e.isSpawn = true;
      e.spawnT = 0.5;
      e.kx = Math.cos(a) * 420; e.ky = Math.sin(a) * 420;
      this.enemies.push(e);
    }
    this.banner('IT SPLITS', b.def.col);
    Cam.shake(0.6);
    Sound.bossHorn();
  },
  /* ---- how this difficulty makes its bosses behave ---- */
  bossChain(b) {
    const D = this.D;
    if (D.bossGentle) {
      // every fourth attack the boss takes a breath, so you can actually move in
      b.beat = (b.beat || 0) + 1;
      if (b.beat % 4 === 0) b.attackT += 1.8;
    } else if (D.bossHarder && rand() < (D.bossExtra ? 0.5 : 0.3)) {
      // no pause at all -- straight into the next attack
      b.attackT = Math.min(b.attackT, 0.35);
    }
  },
  bossDrizzle(b, dt, col) {
    // nightmare bosses never actually stop shooting
    if (!this.D.bossExtra) return;
    b.drizT = (b.drizT || rnd(0, 0.4)) - dt;
    if (b.drizT > 0 || b.spawnT > 0) return;
    b.drizT = 0.42;
    const p = this.player;
    const a = Math.atan2(p.y - b.y, p.x - b.x) + rnd(-0.4, 0.4);
    this.enemyBullet(b.x + Math.cos(a) * b.r, b.y + Math.sin(a) * b.r, Math.cos(a) * 210, Math.sin(a) * 210, 10 * this.dmgScale, col);
  },
  bossPhaseBlast(b) {
    if (!this.D.bossExtra) return;
    this.eShock(b.x, b.y, 660, 30 * this.dmgScale, b.def.col);
  },

  /* ---------------------------------------------------------- THE SOWER */
  sowerStart(b) {
    b.form = 0;
    b.baseHp = b.maxHp / SOWER_FORMS[0].hp;
    b.bleed = 0;
    b.reviveT = 0;
    this.banner(SOWER_FORMS[0].title, b.def.col);
    this.arenaTarget = 1180;
  },
  /* one mote for every fortieth of a form, so each body is worth the same */
  sowerBleed(e, dmg) {
    const per = e.maxHp / 40;
    e.bleed = (e.bleed || 0) + dmg;
    let guard = 0;
    while (e.bleed >= per && guard++ < 6) {
      e.bleed -= per;
      const a = rnd(TAU), d2 = e.r * rnd(0.7, 1.35);
      this.pickups.push(new Pickup(e.x + Math.cos(a) * d2, e.y + Math.sin(a) * d2, 'mote', 46));
    }
  },
  /* it goes down, and then it does not stay down */
  sowerRevive(e) {
    const nf = (e.form | 0) + 1;
    const F = SOWER_FORMS[nf];
    e.form = nf;
    e.def = ENEMY[F.def];
    e.maxHp = Math.round(e.baseHp * F.hp);
    e.hp = e.maxHp;
    e.r = e.def.r;
    e.phase = -1;
    e.attackT = 3.2;
    e.spiral = 0;
    e.downed = 2.9;                       // untouchable while it re-forms
    e.reviveT = 2.9;
    e.bleed = 0;
    e.sub = 0; e.blinkT = 0; e.dashT = 0; e.orbT = 0; e.closing = false;
    e.vx = 0; e.vy = 0; e.kx = 0; e.ky = 0;

    // the room is cleared for the transition -- no cheap deaths on the seam
    this.ebullets.length = 0;
    for (let i = this.fx.length - 1; i >= 0; i--) {
      const f = this.fx[i];
      if (f.t === 'tele' || f.t === 'hex' || f.t === 'eshock') this.fx.splice(i, 1);
    }
    this.pools.length = 0;
    this.arenaTarget = nf >= 2 ? 980 : 1180;

    // and it pays out: the fight is the only place a build can come from
    for (let i = 0; i < 14; i++) {
      const a = rnd(TAU), d2 = e.r + rnd(30, 180);
      this.pickups.push(new Pickup(e.x + Math.cos(a) * d2, e.y + Math.sin(a) * d2, 'mote', 46));
    }
    this.rerolls++;
    this.score += e.def.score * 0.35 * this.D.scoreMul;
    this.player.heal(Math.round(this.player.maxHp * 0.22));

    this.hitstop = 0.55;
    Cam.shake(1.2);
    Flash.hit('#ffffff', 0.7);
    Sound.bossHorn();
    Sound.fanfare(true);
    Particles.ring(e.x, e.y, e.r * 6, e.r * 0.4, { col: '#ffffff', life: 0.7, w: 10 });
    for (let i = 0; i < 90; i++) {
      const a = rnd(TAU);
      Particles.spark(e.x + Math.cos(a) * 620, e.y + Math.sin(a) * 620, a + Math.PI, rnd(420, 900),
        { col: e.def.col, life: rnd(0.45, 0.9), w: 3 });
    }
    this.banner(F.title, e.def.col);
    this.sowerLine = { text: F.line, t: 4.2, col: e.def.col };
  },

  /* one ring, with a hole in it. off spawns it out at a radius; turn and
     acc bend and brake it after it leaves. */
  sowerRing(b, o) {
    o = o || {};
    const n = Math.max(3, this.bossN(o.n || 24));
    const spd = o.spd || 250;
    const col = o.col || b.def.col;
    const dmg = (o.dmg || 13) * this.dmgScale;
    const base = (o.a === undefined ? (b.ringA || 0) : o.a);
    const gapW = o.gapW === undefined ? 0.50 : o.gapW;
    const gapA = o.gapA === undefined ? 0 : o.gapA;
    const off = o.off === undefined ? b.r * 0.9 : o.off;
    for (let i = 0; i < n; i++) {
      const a = base + i / n * TAU;
      if (gapW > 0 && Math.abs(angDiff(a, gapA)) < gapW) continue;
      this.enemyBullet(b.x + Math.cos(a) * off, b.y + Math.sin(a) * off,
        Math.cos(a) * spd, Math.sin(a) * spd, dmg, col,
        { turn: o.turn || 0, acc: o.acc || 0, life: o.life || 0 });
    }
    Sound.shoot(o.snd || 'nova');
  },

  /* an aimed fan. narrow, so it is a micro-dodge, not a wall. */
  sowerFan(b, n, spd) {
    const p = this.player;
    const ta = Math.atan2(p.y - b.y, p.x - b.x);
    n = Math.max(1, this.bossN(n));
    const half = (n - 1) / 2;
    for (let i = 0; i < n; i++) {
      const a = ta + (i - half) * 0.135;
      this.enemyBullet(b.x + Math.cos(a) * b.r, b.y + Math.sin(a) * b.r,
        Math.cos(a) * spd, Math.sin(a) * spd, 12 * this.dmgScale, b.def.col);
    }
    Sound.shoot();
  },

  /* the wall comes in from outside and closes on the boss. one gap. */
  sowerCollapse(b, n, col) {
    n = this.bossN(n);
    const R = Math.min(780, this.arenaR * 0.72);
    const gapA = rnd(TAU);
    const lim = this.arenaR - 40;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU;
      if (Math.abs(angDiff(a, gapA)) < 0.44) continue;
      let x = b.x + Math.cos(a) * R, y = b.y + Math.sin(a) * R;
      const m = Math.hypot(x, y);
      if (m > lim) { x = x / m * lim; y = y / m * lim; }
      const da = Math.atan2(b.y - y, b.x - x);
      this.enemyBullet(x, y, Math.cos(da) * 290, Math.sin(da) * 290, 15 * this.dmgScale, col, { life: 5 });
    }
    this.banner('COLLAPSE', col);
    Sound.bossHorn();
  },

  /* the one that punishes standing still: it drags you in while a slow
     ring walks out, so the answer is to run outward through it. */
  sowerAccrete(b, col) {
    b.pullT = 1.9;
    this.banner('ACCRETION', col);
    b.wave = 3; b.waveT = 0.25; b.waveGap = 0.62;
    b.waveO = { n: 30, spd: 132, gapW: 0.42, gapA: rnd(TAU), gapStep: 1.15, dmg: 14, col: col };
    Sound.bossHorn();
  },
  bossCd(t) { return t * (this.D.bossCd || 1); },
  bossN(n) { return Math.max(1, Math.round(n * (this.D.bossN || 1))); },
  bossTele(t) { return t * (this.D.bossTele || 1); },
  bossCount() {
    let n = 0;
    for (const e of this.enemies) if (e.boss && !e.dead && !e.isSpawn) n++;
    return n;
  },
  pickPrimaryBoss() {
    let best = null;
    for (const e of this.enemies) {
      if (!e.boss || e.dead) continue;
      if ((e.isSpawn || e.isDecoy) && best) continue;
      if (!best || e.maxHp > best.maxHp) best = e;
    }
    this.boss = best;
    return best;
  },
  spawnBossPack(n) {
    const room = Math.max(0, (this.D.maxBosses || 1) - this.bossCount());
    n = Math.min(n, room);
    if (n <= 0) return;
    if (n > 1) { this.banner('BOSS SWARM', PAL.boss); Flash.hit(PAL.boss, 0.3); }
    for (let i = 0; i < n; i++) {
      const id = ENDLESS_BOSSES[(rand() * ENDLESS_BOSSES.length) | 0];
      this.endlessBossIdx++;
      const loop = 1 + Math.floor(this.tide / 22) * 0.55;
      this.spawnBoss(id, loop / (n > 1 ? 1.35 : 1));
    }
    this.pickPrimaryBoss();
  },
  rageMul() {
    if (this.cov && this.cov('bloomsight')) return this._rageBase() * 1.4;
    return this._rageBase();
  },
  _rageBase() {
    // bosses speed up their cadence when the difficulty says so, and always in endless
    let m = 1;
    if (this.D.enrage) m += Math.min(0.8, this.time / 620);
    if (this.D.endless) m += Math.min(0.9, this.tide * 0.018);
    return m;
  },

  /* ----------------------------------------------------------- boss stuff */
  bossSummon(b, n) {
    n = this.bossN(n);
    this.banner('SPORES', PAL.boss);
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + rnd(0.2);
      const d = b.r + 60;
      const def = rand() < 0.4 ? ENEMY.swarmer : ENEMY.drifter;
      const e = new Enemy(def, b.x + Math.cos(a) * d, b.y + Math.sin(a) * d, this.hpMul() * 0.8, this.dmgScale);
      e.kx = Math.cos(a) * 420; e.ky = Math.sin(a) * 420;
      this.enemies.push(e);
      Particles.ring(e.x, e.y, 4, 46, { col: PAL.boss, life: 0.4, w: 2.5 });
    }
    Sound.shoot('nova');
  },
  bossPetalLasers(b, n) {
    n = this.bossN(n);
    const life = this.bossTele(1.0);
    const base = rnd(TAU);
    for (let i = 0; i < n; i++) {
      const a = base + i / n * TAU;
      this.fx.push({ t: 'tele', x: b.x, y: b.y, a: a, len: 2200, w: 40, life: life, max: life, col: b.def.col || PAL.boss, src: b, fired: false });
    }
    Sound.bossHorn();
  },

  /* -------------------------------------------------------- xp / progress */
  addXp(v) {
    const gain = v * this.stats.xpMul;
    this.xp += gain; this.totalXp += gain;
    while (this.xp >= this.xpNeed) {
      this.xp -= this.xpNeed;
      this.level++;
      this.xpNeed = this.needFor(this.level);
      this.pendingLevels++;
    }
    if (this.pendingLevels > 0 && this.state === 'playing') this.openLevelUp();
  },
  ownedWeapon(id) { return this.weapons.find(w => w.id === id); },

  buildCards(isChest) {
    const cards = [];
    const S = this.stats;
    // evolutions first (guaranteed)
    for (const w of this.weapons) {
      if (w.level >= 5 && !w.evolved) {
        const def = WEAPONS[w.id];
        if ((this.passives[def.evo.req] || 0) >= 3) {
          cards.push({ kind: 'evo', id: def.evo.id, wid: w.id, name: def.evo.name, color: def.evo.color, desc: def.evo.blurb, tag: 'EVOLUTION' });
        }
      }
    }
    const pool = [];
    for (const w of this.weapons) {
      if (w.level < 5) {
        const def = WEAPONS[w.id];
        pool.push({ kind: 'wup', id: w.id, name: def.name, color: def.color, desc: def.up[w.level - 1], tag: 'LV ' + (w.level + 1), weight: 10, pair: def.evo.req });
      }
    }
    if (this.weapons.length < 6) {
      // with a large armoury, spreading thin is the trap -- taper new offers,
      // and only shortlist a few of the unowned so upgrades stay competitive
      const nw = Math.max(3, 9 - this.weapons.length * 1.2);
      const unowned = [];
      for (const id of WEAPON_IDS) if (!this.ownedWeapon(id)) unowned.push(id);
      for (let i = unowned.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t2 = unowned[i]; unowned[i] = unowned[j]; unowned[j] = t2; }
      const show = Math.min(unowned.length, 3 + Math.round(S.luck * 0.5) + (this.weapons.length < 2 ? 2 : 0));
      for (let i = 0; i < show; i++) {
        const def = WEAPONS[unowned[i]];
        pool.push({ kind: 'wnew', id: def.id, name: def.name, color: def.color, desc: def.blurb, tag: 'NEW WEAPON', weight: nw, pair: def.evo.req });
      }
    }
    // passives that complete an owned weapon's evolution are pushed forward
    const wanted = Object.create(null);
    for (const w of this.weapons) {
      if (w.evolved) continue;
      const req = WEAPONS[w.id].evo.req;
      wanted[req] = Math.max(wanted[req] || 0, w.level);
    }
    const pcount = Object.keys(this.passives).length;
    const fresh = [];
    for (const id of PASSIVE_IDS) {
      const l = this.passives[id] || 0;
      if (l >= 5) continue;
      if (l === 0 && pcount >= 7) continue;
      // one you already own, or one that completes an evolution, is always eligible
      if (l === 0 && !wanted[id]) { fresh.push(id); continue; }
      const def = PASSIVES[id];
      let wt = l === 0 ? 7 : 8;
      if (wanted[id]) wt *= (l < 3 ? 1.7 : 1.15) * (wanted[id] >= 4 ? 1.5 : 1);
      pool.push({ kind: 'pass', id: id, name: def.name, color: def.color, desc: def.blurb, tag: l === 0 ? 'NEW' : 'LV ' + (l + 1), weight: wt, pair: id });
    }
    for (let i = fresh.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t2 = fresh[i]; fresh[i] = fresh[j]; fresh[j] = t2; }
    for (let i = 0; i < Math.min(fresh.length, 3); i++) {
      const def = PASSIVES[fresh[i]];
      pool.push({ kind: 'pass', id: def.id, name: def.name, color: def.color, desc: def.blurb, tag: 'NEW', weight: 7, pair: def.id });
    }
    // weighted pick without repeats
    const NCARD = this.D.cards || 3;
    while (cards.length < NCARD && pool.length) {
      let tot = 0; for (const c of pool) tot += c.weight;
      let r = rand() * tot, idx = 0;
      for (let i = 0; i < pool.length; i++) { r -= pool[i].weight; if (r <= 0) { idx = i; break; } }
      cards.push(pool.splice(idx, 1)[0]);
    }
    const filler = [
      { kind: 'ascend', id: 'focus', name: 'ASCEND', color: '#ff4fd8', desc: '+8% to all damage, permanently', tag: 'ETERNAL' },
      { kind: 'heal', id: 'vitality', name: 'MENDING', color: PAL.xp, desc: 'Restore 45% of your life', tag: 'RELIEF' },
      { kind: 'score', id: 'fortune', name: 'RELIC', color: PAL.gold, desc: '+1200 score, +1 reroll', tag: 'BONUS' }
    ];
    for (let i = filler.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t2 = filler[i]; filler[i] = filler[j]; filler[j] = t2; }
    let fi = 0;
    while (cards.length < NCARD) cards.push(filler[fi++ % filler.length]);
    return cards.slice(0, NCARD);
  },
  openLevelUp() {
    this.cards = this.buildCards();
    this.cardSel = 0;
    this.state = 'levelup';
    Sound.levelUp();
    Flash.hit(PAL.xp, 0.13);
    Particles.ring(this.player.x, this.player.y, 20, 300, { col: PAL.xp, life: 0.7, w: 6 });
  },
  takeCard(c) {
    if (c.kind === 'wup') { const w = this.ownedWeapon(c.id); w.level++; }
    else if (c.kind === 'wnew') { this.weapons.push({ id: c.id, level: 1, t: 0.2, evolved: false }); if (this.runStats) this.runStats.weaponsTaken++; }
    else if (c.kind === 'pass') { this.passives[c.id] = (this.passives[c.id] || 0) + 1; this.recomputeStats(); }
    else if (c.kind === 'evo') {
      const w = this.ownedWeapon(c.wid); w.evolved = true;
      this.banner(c.name + ' AWAKENED', c.color);
      Flash.hit(c.color, 0.4); Cam.shake(0.5);
      Particles.ring(this.player.x, this.player.y, 10, 420, { col: c.color, life: 0.9, w: 9 });
      Sound.fanfare(true);
      Ach.grant('evolved');
    }
    else if (c.kind === 'ascend') { this.ascend = (this.ascend || 0) + 1; this.recomputeStats(); this.banner('ASCEND \u00d7' + this.ascend, '#ff4fd8'); }
    else if (c.kind === 'heal') this.player.heal(Math.round(this.player.maxHp * 0.45));
    else if (c.kind === 'score') { this.score += 1200; this.rerolls++; }
    Sound.ui(true);
    if (this.pendingLevels > 0) this.pendingLevels--;
    if (this.chestQueue > 0) this.chestQueue--;
    if (this.pendingLevels > 0 || this.chestQueue > 0) { this.cards = this.buildCards(); this.cardSel = 0; }
    else this.state = 'playing';
  },
  openChest() {
    this.player.heal(Math.round(this.player.maxHp * 0.2));
    this.chestQueue += rand() < 0.25 ? 2 : 1;
    this.rerolls++;
    this.banner('RELIC CACHE', PAL.gold);
    if (this.state === 'playing') { this.cards = this.buildCards(true); this.cardSel = 0; this.state = 'levelup'; Sound.levelUp(); }
  },

  /* ------------------------------------------------------------- spawning */
  bossTime() { return (!this.planet && this.D.bossT) ? this.D.bossT : BOSS_T; },
  hpMul() {
    const t = this.time;
    let m = (1 + Math.pow(t / 60, 1.33) * 0.38) * this.D.hp;
    if (this.planet) m *= THREAT_HP[this.planet.threat] || 1;
    if (this.endless) m *= Math.pow(1 + TIDE.hp, this.tide);
    if (this.actII) m *= Math.pow(1.11, this.og);
    if (this.postBloom) m *= 1 + Math.max(0, t - BOSS_T) / 260;
    return m;
  },
  spawnRate() {
    const t = this.time;
    let base = Math.min(15, 1.5 + t * 0.0285) * this.D.rate;
    if (this.endless) base *= Math.min(3.2, 1 + this.tide * TIDE.rate);
    if (this.postBloom) base *= 1 + Math.min(1.2, (t - BOSS_T) / 420);
    return Math.min(34, base);
  },
  tideMul(key, cap) {
    if (!this.endless) return 1;
    return Math.min(cap, 1 + this.tide * TIDE[key]);
  },
  bulletMul() {
    return this.D.bulletSpd * this.tideMul('bullet', 2.0);
  },
  enemyArmor() {
    let a = this.D.armor || 0;
    if (this.actII && this.og >= 4) a += 0.18;
    if (this.endless && this.tide >= TIDE.armorAt) a += Math.min(0.32, (this.tide - TIDE.armorAt) * 0.006);
    return a;
  },
  // how likely a given corpse is to fire a parting shot
  burstsOnDeath() {
    let c = this.D.deathBurst || 0;
    if (this.endless && this.tide >= TIDE.burstAt) c = Math.max(c, 0.5);
    return c;
  },
  // what share of the rank and file spawn carrying a weapon
  enemyGunRate() {
    let r = this.D.enemyGuns || 0;
    if (this.endless && this.tide >= TIDE.gunAt) r = Math.max(r, Math.min(0.28, (this.tide - TIDE.gunAt) * 0.012));
    return r;
  },
  pickType() {
    const t = this.time;
    const w = [];
    const add = (id, v) => { if (v > 0) w.push([id, v]); };
    add('drifter', 10 + Math.max(0, 8 - t / 60));
    add('swarmer', t > 35 ? Math.min(13, 3 + t / 42) : 0);
    add('bulwark', t > 95 ? Math.min(6.5, 1 + (t - 95) / 105) : 0);
    add('spitter', t > 140 ? Math.min(6, 1 + (t - 140) / 115) : 0);
    add('splitter', t > 215 ? Math.min(5.5, 1 + (t - 215) / 125) : 0);
    add('wraith', t > 300 ? Math.min(5.5, 1 + (t - 300) / 115) : 0);
    add('howler', t > 120 ? Math.min(6, 1 + (t - 120) / 110) : 0);
    add('lancer', t > 190 ? Math.min(5, 1 + (t - 190) / 120) : 0);
    add('hexer', t > 265 ? Math.min(4.5, 1 + (t - 265) / 130) : 0);
    add('weaver', t > 340 ? Math.min(4.5, 1 + (t - 340) / 130) : 0);
    add('monolith', t > 400 ? Math.min(3.5, 0.8 + (t - 400) / 150) : 0);
    const ros = this.planet && this.planet.roster;
    if (ros) for (const p of w) { const k = ros[p[0]]; if (k !== undefined) p[1] *= k; }
    let tot = 0; for (const p of w) tot += p[1];
    if (tot <= 0) return ENEMY.drifter;
    let r = rand() * tot;
    for (const p of w) { r -= p[1]; if (r <= 0) return ENEMY[p[0]]; }
    return ENEMY.drifter;
  },
  spawnPos() {
    const p = this.player;
    const margin = Math.max(VW, VH) * 0.62 / Cam.zoom + 90;
    // a share of spawns lands in your path, so running forever isn't free
    const ahead = rand() < (0.18 + Math.min(0.26, this.time / 2200));
    const vdir = Math.atan2(p.vy, p.vx);
    const moving = Math.hypot(p.vx, p.vy) > 40;
    for (let i = 0; i < 12; i++) {
      const a = (ahead && moving) ? vdir + rnd(-0.62, 0.62) : rnd(TAU);
      const x = p.x + Math.cos(a) * margin, y = p.y + Math.sin(a) * margin;
      if (Math.hypot(x, y) < this.arenaR - 30) return { x: x, y: y };
    }
    const a = Math.atan2(-p.y, -p.x) + rnd(-0.9, 0.9);
    let fx = p.x + Math.cos(a) * margin * 0.8, fy = p.y + Math.sin(a) * margin * 0.8;
    const fm = Math.hypot(fx, fy), flim = this.arenaR - 60;
    if (fm > flim) { fx = fx / fm * flim; fy = fy / fm * flim; }
    return { x: fx, y: fy };
  },
  spawnOne(def) {
    if (this.enemies.length >= this.enemyCap) return null;
    const pos = this.spawnPos();
    const e = new Enemy(def || this.pickType(), pos.x, pos.y, this.hpMul(), this.dmgScale);
    this.enemies.push(e);
    return e;
  },
  surge() {
    const t = this.time;
    const kind = rand();
    const p = this.player;
    const R = Math.max(VW, VH) * 0.6 / Cam.zoom + 70;
    if (kind < 0.4) {
      const n = Math.min(46, 14 + (t / 30) | 0);
      this.banner('ENCIRCLED', '#ff9a3c');
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU;
        const x = p.x + Math.cos(a) * R, y = p.y + Math.sin(a) * R;
        if (Math.hypot(x, y) > this.arenaR) continue;
        this.enemies.push(new Enemy(t > 200 && rand() < 0.3 ? ENEMY.bulwark : ENEMY.drifter, x, y, this.hpMul(), this.dmgScale));
      }
    } else if (kind < 0.75) {
      const n = Math.min(50, 18 + (t / 24) | 0);
      const a0 = rnd(TAU);
      this.banner('SWARM', '#63ffc9');
      for (let i = 0; i < n; i++) {
        const a = a0 + rnd(-0.5, 0.5);
        const d = R + rnd(0, 220);
        this.enemies.push(new Enemy(ENEMY.swarmer, p.x + Math.cos(a) * d, p.y + Math.sin(a) * d, this.hpMul(), this.dmgScale));
      }
    } else {
      const n = Math.min(16, 5 + (t / 70) | 0);
      this.banner('HEAVY', '#ff5fa2');
      for (let i = 0; i < n; i++) {
        const a = rnd(TAU);
        this.enemies.push(new Enemy(rand() < 0.5 ? ENEMY.bulwark : ENEMY.spitter, p.x + Math.cos(a) * R, p.y + Math.sin(a) * R, this.hpMul(), this.dmgScale));
      }
    }
  },
  spawnElite() {
    const id = ELITE_CYCLE[this.eliteCount % ELITE_CYCLE.length] || 'warden';
    this.eliteCount = (this.eliteCount || 0) + 1;
    const def = ENEMY[id];
    const e = this.spawnOne(def);
    if (!e) return;
    e.maxHp = e.hp = Math.round(def.hp * (0.5 + this.hpMul() * 0.5) * this.D.eliteHp);
    this.banner(def.name, def.col);
    Pet.poke('boss');
    Sound.bossHorn();
    Flash.hit(def.col, 0.22);
    Particles.ring(e.x, e.y, 20, 340, { col: def.col, life: 0.8, w: 8 });
  },
  spawnBoss(id, extraMul) {
    if (id === 'antiphon') { this.spawnAntiphon(extraMul); return; }
    const def = ENEMY[id] || ENEMY.bloom;
    if (def.finale) this.bossSpawned = true;
    const p = this.player;
    const a = rnd(TAU);
    const d = Math.max(VW, VH) * 0.55 + 130;
    let x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d;
    const m = Math.hypot(x, y);
    if (m > this.arenaR - 150) { x = x / m * (this.arenaR - 150); y = y / m * (this.arenaR - 150); }
    let mul = this.D.bossHp * (extraMul || 1) * (this.rel('bloomcrown') ? 1.25 : 1);
    if (this.endless) mul *= Math.pow(1 + TIDE.hp * 0.85, this.tide);
    const b = new Enemy(def, x, y, mul, this.dmgScale);
    b.spawnT = 1.2;
    this.enemies.push(b);
    if (!this.boss || this.boss.dead || b.maxHp > this.boss.maxHp) this.boss = b;
    this.banner(def.name, def.col);
    Sound.bossHorn();
    Flash.hit(def.col, 0.45);
    Cam.shake(0.9);
    Cam.tzoom = 0.92;
    Particles.ring(x, y, 20, 600, { col: def.col, life: 1.2, w: 12 });
    this._lastBoss = b;
  },

  /* --------------------------------------------------------------- update */
  update(dt) {
    if (this.hitstop > 0) { this.hitstop -= dt; return; }
    this.frame++;
    this.time += dt;
    const D = this.D;
    if (this.player && this.runStats) {
      const f = this.player.hp / Math.max(1, this.player.maxHp);
      if (f < this.runStats.minHpFrac) this.runStats.minHpFrac = f;
    }
    this._achT = (this._achT || 0) - dt;
    if (this._achT <= 0) { this._achT = 1; Ach.sweep(); }
    // the difficulty's damage multiplier eases in over the first 40s, so a hard
    // run is survivable long enough to get your first two levels
    const dEase = 1 + (D.dmg - 1) * (0.6 + 0.4 * Math.min(1, this.time / 40));
    this.dmgScale = (1 + this.time / 260 * D.dmgRamp) * dEase * (this.endless ? (1 + this.tide * TIDE.dmg) : 1);
    this.enemySpeedMul = (1 + Math.min(0.55, this.time / 1250) * D.spdRamp) * D.spd * this.tideMul('spd', 1.9);
    // the tide: endless escalation, forever
    if (this.endless && !this.over) {
      this.tideT -= dt;
      if (this.tideT <= 0) {
        this.tideT = D.tideEvery;
        this.tide++;
        if (this.tide % 5 === 0) { this.banner('TIDE \u00d7' + this.tide, D.color); Flash.hit(D.color, 0.14); }
        if (this.tide % TIDE.wardenEvery === 0) this.spawnElite();
      }
      // Bosses come when they come -- but never on top of each other. One at a
      // time until the tide is deep, and always a real gap after the last one.
      this.bossRollT -= dt;
      if (this.bossRollT <= 0) {
        const live = this.bossCount();
        const cap = Math.min(this.D.maxBosses || 3, 1 + Math.floor(this.tide / TIDE.capAt));
        const since = this.time - (this.lastBossSpawnT === undefined ? -99 : this.lastBossSpawnT);
        if (live >= cap || since < TIDE.minGap) {
          this.bossRollT = 5;            // come back shortly, do not spawn
        } else {
          this.bossRollT = rnd(TIDE.rollMin, TIDE.rollMax);
          const chance = Math.min(0.7, TIDE.bossBase + this.tide * TIDE.bossPer) / (1 + live * 1.8);
          if (this.time > 45 && rand() < chance) {
            // a pack is only ever allowed onto an empty floor, and only late
            let pack = 1;
            if (live === 0 && this.tide >= 24) pack = 1 + ((rand() * Math.min(2, this.tide / 24)) | 0);
            pack = Math.min(pack, cap - live);
            if (pack > 0) {
              this.spawnBossPack(pack);
              this.lastBossSpawnT = this.time;
              this.bossRollT = TIDE.afterPack + pack * 9;
            }
          }
        }
      }
    }

    const p = this.player;
    const preX = p.x, preY = p.y;
    p.update(dt);
    Pet.update(dt, p);
    // dashing through THE APERTURE is the only thing that opens it
    if (p.dashT > 0 || Math.hypot(p.x - preX, p.y - preY) > 60) {
      for (const e of this.enemies) {
        if (e.dead || e.def.bossKind !== 'aperture' || e.spawnT > 0) continue;
        const rr = e.r + 16;
        const mx = (preX + p.x) * 0.5, my = (preY + p.y) * 0.5;
        if (dist2(p.x, p.y, e.x, e.y) < rr * rr || dist2(mx, my, e.x, e.y) < rr * rr) {
          if (e.openT <= 0) {
            e.openT = this.D.bossGentle ? 6 : (this.D.bossExtra ? 2.2 : 3.5);
            this.banner('OPEN', e.def.col);
            Flash.hit(e.def.col, 0.4); Cam.shake(0.6);
            Particles.ring(e.x, e.y, e.r, e.r + 320, { col: e.def.col, life: 0.7, w: 8 });
            Sound.bossHorn();
          }
        }
      }
    }

    // spawn director
    if (!this.over && this.solo) {
      // EVENTIDE: no trash, no elites, no gauntlet. It is already down there.
      if (!this.bossSpawned && this.time >= 2.4) {
        this.bossSpawned = true;
        this._lastBoss = null;
        this.spawnBoss('sower');
        if (this._lastBoss) { this._lastBoss.isFinale = true; this.sowerStart(this._lastBoss); }
      }
    } else if (!this.over) {
      this.spawnAcc += this.spawnRate() * (this.boss ? 0.42 : 1) * dt;
      let guard = 0;
      while (this.spawnAcc >= 1 && guard++ < 24) { this.spawnAcc -= 1; this.spawnOne(); }
      this.surgeT -= dt;
      if (this.surgeT <= 0 && (this.time < this.bossTime() || this.endless)) { this.surgeT = Math.max(24, 44 - this.time / 22) + rnd(-4, 6); this.surge(); }
      const eliteTimes = this.eliteTimes;
      if (this.eliteIdx < eliteTimes.length && this.time >= eliteTimes[this.eliteIdx]) { this.eliteIdx++; this.spawnElite(); }
      if (!this.endless) {
        const g = GAUNTLET[this.gauntletIdx];
        if (g && this.time >= g.t && !this.boss) { this.gauntletIdx++; this.spawnBoss(g.id); }
        if (!this.bossSpawned && this.time >= this.bossTime() && !this.boss) {
          this.bossSpawned = true;
          this._lastBoss = null;
          const fid = this.planet ? this.planet.finaleNow : (this.D.finaleId || (this.D.daily ? 'voidheart' : 'bloom'));
          this.spawnBoss(fid);
          if (this._lastBoss) this._lastBoss.isFinale = true;
        }
      }
      if (this.actII) {
        const el = this.time - (this.act2Start || 0);
        const marks = [210, 390];
        if (this.covIdx < marks.length && el >= marks[this.covIdx]) { this.covIdx++; this.offerCovenant(); }
        if (!this.ubSpawned && el >= 480 && !this.boss) {
          this.ubSpawned = true;
          this._lastBoss = null;
          this.spawnBoss('underbloom');
          if (this._lastBoss) this._lastBoss.isFinale = true;
        }
      }
      if (this.postBloom) {
        this.endlessT -= dt;
        if (this.endlessT <= 0) { this.endlessT = 75; this.spawnElite(); }
      }
    }

    // THE LONG NIGHT drags the walls inward; they ease back once it is gone
    if (this.arenaTarget && Math.abs(this.arenaR - this.arenaTarget) > 1) {
      this.arenaR += (this.arenaTarget - this.arenaR) * Math.min(1, dt * 0.55);
    }
    this.ogTick(dt);
    // boss-imposed conditions decay unless something is renewing them
    this.moveMul = 1; this.spinF = 0; this.pullF = 0;
    if (this.freezeT > 0) this.freezeT -= dt;
    if (this.rime > 0) { this.rimeT -= dt; if (this.rimeT <= 0) { this.rime = Math.max(0, this.rime - 1); this.rimeT = 1.5; } }
    this.rebuildGrid();
    this.tickSilence(dt);
    this.relicTick(dt);
    Weapons.update(dt);
    Weapons.updateFx(dt);

    // enemies
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (!e) continue;
      if (e.dead) { this.enemies.splice(i, 1); if (e === this.boss) this.pickPrimaryBoss(); continue; }
      e.update(dt);
    }
    this.separate(dt);
    // separation and knockback can shove things through the wall -- sweep them back
    for (let i = 0; i < this.enemies.length; i++) {
      const e = this.enemies[i];
      if (e && !e.dead && !e.isMoon) e.contain();
    }

    // enemy vs player
    const near = this.queryEnemies(p.x, p.y, 90);
    for (let i = 0; i < near.length; i++) {
      const e = near[i];
      if (e.dead || e.spawnT > 0) continue;
      const rr = e.r + p.r - 3;
      if (dist2(e.x, e.y, p.x, p.y) < rr * rr) {
        p.damage(e.dmg, { contact: true });
        if (this.cov('thorn')) this.hitEnemy(e, 900 * (this.stats.dmgMul || 1), { silent: true, col: '#ff5470' });
        const a = Math.atan2(e.y - p.y, e.x - p.x);
        e.kx += Math.cos(a) * 260; e.ky += Math.sin(a) * 260;
        break;
      }
    }

    // shots
    for (let i = this.shots.length - 1; i >= 0; i--) {
      const s = this.shots[i];
      if (!s) continue;
      s.update(dt);
      if (!s.dead) {
        const list = this.queryEnemies(s.x, s.y, s.r + 34);
        for (let j = 0; j < list.length; j++) {
          const e = list[j];
          if (e.dead || e.spawnT > 0) continue;
          if (s.hitSet && s.hitSet.has(e)) continue;
          const rr = e.r + s.r;
          if (dist2(e.x, e.y, s.x, s.y) < rr * rr) {
            if (s.hitCd) {
              if (!s.uid) s.uid = 'sv' + (rand() * 1e6 | 0);
              if (e.tickReady(s.uid, s.hitCd)) this.hitEnemy(e, s.dmg, { col: s.col, kb: 180, kbAngle: Math.atan2(s.vy, s.vx) });
              continue;
            }
            if (s.bounce > 0) {
              this.hitEnemy(e, s.dmg, { col: s.col, kb: 150, kbAngle: Math.atan2(s.vy, s.vx) });
              if (!s.hitSet) s.hitSet = new Set();
              s.hitSet.add(e);
              s.bounce--;
              s.dmg *= 1.18;
              const nx2 = this.nearestEnemy(s.x, s.y, 460, s.hitSet);
              const sp2 = Math.max(Math.hypot(s.vx, s.vy), 420);
              const a2 = nx2 ? Math.atan2(nx2.y - s.y, nx2.x - s.x) : Math.atan2(s.vy, s.vx) + rnd(2.0, 4.2);
              s.vx = Math.cos(a2) * sp2; s.vy = Math.sin(a2) * sp2;
              if (s.bounce <= 0) s.dead = true;
              Particles.burst(s.x, s.y, 4, s.col, { spd1: 150, life: 0.22 });
              break;
            }
            this.hitEnemy(e, s.dmg, { col: s.col, kb: 180, kbAngle: Math.atan2(s.vy, s.vx) });
            if (s.explode) this.explode(s.x, s.y, s.explode.r, s.dmg * s.explode.mul, s.col, e);
            if (s.split > 0) {
              for (let k = 0; k < s.split; k++) {
                const t2 = this.nearestEnemy(s.x, s.y, 340, new Set([e]));
                const a3 = t2 ? Math.atan2(t2.y - s.y, t2.x - s.x) : rnd(TAU);
                this.shots.push(new Shot({
                  x: s.x, y: s.y, vx: Math.cos(a3) * 300, vy: Math.sin(a3) * 300,
                  r: 5, dmg: s.dmg * 0.6, life: 1.8, pierce: 1, homing: 7, accel: 260,
                  col: s.col, trail: true, kind: 'orb', target: t2, split: 0, wkey: s.wkey
                }));
              }
            }
            s.pierce--;
            if (s.pierce <= 0) { s.dead = true; }
            else { if (!s.hitSet) s.hitSet = new Set(); s.hitSet.add(e); }
            break;
          }
        }
      }
      if (s.dead) {
        Particles.burst(s.x, s.y, 5, s.col, { spd1: 140, life: 0.3 });
        this.shots.splice(i, 1);
      }
    }
    // enemy bullets
    for (let i = this.ebullets.length - 1; i >= 0; i--) {
      const b = this.ebullets[i];
      if (!b) continue;
      b.update(dt);
      if (b.dead) this.ebullets.splice(i, 1);
    }
    // gadgets (pylons, mines, wells, chains)
    for (let i = this.gadgets.length - 1; i >= 0; i--) { const o = this.gadgets[i]; if (!o) continue; o.update(dt); if (o.dead) this.gadgets.splice(i, 1); }
    // pools & pickups & fx
    for (let i = this.pools.length - 1; i >= 0; i--) { const o = this.pools[i]; if (!o) continue; o.update(dt); if (o.dead) this.pools.splice(i, 1); }
    for (let i = this.pickups.length - 1; i >= 0; i--) { const o = this.pickups[i]; if (!o) continue; o.update(dt); if (o.dead) this.pickups.splice(i, 1); }
    // telegraph lasers
    for (let i = this.fx.length - 1; i >= 0; i--) {
      const f = this.fx[i];
      if (f.t !== 'tele') continue;
      if (f.src && !f.src.dead) { f.x = f.src.x; f.y = f.src.y; }
      if (f.rot && !f.fired) f.a += f.rot * dt;
      if (!f.fired && f.life < 0.34) {
        f.fired = true;
        const dx = Math.cos(f.a), dy = Math.sin(f.a);
        const px = p.x - f.x, py = p.y - f.y;
        const t = px * dx + py * dy;
        const perp = Math.abs(px * -dy + py * dx);
        if (t > 0 && perp < f.w / 2 + p.r) p.damage(26 * this.dmgScale);
        Cam.shake(0.2);
        Sound.shoot('beam');
      }
    }

    Particles.update(dt);
    Pops.update(dt);
    Flash.update(dt);
    for (let i = this.banners.length - 1; i >= 0; i--) { this.banners[i].life -= dt; if (this.banners[i].life <= 0) this.banners.splice(i, 1); }

    this.comboT -= dt;
    if (this.comboT <= 0) this.combo = 0;

    // camera
    const lookX = clamp(p.vx * 0.16, -110, 110), lookY = clamp(p.vy * 0.16, -110, 110);
    Cam.update(dt, p.x, p.y, lookX, lookY);

    // music intensity
    Sound.setIntensity(Math.min(1, this.time / 460 + (this.boss ? 0.35 : 0) + Math.min(0.2, this.enemies.length / 400)));
  },

  explode(x, y, r, dmg, col, skip) {
    r *= this.stats.blastMul; dmg *= this.stats.blastDmg;
    Particles.ring(x, y, r * 0.2, r, { col: col, life: 0.35, w: 4 });
    Particles.burst(x, y, 12, col, { spd1: 300, life: 0.4 });
    Cam.shake(0.06);
    const list = this.queryEnemies(x, y, r + 40);
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.dead || e === skip) continue;
      if (dist2(e.x, e.y, x, y) < (r + e.r) * (r + e.r)) {
        this.hitEnemy(e, dmg, { col: col, kb: 200, kbAngle: Math.atan2(e.y - y, e.x - x) });
      }
    }
  },

  separate(dt) {
    const list = this.enemies;
    const n = list.length;
    if (!n) return;
    const step = this.frame % 2;
    for (let i = step; i < n; i += 2) {
      const a = list[i];
      if (a.dead || a.boss) continue;
      const near = this.grid.query(a.x, a.y, a.r + 34, this._q);
      for (let j = 0; j < near.length; j++) {
        const b = near[j];
        if (b === a || b.dead || b.boss) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const rr = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 < rr * rr && d2 > 0.001) {
          const d = Math.sqrt(d2);
          const push = (rr - d) * 0.5;
          const ux = dx / d, uy = dy / d;
          const ma = b.def.mass / (a.def.mass + b.def.mass);
          a.x -= ux * push * ma * 1.6; a.y -= uy * push * ma * 1.6;
          b.x += ux * push * (1 - ma) * 1.6; b.y += uy * push * (1 - ma) * 1.6;
        }
      }
    }
  },

  /* ---- PRESS ON: the second act of a threat-5 world ---- */
  pressOn() {
    this.over = false;
    this.state = 'playing';
    this.actII = true;
    this.og = 0; this.ogT = 90; this.covIdx = 0;
    this.act2Start = this.time;
    this.gauntletIdx = GAUNTLET.length;
    this.bossSpawned = true;
    this.surgeT = 18;
    this.eliteIdx = 0;
    this.eliteTimes = [this.time + 70, this.time + 180, this.time + 300, this.time + 420].map(Math.round);
    this.player.dead = false;
    this.player.hp = this.player.maxHp;
    this.player.inv = 2.5;
    Sound.startMusic();
    Sound.setIntensity(1);
    this.banner('THE UNDERBLOOM STIRS', PAL.boss);
    Flash.hit(PAL.boss, 0.45);
    Cam.shake(0.8);
    UI.lastState = '';
    this.offerCovenant();
  },
  offerCovenant() {
    const pool = COVENANTS.filter(cv => !this.covs[cv.id]);
    if (!pool.length) return;
    for (let i = pool.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    this.covCards = pool.slice(0, 3);
    this.state = 'covenant';
    UI.sels.cov = 0; UI.lockT = 0.25; UI.lastState = '';
    Sound.levelUp();
  },
  takeCovenant(id) {
    const cv = COV_BY_ID[id];
    if (!cv) return;
    this.covs[id] = 1;
    if (id === 'longbreath' && this.player) { this.recomputeStats(); this.player.hp = this.player.maxHp; }
    if (id === 'vow' && this.weapons.length > 1) {
      let worst = 0;
      for (let i = 1; i < this.weapons.length; i++) if (this.weapons[i].level < this.weapons[worst].level) worst = i;
      this.weapons.splice(worst, 1);
      for (const w of this.weapons) w.level = Math.min(7, w.level + 2);
    }
    if (id === 'fallow') this.ogStall = 180;
    this.recomputeStats();
    this.banner(cv.name, cv.col);
    Flash.hit(cv.col, 0.35);
    this.state = 'playing';
    UI.lastState = '';
  },

  /* ---- Overgrowth: the Act II clock ---- */
  ogTick(dt) {
    if (!this.actII) return;
    if (this.ogStall > 0) { this.ogStall -= dt; return; }
    this.ogT -= dt;
    if (this.ogT <= 0) {
      this.ogT = 90;
      const jump = this.cov('fallow') && !this.ogJumped ? 2 : 1;
      if (jump === 2) this.ogJumped = 1;
      for (let i = 0; i < jump; i++) {
        this.og++;
        const rule = OG_RULES.find(r => r.at === this.og);
        if (rule) { this.banner(rule.name, '#8dff6b'); Flash.hit('#8dff6b', 0.3); Cam.shake(0.5); }
        else this.banner('OVERGROWTH ' + this.og, '#8dff6b');
      }
    }
    // SPORES -- drifting clouds off the wall
    if (this.og >= 1) {
      this.sporeT = (this.sporeT || 0) - dt;
      if (this.sporeT <= 0) {
        this.sporeT = 3.4;
        const a = rnd(TAU), d = this.arenaR - 40;
        this.addPool(new Pool(Math.cos(a) * d, Math.sin(a) * d, 90, 12 * this.dmgScale, 14, '#8dff6b', { hostile: true }));
      }
    }
    // ROOTED -- the floor holds you where you killed things
    if (this.og >= 2 && this.player && !this.player.dead) {
      for (const pl of this.pools) {
        if (!pl.root || pl.dead) continue;
        if (dist2(pl.x, pl.y, this.player.x, this.player.y) < pl.r * pl.r) { this.moveMul *= 0.65; break; }
      }
    }
    // THE SECOND SUN -- one slow beam, forever
    if (this.og >= 5) {
      this.sunA += dt * (TAU / 14);
      const p = this.player;
      if (p && !p.dead) {
        const pa = Math.atan2(p.y, p.x);
        if (Math.abs(angDiff(pa, this.sunA)) < 0.08 && Math.hypot(p.x, p.y) > 60) p.damage(16 * this.dmgScale);
      }
    }
  },
  goEndless() {
    this.over = false;
    this.state = 'playing';
    this.postBloom = true;
    this.endlessT = 60;
    this.gauntletIdx = GAUNTLET.length;
    this.surgeT = 20;
    this.player.dead = false;
    this.player.hp = this.player.maxHp;
    this.player.inv = 2;
    Sound.startMusic();
    Sound.setIntensity(1);
    this.banner('DESCEND', PAL.boss);
    Flash.hit(PAL.boss, 0.3);
    Cam.shake(0.5);
    UI.lastState = '';
  },
  gameOver(win) {
    if (this.over) return;
    this.titheReleaseAll(false);
    this.over = true;
    this.state = win ? 'win' : 'dead';
    this.player.dead = !win;
    Sound.stopMusic(!win);
    Sound.fanfare(win);
    if (win) { Flash.hit('#fff', 0.8); Cam.shake(1); CG.win(); }
    else { Flash.vignette('rgba(120,0,20,0.85)', 1); Cam.shake(0.6); }
    const d = Save.data;
    d.runs++; d.kills += this.kills;
    if (win) d.wins++;
    this.conquered = null;
    if (win && this.actII) Ach.grant('endurant');
    if (this.tide >= 40) Ach.grant('sunken');
    if (win && this.planet === EVENTIDE) {
      const firstTake = Conquest.takeHole(this.score, this.time);
      this.conquered = { planet: EVENTIDE, first: firstTake };
      Ach.grant('eventide');
    } else if (win && this.planet) {
      const firstTake = Conquest.conquer(this.planet, this.score, this.time);
      this.conquered = { planet: this.planet, first: firstTake };
      if (Conquest.count() >= PLANETS.length) Ach.grant('conqueror');
    }
    const sc = Math.round(this.score);
    if (sc > d.best) d.best = sc;
    if (this.time > d.bestTime) d.bestTime = this.time;
    const k = this.diff;
    if (!d.diffBest) d.diffBest = {};
    if (!d.diffTime) d.diffTime = {};
    if (!d.diffWins) d.diffWins = {};
    if (!d.diffTide) d.diffTide = {};
    if (sc > (d.diffBest[k] || 0)) d.diffBest[k] = sc;
    if (this.time > (d.diffTime[k] || 0)) d.diffTime[k] = this.time;
    if (win) d.diffWins[k] = (d.diffWins[k] || 0) + 1;
    if (this.tide > (d.diffTide[k] || 0)) d.diffTide[k] = this.tide;
    d.lastDiff = k;
    let firstOfDay = 0;
    if (this.D.daily) {
      const rec = Save.dailyRec(this.dayKey || dailyKey());
      if (rec.runs === 0) firstOfDay = 400;      // one bonus per day, for turning up
      rec.runs++;
      if (sc > rec.best) rec.best = sc;
      if (this.time > rec.time) rec.time = this.time;
      if (win) rec.cleared = 1;
    }
    // ---- what this run proved
    Ach.grant('firstlight');
    if (this.endless) {
      if (this.tide >= 10) Ach.grant('tide10');
      if (this.tide >= 18) Ach.grant('tide18');
      if (this.tide >= 30) Ach.grant('tide30');
    }
    if (win) {
      Ach.grant('gardener');
      if (this.planet === EVENTIDE) Ach.grant('eventide');
      if (k === 'easy') Ach.grant('clr_easy');
      if (k === 'medium') Ach.grant('clr_medium');
      if (k === 'hard') Ach.grant('clr_hard');
      if (k === 'hardcore') Ach.grant('clr_hardcore');
      if (k === 'impossible') Ach.grant('clr_impossible');
      if (this.D.daily) Ach.grant('pilgrim');
      if (this.runStats && this.runStats.minHpFrac >= 0.5) Ach.grant('unbroken');
      let evo = 0;
      for (let i = 0; i < this.weapons.length; i++) if (this.weapons[i].evolved) evo++;
      if (evo >= 2) Ach.grant('ascendant');
    }
    Ach.sweepMeta();

    const earned = Math.round(shardsFor(sc, win, this.tide) * (this.D.shardMul || 1)) + firstOfDay;
    d.shards = (d.shards || 0) + earned;
    this.lastEarned = earned;
    if (!d.owned) d.owned = ['seed'];
    Save.save();
    Ach.sweepMeta();
    // death burst
    for (let i = 0; i < 70; i++) {
      Particles.spark(this.player.x, this.player.y, rnd(TAU), rnd(90, 520), { col: win ? '#fff' : PAL.hp, life: rnd(0.4, 1.1), w: 3 });
    }
  }
};


/* ========================================================================
   ACHIEVEMENTS  --  they pop up the instant you earn them, and four of them
   are the only way to get the mastery skins that are not difficulty clears.
   ======================================================================== */
const ACHS = [
  /* --- first steps ---------------------------------------------------- */
  { id: 'firstlight', n: 'FIRST LIGHT', d: 'Finish your first run', c: '#9ef7ff', g: 'FIRST STEPS' },
  { id: 'firstblood', n: 'FIRST BLOOD', d: 'Kill your first boss', c: '#ff4fd8', g: 'FIRST STEPS' },
  { id: 'gardener', n: 'GARDENER', d: 'Kill THE BLOOM and win a run', c: '#ffd166', g: 'FIRST STEPS' },
  { id: 'student', n: 'STUDENT', d: 'Reach level 10 in one run', c: '#8dff6b', g: 'FIRST STEPS' },
  { id: 'scholar', n: 'SCHOLAR', d: 'Reach level 30 in one run', c: '#8dff6b', g: 'FIRST STEPS' },

  /* --- carnage -------------------------------------------------------- */
  { id: 'hundred', n: 'A HUNDRED', d: '100 kills in one run', c: '#ff9a3c', g: 'CARNAGE' },
  { id: 'thousand', n: 'A THOUSAND', d: '1,000 kills in one run', c: '#ff9a3c', g: 'CARNAGE' },
  { id: 'myriad', n: 'MYRIAD', d: '10,000 kills all told', c: '#ff9a3c', g: 'CARNAGE', prog: () => [Math.min(10000, Save.data.kills || 0), 10000] },

const ALL_BOSS_IDS = ['choir', 'gravewalker', 'weep', 'nullarch', 'loom', 'carrion', 'orrery', 'husk', 'bloom', 'voidheart', 'mirror', 'crown', 'longnight', 'antiphon',

function bossSeenCount() {
  const s = Save.data.bossSeen || {};
  let n = 0; for (const id of ALL_BOSS_IDS) if (s[id]) n++;
  return n;
}
function dailyDays() {
  const log = Save.data.dailyLog || [];
  let n = 0; for (const r of log) if (r.runs > 0) n++;
  return n;
}

const Ach = {
  toasts: [],
  has(id) { const a = Save.data.achs; return !!(a && a[id]); },
  count() { let n = 0; for (let i = 0; i < ACHS.length; i++) if (this.has(ACHS[i].id)) n++; return n; },

  grant(id) {
    if (this.has(id)) return false;
    const a = ACH_BY_ID[id];
    if (!a) return false;
    if (!Save.data.achs) Save.data.achs = {};
    Save.data.achs[id] = 1;
    if (a.skin) {
      if (!Save.data.owned) Save.data.owned = ['seed'];
      if (Save.data.owned.indexOf(a.skin) < 0) Save.data.owned.push(a.skin);
    }
    Save.save();
    this.toasts.push({ a: a, t: 0, life: 4.4 });
    while (this.toasts.length > 3) this.toasts.shift();
    Sound.achieve();
    return true;
  },

  /* cheap conditions, swept once a second while a run is live */
  sweep() {
    const g = Game, d = Save.data;
    if (g.level >= 10) this.grant('student');
    if (g.level >= 30) this.grant('scholar');
    if (g.kills >= 100) this.grant('hundred');
    if (g.kills >= 1000) this.grant('thousand');
    if ((d.kills || 0) + g.kills >= 10000) this.grant('myriad');
    if (g.runStats && g.runStats.dmgDealt >= 500000) this.grant('overkill');
    if (g.time >= 900) this.grant('marathon');
    if (g.weapons.length >= 6) this.grant('fullhands');
    if (Object.keys(g.passives).length >= 7) this.grant('wellrounded');
    if (g.ascend > 0) this.grant('ascend');
    if (g.time >= 480 && g.runStats && g.runStats.weaponsTaken <= 1) this.grant('purist');
    if (g.runStats && g.runStats.dashes >= 150) this.grant('dasher');
    let evo = 0;
    for (let i = 0; i < g.weapons.length; i++) if (g.weapons[i].evolved) evo++;
    if (evo >= 1) this.grant('evolved');
    if (evo >= 2) this.grant('evo2');
    if (evo >= 3) this.grant('evo3');
    if (g.endless) {
      if (g.tide >= 10) this.grant('tide10');
      if (g.tide >= 18) this.grant('tide18');
      if (g.tide >= 30) this.grant('tide30');
    }
    this.sweepMeta();
  },

  /* conditions that hold outside a run too */
  sweepMeta() {
    try { if (bossSeenCount() >= ALL_BOSS_IDS.length) this.grant('archivist'); } catch (e) { }
    const d = Save.data;
    if ((d.shards || 0) >= 5000) this.grant('rich');
    if ((d.owned || []).length >= 6) this.grant('dressed');
    if (dailyDays() >= 5) this.grant('devout');
    if (bossSeenCount() >= ALL_BOSS_IDS.length) this.grant('bestiary');
  },

  update(dt) {
    for (let i = this.toasts.length - 1; i >= 0; i--) {
      const t = this.toasts[i];
      t.t += dt;
      if (t.t >= t.life) this.toasts.splice(i, 1);
    }
  },

  /* the pop-up. slides in from the right, holds, slides out. */
  draw(c) {
    if (!this.toasts.length) return;
    const narrow = VW < 620;
    const w = narrow ? Math.min(300, VW - 28) : Math.min(320, VW * 0.42), h = narrow ? 52 : 62;
    const maxShown = narrow ? 2 : 3;
    for (let i = 0; i < Math.min(this.toasts.length, maxShown); i++) {
      const t = this.toasts[i], a = t.a;
      const inT = Math.min(1, t.t / 0.42);
      const outT = Math.min(1, Math.max(0, (t.life - t.t) / 0.5));
      const e = 1 - Math.pow(1 - inT, 3);
      const slide = (1 - e) * (w + 40) + (1 - outT) * (w + 40);
      const x = (narrow ? (VW - w) / 2 : VW - w - 18) + slide;
      const y = (narrow ? 8 : VH * 0.22) + i * (h + 8);
      const al = Math.min(inT * 1.4, outT * 1.6, 1);
      c.save();
      c.globalAlpha = al;
      c.fillStyle = 'rgba(10,11,26,0.92)';
      roundRect(c, x, y, w, h, 10); c.fill();
      c.strokeStyle = a.c; c.lineWidth = 1.6;
      c.shadowColor = a.c; c.shadowBlur = 16;
      c.stroke();
      c.restore();

      c.save();
      c.globalAlpha = al;
      // the little star, turning
      c.translate(x + (narrow ? 26 : 30), y + h / 2);
      c.rotate(t.t * 1.6);
      neon(c, xx => pathStar(xx, 5, narrow ? 11 : 13, narrow ? 4.7 : 5.6, -Math.PI / 2), a.c, { lw: 2, blur: 14, core: null, inner: false });
      c.restore();

      c.save();
      c.globalAlpha = al;
      const tx = x + (narrow ? 46 : 54);
      tracked(c, a.skin ? 'ACHIEVEMENT  ·  SKIN UNLOCKED' : 'ACHIEVEMENT', tx, y + (narrow ? 17 : 20),
        { size: narrow ? 7.5 : 8.5, weight: 900, color: a.c, track: narrow ? 1.4 : 2, alpha: 0.9 });
      tracked(c, a.n, tx, y + (narrow ? 32 : 37), { size: narrow ? 12.5 : 14, weight: 900, color: '#fff', glow: a.c, blur: 10, track: 1.5 });
      text(c, a.d, tx, y + (narrow ? 45 : 52), { size: narrow ? 9 : 10, weight: 600, color: PAL.dim, alpha: 0.95 });
      c.restore();
    }
  }
};

/* ------------------------------------------------------- planet bodies --
   Twelve worlds, drawn not drafted. Silhouette carries the identity, so
   they read apart at map size, not only by colour.
