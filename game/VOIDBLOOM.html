          Flash.hit(col, 0.3); Cam.shake(0.7);
        }
      } else if (kind === 'witness') {
        if (this.sub === 1 || this.sub === 3) {
          this.attackT = G.bossCd(3.4);
          const n = G.bossN(10 + ph * 4), off = rnd(TAU);
          for (let i = 0; i < n; i++) {
            const a = off + i / n * TAU;
            G.enemyBullet(this.x, this.y, Math.cos(a) * 195, Math.sin(a) * 195, 12 * G.dmgScale, col);
          }
        } else {
          this.attackT = G.bossCd(4.2 - ph * 0.5);
          const want = Math.min(1 + ph, G.D.bossExtra ? 4 : 3);
          const tape = (this.tape || []).slice();
          if (tape.length > 8) {
            if (!this.echoes) this.echoes = [];
            while (this.echoes.length >= want) this.echoes.shift();
            this.echoes.push({ path: tape, t: 0, fire: 0.1, hx: tape[0].x, hy: tape[0].y });
            G.banner('ECHO', col);
            Sound.bossHorn();
          }
        }
      } else if (kind === 'tithe') {
        this.attackT = G.bossCd(2.6 - ph * 0.3);
        // it fires what it took, and the more of it there was the worse this is
        const lv = this.tookLevel || 1;
        const n = G.bossN(3 + lv + ph * 2);
        const toP = Math.atan2(G.player.y - this.y, G.player.x - this.x);
        for (let i = 0; i < n; i++) {
          const a = toP + (i - (n - 1) / 2) * 0.13;
          G.enemyBullet(this.x, this.y, Math.cos(a) * 245, Math.sin(a) * 245, 12 * G.dmgScale, col);
        }
        if (ph >= 1 && this.sub === 2) {
          const m = G.bossN(14), off = rnd(TAU);
          for (let i = 0; i < m; i++) {
            const a = off + i / m * TAU;
            G.enemyBullet(this.x, this.y, Math.cos(a) * 175, Math.sin(a) * 175, 11 * G.dmgScale, col);
          }
        }
        Sound.shoot();
      } else if (kind === 'aperture') {
        this.attackT = G.bossCd(3.0 - ph * 0.3);
        if (this.sub === 1) {
          G.eShock(this.x, this.y, 480 + ph * 110, 24 + ph * 6, col);
        } else {
          const n = G.bossN(8 + ph * 3), off = rnd(TAU);
          for (let i = 0; i < n; i++) {
            const a = off + i / n * TAU;
            G.enemyBullet(this.x, this.y, Math.cos(a) * 200, Math.sin(a) * 200, 12 * G.dmgScale, col);
          }
        }
        Sound.shoot('beam');
      } else if (kind === 'cultivar') {
        if (this.sub === 0 || this.sub === 2) {
          this.attackT = G.bossCd([5.0, 4.5, 4.0][ph]);
          G.plantSeeds(this, [3, 4, 5][ph]);
        } else {
          this.attackT = G.bossCd(3.2);
          const n = G.bossN(12 + ph * 5), off = rnd(TAU);
          for (let i = 0; i < n; i++) {
            const a = off + i / n * TAU;
            G.enemyBullet(this.x, this.y, Math.cos(a) * 180, Math.sin(a) * 180, 12 * G.dmgScale, col);
          }
          Sound.shoot('nova');
        }
      } else if (kind === 'toll') {
        if (this.sub === 1 && ph >= 1) {
          this.attackT = G.bossCd(4.5);
          G.silenceRing(this, true);          // inward, from the wall
        } else {
          this.attackT = G.bossCd(4.5 - ph * 0.6);
          G.silenceRing(this, false);
          if (ph >= 2) setTimeout(() => { if (!this.dead && G.state === 'playing') G.silenceRing(this, false); }, 1200);
        }
        Sound.bossHorn();
      } else if (kind === 'hoarfrost') {
        if (this.sub === 0) {
          this.attackT = G.bossCd(3.4 - ph * 0.4);
          const n = G.bossN(9 + ph * 4), off = rnd(TAU);
          for (let i = 0; i < n; i++) {
            const a = off + i / n * TAU;
            G.enemyBullet(this.x, this.y, Math.cos(a) * 175, Math.sin(a) * 175, 12 * G.dmgScale, col);
          }
        } else if (this.sub === 1) {
          this.attackT = G.bossCd(3.8);
          // frost heaves out of the floor around you
          const pl = G.player;
          for (let i = 0; i < 3 + ph; i++) {
            G.hexCircle(pl.x + rnd(-260, 260), pl.y + rnd(-260, 260), 116, 1.25, 30 * G.dmgScale, col);
          }
        } else {
          this.attackT = G.bossCd(3.0);
          G.eShock(this.x, this.y, 520 + ph * 120, 26 + ph * 6, col);
          Cam.shake(0.5); Sound.shoot('nova');
        }
      } else if (kind === 'gyre') {
        if (this.sub === 1) {
          this.attackT = G.bossCd(3.6);
          G.eShock(this.x, this.y, 560 + ph * 120, 28 + ph * 6, col);
          Sound.shoot('nova');
        } else {
          this.attackT = G.bossCd(2.6 - ph * 0.25);
          // straight radial lines -- they only look like spirals because you are turning
          const arms = G.bossN(8 + ph * 2), off = rnd(TAU), dir = this.spinDir || 1;
          for (let i = 0; i < arms; i++) {
            const a = off + i / arms * TAU;
            for (let k = 0; k < 3; k++) {
              G.enemyBullet(this.x + Math.cos(a) * (40 + k * 26), this.y + Math.sin(a) * (40 + k * 26),
                Math.cos(a) * (200 + k * 22), Math.sin(a) * (200 + k * 22), 12 * G.dmgScale, col);
            }
          }
          Sound.shoot('beam');
        }
      } else if (kind === 'maw') {
        this.attackT = G.bossCd(2.4 - ph * 0.3);
        // cones of shrapnel out of whatever throats are left
        const live = (this.throats || []).filter(t2 => t2 && !t2.dead);
        const src = live.length ? live[(rand() * live.length) | 0] : this;
        const toP = Math.atan2(G.player.y - src.y, G.player.x - src.x);
        const n = G.bossN(7 + ph * 3);
        for (let i = 0; i < n; i++) {
          const a = toP + (i - (n - 1) / 2) * 0.11;
          G.enemyBullet(src.x, src.y, Math.cos(a) * 250, Math.sin(a) * 250, 13 * G.dmgScale, col);
        }
        Sound.shoot();
      } else if (kind === 'husk') {
        if (this.sub === 0 || this.sub === 2) {
          this.attackT = G.bossCd(2.5 - ph * 0.3);
          // a shotgun blast out of the face it is pointing at you
          const n = G.bossN(7 + ph * 3);
          const a0 = this.face === undefined ? Math.atan2(ny, nx) : this.face;
          for (let i = 0; i < n; i++) {
            const a = a0 + (i - (n - 1) / 2) * 0.14;
            G.enemyBullet(this.x + Math.cos(a0) * this.r, this.y + Math.sin(a0) * this.r,
              Math.cos(a) * 300, Math.sin(a) * 300, 14 * G.dmgScale, col);
          }
          Sound.shoot('beam');
        } else if (this.sub === 1) {
          this.attackT = G.bossCd(3.4);
          // a charge along its facing
          const a0 = this.face === undefined ? Math.atan2(ny, nx) : this.face;
          this.kx = Math.cos(a0) * 1500; this.ky = Math.sin(a0) * 1500;
          G.fx.push({ t: 'tele', x: this.x, y: this.y, a: a0, len: 1400, w: 90, life: G.bossTele(0.75), max: G.bossTele(0.75), col: col, src: this, fired: false });
          Cam.shake(0.5);
          Sound.bossHorn();
        } else {
          this.attackT = G.bossCd(3.0 - ph * 0.3);
          G.hexCircle(p.x, p.y, 120, 1.2, 32 * G.dmgScale, col);
          G.bossSummon(this, 4 + ph * 2);
        }
      } else if (kind === 'sower') {
        const F = this.form | 0;
        if (this.reviveT > 0) {
          this.attackT = 0.5;
        } else if (F === 0) {
          /* I -- THE SOWER. Wide, slow, legible. It teaches the gap. */
          if (this.sub === 0) {
            this.attackT = G.bossCd(3.0 - ph * 0.25);
            this.wave = 2 + ph; this.waveT = 0; this.waveGap = 0.55;
            this.waveO = { n: 24 + ph * 6, spd: 232 + ph * 18, gapW: 0.52,
                           gapA: rnd(TAU), gapStep: 0.95, dmg: 13, col: col };
          } else if (this.sub === 1) {
            this.attackT = G.bossCd(3.3);
            this.fall = 3 + ph; this.fallT = 0.1; this.fallGap = 0.36;
            this.fallN = 5 + ph; this.fallSpd = 300;
          } else if (this.sub === 2) {
            this.attackT = G.bossCd(3.1);
            G.bossPetalLasers(this, 5 + ph * 2);
          } else {
            this.attackT = G.bossCd(3.5);
            if (ph >= 2) G.sowerAccrete(this, col);
            else { this.wave = 2; this.waveT = 0; this.waveGap = 0.5;
                   this.waveO = { n: 22, spd: 210, gapW: 0.55, gapA: rnd(TAU), gapStep: -1.1, dmg: 13, col: col }; }
          }
        } else if (F === 1) {
          /* II -- THE HORIZON. Everything it throws bends. */
          if (this.sub === 0) {
            // FRAME DRAG: the whole ring curls the same way as it leaves
            this.attackT = G.bossCd(2.9 - ph * 0.25);
            this.wave = 2 + ph; this.waveT = 0; this.waveGap = 0.5;
            this.waveO = { n: 26 + ph * 6, spd: 244, gapW: 0.48, gapA: rnd(TAU), gapStep: 1.25,
                           turn: (ph >= 1 ? 0.62 : 0.46) * (rand() < 0.5 ? 1 : -1), dmg: 13, col: col };
          } else if (this.sub === 1) {
            // REDSHIFT / BLUESHIFT: one ring brakes, one accelerates
            this.attackT = G.bossCd(3.2);
            G.sowerRing(this, { n: 18 + ph * 4, spd: 430, gapW: 0.5, gapA: rnd(TAU), acc: 0.42, dmg: 13, col: '#63d4ff' });
            this.wave = 1; this.waveT = 0.45; this.waveGap = 0.5;
            this.waveO = { n: 18 + ph * 4, spd: 120, gapW: 0.5, gapA: rnd(TAU), acc: 2.3, dmg: 13, col: '#ff5470' };
          } else if (this.sub === 2) {
            this.attackT = G.bossCd(3.0);
            G.rotWalls(this, 4 + ph);
          } else {
            this.attackT = G.bossCd(3.4);
            this.fall = 2 + ph; this.fallT = 0.1; this.fallGap = 0.32;
            this.fallN = 7 + ph * 2; this.fallSpd = 330;
            if (ph >= 2) G.hexCircle(G.player.x, G.player.y, 150, 1.0, 34 * G.dmgScale, col);
          }
        } else if (F === 2) {
          /* III -- THE SINGULARITY. It stops giving you room. */
          if (this.sub === 0) {
            this.attackT = G.bossCd(3.4 - ph * 0.3);
            G.sowerCollapse(this, 34 + ph * 8, col);
          } else if (this.sub === 1) {
            this.attackT = G.bossCd(2.8 - ph * 0.3);
            this.spiral = G.bossN(30 + ph * 12); this.spiralA = rnd(TAU);
          } else if (this.sub === 2) {
            this.attackT = G.bossCd(3.0);
            G.rotWalls(this, 5 + ph * 2);
          } else {
            this.attackT = G.bossCd(3.2);
            this.wave = 3; this.waveT = 0; this.waveGap = 0.42;
            this.waveO = { n: 30 + ph * 6, spd: 300, gapW: 0.44, gapA: rnd(TAU), gapStep: 1.55, dmg: 14, col: col };
            if (ph >= 2) G.eShock(this.x, this.y, 620, 30 * G.dmgScale, col);
          }
        } else {
          /* IV -- THE SEED. Small, quick, and out of ideas except the good one. */
          const last = this.hp / this.maxHp < 0.2;
          if (last) {
            // it stops building patterns and simply runs, firing
            this.attackT = G.bossCd(0.9);
            G.sowerFan(this, 3, 380);
          } else if (this.sub === 0) {
            // ORBIT: four points around it, firing outward as they turn
            this.attackT = G.bossCd(3.0);
            this.wave = 6; this.waveT = 0; this.waveGap = 0.22;
            this.waveO = { n: 4, spd: 330, gapW: 0, off: this.r * 3.4, dmg: 12, col: col, snd: '' };
          } else if (this.sub === 1) {
            this.attackT = G.bossCd(2.6);
            this.fall = 3 + ph; this.fallT = 0.1; this.fallGap = 0.28;
            this.fallN = 3 + ph; this.fallSpd = 400;
          } else if (this.sub === 2) {
            this.attackT = G.bossCd(3.2);
            this.spiral = G.bossN(24 + ph * 10); this.spiralA = rnd(TAU);
          } else {
            // THE LAST BLOOM: three rings, wide gaps, and it means it
            this.attackT = G.bossCd(3.8);
            G.banner('THE LAST BLOOM', col);
            G.sowerRing(this, { n: 30, spd: 180, gapW: 0.62, gapA: rnd(TAU), dmg: 14, col: '#ff4fd8' });
            this.wave = 2; this.waveT = 0.42; this.waveGap = 0.42;
            this.waveO = { n: 30, spd: 260, gapW: 0.58, gapA: rnd(TAU), gapStep: 1.05, dmg: 14, col: '#ffd166' };
          }
        }
      } else if (kind === 'void') {
        if (this.sub === 0) {
          this.attackT = G.bossCd(2.2 - ph * 0.3);
          this.spiral = G.bossN(40 + ph * 14); this.spiralA = rnd(TAU);
        } else if (this.sub === 1) {
          this.attackT = G.bossCd(2.8 - ph * 0.3);
          G.eShock(this.x, this.y, 700 + ph * 150, 34 + ph * 10, col);
          G.bossPetalLasers(this, 6 + ph * 3);
        } else if (this.sub === 2) {
          this.attackT = G.bossCd(3.0);
          G.raiseDead(this, 8 + ph * 4);
          G.addPool(new Pool(this.x, this.y, 110, 22 * G.dmgScale, 5.0, col, { hostile: true }));
        } else {
          this.attackT = G.bossCd(2.6 - ph * 0.3);
          G.rotWalls(this, 5 + ph * 2);
          G.hexCircle(G.player.x, G.player.y, 140, 1.1, 38 * G.dmgScale, col);
        }
      }
      G.bossChain(this);
    }

    /* ---- THE SOWER's timed streams ---- */
    if (this.wave > 0) {
      this.waveT = (this.waveT || 0) - dt;
      if (this.waveT <= 0) {
        this.waveT = this.waveGap || 0.5;
        this.wave--;
        const o = this.waveO || {};
        if (o.off) o.a = (this.ringA || 0) * 2.4;
        G.sowerRing(this, o);
        if (o.gapStep) o.gapA = (o.gapA || 0) + o.gapStep;
      }
    }
    if (this.fall > 0) {
      this.fallT = (this.fallT || 0) - dt;
      if (this.fallT <= 0) {
        this.fallT = this.fallGap || 0.36;
        this.fall--;
        G.sowerFan(this, this.fallN || 5, this.fallSpd || 300);
      }
    }

    /* ---- spiral streams (shared) ---- */
    if (this.spiral > 0) {
      this.spiralT = (this.spiralT || 0) - dt;
      if (this.spiralT <= 0) {
        this.spiralT = G.D.bossGentle ? 0.085 : (G.D.bossExtra ? 0.048 : 0.055);
        this.spiral--;
        let step = kind === 'weep' ? -0.5 : 0.42;
        if (G.D.bossExtra && (this.spiral & 1)) step = -step;   // nightmare spirals fight each other
        this.spiralA += step;
        const arms = 2 + this.phase + (kind === 'void' ? 2 : 0) + (G.D.bossExtra ? 2 : (G.D.bossHarder ? 1 : 0)) - (G.D.bossGentle ? 1 : 0);
        for (let i = 0; i < Math.max(1, arms); i++) {
          const a = this.spiralA + i / Math.max(1, arms) * TAU;
          const sp2 = 190 + this.phase * 30;
          G.enemyBullet(this.x + Math.cos(a) * this.r, this.y + Math.sin(a) * this.r, Math.cos(a) * sp2, Math.sin(a) * sp2, 13 * G.dmgScale, col);
        }
        Sound.shoot();
      }
    }
  }


  /* --------------------------------------------------------------------
     The conquest finales get their bodies from enemySprite() like everything
     else, in the same neon-on-dark language. What lives here is only the part
     that has to move or has to be read live: the Gyre's heading, Hoarfrost's
     aura edge, the Maw's breath.
     -------------------------------------------------------------------- */
  bodyRot() {
    const k = this.def.bossKind;
    if (k === 'toll') return (this.swing || 0);
    if (k === 'gyre') return (G.arenaSpin || 0) * 1.4;
    if (k === 'maw') return (this.anchorA === undefined ? Math.atan2(this.y, this.x) : this.anchorA) + Math.PI;
    return this.rot;
  }

  bossArt(c, sc) {
    const k = this.def.bossKind;
    if (!k) return;

    // the motif: whatever else a boss does, it is never completely still
    /* Never gated on quality. It costs about 0.2ms -- roughly one percent
       of a frame -- and a boss that stops moving on a weak machine is a
       worse outcome than a boss that costs 1% of a frame. */
    const MO = BOSS_MOTIF[k];
    if (MO) {
      const fn = BossMotif[MO.m];
      if (fn) {
        c.save();
        c.translate(this.x, this.y);
        const o = {
          t: G.time + (this.ph || 0),
          r: this.r * Math.max(0.18, sc || 1),
          col: this.def.col, alt: MO.alt,
          rings: MO.rings, blades: MO.blades, petals: MO.petals,
          shards: MO.shards, plates: MO.plates, teeth: MO.teeth,
          nodes: MO.nodes, rate: MO.rate, spin: MO.spin
        };
        fn(c, o);
        c.restore();
      }
    }




    if (k === 'sower') {
      const t2 = G.time;
      const col = this.def.col;
      const r = this.r * Math.max(0.18, sc || 1);
      const F = this.form | 0;
      c.save();
      c.globalCompositeOperation = 'lighter';

      // while it re-forms, the pieces come back in from outside
      if (this.reviveT > 0) {
        const k2 = 1 - this.reviveT / 2.9;
        c.globalAlpha = 0.35 + 0.45 * k2;
        c.strokeStyle = '#ffffff'; c.lineWidth = 2;
        c.beginPath(); c.arc(0, 0, r + 760 * (1 - k2), 0, TAU); c.stroke();
        c.globalAlpha = 1;
      }

      if (F === 0) {
        // the disc it scatters from, turning on its own axis
        c.save(); c.rotate(this.coreA || 0); c.scale(1, 0.30);
        c.strokeStyle = col; c.globalAlpha = 0.5; c.lineWidth = 1.6;
        c.setLineDash([10, 12]); c.lineDashOffset = -t2 * 40;
        c.beginPath(); c.arc(0, 0, r * 1.95, 0, TAU); c.stroke();
        c.setLineDash([]); c.restore();
      } else if (F === 1) {
        // everything within reach is falling towards it
        for (let i = 0; i < 3; i++) {
          const ph2 = ((t2 * 0.55 + i / 3) % 1);
          c.globalAlpha = ph2 * 0.5;
          c.strokeStyle = col; c.lineWidth = 1.8;
          c.beginPath(); c.arc(0, 0, r + (1 - ph2) * 340, 0, TAU); c.stroke();
        }
        c.globalAlpha = 1;
      } else if (F === 2) {
        // a hard point, and the light that cannot get away from it
        const a0 = t2 * 2.4;
        c.strokeStyle = '#ffffff'; c.globalAlpha = 0.8; c.lineWidth = 1.4;
        for (let i = 0; i < 3; i++) {
          const a = a0 + i / 3 * TAU;
          c.beginPath(); c.arc(0, 0, r * (1.5 + i * 0.34), a, a + 1.5); c.stroke();
        }
        c.globalAlpha = 1;
      } else {
        // it is running out, and it burns brighter for it
        const pulse = 0.55 + 0.45 * Math.sin(t2 * 9);
        c.globalAlpha = 0.35 + pulse * 0.4;
        c.strokeStyle = '#ffd166'; c.lineWidth = 1.6;
        c.beginPath(); c.arc(0, 0, r * (1.9 + pulse * 0.5), 0, TAU); c.stroke();
        c.globalAlpha = 1;
        if (this.dashing > 0) {
          c.strokeStyle = col; c.lineWidth = 3; c.globalAlpha = 0.75;
          const a = Math.atan2(this.dvy || 0, this.dvx || 1);
          c.beginPath();
          c.moveTo(-Math.cos(a) * r * 5.0, -Math.sin(a) * r * 5.0);
          c.lineTo(-Math.cos(a) * r * 1.2, -Math.sin(a) * r * 1.2);
          c.stroke(); c.globalAlpha = 1;
        }
      }
      c.restore();
      return;
    }
    if (k === 'witness') {
      const t2 = G.time;
      c.save();
      c.globalCompositeOperation = 'lighter';
      // the tape it is holding
      const tp = this.tape;
      if (tp && tp.length > 2) {
        c.strokeStyle = this.def.col; c.globalAlpha = 0.14; c.lineWidth = 2;
        c.beginPath(); c.moveTo(tp[0].x, tp[0].y);
        for (let i = 1; i < tp.length; i++) c.lineTo(tp[i].x, tp[i].y);
        c.stroke();
      }
      for (const E of (this.echoes || [])) {
        if (E.hx === undefined) continue;
        c.globalAlpha = 0.75;
        c.strokeStyle = '#ffffff'; c.shadowColor = this.def.col; c.shadowBlur = 18; c.lineWidth = 2.2;
        c.save(); c.translate(E.hx, E.hy); c.rotate(t2 * 2.4);
        c.beginPath();
        for (let i = 0; i < 4; i++) {
          const a = i / 4 * TAU, rr = i % 2 ? 7 : 15;
          const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
          i ? c.lineTo(px, py) : c.moveTo(px, py);
        }
        c.closePath(); c.stroke();
        c.restore();
      }
      c.restore();
      return;
    }
    if (k === 'tithe' && this.took) {
      const pl = G.player;
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.3 + Math.sin(G.time * 3) * 0.12;
      c.strokeStyle = this.def.col; c.shadowColor = this.def.col; c.shadowBlur = 12; c.lineWidth = 1.6;
      c.setLineDash([9, 11]); c.lineDashOffset = -G.time * 40;
      c.beginPath(); c.moveTo(this.x, this.y); c.lineTo(pl.x, pl.y); c.stroke();
      c.setLineDash([]); c.restore();
    }
    if (k === 'aperture') {
      const open = (this.openT || 0) > 0;
      const rad = 100 + this.r;
      const gaps = [this.gapA || 0];
      if ((this.phase || 0) >= 1) gaps.push(this.gap2A || 2);
      c.save();
      c.globalCompositeOperation = 'lighter';
      if (open) {
        c.globalAlpha = 0.55 + Math.sin(G.time * 10) * 0.2;
        c.strokeStyle = '#ffffff'; c.shadowColor = this.def.col; c.shadowBlur = 26; c.lineWidth = 5;
        c.beginPath(); c.arc(this.x, this.y, this.r + 14, 0, TAU); c.stroke();
      } else {
        c.strokeStyle = this.def.col; c.shadowColor = this.def.col; c.shadowBlur = 16;
        c.lineWidth = 9; c.globalAlpha = 0.75;
        let segs = [[0, TAU]];
        for (const g of gaps) {
          const out = [];
          for (const [a, b2] of segs) {
            const gs = g - 0.42, ge = g + 0.42;
            out.push([a, b2]);
          }
          segs = out;
        }
        // draw the full ring, then punch the gaps out as bright openings
        c.beginPath(); c.arc(this.x, this.y, rad, 0, TAU); c.stroke();
        c.globalCompositeOperation = 'destination-out';
        c.lineWidth = 13;
        for (const g of gaps) { c.beginPath(); c.arc(this.x, this.y, rad, g - 0.44, g + 0.44); c.stroke(); }
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = 0.5 + Math.sin(G.time * 6) * 0.2;
        c.strokeStyle = '#ffffff'; c.lineWidth = 2.4;
        for (const g of gaps) { c.beginPath(); c.arc(this.x, this.y, rad, g - 0.44, g + 0.44); c.stroke(); }
      }
      c.restore();
      return;
    }
    const col = this.def.col, t = G.time, ph = this.phase || 0;
    const r = this.r * Math.max(0.18, sc || 1);

    if (k === 'hoarfrost' && this.aura && this.aura < 5000) {
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.24 + Math.sin(t * 1.4) * 0.06;
      c.strokeStyle = col; c.shadowColor = col; c.shadowBlur = 12; c.lineWidth = 2.4;
      c.setLineDash([18, 15]); c.lineDashOffset = -t * 26;
      c.beginPath(); c.arc(this.x, this.y, this.aura, 0, TAU); c.stroke();
      c.setLineDash([]); c.restore();

    } else if (k === 'cultivar') {
      // it glows brighter the more of the garden is up
      const m = this.maturedN || 0;
      if (m > 0) {
        c.save(); c.globalCompositeOperation = 'lighter';
        c.globalAlpha = Math.min(0.5, 0.12 * m) * (0.6 + Math.sin(t * 4) * 0.4);
        c.strokeStyle = '#eaff8a'; c.shadowColor = col; c.shadowBlur = 16; c.lineWidth = 2;
        c.beginPath(); c.arc(this.x, this.y, r * 1.5, 0, TAU); c.stroke();
        c.restore();
      }

    } else if (k === 'gyre') {
      // which way the floor is going, and how hard
      const dir = this.spinDir || 1;
      c.save();
      c.translate(this.x, this.y); c.rotate(t * 1.2 * dir);
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = '#ffffff'; c.shadowColor = col; c.shadowBlur = 14;
      c.lineWidth = 2.6; c.lineCap = 'round';
      c.globalAlpha = 0.55 + ph * 0.15;
      c.beginPath(); c.arc(0, 0, r * 1.72, -0.85, 0.85); c.stroke();
      const tipA = 0.85, tx = Math.cos(tipA) * r * 1.72, ty = Math.sin(tipA) * r * 1.72;
      c.beginPath();
      c.moveTo(tx - Math.cos(tipA - 0.55) * r * 0.3, ty - Math.sin(tipA - 0.55) * r * 0.3);
      c.lineTo(tx, ty);
      c.lineTo(tx - Math.cos(tipA + 0.1) * r * 0.34, ty - Math.sin(tipA + 0.1) * r * 0.34);
      c.stroke();
      c.lineCap = 'butt'; c.restore();

    } else if (k === 'maw') {
      const inward = (this.anchorA === undefined ? Math.atan2(this.y, this.x) : this.anchorA) + Math.PI;
      const inh = (this.inhaling || 0) > 0;
      if (inh) {
        c.save();
        c.globalCompositeOperation = 'lighter';
        c.strokeStyle = col; c.shadowColor = col; c.shadowBlur = 10;
        c.lineWidth = 2; c.globalAlpha = 0.5;
        for (let i = 0; i < 11; i++) {
          const a = inward + (i / 10 - 0.5) * 1.95;
          const d0 = r * 3.4 + ((t * 460 + i * 84) % 560);
          c.beginPath();
          c.moveTo(this.x + Math.cos(a) * d0, this.y + Math.sin(a) * d0);
          c.lineTo(this.x + Math.cos(a) * (d0 - 84), this.y + Math.sin(a) * (d0 - 84));
          c.stroke();
        }
        c.globalAlpha = 0.3 + Math.sin(t * 9) * 0.12;
        c.lineWidth = 4;
        c.beginPath(); c.arc(this.x, this.y, r * 2.9, inward - 1.3, inward + 1.3); c.stroke();
        c.restore();
      }
    }
  }

  draw(c) {
    const sc = this.spawnT > 0 ? 0.4 + (1 - this.spawnT / 0.28) * 0.6 : 1;
    if (this.boss) {
      /* Sized to the creature, not to a fixed 480px. The old version was a
         six-body-widths-wide wash that lifted the black core to grey and
         turned every boss into coloured fog -- the single biggest thing
         standing between these bodies and reading cleanly. */
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.20 + Math.sin(G.time * 2) * 0.05;
      const gR = this.r * 3.1;
      c.drawImage(glowSprite(this.def.col), this.x - gR, this.y - gR, gR * 2, gR * 2);
      c.restore();
    } else if (this.elite) {
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.45;
      c.drawImage(glowSprite(this.def.col), this.x - 120, this.y - 120, 240, 240);
      c.restore();
    }
    if (this.shield > G.time) {
      c.save(); c.globalAlpha = 0.28 + Math.sin(G.time * 8 + this.ph) * 0.1;
      c.strokeStyle = '#5ec8ff'; c.shadowColor = '#5ec8ff'; c.shadowBlur = 12; c.lineWidth = 2;
      c.beginPath(); c.arc(this.x, this.y, this.r + 8, 0, TAU); c.stroke(); c.restore();
    }
    if (this.frozen > G.time) {
      c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.3;
      c.drawImage(glowSprite('#d6f6ff'), this.x - this.r * 1.7, this.y - this.r * 1.7, this.r * 3.4, this.r * 3.4);
      c.restore();
    }
    if (this.shielded > 0) {
      c.save(); c.globalAlpha = 0.4 + Math.sin(G.time * 6) * 0.15;
      c.strokeStyle = '#e9b8ff'; c.shadowColor = '#e9b8ff'; c.shadowBlur = 22; c.lineWidth = 4;
      c.beginPath(); c.arc(this.x, this.y, this.r + 22, 0, TAU); c.stroke(); c.restore();
    }
    const s = enemySprite(this.def, false);
    // a boss breathes: the cached shell is scaled on a slow double sine so
    // even the static part of the body is never completely still
    let bsc = sc, bscY = sc;
    if (this.def.boss) {
      const beat = bossBodyBeat(this.def.bossKind, G.time + (this.ph || 0));
      if (beat) { bsc = sc * beat[0]; bscY = sc * beat[1]; }
      else { bsc = bscY = sc * BossFX.breathe(G.time + (this.ph || 0), 1.15, 0.028); }
    }
    if (bsc !== bscY) {
      // squash and stretch: the body has to act on the beat too
      c.save();
      c.translate(this.x, this.y);
      c.scale(bsc / sc, bscY / sc);
      c.translate(-this.x, -this.y);
      drawSprite(c, s, this.x, this.y, this.bodyRot(), sc, this.spawnT > 0 ? 0.6 : 1);
      c.restore();
    } else {
      drawSprite(c, s, this.x, this.y, this.bodyRot(), bsc, this.spawnT > 0 ? 0.6 : 1);
    }
    this.bossArt(c, sc);
    if (this.hurt > 0.02) {
      c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.min(0.7, this.hurt * 0.7);
      drawSprite(c, enemySprite(this.def, true), this.x, this.y, this.bodyRot(), sc, 1);
      c.restore();
    }
    if (this.burn > 0) {
      c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.35 + Math.sin(G.time * 18 + this.ph) * 0.12;
      c.drawImage(glowSprite('#ffb347'), this.x - this.r * 1.6, this.y - this.r * 1.6, this.r * 3.2, this.r * 3.2);
      c.restore();
    }
    if (this.armed) {
      c.save();
      c.globalAlpha = 0.45 + Math.sin(G.time * 4 + this.ph) * 0.22;
      c.strokeStyle = '#ffca7a'; c.shadowColor = '#ffca7a'; c.shadowBlur = 9; c.lineWidth = 1.7;
      c.beginPath(); c.arc(this.x, this.y, this.r + 6, 0, TAU); c.stroke();
      c.restore();
    }
    if (this.slow > 0) {
      c.save(); c.globalAlpha = 0.5; c.strokeStyle = '#63ffc9'; c.lineWidth = 1.5;
      c.beginPath(); c.arc(this.x, this.y, this.r + 5, 0, TAU); c.stroke(); c.restore();
    }
    // a seed shows how long you have left to pull it
    if (this.isSeed) {
      const col2 = '#b6d13a';
      c.save();
      if (this.matured) {
        c.strokeStyle = '#eaff8a'; c.lineWidth = 2.2;
        c.shadowColor = col2; c.shadowBlur = 12;
        c.beginPath(); c.arc(this.x, this.y, this.r + 7, 0, TAU); c.stroke();
        for (let i = 0; i < 3; i++) {
          const a = G.time * 1.6 + i / 3 * TAU;
          c.beginPath(); c.arc(this.x + Math.cos(a) * (this.r + 12), this.y + Math.sin(a) * (this.r + 12), 2.4, 0, TAU);
          c.fillStyle = '#eaff8a'; c.fill();
        }
      } else {
        const f = 1 - Math.max(0, Math.min(1, this.seedT / 9));
        c.strokeStyle = 'rgba(20,30,12,0.8)'; c.lineWidth = 3.4;
        c.beginPath(); c.arc(this.x, this.y, this.r + 7, 0, TAU); c.stroke();
        c.strokeStyle = col2; c.lineWidth = 3.4; c.lineCap = 'round';
        c.shadowColor = col2; c.shadowBlur = 8;
        c.beginPath(); c.arc(this.x, this.y, this.r + 7, -Math.PI / 2, -Math.PI / 2 + f * TAU); c.stroke();
        c.lineCap = 'butt';
      }
      c.restore();
    }
    // health bar for elites
    if ((this.elite || this.boss) && this.hp < this.maxHp && !G.rel('deafear')) {
      const w = this.r * 2.4, h = 5;
      const x = this.x - w / 2, y = this.y - this.r - 18;
      c.save();
      c.fillStyle = 'rgba(0,0,0,0.6)'; roundRect(c, x - 1, y - 1, w + 2, h + 2, 3); c.fill();
      c.fillStyle = this.boss ? PAL.boss : '#ff6b3c';
      c.shadowColor = c.fillStyle; c.shadowBlur = 10;
      roundRect(c, x, y, w * (this.hp / this.maxHp), h, 2.5); c.fill();
      c.restore();
    }
  }
}

/* ------------------------------------------------------------ projectiles */
class Shot {
  constructor(o) { Object.assign(this, o); this.dead = false; this.age = 0; this.hitSet = null; }
  update(dt) {
    this.age += dt;
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    if (this.homing) {
      if (!this.target || this.target.dead) this.target = G.nearestEnemy(this.x, this.y, 700, this.hitSet);
      if (this.target) {
        const a = Math.atan2(this.target.y - this.y, this.target.x - this.x);
        const cur = Math.atan2(this.vy, this.vx);
        const na = cur + clamp(angDiff(cur, a), -this.homing * dt, this.homing * dt);
        const sp = Math.hypot(this.vx, this.vy);
        this.vx = Math.cos(na) * sp; this.vy = Math.sin(na) * sp;
      }
    }
    if (this.accel) { const sp = Math.hypot(this.vx, this.vy); const na = Math.atan2(this.vy, this.vx); const ns = sp + this.accel * dt; this.vx = Math.cos(na) * ns; this.vy = Math.sin(na) * ns; }
    if (this.boom) {
      const p = G.player;
      this.rot = (this.rot || 0) + (this.spin || 10) * dt;
      if (!this.back) {
        this.travel = (this.travel || 0) + Math.hypot(this.vx, this.vy) * dt;
        if (this.travel >= this.boom) {
          if (this.hangT > 0) {
            this.hangT -= dt;
            const sp = Math.hypot(this.vx, this.vy) || 1;
            const na = Math.atan2(this.vy, this.vx) + dt * 3.4;
            this.vx = Math.cos(na) * sp * 0.35; this.vy = Math.sin(na) * sp * 0.35;
          } else this.back = true;
        }
      } else {
        const want = Math.atan2(p.y - this.y, p.x - this.x);
        const cur = Math.atan2(this.vy, this.vx);
        const na = cur + clamp(angDiff(cur, want), -11 * dt, 11 * dt);
        const sp = Math.max(Math.hypot(this.vx, this.vy), 520);
        this.vx = Math.cos(na) * sp; this.vy = Math.sin(na) * sp;
        if (dist2(this.x, this.y, p.x, p.y) < 500) { this.dead = true; return; }
      }
    }
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.trail && (G.frame % 2 === 0)) {
      Particles.spark(this.x, this.y, Math.atan2(-this.vy, -this.vx) + rnd(-0.3, 0.3), rnd(10, 60), { col: this.col, life: 0.22, w: this.r * 0.5 });
    }
    if (Math.hypot(this.x, this.y) > G.arenaR + 200) {
      if (this.bounce > 0) {
        // reflect off the arena edge and keep going
        const n = Math.atan2(this.y, this.x);
        const nx = Math.cos(n), ny = Math.sin(n);
        const dot = this.vx * nx + this.vy * ny;
        this.vx -= 2 * dot * nx; this.vy -= 2 * dot * ny;
        this.x = nx * (G.arenaR + 190); this.y = ny * (G.arenaR + 190);
        this.bounce--;
        if (this.hitSet) this.hitSet.clear();
        Particles.burst(this.x, this.y, 5, this.col, { spd1: 160, life: 0.25 });
      } else this.dead = true;
    }
  }
  draw(c) {
    const g = glowSprite(this.col);
    c.save();
    c.globalCompositeOperation = 'lighter';
    const s = this.r * 2.6;
    c.globalAlpha = 0.85;
    c.drawImage(g, this.x - s, this.y - s, s * 2, s * 2);
    c.globalAlpha = 0.9;
    c.fillStyle = this.col;
    c.beginPath(); c.arc(this.x, this.y, this.r * 0.9, 0, TAU); c.fill();
    c.globalAlpha = 1;
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(this.x, this.y, this.r * 0.38, 0, TAU); c.fill();
    c.restore();
    if (this.kind === 'blade') {
      c.save();
      c.translate(this.x, this.y); c.rotate(this.rot || 0);
      neon(c, cc => { for (let i = 0; i < 3; i++) { const a = i / 3 * TAU; cc.moveTo(0, 0); cc.lineTo(Math.cos(a) * this.r * 1.5, Math.sin(a) * this.r * 1.5); } }, this.col, { lw: 3, blur: 16, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, this.r * 0.55, 0, TAU); }, '#fff', { lw: 1.6, blur: 10, core: null, inner: false });
      c.restore();
    }
    if (this.kind === 'missile') {
      c.save();
      c.translate(this.x, this.y); c.rotate(Math.atan2(this.vy, this.vx));
      neon(c, cc => { cc.beginPath(); cc.moveTo(this.r * 1.5, 0); cc.lineTo(-this.r, this.r * 0.7); cc.lineTo(-this.r * 0.4, 0); cc.lineTo(-this.r, -this.r * 0.7); cc.closePath(); }, this.col, { lw: 1.8, blur: 10, core: 'rgba(0,0,0,0.4)' });
      c.restore();
    }
  }
}

class EBullet {
  constructor(x, y, vx, vy, dmg, col, o) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.dmg = dmg;
    this.col = col || '#ff5fa2'; this.r = 7; this.life = 7; this.dead = false;
    if (o) {
      if (o.turn) this.turn = o.turn;     // radians per second
      if (o.acc) this.acc = o.acc;        // speed multiplier per second
      if (o.r) this.r = o.r;
      if (o.life) this.life = o.life;
    }
  }
  update(dt) {
    this.life -= dt; if (this.life <= 0) { this.dead = true; return; }
    if (this.turn) {
      const ca = Math.cos(this.turn * dt), sa = Math.sin(this.turn * dt);
      const nvx = this.vx * ca - this.vy * sa;
      this.vy = this.vx * sa + this.vy * ca;
      this.vx = nvx;
    }
    if (this.acc) {
      const k = Math.pow(this.acc, dt);
      this.vx *= k; this.vy *= k;
    }
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (Math.hypot(this.x, this.y) > G.arenaR + 120) this.dead = true;
    const p = G.player;
    if (!p.dead && dist2(this.x, this.y, p.x, p.y) < (this.r + p.r) * (this.r + p.r)) {
      p.damage(this.dmg);
      this.dead = true;
      Particles.burst(this.x, this.y, 8, this.col, { spd1: 200 });
    }
  }
  draw(c) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    const g = glowSprite(this.col);
    c.drawImage(g, this.x - 20, this.y - 20, 40, 40);
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(this.x, this.y, 3, 0, TAU); c.fill();
    c.strokeStyle = this.col; c.lineWidth = 2;
    c.beginPath(); c.arc(this.x, this.y, this.r, 0, TAU); c.stroke();
    c.restore();
  }
}

/* ---------------------------------------------------------------- pickups */
class Pickup {
  constructor(x, y, type, val) {
    // never strand a drop outside the ring
    const m = Math.hypot(x, y), lim = G.arenaR - 24;
    if (m > lim) { x = x / m * lim; y = y / m * lim; }
    this.x = x; this.y = y; this.type = type; this.val = val;
    this.vx = rnd(-70, 70); this.vy = rnd(-70, 70);
    this.dead = false; this.age = 0; this.pull = false;
    this.r = type === 'mote' ? 7 : 12;
    this.ph = rnd(TAU);
  }
  update(dt) {
    this.age += dt;
    const p = G.player;
    const d = dist(this.x, this.y, p.x, p.y);
    if (!this.pull && d < G.stats.magnet) this.pull = true;
    if (this.pull) {
      const a = Math.atan2(p.y - this.y, p.x - this.x);
      const sp = 300 + Math.max(0, 460 - d) * 2.6;
      this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
    } else if (this.age > 1.5) {
      // slow inevitable drift so nothing is ever truly lost
      const a = Math.atan2(p.y - this.y, p.x - this.x);
      const sp = Math.min(190, 28 + (this.age - 1.5) * 26);
      const k = 1 - Math.exp(-2.2 * dt);
      this.vx += (Math.cos(a) * sp - this.vx) * k;
      this.vy += (Math.sin(a) * sp - this.vy) * k;
    } else {
      this.vx *= Math.exp(-4 * dt); this.vy *= Math.exp(-4 * dt);
    }
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (d < p.r + this.r + 6) this.collect();
  }
  collect() {
    this.dead = true;
    const p = G.player;
    if (this.type === 'mote') {
      G.addXp(this.val);
      G.comboPitch = (G.comboPitch + 1) % 8;
      Sound.pickup(G.comboPitch);
      p.pickupPulse = 1;
      Particles.spark(this.x, this.y, Math.atan2(p.y - this.y, p.x - this.x), 120, { col: PAL.xp, life: 0.2, w: 2 });
    } else if (this.type === 'heart') {
      p.heal(Math.round(p.maxHp * 0.28));
      Sound.coin();
    } else if (this.type === 'bomb') {
      G.screenClear();
      Sound.kill(true);
    } else if (this.type === 'chest') {
      Sound.coin();
      G.openChest();
    }
  }
  draw(c) {
    const bob = Math.sin(G.time * 4 + this.ph) * 2;
    if (this.type === 'mote') {
      const s = sprite('mote', 34, 34, cc => {
        neon(cc, x => pathPoly(x, 4, 5.5, 0), PAL.xp, { lw: 1.7, blur: 9, core: 'rgba(20,60,36,0.5)' });
      });
      c.save();
      c.globalCompositeOperation = 'lighter';
      const gs = 10 + Math.sin(G.time * 6 + this.ph) * 1.4;
      c.globalAlpha = 0.42;
      c.drawImage(glowSprite(PAL.xp), this.x - gs, this.y - gs + bob, gs * 2, gs * 2);
      c.globalAlpha = 1;
      c.drawImage(s, this.x - 17, this.y - 17 + bob);
      c.restore();
    } else {
      const cols = { heart: PAL.hp, bomb: '#ffd166', chest: PAL.gold };
      const col = cols[this.type];
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.8;
      c.drawImage(glowSprite(col), this.x - 34, this.y - 34 + bob, 68, 68);
      c.restore();
      c.save();
      c.translate(this.x, this.y + bob);
      c.rotate(Math.sin(G.time * 3 + this.ph) * 0.2);
      if (this.type === 'heart') drawIcon(c, 'vitality', 34);
      else if (this.type === 'chest') { neon(c, cc => roundRect(cc, -13, -10, 26, 20, 4), col, { lw: 2.4, blur: 14 }); neon(c, cc => { cc.beginPath(); cc.moveTo(-13, -1); cc.lineTo(13, -1); }, col, { lw: 1.6, blur: 6, core: null, inner: false }); }
      else { neon(c, cc => pathStar(cc, 8, 15, 6, G.time), col, { lw: 2.2, blur: 14 }); }
      c.restore();
    }
  }
}

/* ------------------------------------------------------ ground hazards */
class Pool {
  constructor(x, y, r, dps, dur, col, opt) {
    this.x = x; this.y = y; this.r = r; this.dps = dps;
    this.life = dur; this.max = dur; this.col = col || '#a56bff';
    this.dead = false; this.seed = (rand() * 1e9) | 0;
    this.tick = 0;
    Object.assign(this, opt || {});
  }
  update(dt) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    if (this.drift) {
      if (this.hunt) {
        const t = G.nearestEnemy(this.x, this.y, 520);
        if (t) {
          const a = Math.atan2(t.y - this.y, t.x - this.x);
          this.dvx = lerp(this.dvx, Math.cos(a) * this.drift, 0.05);
          this.dvy = lerp(this.dvy, Math.sin(a) * this.drift, 0.05);
        }
      }
      this.x += this.dvx * dt; this.y += this.dvy * dt;
    }
    this.tick -= dt;
    if (this.hostile) {
      if (this.tick <= 0) {
        this.tick = 0.5;
        const p = G.player;
        if (!p.dead && dist2(p.x, p.y, this.x, this.y) < (this.r + p.r) * (this.r + p.r)) p.damage(this.dps * 0.5);
      }
      if (G.frame % 10 === 0 && G.pools.length < 22) {
        const a = rnd(TAU), rr = Math.sqrt(rand()) * this.r;
        Particles.puff(this.x + Math.cos(a) * rr, this.y + Math.sin(a) * rr, { col: this.col, r: rnd(5, 11), life: rnd(0.4, 0.8), alpha: 0.2, grow: 9, vy: -14 });
      }
      return;
    }
    if (this.tick <= 0) {
      this.tick = 0.25;
      const near = G.queryEnemies(this.x, this.y, this.r + 30);
      for (let i = 0; i < near.length; i++) {
        const e = near[i];
        if (e.dead) continue;
        if (dist2(e.x, e.y, this.x, this.y) < (this.r + e.r) * (this.r + e.r)) {
          G.hitEnemy(e, this.dps * 0.25, { silent: true, col: this.col, noKb: true, src: 'mire' });
          if (this.slowing) e.slow = Math.max(e.slow, 0.5);
          if (this.blind) e.blind = Math.max(e.blind, G.time + 1.6);
        }
      }
    }
    if (G.frame % 14 === 0 && G.pools.length < 10) {
      const a = rnd(TAU), rr = Math.sqrt(rand()) * this.r;
      Particles.puff(this.x + Math.cos(a) * rr, this.y + Math.sin(a) * rr, { col: this.col, r: rnd(5, 11), life: rnd(0.4, 0.8), alpha: 0.16, grow: 8, vy: -12 });
    }
  }
  draw(c) {
    const k = Math.min(1, this.life / 0.8);
    const grow = this.life > this.max - 0.2 ? (1 - (this.life - (this.max - 0.2)) / 0.2) : 1;
    c.save();
    c.translate(this.x, this.y);
    c.scale(grow, grow);
    c.globalAlpha = 0.30 * k;
    c.fillStyle = this.col;
    pathBlob(c, this.r, 11, 0.18, this.seed); c.fill();
    c.globalAlpha = 0.34 * k;
    c.strokeStyle = this.col; c.lineWidth = 1.8;
    pathBlob(c, this.r, 11, 0.18, this.seed); c.stroke();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.16 * k * (0.8 + Math.sin(G.time * 3 + this.seed) * 0.2);
    pathBlob(c, this.r * 0.72, 9, 0.24, this.seed + 7); c.fill();
    c.restore();
  }
}

/* ========================================================================
   GADGETS  --  pylons, mines, wells, chains: things you leave behind
   ======================================================================== */
class Pylon {
  constructor(x, y, o) {
    this.x = x; this.y = y; this.dead = false;
    Object.assign(this, o);
    this.t = rnd(0, 0.2); this.rot = 0; this.ph = rnd(TAU);
    this.kind = 'pylon';
  }
  update(dt) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; Particles.burst(this.x, this.y, 8, this.col, { spd1: 200, life: 0.4 }); return; }
    this.rot += dt * 2.4;
    this.t -= dt;
    if (this.t <= 0) {
      const tgt = G.nearestEnemy(this.x, this.y, this.range);
      if (tgt) {
        this.t = this.fireCd;
        const a = Math.atan2(tgt.y - this.y, tgt.x - this.x);
        G.shots.push(new Shot({
          x: this.x, y: this.y, vx: Math.cos(a) * 620, vy: Math.sin(a) * 620,
          r: 5.5, dmg: this.dmg, life: 1.4, pierce: 1, homing: 3.2, col: this.col,
          trail: true, kind: 'orb', wkey: 'beacon'
        }));
        Sound.shoot();
      } else this.t = 0.2;
    }
    if (this.linked) {
      this.lt = (this.lt || 0) - dt;
      if (this.lt <= 0) {
        this.lt = 0.32;
        for (const g of G.gadgets) {
          if (g === this || g.kind !== 'pylon' || g.dead) continue;
          if (dist2(g.x, g.y, this.x, this.y) > 520 * 520) continue;
          Weapons.linkBeam(this.x, this.y, g.x, g.y, this.dmg * 0.55, this.col);
        }
      }
    }
  }
  draw(c) {
    const k = Math.min(1, this.life / 0.6);
    c.save();
    c.translate(this.x, this.y);
    c.globalAlpha = k;
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = k * (0.22 + Math.sin(G.time * 5 + this.ph) * 0.07);
    c.drawImage(glowSprite(this.col), -46, -46, 92, 92);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = k;
    c.rotate(this.rot);
    neon(c, cc => pathPoly(cc, 3, 15, -Math.PI / 2), this.col, { lw: 2.4, blur: 16, core: 'rgba(10,10,4,0.7)' });
    c.rotate(-this.rot * 2);
    neon(c, cc => pathPoly(cc, 3, 8, Math.PI / 2), '#fff', { lw: 1.6, blur: 10, core: null, inner: false });
    c.restore();
  }
}

class Mine {
  constructor(x, y, o) {
    this.x = x; this.y = y; this.dead = false;
    Object.assign(this, o);
    this.arm = this.arm || 0.4; this.life = 14; this.ph = rnd(TAU);
    this.kind = 'mine';
  }
  update(dt) {
    this.life -= dt;
    this.arm -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    if (this.arm > 0) return;
    const near = G.queryEnemies(this.x, this.y, 34);
    for (let i = 0; i < near.length; i++) {
      const e = near[i];
      if (e.dead || e.spawnT > 0) continue;
      if (dist2(e.x, e.y, this.x, this.y) < (e.r + 22) * (e.r + 22)) { this.blow(); return; }
    }
  }
  blow(depth) {
    if (this.dead) return;
    this.dead = true;
    G.explode(this.x, this.y, this.rad, this.dmg, this.col);
    Flash.hit(this.col, 0.05);
    Cam.shake(0.12);
    Sound.shoot('nova');
    if (this.chain && (depth || 0) < 6) {
      for (const g of G.gadgets) {
        if (g === this || g.kind !== 'mine' || g.dead) continue;
        if (dist2(g.x, g.y, this.x, this.y) < this.rad * this.rad * 2.6) g.blow((depth || 0) + 1);
      }
    }
  }
  draw(c) {
    const armed = this.arm <= 0;
    const pulse = armed ? 0.55 + Math.sin(G.time * 9 + this.ph) * 0.45 : 0.2;
    c.save();
    c.translate(this.x, this.y);
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.18 * pulse;
    c.drawImage(glowSprite(this.col), -34, -34, 68, 68);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = armed ? 1 : 0.5;
    c.rotate(G.time * 1.2 + this.ph);
    neon(c, cc => pathPoly(cc, 8, 9, 0), this.col, { lw: 2, blur: 12, core: 'rgba(20,2,8,0.7)' });
    c.globalAlpha = pulse;
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, 3.4, 0, TAU); }, '#fff', { lw: 1.6, blur: 10, core: null, inner: false });
    c.restore();
  }
}

class Well {
  constructor(x, y, o) {
    this.x = x; this.y = y; this.dead = false;
    Object.assign(this, o);
    this.max = this.life; this.tick = 0; this.ph = rnd(TAU);
    this.kind = 'well';
  }
  update(dt) {
    this.life -= dt;
    if (this.life <= 0) {
      this.dead = true;
      if (this.collapse) {
        G.explode(this.x, this.y, this.rad * 1.15, this.dmg * 9, this.col);
        Flash.hit(this.col, 0.16); Cam.shake(0.5); Sound.shoot('nova');
        Particles.ring(this.x, this.y, 10, this.rad * 2.2, { col: this.col, life: 0.7, w: 10 });
      }
      return;
    }
    const near = G.queryEnemies(this.x, this.y, this.rad + 40);
    this.tick -= dt;
    const hits = this.tick <= 0;
    if (hits) this.tick = 0.22;
    for (let i = 0; i < near.length; i++) {
      const e = near[i];
      if (e.dead) continue;
      const dx = this.x - e.x, dy = this.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d > this.rad + e.r) continue;
      const res = 1 - (e.def.kbres || 0) * 0.75;
      const f = this.pull * res * (1 - d / (this.rad + 60)) / (e.def.mass * 0.28 + 0.8);
      e.x += dx / d * f * dt; e.y += dy / d * f * dt;
      if (hits) G.hitEnemy(e, this.dmg * 0.22, { silent: true, col: this.col, noKb: true });
    }
    if (G.frame % 3 === 0) {
      const a = rnd(TAU), rr = this.rad * (0.7 + rand() * 0.5);
      Particles.spark(this.x + Math.cos(a) * rr, this.y + Math.sin(a) * rr, a + Math.PI, rnd(120, 320), { col: this.col, life: 0.4, w: 2 });
    }
  }
  draw(c) {
    const k = Math.min(1, this.life / 0.4);
    c.save();
    c.translate(this.x, this.y);
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.16 * k;
    c.drawImage(glowSprite(this.col), -this.rad, -this.rad, this.rad * 2, this.rad * 2);
    c.globalAlpha = 0.5 * k;
    for (let i = 0; i < 3; i++) {
      const r = this.rad * (0.35 + i * 0.3) * (0.9 + Math.sin(G.time * 3 + i + this.ph) * 0.1);
      c.strokeStyle = this.col; c.lineWidth = 2 - i * 0.4;
      c.shadowColor = this.col; c.shadowBlur = 18;
      c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke();
    }
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = k;
    c.fillStyle = 'rgba(2,0,8,0.92)';
    c.beginPath(); c.arc(0, 0, this.rad * 0.3, 0, TAU); c.fill();
    c.restore();
  }
}

class Drone {
  constructor(x, y, o) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.dead = false;
    Object.assign(this, o);
    this.t = 0; this.rot = rnd(TAU); this.ph = rnd(TAU);
    this.kind = 'drone';
    this.target = null;
  }
  update(dt) {
    const p = G.player;
    if (!this.owner || G.weapons.indexOf(this.owner) < 0) { this.dead = true; return; }
    if (!this.target || this.target.dead) this.target = G.nearestEnemy(this.x, this.y, this.roam ? 900 : 560);
    let tx, ty, sp = this.spd;
    if (this.target) { tx = this.target.x; ty = this.target.y; }
    else {
      // no prey: orbit the player
      const a = G.time * 1.6 + this.ph;
      tx = p.x + Math.cos(a) * 62; ty = p.y + Math.sin(a) * 62;
      sp = this.spd * 0.9;
    }
    const dx = tx - this.x, dy = ty - this.y;
    const d = Math.hypot(dx, dy) || 1;
    const want = Math.atan2(dy, dx);
    const cur = Math.atan2(this.vy, this.vx);
    const na = (this.vx || this.vy) ? cur + clamp(angDiff(cur, want), -7 * dt, 7 * dt) : want;
    this.vx = Math.cos(na) * sp; this.vy = Math.sin(na) * sp;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.rot = na;
    // leash: never wander off the map
    if (!this.roam && dist2(this.x, this.y, p.x, p.y) > 760 * 760) {
      this.x = lerp(this.x, p.x, 0.06); this.y = lerp(this.y, p.y, 0.06);
    }
    if (G.frame % 3 === 0) Particles.spark(this.x, this.y, na + Math.PI + rnd(-0.4, 0.4), rnd(20, 80), { col: this.col, life: 0.22, w: 1.8 });
    const near = G.queryEnemies(this.x, this.y, 26);
    for (let i = 0; i < near.length; i++) {
      const e = near[i];
      if (e.dead || e.spawnT > 0) continue;
      if (dist2(e.x, e.y, this.x, this.y) > (e.r + 12) * (e.r + 12)) continue;
      if (!e.tickReady('drone' + (this.uid || (this.uid = 'd' + (rand() * 1e6 | 0))), this.hitCd)) continue;
      G.hitEnemy(e, this.dmg, { col: this.col, kb: 130, kbAngle: Math.atan2(e.y - this.y, e.x - this.x) });
      if (!this.roam) { this.vx *= -0.4; this.vy *= -0.4; this.target = null; }
      break;
    }
  }
  draw(c) {
    c.save();
    c.translate(this.x, this.y);
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.22 + Math.sin(G.time * 7 + this.ph) * 0.06;
    c.drawImage(glowSprite(this.col), -30, -30, 60, 60);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1;
    c.rotate(this.rot);
    neon(c, cc => { cc.beginPath(); cc.moveTo(11, 0); cc.lineTo(-7, 6); cc.lineTo(-3, 0); cc.lineTo(-7, -6); cc.closePath(); }, this.col, { lw: 2, blur: 12, core: 'rgba(6,10,26,0.7)' });
    neon(c, cc => { cc.beginPath(); cc.arc(1, 0, 2.4, 0, TAU); }, '#fff', { lw: 1.4, blur: 8, core: null, inner: false });
    c.restore();
  }
}

class Splice {
  constructor(a, b, o) {
    this.a = a; this.b = b; this.dead = false;
    Object.assign(this, o);
    this.tickT = 0; this.kind = 'splice';
    this.x = a.x; this.y = a.y;
    this.did = false;
  }
  update(dt) {
    this.life -= dt;
    if (this.life <= 0 || !this.a || !this.b || this.a.dead || this.b.dead) {
      if (this.spread && !this.did && this.a && this.b) {
        this.did = true;
        // WEB: a broken wire looks for new anchors
        const from = this.a.dead ? this.b : this.a;
        if (from && !from.dead) {
          const next = G.nearestEnemy(from.x, from.y, this.range, new Set([from]));
          if (next) G.gadgets.push(new Splice(from, next, {
            dmg: this.dmg * 0.8, life: this.life > 0 ? this.life : 1.6,
            tick: this.tick, range: this.range, col: this.col, spread: false
          }));
        }
      }
      this.dead = true;
      return;
    }
    this.x = (this.a.x + this.b.x) / 2; this.y = (this.a.y + this.b.y) / 2;
    const dx = this.b.x - this.a.x, dy = this.b.y - this.a.y;
    const len = Math.hypot(dx, dy) || 1;
    if (len > this.range * 2.2) { this.dead = true; return; }
    this.tickT -= dt;
    if (this.tickT > 0) return;
    this.tickT = this.tick;
    const ux = dx / len, uy = dy / len;
    const list = G.queryEnemies(this.x, this.y, len / 2 + 70);
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.dead) continue;
      const px = e.x - this.a.x, py = e.y - this.a.y;
      const t = px * ux + py * uy;
      if (t < -e.r || t > len + e.r) continue;
      if (Math.abs(px * -uy + py * ux) > 14 + e.r) continue;
      G.hitEnemy(e, this.dmg, { col: this.col, kb: 30, kbAngle: Math.atan2(e.y - this.y, e.x - this.x) });
    }
  }
  draw(c) {
    if (!this.a || !this.b || this.a.dead || this.b.dead) return;
    const k = Math.min(1, this.life / 0.4);
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.strokeStyle = this.col; c.shadowColor = this.col; c.shadowBlur = 16;
    c.globalAlpha = 0.85 * k;
    c.lineWidth = 2.8;
    c.beginPath();
    const seg = 6;
    c.moveTo(this.a.x, this.a.y);
    for (let i = 1; i <= seg; i++) {
      const t = i / seg;
      const jx = i === seg ? 0 : Math.sin(G.time * 18 + i * 2.2) * 6;
      const jy = i === seg ? 0 : Math.cos(G.time * 16 + i * 1.9) * 6;
      c.lineTo(lerp(this.a.x, this.b.x, t) + jx, lerp(this.a.y, this.b.y, t) + jy);
    }
    c.stroke();
    c.globalAlpha = k * 0.85; c.strokeStyle = '#fff'; c.lineWidth = 1; c.shadowBlur = 5;
    c.stroke();
    c.globalAlpha = k * 0.6;
    c.fillStyle = this.col;
    c.beginPath(); c.arc(this.a.x, this.a.y, 5, 0, TAU); c.fill();
    c.beginPath(); c.arc(this.b.x, this.b.y, 5, 0, TAU); c.fill();
    c.restore();
  }
}

class Chain {
  constructor(target, o) {
    this.e = target; this.dead = false;
    Object.assign(this, o);
    this.tickT = 0;
    this.kind = 'chain';
    this.x = target.x; this.y = target.y;
  }
  update(dt) {
    this.life -= dt;
    const p = G.player;
    if (this.life <= 0 || !this.e || this.e.dead) { this.dead = true; return; }
    this.x = this.e.x; this.y = this.e.y;
    const d = dist(p.x, p.y, this.e.x, this.e.y);
    if (d > this.range * 1.7) { this.dead = true; return; }
    if (this.amp) this.e.amped = G.time + 0.3;
    this.tickT -= dt;
    if (this.tickT <= 0) {
      this.tickT = this.tick;
      const dx = this.e.x - p.x, dy = this.e.y - p.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const list = G.queryEnemies(p.x + dx / 2, p.y + dy / 2, len / 2 + 70);
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (e.dead) continue;
        const px = e.x - p.x, py = e.y - p.y;
        const t = px * ux + py * uy;
        if (t < -e.r || t > len + e.r) continue;
        if (Math.abs(px * -uy + py * ux) > 15 + e.r) continue;
        G.hitEnemy(e, this.dmg, { col: this.col, kb: 40, kbAngle: Math.atan2(e.y - p.y, e.x - p.x) });
      }
      G.hitEnemy(this.e, this.dmg * 0.8, { col: this.col, silent: true, noKb: true });
    }
  }
  draw(c) {
    const p = G.player;
    if (!this.e || this.e.dead) return;
    c.save();
    c.globalCompositeOperation = 'lighter';
    const k = Math.min(1, this.life / 0.4);
    c.globalAlpha = 0.85 * k;
    c.strokeStyle = this.col; c.shadowColor = this.col; c.shadowBlur = 18;
    c.lineWidth = 3.2;
    c.beginPath();
    const seg = 7;
    c.moveTo(p.x, p.y);
    for (let i = 1; i <= seg; i++) {
      const t = i / seg;
      const jx = i === seg ? 0 : Math.sin(G.time * 14 + i * 1.7) * 7;
      const jy = i === seg ? 0 : Math.cos(G.time * 12 + i * 2.1) * 7;
      c.lineTo(lerp(p.x, this.e.x, t) + jx, lerp(p.y, this.e.y, t) + jy);
    }
    c.stroke();
    c.globalAlpha = k * 0.8; c.strokeStyle = '#fff'; c.lineWidth = 1.1; c.shadowBlur = 6;
    c.stroke();
    if (this.amp) {
      c.globalAlpha = k * 0.5;
      c.strokeStyle = this.col; c.lineWidth = 2;
      c.beginPath(); c.arc(this.e.x, this.e.y, this.e.r + 8, 0, TAU); c.stroke();
    }
    c.restore();
  }
}

/* ========================================================================
   WEAPONS
   ======================================================================== */
function weaponStats(w) {
  const def = WEAPONS[w.id];
  const s = Object.assign({}, def.lv[w.level - 1]);
  const S = G.stats;
  s.dmg = (s.dmg || 0) * S.dmgMul;
  if (s.cd) s.cd *= S.cdMul;
  if (s.rad) s.rad *= S.areaMul;
  if (s.range) s.range *= S.areaMul;
  if (s.aoe) s.aoe *= S.areaMul;
  if (s.w) s.w *= (1 + (S.areaMul - 1) * 0.6);
  if (s.arc) s.arc = Math.min(TAU, s.arc * (1 + (S.areaMul - 1) * 0.5));
  if (s.len) s.len *= (1 + (S.areaMul - 1) * 0.5);
  if (s.count !== undefined) s.count += S.extraProj;
  if (s.chains !== undefined) s.chains += Math.round(S.extraProj * 0.7);
  if (s.spd) s.spd *= S.projMul;
  if (s.burn) s.burn *= S.burnMul;
  if (s.pull) s.pull *= S.pullMul;
  if (s.dur && (w.id === 'beacon' || w.id === 'tether')) s.dur *= S.deployMul;
  if (w.evolved) {
    s.dmg *= 1.35;
    if (s.cd) s.cd *= 0.86;
  }
  return s;
}
function weaponColor(w) {
  const def = WEAPONS[w.id];
  return w.evolved ? def.evo.color : def.color;
}

const Weapons = {
  update(dt) {
    if (G.time < G.silenceT) return;   // THE TOLL: nothing of yours fires in here
    for (const w of G.weapons) {
      if (w.id === 'thorns') { this.thornsTick(w, dt); continue; }
      if (w.id === 'veil') { this.veilTick(w, dt); continue; }
      if (w.id === 'pharos') { this.pharosTick(w, dt); continue; }
      if (w.id === 'wake') { this.wakeTick(w, dt); continue; }
      if (w.id === 'familiar') { this.familiarTick(w, dt); continue; }
      if (w.id === 'thirst') { this.thirstTick(w, dt); continue; }

  beam(x, y, a, len, wdt, dmg, col, split) {
    const dx = Math.cos(a), dy = Math.sin(a);

    let firstHit = null;
    for (const e of near) {
      if (e.dead) continue;
      const px = e.x - x, py = e.y - y;
      const t = px * dx + py * dy;
      if (t < -e.r || t > len + e.r) continue;
      const perp = Math.abs(px * -dy + py * dx);
      if (perp > wdt / 2 + e.r) continue;
      G.hitEnemy(e, dmg, { col: col, kb: 120, kbAngle: a });
      if (!firstHit || t < firstHit.t) firstHit = { e: e, t: t };
    }
    if (split && firstHit) {
      const bx = x + dx * firstHit.t, by = y + dy * firstHit.t;
      for (const off of [-0.55, 0.55]) this.beam(bx, by, a + off, len * 0.6, wdt * 0.75, dmg * 0.55, col, 0);

    const near = G.queryEnemies(p.x, p.y, s.rad + 60);
    w.pos = [];

      const dir = ring === 0 ? 1 : -1;
      const rr = s.rad * (ring === 0 ? 1 : 0.62);
      for (let i = 0; i < s.count; i++) {
        const a = w.ang * dir + i / s.count * TAU;
        const ox = p.x + Math.cos(a) * rr, oy = p.y + Math.sin(a) * rr;
        w.pos.push(ox, oy, a);

          if (e.dead) continue;
          const rad = e.r + 13;

              G.hitEnemy(e, s.dmg, { col: weaponColor(w), kb: 140, kbAngle: Math.atan2(e.y - p.y, e.x - p.x) });

    }
  },

  /* ---- PENDULUM: a weight on a chain ---- */
  pendulumTick(w, dt) {
    const s = weaponStats(w);
    const p = G.player;
    const col = weaponColor(w);
    w.ang = (w.ang || 0) + s.spin * dt;
    const heads = w.evolved ? 2 : 1;
    w.pend = [];
    for (let h = 0; h < heads; h++) {
      // a swing, not a spin: it sweeps back and forth across an arc
      const a = p.aim + Math.sin(w.ang + h * Math.PI) * (s.arc / 2);
      const hx = p.x + Math.cos(a) * s.rad, hy = p.y + Math.sin(a) * s.rad;
      w.pend.push({ x: hx, y: hy, a: a });
      const near = G.queryEnemies(hx, hy, 42);
      for (let i = 0; i < near.length; i++) {
        const e = near[i];
        if (e.dead) continue;
        const rr = e.r + 24;
        if (dist2(e.x, e.y, hx, hy) > rr * rr) continue;
        if (!e.tickReady('pend' + h, s.tick)) continue;
        G.hitEnemy(e, s.dmg, { col: col, kb: s.kb, kbAngle: Math.atan2(e.y - p.y, e.x - p.x) });
        if (w.evolved) e.sunder = G.time + 3.0;   // armour broken open
        Particles.burst(hx, hy, 5, col, { spd1: 220, life: 0.3 });
      }
    }
  },
  drawPendulum(c) {
    for (const w of G.weapons) {
      if (w.id !== 'pendulum' || !w.pend) continue;
      const col = weaponColor(w), p = G.player;
      c.save();
      c.globalCompositeOperation = 'lighter';
      for (const h of w.pend) {
        c.globalAlpha = 0.5;
        c.strokeStyle = col; c.shadowColor = col; c.shadowBlur = 10; c.lineWidth = 2.4;
        c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(h.x, h.y); c.stroke();
        c.globalAlpha = 0.28;
        c.drawImage(glowSprite(col), h.x - 40, h.y - 40, 80, 80);
        c.translate(h.x, h.y);
        c.rotate(h.a);
        neon(c, cc => pathPoly(cc, 6, 17, 0), col, { lw: 3, blur: 18, core: 'rgba(10,12,34,0.8)' });
        neon(c, cc => pathPoly(cc, 6, 8, Math.PI / 6), '#fff', { lw: 1.6, blur: 10, core: null, inner: false });
        c.rotate(-h.a);
        c.translate(-h.x, -h.y);
      }
      c.restore();
    }
  },

  /* ---- SIPHON: the longer it stays on, the deeper it bites ---- */
  siphonTick(w, dt) {
    const s = weaponStats(w);
    const p = G.player;
    const col = weaponColor(w);
    w.t -= dt;
    if (!w.tgt || w.tgt.dead || dist2(w.tgt.x, w.tgt.y, p.x, p.y) > s.range * s.range * 1.3) {
      const next = G.nearestEnemy(p.x, p.y, s.range);
      if (next !== w.tgt) w.ramp = 1;
      w.tgt = next;
    }
    if (!w.tgt) { w.ramp = 1; w.beam = null; return; }
    w.ramp = Math.min(s.cap, (w.ramp || 1) + s.ramp * dt);
    w.beam = { x: w.tgt.x, y: w.tgt.y, col: col, ramp: w.ramp, cap: s.cap };
    if (w.t > 0) return;
    w.t = Math.max(0.06, s.cd);
    const dmg = s.dmg * w.ramp;
    G.hitEnemy(w.tgt, dmg, { col: col, kb: 25, silent: (G.frame % 3) !== 0 });
    if (w.evolved && (G.frame % 6) === 0) p.heal(1, true);
  },
  drawSiphon(c) {
    for (const w of G.weapons) {
      if (w.id !== 'siphon' || !w.beam) continue;
      const b = w.beam, p = G.player;
      const k = (b.ramp - 1) / Math.max(0.01, b.cap - 1);
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = b.col; c.shadowColor = b.col; c.shadowBlur = 22;
      c.globalAlpha = 0.55 + k * 0.4;
      c.lineWidth = 3 + k * 7;
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(b.x, b.y); c.stroke();
      c.globalAlpha = 0.9;
      c.strokeStyle = '#fff'; c.lineWidth = 1 + k * 2.4; c.shadowBlur = 8;
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(b.x, b.y); c.stroke();
      // beads running down the beam
      const n = 4;
      for (let i = 0; i < n; i++) {
        const t = ((G.time * 1.6 + i / n) % 1);
        const bx = lerp(b.x, p.x, t), by = lerp(b.y, p.y, t);
        c.globalAlpha = (1 - t) * 0.9;
        c.fillStyle = b.col;
        c.beginPath(); c.arc(bx, by, 2.5 + k * 3, 0, TAU); c.fill();
      }
      c.restore();
    }
  },

  /* ---- PHAROS: a beam that never stops turning ---- */
  pharosTick(w, dt) {
    const s = weaponStats(w);
    const p = G.player;
    const col = weaponColor(w);
    w.ang = (w.ang || 0) + s.spin * dt;
    const arms = w.evolved ? 2 : 1;
    w.pharos = { a: w.ang, len: s.len, w: s.w, col: col, arms: arms };
    for (let k = 0; k < arms; k++) {
      const a = w.ang + k * Math.PI;
      const dx = Math.cos(a), dy = Math.sin(a);
      const near = G.queryEnemies(p.x + dx * s.len / 2, p.y + dy * s.len / 2, s.len / 2 + 80);
      for (let i = 0; i < near.length; i++) {
        const e = near[i];
        if (e.dead) continue;
        const px = e.x - p.x, py = e.y - p.y;
        const t = px * dx + py * dy;
        if (t < -e.r || t > s.len + e.r) continue;
        if (Math.abs(px * -dy + py * dx) > s.w / 2 + e.r) continue;
        if (!e.tickReady('pharos' + k, s.tick)) continue;
        G.hitEnemy(e, s.dmg, { col: col, kb: 70, kbAngle: a });
        if (w.evolved) G.ignite(e, s.dmg * 0.5 * G.stats.burnMul, 2.4, false);
      }
    }
  },
  drawPharos(c) {
    for (const w of G.weapons) {
      if (w.id !== 'pharos' || !w.pharos) continue;
      const v = w.pharos, p = G.player;
      c.save();
      c.translate(p.x, p.y);
      c.globalCompositeOperation = 'lighter';
      for (let k = 0; k < v.arms; k++) {
        c.save();
        c.rotate(v.a + k * Math.PI);
        const g = c.createLinearGradient(0, 0, v.len, 0);
        g.addColorStop(0, v.col); g.addColorStop(0.55, v.col); g.addColorStop(1, 'rgba(0,0,0,0)');
        c.globalAlpha = 0.17;
        c.fillStyle = g;
        c.fillRect(0, -v.w * 0.9, v.len, v.w * 1.8);
        c.globalAlpha = 0.62;
        c.fillRect(0, -v.w / 2, v.len, v.w);
        c.globalAlpha = 0.95;
        c.shadowColor = v.col; c.shadowBlur = 20;
        c.fillStyle = '#fff';
        c.fillRect(0, -v.w * 0.14, v.len * 0.94, v.w * 0.28);
        c.restore();
      }
      c.restore();
    }
  },

  /* ---- WAKE: the dash is the trigger ---- */
  wakeTick(w, dt) {
    const p = G.player;
    const s = weaponStats(w);
    const col = weaponColor(w);
    const dashing = p.dashT > 0;
    if (dashing && !w.wasDash) {
      w.left = s.blasts;
      w.blastT = 0;
      if (w.evolved) {
        G.gadgets.push(new Well(p.x, p.y, {
          rad: s.rad * 1.5, dmg: s.dmg * 0.16, life: 1.9,
          pull: 340 * G.stats.pullMul, col: col, collapse: true
        }));
      }
      Sound.shoot('nova');
    }
    w.wasDash = dashing;
    if (w.left > 0) {
      w.blastT -= dt;
      if (w.blastT <= 0) {
        w.blastT = 0.055;
        w.left--;
        G.explode(p.x, p.y, s.rad, s.dmg, col);
        Particles.ring(p.x, p.y, 6, s.rad, { col: col, life: 0.3, w: 4 });
      }
    }
  },

  /* ---- HARVEST: kills feed it ---- */
  onKill(e) {
    for (const w of G.weapons) {
      if (w.id !== 'harvest' || e.boss) continue;
      const s = weaponStats(w);
      if (rand() > s.chance) continue;
      const col = weaponColor(w);
      for (let i = 0; i < s.count; i++) {
        const tgt = G.nearestEnemy(e.x, e.y, s.range);
        const a = tgt ? Math.atan2(tgt.y - e.y, tgt.x - e.x) : rnd(TAU);
        G.shots.push(new Shot({
          x: e.x, y: e.y, vx: Math.cos(a) * 250, vy: Math.sin(a) * 250,
          r: 6, dmg: s.dmg, life: 2.6, pierce: 1, homing: 7.5, accel: 320,
          col: col, trail: true, kind: 'orb', target: tgt,
          split: w.evolved ? 2 : 0, wkey: 'harvest'
        }));
      }
    }
  },

  /* ---- FAMILIAR: a small thing that hunts ---- */
  familiarTick(w, dt) {
    const s = weaponStats(w);
    const col = weaponColor(w);
    let live = 0;
    for (const g of G.gadgets) if (g.kind === 'drone' && g.owner === w && !g.dead) live++;
    if (live < s.count) {
      const p = G.player;
      G.gadgets.push(new Drone(p.x + rnd(-30, 30), p.y + rnd(-30, 30), {
        owner: w, dmg: s.dmg, spd: s.spd, hitCd: s.tick, col: col, roam: !!w.evolved
      }));
    }
  },

  /* ---- THIRST: a field that drinks ---- */
  thirstTick(w, dt) {
    const s = weaponStats(w);
    const p = G.player;
    const col = weaponColor(w);
    let rad = s.rad, dmg = s.dmg;
    if (w.evolved) {
      const missing = 1 - p.hp / p.maxHp;
      dmg *= 1 + missing * 1.6;
      rad *= 1 + missing * 0.3;
    }
    w.thirst = { rad: rad, col: col, hot: w.evolved };
    const near = G.queryEnemies(p.x, p.y, rad + 40);
    for (let i = 0; i < near.length; i++) {
      const e = near[i];
      if (e.dead) continue;
      if (dist2(e.x, e.y, p.x, p.y) > (rad + e.r) * (rad + e.r)) continue;
      if (!e.tickReady('thirst', s.tick)) continue;
      const before = e.hp;
      G.hitEnemy(e, dmg, { col: col, kb: 40, kbAngle: Math.atan2(e.y - p.y, e.x - p.x) });
      if (e.dead && before > 0) p.heal(s.leech, true);
    }
  },
  drawThirst(c) {
    for (const w of G.weapons) {
      if (w.id !== 'thirst' || !w.thirst) continue;
      const v = w.thirst, p = G.player;
      const puls = 0.85 + Math.sin(G.time * 4) * 0.15;
      c.save();
      c.translate(p.x, p.y);
      c.globalCompositeOperation = 'lighter';
      const g = c.createRadialGradient(0, 0, v.rad * 0.25, 0, 0, v.rad);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.7, 'rgba(0,0,0,0)');
      g.addColorStop(1, v.col);
      c.globalAlpha = 0.34 * puls;
      c.fillStyle = g;
      c.beginPath(); c.arc(0, 0, v.rad, 0, TAU); c.fill();
      c.globalAlpha = 0.7 * puls;
      c.strokeStyle = v.col; c.shadowColor = v.col; c.shadowBlur = 18; c.lineWidth = 2;
      c.beginPath(); c.arc(0, 0, v.rad, 0, TAU); c.stroke();
      c.restore();
    }
  },

  veilTick(w, dt) {
    const s = weaponStats(w);
    const p = G.player;
    const col = weaponColor(w);
    w.ang = (w.ang || 0) + s.spin * dt;
    const full = !!w.evolved;
    const arc = full ? TAU : s.arc;
    const a0 = w.ang;
    w.veil = { a: a0, arc: arc, rad: s.rad, col: col, full: full };
    const near = G.queryEnemies(p.x, p.y, s.rad + 50);
    for (let i = 0; i < near.length; i++) {
      const e = near[i];
      if (e.dead) continue;
      const d = dist(e.x, e.y, p.x, p.y);
      if (d > s.rad + e.r + 8 || d < s.rad - 30 - e.r) continue;
      const ea = Math.atan2(e.y - p.y, e.x - p.x);
      if (!full && Math.abs(angDiff(a0, ea)) > arc / 2) continue;
      if (e.tickReady('veil', s.tick)) G.hitEnemy(e, s.dmg, { col: col, kb: 240, kbAngle: ea });
    }
    for (let i = G.ebullets.length - 1; i >= 0; i--) {
      const b = G.ebullets[i];
      if (b.dead) continue;
      const d = dist(b.x, b.y, p.x, p.y);
      if (d > s.rad + 12 || d < s.rad - 22) continue;
      if (b.vx * (p.x - b.x) + b.vy * (p.y - b.y) <= 0) continue;
      const ba = Math.atan2(b.y - p.y, b.x - p.x);
      if (!full && Math.abs(angDiff(a0, ba)) > arc / 2) continue;
      b.dead = true;
      Particles.burst(b.x, b.y, 6, col, { spd1: 180, life: 0.28 });
      if (full) {
        const tgt = G.nearestEnemy(b.x, b.y, 620);
        const a = tgt ? Math.atan2(tgt.y - b.y, tgt.x - b.x) : Math.atan2(-b.vy, -b.vx);
        G.shots.push(new Shot({
          x: b.x, y: b.y, vx: Math.cos(a) * 640, vy: Math.sin(a) * 640,
          r: 6, dmg: s.dmg * 0.9, life: 1.6, pierce: 2, homing: 3, col: col, trail: true, kind: 'orb', wkey: 'veil'
        }));
      }
    }
  },
  drawVeil(c) {
    for (const w of G.weapons) {
      if (w.id !== 'veil' || !w.veil) continue;
      const v = w.veil;
      const p = G.player;
      c.save();
      c.translate(p.x, p.y);
      c.globalCompositeOperation = 'lighter';
      const puls = 0.75 + Math.sin(G.time * 5) * 0.15;
      c.strokeStyle = v.col; c.shadowColor = v.col; c.shadowBlur = 20;
      c.globalAlpha = 0.85 * puls;
      c.lineWidth = 6;
      c.beginPath(); c.arc(0, 0, v.rad, v.a - v.arc / 2, v.a + v.arc / 2); c.stroke();
      c.globalAlpha = 0.28 * puls;
      c.lineWidth = 16;
      c.beginPath(); c.arc(0, 0, v.rad, v.a - v.arc / 2, v.a + v.arc / 2); c.stroke();
      c.globalAlpha = 0.9;
      c.strokeStyle = '#fff'; c.lineWidth = 1.6; c.shadowBlur = 8;
      c.beginPath(); c.arc(0, 0, v.rad, v.a - v.arc / 2, v.a + v.arc / 2); c.stroke();
      c.restore();
    }
  },
  linkBeam(x1, y1, x2, y2, dmg, col) {
    G.fx.push({ t: 'link', x: x1, y: y1, x2: x2, y2: y2, life: 0.2, max: 0.2, col: col });
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const list = G.queryEnemies(x1 + dx / 2, y1 + dy / 2, len / 2 + 60);
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (e.dead) continue;
      const px = e.x - x1, py = e.y - y1;
      const t = px * ux + py * uy;
      if (t < -e.r || t > len + e.r) continue;
      if (Math.abs(px * -uy + py * ux) > 12 + e.r) continue;
      G.hitEnemy(e, dmg, { col: col, silent: true, noKb: true });
    }
  },

  /* ------------------------------------------------------------- fx draw */
  updateFx(dt) {
    for (let i = G.fx.length - 1; i >= 0; i--) {
      const f = G.fx[i];
      f.life -= dt;
      if (f.life <= 0) { G.fx.splice(i, 1); continue; }
      if (f.t === 'shock') {
        const k = 1 - f.life / f.max;
        f.r = 10 + (f.target - 10) * easeOut(k);
        const near = G.queryEnemies(f.x, f.y, f.r + 40);
        for (const e of near) {
          if (e.dead || f.hit.has(e)) continue;
          const d = dist(e.x, e.y, f.x, f.y);
          if (d < f.r + e.r) {
            f.hit.add(e);
            const alive0 = !e.dead;
            G.hitEnemy(e, f.dmg, { col: f.col, kb: f.kb, kbAngle: Math.atan2(e.y - f.y, e.x - f.x) });
            if (f.stun) e.stun = Math.max(e.stun, f.stun);
            if (f.leech && alive0) G.player.heal(f.leech, true);
            if (f.evolved) G.player.heal(2, true);
          }
        }
        if (f.evolved && f.life <= dt * 2) {
          G.addPool(new Pool(f.x, f.y, f.target * 0.34, f.dmg * 0.4, 2.6, '#ff7a45'));
        }
      }
      if (f.t === 'sweep' && f.follow) { f.x = G.player.x; f.y = G.player.y; }
      if (f.t === 'spike') {
        if (!f.fired && f.life < f.max - 0.22) {
          f.fired = true;
          const near = G.queryEnemies(f.x, f.y, f.r + 40);
          for (const e of near) {
            if (e.dead) continue;
            if (dist2(e.x, e.y, f.x, f.y) < (f.r + e.r) * (f.r + e.r)) {
              G.hitEnemy(e, f.dmg, { col: f.col, kb: 60, kbAngle: Math.atan2(e.y - f.y, e.x - f.x) });
              e.slow = Math.max(e.slow, f.slow);
              if (f.shatter) e.frozen = G.time + f.slow;
            }
          }
          Particles.ring(f.x, f.y, 6, f.r * 1.6, { col: f.col, life: 0.4, w: 4 });
          if (f.crack) G.addPool(new Pool(f.x, f.y, f.r * 0.8, f.crack, 3.0, f.col, { slowing: true }));
          Sound.hit(0.2);
        }
      } else if (f.t === 'pillar') {
        if (f.src && !f.src.dead) { f.x = f.src.x; f.y = f.src.y; }
        if (!f.fired && f.life < f.at) {
          f.fired = true;
          const near = G.queryEnemies(f.x, f.y, f.r + 50);
          let survivor = null;
          for (const e of near) {
            if (e.dead) continue;
            if (dist2(e.x, e.y, f.x, f.y) < (f.r + e.r) * (f.r + e.r)) {
              G.hitEnemy(e, f.dmg, { col: f.col, kb: 260, kbAngle: Math.atan2(e.y - f.y, e.x - f.x) });
              if (!e.dead) survivor = e;
            }
          }
          Cam.shake(0.24); Flash.hit(f.col, 0.08);
          Particles.ring(f.x, f.y, 8, f.r * 2, { col: f.col, life: 0.5, w: 7 });
          Sound.shoot('nova');
          if (f.chain > 0 && survivor) {
            G.fx.push({ t: 'pillar', x: survivor.x, y: survivor.y, src: survivor, r: f.r * 0.85, life: 0.55, max: 0.55, at: 0.25, col: f.col, dmg: f.dmg * 0.7, fired: false, chain: f.chain - 1 });
          }
        }
      } else if (f.t === 'meteor') {
        if (!f.fired && f.life < f.at) {
          f.fired = true;
          G.explode(f.x, f.y, f.r, f.dmg, f.col);
          Cam.shake(0.1);
          Sound.hit(0.6);
          if (f.crater && rand() < 0.35) G.addPool(new Pool(f.x, f.y, f.r * 0.6, f.dmg * 0.6, 2.0, '#ffa552'));
        }
      } else if (f.t === 'cone') {
        f.x = G.player.x; f.y = G.player.y;
      } else if (f.t === 'web') {
        if (f.grow > 0) { f.grow -= dt; }
        else {
          f.tick -= dt;
          if (f.tick <= 0) {
            f.tick = 0.3;
            const p2 = G.player;
            const dx = f.x2 - f.x1, dy = f.y2 - f.y1;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len, uy = dy / len;
            const px = p2.x - f.x1, py = p2.y - f.y1;
            const t2 = px * ux + py * uy;
            if (t2 > 0 && t2 < len && Math.abs(px * -uy + py * ux) < 15 + p2.r) p2.damage(f.dmg);
          }
        }
      } else if (f.t === 'wall') {
        const ux = Math.cos(f.a), uy = Math.sin(f.a);
        f.x += ux * f.spd * dt; f.y += uy * f.spd * dt;
        const list = G.queryEnemies(f.x, f.y, f.w / 2 + 70);
        for (let j = 0; j < list.length; j++) {
          const e = list[j];
          if (e.dead || f.hit.has(e)) continue;
          const px = e.x - f.x, py = e.y - f.y;
          if (Math.abs(px * ux + py * uy) > 34 + e.r) continue;
          if (Math.abs(px * -uy + py * ux) > f.w / 2) continue;
          f.hit.add(e);
          G.hitEnemy(e, f.dmg, { col: f.col, kb: f.kb, kbAngle: f.a });
        }
        if (Math.hypot(f.x, f.y) > G.arenaR + 60) {
          if (f.back > 0) { f.back--; f.a += Math.PI; f.hit.clear(); }
          else f.life = 0;
        }
      } else if (f.t === 'scar') {
        f.tick -= dt;
        if (f.tick <= 0) {
          f.tick = 0.3;
          const dx = Math.cos(f.a), dy = Math.sin(f.a);
          const list = G.queryEnemies(f.x + dx * f.len / 2, f.y + dy * f.len / 2, f.len / 2 + 80);
          for (let i = 0; i < list.length; i++) {
            const e = list[i];
            if (e.dead) continue;
            const px = e.x - f.x, py = e.y - f.y;
            const t = px * dx + py * dy;
            if (t < 0 || t > f.len + e.r) continue;
            if (Math.abs(px * -dy + py * dx) > f.w / 2 + e.r) continue;

const BOSS_T = 630;          // 10:30 -- THE BLOOM, the finale
const RUN_GOAL = 720;        // 12:00 reference

/* the gauntlet: mid-run bosses, each a full fight with its own moveset */
const GAUNTLET_TIMES = [165, 285, 405, 525];
const MID_BOSSES = ['choir', 'gravewalker', 'weep', 'nullarch', 'loom', 'carrion', 'orrery', 'husk'];
let GAUNTLET = [];
function rollDailyGauntlet() {
  // seeded, so every player meets them in the same order today
  const pool = DAILY_BOSSES.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  DAILY_ORDER = pool;
  GAUNTLET = DAILY_TIMES.map((t, i) => ({ t: t, id: pool[i] }));
}
function rollConquestGauntlet(pl) {
  // the pool is the wild bosses plus every world you have already taken
  const src = Conquest.pool(pl.id);
  const pool = [];
  // shuffle, then top up with repeats when the galaxy is still small
  const bag = src.slice();
  for (let i = bag.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t = bag[i]; bag[i] = bag[j]; bag[j] = t; }
  for (let i = 0; i < GAUNTLET_TIMES.length; i++) pool.push(bag[i % bag.length]);
  GAUNTLET = GAUNTLET_TIMES.map((t, i) => ({ t: t, id: pool[i] }));
}
function rollGauntlet(times) {
  // four of the eight, shuffled -- a different gauntlet every run
  const T = times || GAUNTLET_TIMES;
  const pool = MID_BOSSES.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  GAUNTLET = T.map((t, i) => ({ t: t, id: pool[i % pool.length] }));
}
rollGauntlet();
const ELITE_CYCLE = ['warden', 'harbinger', 'sentinel', 'carver', 'warden', 'sentinel', 'harbinger', 'carver'];
const ELITE_TIMES = [105, 250, 370, 490, 600];
