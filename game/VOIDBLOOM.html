  const thin = (b) => ({ lw: 1.2, blur: b || 9, core: null, inner: false });
  const wob = Math.sin(t * 2.6) * 0.12;

  if (f === 'mote') {
    // a seed of light, with three smaller ones caught in its pull
    c.save(); c.rotate(-0.42); c.scale(1, 0.42);
    for (let i = 0; i < 3; i++) {
      const a = t * 1.9 + i / 3 * TAU;
      // a short wake behind each caught mote, so the orbit is visible
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 1.45, a - 0.62, a); }, col,
        { lw: 0.9, blur: 6, core: null, inner: false });
    }
    c.restore();
    neon(c, cc => pathStar(cc, 4, R * 0.62, R * 0.22, -t * 0.7), col,
      { lw: 1.1, blur: 9, core: null, inner: false });
    neon(c, cc => pathStar(cc, 4, R * 0.86, R * 0.30, t * 1.1), col, lw);
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.22, 0, TAU); }, '#ffffff', thin(10));
    c.save(); c.rotate(-0.42); c.scale(1, 0.42);
    for (let i = 0; i < 3; i++) {
      const a = t * 1.9 + i / 3 * TAU;
      const d = R * (1.45 + Math.sin(t * 2 + i) * 0.10);
      neon(c, cc => { cc.beginPath(); cc.arc(Math.cos(a) * d, Math.sin(a) * d, 1.7, 0, TAU); },
        '#eaffd0', thin(8));
    }
    c.restore();

  } else if (f === 'cinder') {
    // a flame that never went out: outer body, hot inner tongue, embers
    const fl = Math.sin(t * 7) * 0.10;
    neon(c, cc => {
      cc.beginPath();
      cc.moveTo(0, -R * (1.35 + fl));
      cc.quadraticCurveTo(R * 0.92, -R * 0.15, R * 0.44, R * 0.85);
      cc.quadraticCurveTo(0, R * 1.12, -R * 0.44, R * 0.85);
      cc.quadraticCurveTo(-R * 0.92, -R * 0.15, 0, -R * (1.35 + fl));
      cc.closePath();
    }, col, { lw: 1.8, blur: 16, core: 'rgba(26,8,2,0.7)' });
    neon(c, cc => {
      cc.beginPath();
      cc.moveTo(0, -R * (0.72 - fl));
      cc.quadraticCurveTo(R * 0.42, R * 0.1, 0, R * 0.62);
      cc.quadraticCurveTo(-R * 0.42, R * 0.1, 0, -R * (0.72 - fl));
      cc.closePath();
    }, '#ffe08a', thin(13));
    for (let i = 0; i < 3; i++) {
      const ph = (t * 0.9 + i / 3) % 1;
      c.save(); c.globalAlpha = alpha * (1 - ph) * 0.8;
      neon(c, cc => { cc.beginPath(); cc.arc(Math.sin(t * 3 + i * 2) * R * 0.5, -R * (1.5 + ph * 1.9), 1.4, 0, TAU); },
        '#ffd166', thin(8));
      c.restore();
    }

  } else if (f === 'sprig') {
    // a stem with three leaves that sway out of phase, and a bud on top
    neon(c, cc => {
      cc.beginPath(); cc.moveTo(0, R * 1.05);
      cc.quadraticCurveTo(wob * R * 2, 0, wob * R, -R * 1.0);
    }, col, { lw: 1.7, blur: 11, core: null, inner: false });
    for (let i = 0; i < 3; i++) {
      const side = i % 2 ? 1 : -1;
      const ly = R * (0.58 - i * 0.50);
      const sw = Math.sin(t * 2.1 + i * 1.3) * 0.20;
      const L = R * (0.98 - i * 0.12);
      c.save();
      c.translate(wob * R * (1 - i * 0.3), ly);
      c.rotate(side * (0.62 + sw));
      // a proper leaf: two mirrored curves meeting at a point, plus a vein
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(0, 0);
        cc.quadraticCurveTo(L * 0.45, -L * 0.42, L, 0);
        cc.quadraticCurveTo(L * 0.45, L * 0.42, 0, 0);
        cc.closePath();
      }, i === 1 ? '#c6ff8a' : col, { lw: 1.4, blur: 11, core: 'rgba(8,20,4,0.55)' });
      neon(c, cc => { cc.beginPath(); cc.moveTo(L * 0.10, 0); cc.lineTo(L * 0.88, 0); },
        '#eaff8a', { lw: 0.8, blur: 6, core: null, inner: false });
      c.restore();
    }
    const open = 0.55 + Math.min(0.45, (G.combo || 0) / 70);
    neon(c, cc => { cc.beginPath(); cc.ellipse(wob * R, -R * 1.12, R * 0.30, R * 0.44 * open, wob, 0, TAU); },
      '#eaff8a', thin(11));

  } else if (f === 'wisp') {
    // a small light inside a hollow ring, trailing smoke that comes apart
    c.save(); c.rotate(face + Math.PI);
    // the tail: one curling stroke that thins and fades, not a bead chain
    for (let pass = 0; pass < 3; pass++) {
      c.save();
      c.globalAlpha = alpha * (0.42 - pass * 0.11);
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(R * 0.7, 0);
        for (let k = 1; k <= 14; k++) {
          const u = k / 14;
          const d = R * (0.7 + u * 2.3);
          const sway = Math.sin(t * 3.0 - u * 4.6 + pass * 1.1) * R * 0.42 * u;
          cc.lineTo(d, sway);
        }
      }, col, { lw: 1.5 - pass * 0.45, blur: 11 - pass * 3, core: null, inner: false });
      c.restore();
    }
    c.restore();
    // the ring: two arcs turning against each other, open at the sides
    for (let i = 0; i < 2; i++) {
      const b = t * (i ? -0.9 : 1.3);
      for (let k = 0; k < 2; k++) {
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * (1.02 - i * 0.22), b + k * Math.PI, b + k * Math.PI + 1.16); },
          i ? '#d8fbff' : col, { lw: 1.5 - i * 0.4, blur: 13 - i * 4, core: null, inner: false });
      }
    }
    // the light itself, breathing
    const br = R * (0.36 + Math.sin(t * 2.4) * 0.05);
    neon(c, cc => pathBlob(cc, br * 1.35, 7, 0.16, 41), col, { lw: 1.4, blur: 16, core: 'rgba(4,14,22,0.5)' });
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, br * 0.62, 0, TAU); }, '#ffffff', thin(14));

  } else if (f === 'chitter') {
    // three of something, arguing: tethered to each other, all talking
    const pos = [];
    for (let i = 0; i < 3; i++) {
      const a = t * 1.7 + i / 3 * TAU + spin * 6;
      const d = R * (0.62 + Math.sin(t * 4 + i * 2.1) * 0.10) + spin * 9;
      pos.push([Math.cos(a) * d, Math.sin(a) * d, a]);
    }
    // the argument: short filaments strung between them, flickering
    for (let i = 0; i < 3; i++) {
      const A = pos[i], B = pos[(i + 1) % 3];
      c.save();
      c.globalAlpha = alpha * (0.20 + Math.abs(Math.sin(t * 9 + i * 2)) * 0.42);
      neon(c, cc => {
        cc.beginPath(); cc.moveTo(A[0], A[1]);
        cc.quadraticCurveTo((A[0] + B[0]) * 0.5 * 0.4, (A[1] + B[1]) * 0.5 * 0.4, B[0], B[1]);
      }, '#e6d4ff', { lw: 0.9, blur: 8, core: null, inner: false });
      c.restore();
    }
    for (let i = 0; i < 3; i++) {
      const [px, py, a] = pos[i];
      c.save();
      c.translate(px, py);
      c.rotate(a + Math.PI / 2 + Math.sin(t * 7 + i) * 0.22);
      // six legs, kicking out of phase
      for (let L = 0; L < 6; L++) {
        const side = L < 3 ? -1 : 1, row = (L % 3) - 1;
        const kick = Math.sin(t * 13 + L * 1.4 + i * 2) * 1.4;
        neon(c, cc => {
          cc.beginPath();
          cc.moveTo(side * 1.4, row * 1.5);
          cc.quadraticCurveTo(side * 4.0, row * 2.0 + kick, side * 4.6, row * 3.1 + kick);
        }, col, { lw: 0.9, blur: 5, core: null, inner: false });
      }
      // a fat little body with a plated back
      neon(c, cc => { cc.beginPath(); cc.ellipse(0, 0.6, 2.6, 3.4, 0, 0, TAU); }, col,
        { lw: 1.4, blur: 11, core: 'rgba(10,8,22,0.72)' });
      neon(c, cc => { cc.beginPath(); cc.moveTo(-2.2, 0.2); cc.lineTo(2.2, 0.2); cc.moveTo(-1.9, 2.0); cc.lineTo(1.9, 2.0); },
        '#c9a3ff', { lw: 0.8, blur: 5, core: null, inner: false });
      // two eyes and a pair of feelers that twitch
      neon(c, cc => {
        cc.beginPath(); cc.arc(-1.1, -2.3, 0.85, 0, TAU);
        cc.moveTo(1.95, -2.3); cc.arc(1.1, -2.3, 0.85, 0, TAU);
      }, '#ffffff', thin(6));
      const fk = Math.sin(t * 10 + i * 3) * 0.5;
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(-0.9, -3.2); cc.lineTo(-2.3 + fk, -5.4);
        cc.moveTo(0.9, -3.2); cc.lineTo(2.3 + fk, -5.4);
      }, col, { lw: 0.8, blur: 5, core: null, inner: false });
      c.restore();
    }

  } else if (f === 'nimbus') {
    // three lobes of cloud, rain, and a bolt on a beat
    for (const [ox, oy, rr] of [[-R * 0.5, R * 0.05, R * 0.56], [R * 0.5, R * 0.05, R * 0.5], [0, -R * 0.22, R * 0.72]]) {
      neon(c, cc => { cc.beginPath(); cc.arc(ox, oy, rr, 0, TAU); }, col,
        { lw: 1.5, blur: 12, core: 'rgba(6,14,26,0.6)' });
    }
    const strike = (Math.floor(t * 2.2) % 4) === 0;
    if (strike) {
      neon(c, cc => { cc.beginPath(); cc.moveTo(-2.4, R * 0.5); cc.lineTo(1.4, R * 1.25); cc.lineTo(-0.8, R * 1.25); cc.lineTo(2.8, R * 2.1); },
        '#ffffff', { lw: 1.5, blur: 14, core: null, inner: false });
    } else {
      for (let i = 0; i < 3; i++) {
        const ph = (t * 1.6 + i / 3) % 1;
        c.save(); c.globalAlpha = alpha * (1 - ph) * 0.7;
        neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 0.4 + i * R * 0.4, R * 0.6 + ph * R * 1.1); cc.lineTo(-R * 0.4 + i * R * 0.4, R * 0.9 + ph * R * 1.1); },
          '#bfe8ff', thin(6));
        c.restore();
      }
    }

  } else if (f === 'revenant') {
    c.globalAlpha = alpha * 0.8;
    const hem = 5;
    neon(c, cc => {
      cc.beginPath();
      cc.arc(0, -R * 0.1, R * 0.82, Math.PI, 0);
      for (let i = 0; i <= hem; i++) {
        const hx = R * 0.82 - (i / hem) * R * 1.64;
        const hy = R * 0.62 + Math.sin(t * 4 + i) * R * 0.16;
        cc.lineTo(hx, hy);
      }
      cc.closePath();
    }, col, lw);
    neon(c, cc => { cc.beginPath(); cc.arc(-R * 0.3, -R * 0.12, 1.4, 0, TAU); cc.moveTo(R * 0.44, -R * 0.12); cc.arc(R * 0.3, -R * 0.12, 1.4, 0, TAU); },
      '#ffffff', thin(8));

  } else if (f === 'orrery') {
    // a small sun with three tilted tracks and a moon on each
    for (let i = 0; i < 3; i++) {
      const a = t * (0.9 + i * 0.42) + i * 2.1;
      const rr = R * (1.0 + i * 0.36);
      c.save(); c.rotate(i * 1.05); c.scale(1, 0.32);
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, rr, 0, TAU); }, col, { lw: 0.9, blur: 7, core: null, inner: false });
      c.restore();
      c.save(); c.rotate(i * 1.05);
      const mx = Math.cos(a) * rr, my = Math.sin(a) * rr * 0.32;
      neon(c, cc => { cc.beginPath(); cc.arc(mx, my, 1.9, 0, TAU); }, '#fff6d0', thin(8));
      c.restore();
    }
    neon(c, cc => pathPoly(cc, 6, R * 0.40, t * 0.4), col, { lw: 1.6, blur: 16, core: 'rgba(24,16,2,0.6)' });
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.16, 0, TAU); }, '#ffffff', thin(12));

  } else if (f === 'herald') {
    // it never bobs. it only turns to look. an eye, held open.
    // an outer corona of lids, each a thin arc, turning very slowly
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * TAU + t * 0.16;
      const len = 0.16 + (i % 2) * 0.10;
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 1.32, a, a + len); }, col,
        { lw: 1.1, blur: 8, core: null, inner: false });
    }
    // the lid: a lens. It blinks, but rarely, and fast when it does.
    const blink = Math.max(0, 1 - Math.abs(((t * 0.21) % 1) - 0.5) * 42);
    const open = 1 - blink;
    if (open < 0.30) {
      // shut: one lid line with a crease above it, not a stack of bars
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(-R * 1.12, 0);
        cc.quadraticCurveTo(0, R * 0.20, R * 1.12, 0);
      }, col, { lw: 1.9, blur: 15, core: null, inner: false });
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(-R * 0.80, -R * 0.26);
        cc.quadraticCurveTo(0, -R * 0.46, R * 0.80, -R * 0.26);
      }, col, { lw: 0.9, blur: 7, core: null, inner: false });
    } else {
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(-R * 1.12, 0);
        cc.quadraticCurveTo(0, -R * 0.98 * open, R * 1.12, 0);
        cc.quadraticCurveTo(0, R * 0.98 * open, -R * 1.12, 0);
        cc.closePath();
      }, col, { lw: 1.8, blur: 15, core: 'rgba(4,8,18,0.82)' });
      c.save();
      // the pupil rides toward whatever it is facing
      c.translate(Math.cos(face) * R * 0.34, Math.sin(face) * R * 0.20 * open);
      neon(c, cc => { cc.beginPath(); cc.ellipse(0, 0, R * 0.40, R * 0.40 * open, 0, 0, TAU); },
        '#dfefff', { lw: 1.4, blur: 12, core: 'rgba(6,10,22,0.7)' });
      if (open > 0.55) {
        // iris spokes, so it has some machinery behind it
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * TAU + t * 0.5;
          neon(c, cc => {
            cc.beginPath();
            cc.moveTo(Math.cos(a) * R * 0.16, Math.sin(a) * R * 0.16 * open);
            cc.lineTo(Math.cos(a) * R * 0.36, Math.sin(a) * R * 0.36 * open);
          }, '#9fc4ff', { lw: 0.7, blur: 5, core: null, inner: false });
        }
      }
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.13, 0, TAU); }, '#ffffff', thin(12));
      c.restore();
    }
    // a slow veil under it, the only part of it that ever moves much
    for (let i = 0; i < 3; i++) {
      c.save(); c.globalAlpha = alpha * (0.34 - i * 0.09);
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(-R * 0.62, R * (0.42 + i * 0.30));
        cc.quadraticCurveTo(Math.sin(t * 1.6 - i) * R * 0.5, R * (0.86 + i * 0.34), R * 0.62, R * (0.42 + i * 0.30));
      }, col, { lw: 1.1, blur: 8, core: null, inner: false });
      c.restore();
    }

  } else if (f === 'huskling') {
    // a small plated face, always turned the right way
    c.save(); c.rotate(face);
    // two shoulder plates, riding a little behind the head
    for (const side of [-1, 1]) {
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(-R * 0.30, side * R * 0.34);
        cc.quadraticCurveTo(-R * 1.05, side * R * 0.92, -R * 1.18, side * R * 0.22);
        cc.quadraticCurveTo(-R * 0.92, side * R * 0.06, -R * 0.30, side * R * 0.34);
        cc.closePath();
      }, col, { lw: 1.3, blur: 10, core: 'rgba(22,8,4,0.6)' });
    }
    // the helm: a plate with a browline and a cut jaw
    neon(c, cc => {
      cc.beginPath();
      cc.moveTo(R * 1.12, 0);
      cc.lineTo(R * 0.42, -R * 0.80);
      cc.lineTo(-R * 0.58, -R * 0.72);
      cc.lineTo(-R * 0.86, 0);
      cc.lineTo(-R * 0.58, R * 0.72);
      cc.lineTo(R * 0.42, R * 0.80);
      cc.closePath();
    }, col, { lw: 2.1, blur: 15, core: 'rgba(26,10,5,0.55)' });
    // the browline, raised off the plate
    neon(c, cc => {
      cc.beginPath();
      cc.moveTo(R * 0.30, -R * 0.62); cc.lineTo(-R * 0.50, -R * 0.54);
      cc.moveTo(R * 0.30, R * 0.62); cc.lineTo(-R * 0.50, R * 0.54);
    }, '#ffd0b8', { lw: 1.1, blur: 7, core: null, inner: false });
    // the visor: one hot slit, pinched at both ends, with an eye in it
    neon(c, cc => {
      cc.beginPath();
      cc.moveTo(-R * 0.18, 0);
      cc.quadraticCurveTo(R * 0.26, -R * 0.24, R * 0.72, 0);
      cc.quadraticCurveTo(R * 0.26, R * 0.24, -R * 0.18, 0);
      cc.closePath();
    }, '#ff9a6b', { lw: 1.2, blur: 9, core: 'rgba(34,10,2,0.88)' });
    const look = Math.sin(t * 0.8) * R * 0.10;
    neon(c, cc => { cc.beginPath(); cc.arc(R * 0.34 + look, 0, R * 0.12, 0, TAU); }, '#ffd0b8',
      { lw: 1.1, blur: 9, core: 'rgba(255,220,190,0.85)' });
    // a chin vent, so the front is not all one shape
    neon(c, cc => {
      cc.beginPath();
      cc.moveTo(R * 0.52, R * 0.34); cc.lineTo(R * 0.86, R * 0.14);
      cc.moveTo(R * 0.52, -R * 0.34); cc.lineTo(R * 0.86, -R * 0.14);
    }, '#ffffff', thin(6));
    c.restore();

  } else if (f === 'seedling') {
    // the husk has split, and something is coming out of it
    const open = 0.40 + Math.min(0.42, (G.level || 1) / 40) + Math.sin(t * 1.4) * 0.05;
    for (const side of [-1, 1]) {
      c.save(); c.rotate(side * open);
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(0, R * 0.9);
        cc.quadraticCurveTo(side * R * 0.9, R * 0.1, 0, -R * 0.75);
        cc.quadraticCurveTo(side * R * 0.32, R * 0.1, 0, R * 0.9);
        cc.closePath();
      }, col, { lw: 1.5, blur: 11, core: 'rgba(14,20,2,0.65)' });
      c.restore();
    }
    neon(c, cc => { cc.beginPath(); cc.moveTo(0, R * 0.4); cc.lineTo(0, -R * 1.15); }, '#eaff8a', thin(9));
    for (const side of [-1, 1]) {
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(0, -R * 0.75);
        cc.quadraticCurveTo(side * R * 0.55, -R * 1.05, side * R * 0.2, -R * 1.35);
      }, '#c6ff8a', thin(8));
    }

  } else if (f === 'chronid') {
    // a face, ticks, an hour hand and a second hand that actually ticks
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R, 0, TAU); }, col, lw);
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU;
      const big = i % 3 === 0;
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(Math.cos(a) * R * (big ? 0.72 : 0.80), Math.sin(a) * R * (big ? 0.72 : 0.80));
        cc.lineTo(Math.cos(a) * R * 0.90, Math.sin(a) * R * 0.90);
      }, big ? '#ffe9c0' : col, { lw: big ? 1.1 : 0.8, blur: 5, core: null, inner: false });
    }
    const sec = Math.floor(G.time) % 60 / 60, hr = (G.time % 600) / 600;
    neon(c, cc => { cc.beginPath(); cc.moveTo(0, 0); cc.lineTo(Math.cos(hr * TAU - Math.PI / 2) * R * 0.44, Math.sin(hr * TAU - Math.PI / 2) * R * 0.44); },
      '#ffffff', { lw: 1.5, blur: 8, core: null, inner: false });
    neon(c, cc => { cc.beginPath(); cc.moveTo(0, 0); cc.lineTo(Math.cos(sec * TAU - Math.PI / 2) * R * 0.72, Math.sin(sec * TAU - Math.PI / 2) * R * 0.72); },
      '#ffe9c0', thin(7));
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, 1.3, 0, TAU); }, '#ffffff', thin(6));

  } else if (f === 'bloomling') {
    // it opens with your streak, and it means it
    const open = 0.62 + Math.min(0.38, (G.combo || 0) / 55) + Math.sin(t * 1.5) * 0.04;
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU + t * 0.35;
      neon(c, cc => {
        cc.beginPath();
        cc.ellipse(Math.cos(a) * R * 0.52 * open, Math.sin(a) * R * 0.52 * open,
          R * 0.56 * open, R * 0.24, a, 0, TAU);
      }, i % 2 ? col : '#ff9ae6', { lw: 1.2, blur: 11, core: 'rgba(26,4,22,0.55)' });
    }
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU - t * 0.8;
      neon(c, cc => { cc.beginPath(); cc.arc(Math.cos(a) * R * 0.30, Math.sin(a) * R * 0.30, 1.1, 0, TAU); },
        '#ffd166', thin(6));
    }
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.18, 0, TAU); }, '#ffffff', thin(10));

  } else if (f === 'tide') {
    // a drop with a turn inside it, and rings coming off it
    for (let i = 0; i < 2; i++) {
      const ph = (t * 0.8 + i / 2) % 1;
      c.save(); c.globalAlpha = alpha * (1 - ph) * 0.45;
      neon(c, cc => { cc.beginPath(); cc.ellipse(0, R * 0.5, R * (0.7 + ph * 1.3), R * (0.22 + ph * 0.4), 0, 0, TAU); },
        col, thin(7));
      c.restore();
    }
    neon(c, cc => {
      cc.beginPath();
      cc.moveTo(0, -R * 1.2);
      cc.quadraticCurveTo(R * 0.86, R * 0.15, 0, R * 1.0);
      cc.quadraticCurveTo(-R * 0.86, R * 0.15, 0, -R * 1.2);
      cc.closePath();
    }, col, lw);
    neon(c, cc => {
      cc.beginPath();
      for (let i = 0; i <= 18; i++) {
        const a = i / 18 * TAU * 1.5 + t * 1.1;
        const rr = R * 0.10 + i / 18 * R * 0.42;
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr + R * 0.1;
        i ? cc.lineTo(px, py) : cc.moveTo(px, py);
      }
    }, '#d6fff2', thin(8));

  } else if (f === 'daybreak') {
    // a small sun coming up over its own horizon
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.62, 0, TAU); }, col,
      { lw: 1.7, blur: 16, core: 'rgba(30,18,2,0.5)' });
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU + t * 0.26;
      const long = i % 2 === 0;
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(Math.cos(a) * R * 0.80, Math.sin(a) * R * 0.80);
        cc.lineTo(Math.cos(a) * R * (long ? 1.38 : 1.06), Math.sin(a) * R * (long ? 1.38 : 1.06));
      }, long ? '#fff0b8' : col, { lw: long ? 1.2 : 0.85, blur: long ? 9 : 6, core: null, inner: false });
    }
    c.save(); c.globalAlpha = alpha * 0.6;
    neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.5, R * 0.62); cc.lineTo(R * 1.5, R * 0.62); }, '#ffd166', thin(8));
    c.restore();
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.2, 0, TAU); }, '#ffffff', thin(12));
  }
  c.restore();
}

/* ------------------------------------------------------------------ enemy */
class Enemy {
  constructor(def, x, y, hpMul, dmgMul) {
    this.def = def;
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.r = def.r;
    this.maxHp = Math.round(def.hp * (hpMul || 1));
    this.hp = this.maxHp;
    this.dmg = def.dmg * (dmgMul || 1);
    this.hurt = 0;
    this.rot = rnd(TAU);
    this.spin = rnd(-1, 1) * 0.8;
    this.dead = false;
    this.kx = 0; this.ky = 0;
    this.burn = 0; this.burnDps = 0; this.burnTick = 0;
    this.slow = 0;
    this.stun = 0;
    this.fireT = rnd(0.5, (def.fireCd || 2) );
    this.dashT = rnd(0.6, def.dashCd || 2);
    this.dashing = 0;
    this.ph = rnd(TAU);
    this.hitBy = null;      // per-weapon tick map for orbiters
    this.tickMap = null;
    this.scale = 1;
    this.spawnT = 0.28;
    this.bornT = Game.time;
    this.elite = !!def.elite;
    this.boss = !!def.boss;
    this.shield = 0; this.frozen = 0; this.amped = 0; this.shielded = 0; this.isShard = false;
    this.brandT = 0; this.brandAmp = 0; this.brandSpread = 0; this.sunder = 0;
    this.isDecoy = false; this.decoyOf = null; this.twin = null; this.twinIdx = 0; this.downed = 0;
    // on the harder modes a share of the ordinary enemies carry a weapon.
    // swarmers are exempt -- they arrive forty at a time.
    const gun = G ? G.enemyGunRate() : 0;
    this.armed = gun > 0 && !def.elite && !def.boss && !def.fireCd && def.id !== 'swarmer' && rand() < gun;
    this.gunT = rnd(1.4, ((G && G.D.gunCd) || 4) * 1.2);
    this.blind = 0; this.isMoon = false; this.isSpawn = false; this.splitGen = 0;
    if (this.boss) { this.phase = 0; this.pt = 0; this.attackT = 2.5; this.sub = 0; this.shards = null; }
    // the orrery's moons orbit 150 out, so it has to stand further off the wall
    this.edgePad = def.bossKind === 'orrery' ? 178 : def.r;
  }
  /* pull this thing back inside the ring and kill any outward push */
  contain() {
    const pad = this.edgePad || this.r;
    const lim = Math.max(40, G.arenaR - pad);
    const od = Math.hypot(this.x, this.y);
    if (od <= lim || od < 0.001) return;
    const ux = this.x / od, uy = this.y / od;
    this.x = ux * lim; this.y = uy * lim;
    const vOut = this.vx * ux + this.vy * uy;
    if (vOut > 0) { this.vx -= ux * vOut; this.vy -= uy * vOut; }
    const kOut = this.kx * ux + this.ky * uy;
    if (kOut > 0) { this.kx -= ux * kOut; this.ky -= uy * kOut; }
  }
  moonsAlive() { let n = 0; for (const m of (this.moons || [])) if (m && !m.dead) n++; return n; }
  tickReady(key, cd) {
    if (!this.tickMap) this.tickMap = Object.create(null);
    const t = G.time;
    if (this.tickMap[key] === undefined || t - this.tickMap[key] >= cd) { this.tickMap[key] = t; return true; }
    return false;
  }
  update(dt) {
    const p = G.player;
    this.spawnT = Math.max(0, this.spawnT - dt);
    this.hurt = Math.max(0, this.hurt - dt * 6.5);
    this.stun = Math.max(0, this.stun - dt);
    this.slow = Math.max(0, this.slow - dt);
    if (this.burn > 0) {
      this.burn -= dt;
      this.burnTick -= dt;
      if (this.burnTick <= 0) {
        this.burnTick = 0.35;
        G.hitEnemy(this, this.burnDps * 0.35, { silent: true, col: '#ffb347', noKb: true });
        Particles.spark(this.x + rnd(-8, 8), this.y + rnd(-8, 8), -Math.PI / 2 + rnd(-0.5, 0.5), rnd(20, 70), { col: '#ffb347', life: 0.35, w: 2 });
      }
    }
    if (this.dead) return;

    const dx = p.x - this.x, dy = p.y - this.y;
    const dd = Math.hypot(dx, dy) || 1;
    let nx = dx / dd, ny = dy / dd;
    let spd = this.def.spd * (this.slow > 0 ? 0.45 : 1) * (this.stun > 0 ? 0 : 1) * G.enemySpeedMul;
    if (this.spawnT > 0) spd *= 0.25;

    // a moon is bolted to its parent until the parent dies
    if (this.isMoon && this.moonOf && !this.moonOf.dead) {
      const b = this.moonOf;
      const ma = (b.moonA || 0) + this.moonI / this.moonN * TAU;
      this.x = b.x + Math.cos(ma) * 150;
      this.y = b.y + Math.sin(ma) * 150;
      this.vx = 0; this.vy = 0; this.kx = 0; this.ky = 0;
      this.contain();
      this.rot += this.spin * dt;
      return;
    }
    // shrouded enemies lose track of where you were
    if (this.blind > G.time) {
      const wob = Math.sin(G.time * 1.6 + this.ph) * 2.2;
      const ca = Math.cos(wob), sa = Math.sin(wob);
      const bx = nx * ca - ny * sa, by = nx * sa + ny * ca;
      nx = bx; ny = by;
    }
    switch (this.isDecoy ? 'chase' : this.def.ai) {
      case 'chase': {
        let ax = nx, ay = ny;
        if (this.def.wobble) {
          const w = Math.sin(G.time * this.def.wobble + this.ph) * 0.55;
          const ca = Math.cos(w), sa = Math.sin(w);
          ax = nx * ca - ny * sa; ay = nx * sa + ny * ca;
        }
        this.vx = ax * spd; this.vy = ay * spd;
        break;
      }
      case 'kite': {
        const keep = this.def.keep;
        const s = dd > keep + 40 ? 1 : (dd < keep - 40 ? -1 : 0);
        const per = Math.sin(G.time * 0.7 + this.ph) * 0.5;
        this.vx = (nx * s - ny * per) * spd;
        this.vy = (ny * s + nx * per) * spd;
        this.fireT -= dt;
        if (this.fireT <= 0 && this.spawnT <= 0 && dd < 620) {
          this.fireT = this.def.fireCd * rnd(0.85, 1.15);
          G.enemyBullet(this.x, this.y, nx * this.def.bulletSpd, ny * this.def.bulletSpd, this.def.bulletDmg * G.dmgScale, this.def.col);
        }
        break;
      }
      case 'dasher': {
        this.dashT -= dt;
        if (this.dashing > 0) {
          this.dashing -= dt;
          this.vx *= 0.995; this.vy *= 0.995;
          if ((G.frame & 1) === 0) Particles.spark(this.x, this.y, Math.atan2(-this.vy, -this.vx) + rnd(-0.3, 0.3), rnd(40, 140), { col: this.def.col, life: 0.25, w: 2 });
        } else if (this.dashT <= 0 && dd < 520 && this.spawnT <= 0) {
          this.dashT = this.def.dashCd * rnd(0.8, 1.3);
          this.dashing = 0.42;
          this.vx = nx * this.def.dashSpd; this.vy = ny * this.def.dashSpd;
          Particles.ring(this.x, this.y, 6, 46, { col: this.def.col, life: 0.3, w: 2.5 });
        } else {
          this.vx = nx * spd * 0.62; this.vy = ny * spd * 0.62;
        }
        break;
      }
      case 'elite': {
        this.vx = nx * spd; this.vy = ny * spd;
        this.fireT -= dt;
        if (this.fireT <= 0 && this.spawnT <= 0) {
          this.fireT = this.def.fireCd;
          const n = 14, off = rnd(TAU);
          for (let i = 0; i < n; i++) {
            const a = off + i / n * TAU;
            G.enemyBullet(this.x, this.y, Math.cos(a) * this.def.bulletSpd, Math.sin(a) * this.def.bulletSpd, this.def.bulletDmg * G.dmgScale, '#ff8a3c');
          }
          Particles.ring(this.x, this.y, this.r, this.r + 70, { col: '#ff8a3c', life: 0.4, w: 4 });
          Sound.shoot('nova');
        }
        break;
      }
      case 'hexer': {
        const keep = this.def.keep;
        const s2 = dd > keep + 50 ? 1 : (dd < keep - 50 ? -1 : 0);
        const per = Math.sin(G.time * 0.6 + this.ph) * 0.55;
        this.vx = (nx * s2 - ny * per) * spd;
        this.vy = (ny * s2 + nx * per) * spd;
        this.fireT -= dt;
        if (this.fireT <= 0 && this.spawnT <= 0 && dd < 640) {
          this.fireT = this.def.fireCd * rnd(0.85, 1.2);
          const p2 = G.player;
          G.hexCircle(p2.x + rnd(-40, 40), p2.y + rnd(-40, 40), 78, 1.15, 22, this.def.col);
        }
        break;
      }
      case 'orbiter': {
        const keep = this.def.keep;
        const s2 = dd > keep + 40 ? 1 : (dd < keep - 40 ? -0.8 : 0);
        this.vx = (nx * s2 - ny * 0.85) * spd;
        this.vy = (ny * s2 + nx * 0.85) * spd;
        this.fireT -= dt;
        if (this.fireT <= 0 && this.spawnT <= 0 && dd < 700) {
          this.fireT = this.def.fireCd * rnd(0.85, 1.15);
          const a0 = Math.atan2(ny, nx);
          for (let i = -1; i <= 1; i++) {
            const a = a0 + i * 0.24;
            G.enemyBullet(this.x, this.y, Math.cos(a) * this.def.bulletSpd, Math.sin(a) * this.def.bulletSpd, this.def.bulletDmg * G.dmgScale, this.def.col);
          }
        }
        break;
      }
      case 'harbinger': {
        this.vx = nx * spd; this.vy = ny * spd;
        this.fireT -= dt;
        if (this.fireT <= 0 && this.spawnT <= 0) {
          this.fireT = this.def.fireCd;
          const n = 7, off = rnd(TAU);
          for (let i = 0; i < n; i++) {
            const a = off + i / n * TAU;
            G.enemyBullet(this.x, this.y, Math.cos(a) * this.def.bulletSpd, Math.sin(a) * this.def.bulletSpd, this.def.bulletDmg * G.dmgScale, this.def.col);
          }
          G.spawnBrood(this, 3);
          Particles.ring(this.x, this.y, this.r, this.r + 60, { col: this.def.col, life: 0.4, w: 4 });
          Sound.shoot('nova');
        }
        break;
      }
      case 'sentinel': {
        const keep = 240;
        const s2 = dd > keep + 50 ? 1 : (dd < keep - 50 ? -0.6 : 0);
        this.vx = (nx * s2 - ny * 0.35) * spd;
        this.vy = (ny * s2 + nx * 0.35) * spd;
        this.wardT = (this.wardT || 0) - dt;
        if (this.wardT <= 0) {
          this.wardT = 0.4;
          const near = G.queryEnemies(this.x, this.y, 300);
          for (let i = 0; i < near.length; i++) {
            const e = near[i];
            if (e === this || e.dead) continue;
            e.shield = G.time + 0.55;
          }
        }
        this.fireT -= dt;
        if (this.fireT <= 0 && this.spawnT <= 0) {
          this.fireT = this.def.fireCd;
          const a0 = Math.atan2(ny, nx);
          for (let i = -2; i <= 2; i++) {
            const a = a0 + i * 0.16;
            G.enemyBullet(this.x, this.y, Math.cos(a) * this.def.bulletSpd, Math.sin(a) * this.def.bulletSpd, this.def.bulletDmg * G.dmgScale, this.def.col);
          }
          Sound.shoot('beam');
        }
        break;
      }
      case 'carver': {
        this.dashT -= dt;
        if (this.dashing > 0) {
          this.dashing -= dt;
          this.vx *= 0.997; this.vy *= 0.997;
          this.trailT = (this.trailT || 0) - dt;
          if (this.trailT <= 0) {
            this.trailT = 0.14;
            G.addPool(new Pool(this.x, this.y, 46, 26 * G.dmgScale, 3.4, this.def.col, { hostile: true }));
          }
          if ((G.frame & 1) === 0) Particles.spark(this.x, this.y, Math.atan2(-this.vy, -this.vx) + rnd(-0.4, 0.4), rnd(60, 200), { col: this.def.col, life: 0.3, w: 2.6 });
        } else if (this.dashT <= 0 && this.spawnT <= 0) {
          this.dashT = this.def.dashCd * rnd(0.85, 1.2);
          this.dashing = 0.62;
          this.vx = nx * this.def.dashSpd; this.vy = ny * this.def.dashSpd;
          Particles.ring(this.x, this.y, 8, 70, { col: this.def.col, life: 0.35, w: 3.5 });
          Sound.shoot('lash');
        } else {
          this.vx = nx * spd * 0.5; this.vy = ny * spd * 0.5;
        }
        break;
      }
      case 'boss': this.bossUpdate(dt, nx, ny, dd, spd); break;
    }

    if (this.armed && this.spawnT <= 0 && this.stun <= 0 && !this.dead) {
      this.gunT -= dt;
      if (this.gunT <= 0 && dd < 640) {
        this.gunT = ((G.D.gunCd) || 4) * rnd(0.8, 1.3);
        this.signatureShot(nx, ny);
      }
    }

    // knockback
    this.x += (this.vx + this.kx) * dt;
    this.y += (this.vy + this.ky) * dt;
    const kf = Math.exp(-7 * dt);
    this.kx *= kf; this.ky *= kf;

    // stay in the arena -- fully inside it, so everything stays reachable
    this.contain();

    if (this.def.ai === 'dasher') this.rot = Math.atan2(this.vy, this.vx);
    else this.rot += this.spin * dt;
  }

  bossUpdate(dt, nx, ny, dd, spd) {
    if (this.def.underbloom) {
      // it takes the shape of something you already beat, one phase at a time
      const worn = G.runStats && G.runStats.bossIds ? G.runStats.bossIds : [];
      // drive the borrowed shape off health, not off the phase counter -- the
      // borrowed moveset rewrites that counter, and the two would fight
      const hpf = this.hp / this.maxHp;
      const stage = hpf > 0.7 ? 0 : (hpf > 0.4 ? 1 : (hpf > 0.15 ? 2 : 3));
      const pick = (stage < 3 && worn.length) ? worn[Math.min(stage, worn.length - 1)] : null;
      const pd = pick && ENEMY[pick];
      const wantKind = pd ? pd.bossKind : null;
      if (wantKind !== this._worn) {
        this._worn = wantKind;
        this.kindOverride = wantKind;
        this.wearCol = wantKind ? pd.col : this.def.col;
        this.attackT = 1.4; this.sub = 0;
        G.banner(wantKind ? ('WEARING  ·  ' + pd.name) : 'ITS OWN FACE', this.wearCol);
        Flash.hit(this.wearCol, 0.4); Cam.shake(0.7);
      }
      if (this.kindOverride) return this.bossUpdateAlt(dt, nx, ny, dd, spd);
    }
    if (this.def.bossKind && this.def.bossKind !== 'bloom') return this.bossUpdateAlt(dt, nx, ny, dd, spd);
    this.pt += dt;
    const hpFrac = this.hp / this.maxHp;
    const wantPhase = hpFrac > 0.66 ? 0 : (hpFrac > 0.33 ? 1 : 2);
    if (wantPhase !== this.phase) {
      this.phase = wantPhase;
      this.attackT = 1.2;
      Sound.bossHorn();
      Cam.shake(0.8);
      Flash.hit(PAL.boss, 0.4);
      Particles.ring(this.x, this.y, this.r, this.r + 420, { col: PAL.boss, life: 0.8, w: 9 });
      for (let i = 0; i < 60; i++) Particles.spark(this.x, this.y, rnd(TAU), rnd(200, 620), { col: PAL.boss, life: rnd(0.4, 0.9), w: 3 });
      G.banner('PHASE ' + (this.phase + 1), PAL.boss);
      G.bossPhaseBlast(this);
    }
    // relentless: always closing, with a slow orbital drift
    const per = Math.sin(G.time * 0.35 + this.ph) * 0.45;
    this.vx = (nx - ny * per) * spd;
    this.vy = (ny + nx * per) * spd;

    this.attackT -= dt * G.rageMul();
    G.bossDrizzle(this, dt, PAL.boss);
    if (this.attackT <= 0 && this.spawnT <= 0) {
      const ph = this.phase;
      this.sub = (this.sub + 1) % 3;
      if (ph === 0) {
        this.attackT = G.bossCd(2.6);
        // spiral
        this.spiral = G.bossN(22);
        this.spiralA = rnd(TAU);
      } else if (ph === 1) {
        if (this.sub === 0) { this.attackT = G.bossCd(3.4); this.spiral = G.bossN(30); this.spiralA = rnd(TAU); }
        else if (this.sub === 1) { this.attackT = G.bossCd(4.2); G.bossSummon(this, 8); }
        else { this.attackT = G.bossCd(3.0); G.bossPetalLasers(this, 6); }
      } else {
        if (this.sub === 0) { this.attackT = G.bossCd(2.4); this.spiral = G.bossN(40); this.spiralA = rnd(TAU); }
        else if (this.sub === 1) { this.attackT = G.bossCd(3.2); G.bossSummon(this, 12); }
        else { this.attackT = G.bossCd(2.6); G.bossPetalLasers(this, 9); }
      }
      G.bossChain(this);
    }
    if (this.spiral > 0) {
      this.spiralT = (this.spiralT || 0) - dt;
      if (this.spiralT <= 0) {
        this.spiralT = G.D.bossGentle ? 0.085 : (G.D.bossExtra ? 0.048 : 0.055);
        this.spiral--;
        this.spiralA += (G.D.bossExtra && (this.spiral & 1)) ? -0.42 : 0.42;
        const arms = Math.max(1, (this.phase >= 1 ? 3 : 2) + (G.D.bossExtra ? 2 : (G.D.bossHarder ? 1 : 0)) - (G.D.bossGentle ? 1 : 0));
        for (let i = 0; i < arms; i++) {
          const a = this.spiralA + i / arms * TAU;
          const sp = 190 + this.phase * 30;
          G.enemyBullet(this.x + Math.cos(a) * this.r, this.y + Math.sin(a) * this.r, Math.cos(a) * sp, Math.sin(a) * sp, 13 * G.dmgScale, PAL.boss);
        }
        Sound.shoot();
      }
    }
  }

  /* what an armed rank-and-file enemy does -- one move per type, in character */
  signatureShot(nx, ny) {
    const d = this.def, col = d.col, S = G.dmgScale;
    const a0 = Math.atan2(ny, nx);
    switch (d.id) {
      case 'bulwark':
        // a slow heavy shell you can see coming and walk around
        G.enemyBullet(this.x, this.y, Math.cos(a0) * 135, Math.sin(a0) * 135, 20 * S, col);
        Particles.ring(this.x, this.y, this.r, this.r + 30, { col: col, life: 0.3, w: 3 });
        break;
      case 'splitter': {
        for (let i = -1; i <= 1; i++) {
          const a = a0 + i * 0.28;
          G.enemyBullet(this.x, this.y, Math.cos(a) * 210, Math.sin(a) * 210, 9 * S, col);
        }
        break;
      }
      case 'howler': {
        const n = 5, off = rnd(TAU);
        for (let i = 0; i < n; i++) {
          const a = off + i / n * TAU;
          G.enemyBullet(this.x, this.y, Math.cos(a) * 185, Math.sin(a) * 185, 9 * S, col);
        }
        Particles.ring(this.x, this.y, this.r, this.r + 54, { col: col, life: 0.35, w: 3 });
        break;
      }
      case 'monolith': {
        const n = 8, off = rnd(TAU);
        for (let i = 0; i < n; i++) {
          const a = off + i / n * TAU;
          G.enemyBullet(this.x, this.y, Math.cos(a) * 150, Math.sin(a) * 150, 13 * S, col);
        }
        Cam.shake(0.09);
        break;
      }
      default:
        // drifters and anything else armed: one aimed bolt
        G.enemyBullet(this.x, this.y, Math.cos(a0) * 195, Math.sin(a0) * 195, 10 * S, col);
    }
    Sound.shoot();
  }
  bossPhase(hpFrac) {
    if (this.def.underbloom) return hpFrac > 0.7 ? 0 : (hpFrac > 0.4 ? 1 : (hpFrac > 0.15 ? 2 : 3));
    return hpFrac > 0.66 ? 0 : (hpFrac > 0.33 ? 1 : 2);
  }
  bossEnterPhase(ph) {
    this.phase = ph;
    this.attackT = 1.1;
    Sound.bossHorn();
    Cam.shake(0.8);
    const col = this.def.col;
    Flash.hit(col, 0.36);
    Particles.ring(this.x, this.y, this.r, this.r + 420, { col: col, life: 0.8, w: 9 });
    for (let i = 0; i < 60; i++) Particles.spark(this.x, this.y, rnd(TAU), rnd(200, 620), { col: col, life: rnd(0.4, 0.9), w: 3 });
    G.banner('PHASE ' + (ph + 1), col);
  }
  bossUpdateAlt(dt, nx, ny, dd, spd) {
    this.pt += dt;
    const col = this.wearCol || this.def.col;
    const kind = this.kindOverride || this.def.bossKind;
    const want = this.bossPhase(this.hp / this.maxHp);
    if (want !== this.phase) { this.bossEnterPhase(want); G.bossPhaseBlast(this); }
    const ph = this.phase;
    const rage = G.rageMul();
    this.attackT -= dt * rage;
    G.bossDrizzle(this, dt, col);

    /* ---- movement ---- */
    if (kind === 'choir') {
      const keep = 330;
      const s2 = dd > keep + 60 ? 1 : (dd < keep - 60 ? -0.9 : 0);
      this.vx = (nx * s2 - ny * 0.6) * spd;
      this.vy = (ny * s2 + nx * 0.6) * spd;
      this.coreA = (this.coreA || 0) + dt * (0.8 + ph * 0.35);
    } else if (kind === 'grave') {
      this.vx = nx * spd; this.vy = ny * spd;
    } else if (kind === 'weep') {
      const per = Math.sin(G.time * 0.9 + this.ph) * 0.7;
      this.vx = (nx - ny * per) * spd;
      this.vy = (ny + nx * per) * spd;
      this.trailT = (this.trailT || 0) - dt;
      if (this.trailT <= 0 && this.spawnT <= 0) {
        this.trailT = 0.55 - ph * 0.12;
        G.addPool(new Pool(this.x, this.y, 54 + ph * 8, (14 + ph * 5) * G.dmgScale, 4.2, col, { hostile: true }));
      }
    } else if (kind === 'null') {
      const keep = 300;
      const s2 = dd > keep + 70 ? 1 : (dd < keep - 70 ? -0.7 : 0);
      this.vx = (nx * s2 - ny * 0.45) * spd;
      this.vy = (ny * s2 + nx * 0.45) * spd;
      if (this.shielded > 0) {
        this.shielded -= dt;
        let alive = 0;
        for (const s of (this.shards || [])) if (s && !s.dead) alive++;
        if (alive === 0) this.shielded = 0;
        if (this.shielded <= 0) {
          G.banner('SHIELD BROKEN', col);
          Flash.hit('#fff', 0.3); Cam.shake(0.6);
          Particles.ring(this.x, this.y, this.r, this.r + 320, { col: '#fff', life: 0.7, w: 8 });
        }
      }
    } else if (kind === 'mirror') {
      const keep = 320;
      const s2 = dd > keep + 70 ? 1 : (dd < keep - 70 ? -0.85 : 0);
      this.vx = (nx * s2 - ny * 0.6) * spd;
      this.vy = (ny * s2 + nx * 0.6) * spd;
    } else if (kind === 'crown') {
      this.vx = nx * spd * 0.9; this.vy = ny * spd * 0.9;
      if (!this.court && !this.isDecoy) { this.court = G.spawnDecoys(this, 3); }
    } else if (kind === 'longnight') {
      this.vx = nx * spd; this.vy = ny * spd;
      // the dark closes in for as long as it lives
      if (!this.closing) { this.closing = true; G.arenaTarget = Math.max(640, G.arenaR * 0.46); G.banner('THE DARK CLOSES IN', col); }
    } else if (kind === 'antiphon') {
      if (this.downed > 0) {
        // beaten, not dead -- it drifts and waits for its twin to fall
        this.downed -= dt;
        this.vx *= 0.94; this.vy *= 0.94;
        if (this.downed <= 0) {
          this.hp = Math.max(1, Math.round(this.maxHp * 0.5));
          G.banner('ANTIPHON RISES', col);
          Flash.hit(col, 0.3); Cam.shake(0.6); Sound.bossHorn();
          Particles.ring(this.x, this.y, 8, this.r * 5, { col: col, life: 0.8, w: 8 });
        }
        return;
      }
      const per = Math.sin(G.time * 0.8 + this.ph) * 0.6;
      this.vx = (nx - ny * per) * spd;
      this.vy = (ny + nx * per) * spd;
    } else if (kind === 'loom') {
      const keep = 340;
      const s2 = dd > keep + 70 ? 1 : (dd < keep - 70 ? -0.8 : 0);
      this.vx = (nx * s2 - ny * 0.7) * spd;
      this.vy = (ny * s2 + nx * 0.7) * spd;
    } else if (kind === 'carrion') {
      const frac = this.hp / this.maxHp;
      if (!this.split1 && frac <= 0.5) { this.split1 = true; G.splitCarrion(this); }
      if (!this.split2 && frac <= 0.22) { this.split2 = true; G.splitCarrion(this); }
      this.vx = nx * spd; this.vy = ny * spd;
      this.oozeT = (this.oozeT || 0) - dt;
      if (this.oozeT <= 0 && this.spawnT <= 0) {
        this.oozeT = 0.9 - ph * 0.18;
        G.addPool(new Pool(this.x, this.y, 62 + ph * 10, (13 + ph * 5) * G.dmgScale, 5.0, col, { hostile: true }));
      }
    } else if (kind === 'orrery') {
      const keep = 300;
      const s2 = dd > keep + 60 ? 1 : (dd < keep - 60 ? -0.7 : 0);
      // each moon lost makes it faster and more frantic
      const lost = 4 - this.moonsAlive();
      this.vx = (nx * s2 - ny * 0.55) * spd * (1 + lost * 0.22);
      this.vy = (ny * s2 + nx * 0.55) * spd * (1 + lost * 0.22);
      this.moonA = (this.moonA || 0) + dt * (0.7 + lost * 0.4);
      if (!this.moons) { this.moons = G.spawnMoons(this, 4); }
    } else if (kind === 'witness') {
      // it keeps the last six seconds of you on tape
      const keep = 360;
      const s2 = dd > keep + 70 ? 1 : (dd < keep - 70 ? -0.8 : 0);
      this.vx = (nx * s2 - ny * 0.5) * spd;
      this.vy = (ny * s2 + nx * 0.5) * spd;
      const pl1 = G.player;
      if (!this.tape) this.tape = [];
      this.tapeT = (this.tapeT || 0) - dt;
      if (this.tapeT <= 0 && pl1) {
        this.tapeT = 0.1;
        this.tape.push({ x: pl1.x, y: pl1.y });
        while (this.tape.length > 60) this.tape.shift();
      }
      if (!this.echoes) this.echoes = [];
      for (let i = this.echoes.length - 1; i >= 0; i--) {
        const E = this.echoes[i];
        E.t += dt * 1.4;
        const idx = Math.floor(E.t / 0.1);
        if (idx >= E.path.length - 1) { this.echoes.splice(i, 1); continue; }
        const a1 = E.path[idx], a2 = E.path[idx + 1];
        const f = (E.t / 0.1) - idx;
        const px = a1.x + (a2.x - a1.x) * f, py = a1.y + (a2.y - a1.y) * f;
        E.hx = px; E.hy = py;
        const mvA = Math.atan2(a2.y - a1.y, a2.x - a1.x);
        E.fire -= dt;
        if (E.fire <= 0) {
          E.fire = 0.15;
          for (const sgn of [1, -1]) {
            const a = mvA + sgn * Math.PI / 2;
            G.enemyBullet(px, py, Math.cos(a) * 210, Math.sin(a) * 210, 11 * G.dmgScale, col);
          }
        }
      }
    } else if (kind === 'tithe') {
      const keep = 320;
      const s2 = dd > keep + 60 ? 1 : (dd < keep - 60 ? -0.9 : 0);
      this.vx = (nx * s2 + ny * 0.55) * spd;
      this.vy = (ny * s2 - nx * 0.55) * spd;
      if (!this.tookT) { this.tookT = 1; G.titheTake(this); }
    } else if (kind === 'aperture') {
      this.vx = nx * spd * 0.4; this.vy = ny * spd * 0.4;
      this.openT = Math.max(0, (this.openT || 0) - dt);
      this.gapA = (this.gapA || 0) + dt * 0.7 * (G.D.bossGentle ? 0.6 : 1);
      this.gap2A = (this.gap2A || 2) - dt * 0.55;
      // the ring only bites while the shutter is shut
      const pl2 = G.player;
      if (this.openT <= 0 && pl2 && !pl2.dead && this.spawnT <= 0) {
        const rad = 100 + this.r;
        const d2 = Math.hypot(pl2.x - this.x, pl2.y - this.y);
        if (Math.abs(d2 - rad) < 22) {
          const pa = Math.atan2(pl2.y - this.y, pl2.x - this.x);
          const inGap = Math.abs(angDiff(pa, this.gapA)) < (G.D.bossGentle ? 0.6 : 0.4)
            || (ph >= 1 && Math.abs(angDiff(pa, this.gap2A)) < 0.4);
          if (!inGap) pl2.damage(this.dmg * 0.5);
        }
      }
    } else if (kind === 'cultivar') {
      // it barely fights you. It gardens, and the garden fights you.
      this.vx = nx * spd * 0.42; this.vy = ny * spd * 0.42;
      if (!this.seedList) this.seedList = [];
      const pl0 = G.player;
      let matured = 0;

            sd.fireT = G.bossCd(2.5);
