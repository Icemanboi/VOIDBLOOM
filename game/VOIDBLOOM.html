        for (let i = 0; i < 3; i++) {
          const rr = R * (0.75 + i * 0.28);
          c.save(); c.rotate(i * 0.6);
          c.globalAlpha = 1;
          neon(c, cc => { cc.save(); cc.scale(1, 0.42); cc.beginPath(); cc.arc(0, 0, rr, 0, TAU); cc.restore(); }, col, { lw: 1.8, blur: 12, core: null, inner: false });
          c.restore();
        }
        neon(c, cc => pathStar(cc, 8, R * 0.36, R * 0.14, 0), '#fff', { lw: 1.8, blur: 14, core: null, inner: false });
        break;
      }
      case 'husk': {
        // the plated face is bright, the back is bare
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R, -1.15, 1.15); cc.closePath(); }, col, { lw: 4.2, blur: 28, core: 'rgba(6,3,8,0.9)' });
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.78, -1.0, 1.0); }, '#ffd166', { lw: 2.6, blur: 18, core: null, inner: false });
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.9, 1.15, TAU - 1.15); cc.closePath(); }, '#8f5c4a', { lw: 2, blur: 12, core: 'rgba(4,3,8,0.8)' });
        neon(c, cc => { cc.beginPath(); cc.arc(-R * 0.45, 0, R * 0.24, 0, TAU); }, '#ff5470', { lw: 2.4, blur: 18, core: null, inner: false });
        neon(c, cc => { cc.beginPath(); cc.arc(R * 0.5, 0, R * 0.16, 0, TAU); }, '#fff', { lw: 1.8, blur: 12, core: null, inner: false });
        break;
      }
      case 'howler':
        neon(c, cc => pathStar(cc, 3, R * 1.25, R * 0.5, -Math.PI / 2), col, o);
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.34, 0, TAU); }, '#fff', { lw: 1.6, blur: 10, core: null, inner: false });
        break;
      case 'monolith':
        neon(c, cc => { cc.beginPath(); cc.rect(-R * 0.62, -R, R * 1.24, R * 2); }, col, { lw: 3.2, blur: 20, core: core });
        neon(c, cc => { cc.beginPath(); cc.rect(-R * 0.3, -R * 0.66, R * 0.6, R * 1.32); }, col, { lw: 1.8, blur: 9, core: null, inner: false });
        neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 0.5, 0); cc.lineTo(R * 0.5, 0); }, '#fff', { lw: 1.5, blur: 8, core: null, inner: false });
        break;
      case 'hexer':
        neon(c, cc => pathPoly(cc, 6, R, 0), col, o);
        neon(c, cc => pathPoly(cc, 3, R * 0.55, Math.PI / 2), col, { lw: 1.8, blur: 10, core: null, inner: false });
        neon(c, cc => pathPoly(cc, 3, R * 0.55, -Math.PI / 2), col, { lw: 1.8, blur: 10, core: null, inner: false });
        break;
      case 'lancer':
        neon(c, cc => { cc.beginPath(); cc.moveTo(R * 1.7, 0); cc.lineTo(-R * 0.6, R * 0.6); cc.lineTo(-R * 0.25, 0); cc.lineTo(-R * 0.6, -R * 0.6); cc.closePath(); }, col, o);
        neon(c, cc => { cc.beginPath(); cc.moveTo(R * 1.0, 0); cc.lineTo(-R * 0.3, 0); }, '#fff', { lw: 1.4, blur: 8, core: null, inner: false });
        break;
      case 'weaver':
        neon(c, cc => pathStar(cc, 6, R * 1.15, R * 0.44, 0), col, o);
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.46, 0, TAU); }, col, { lw: 1.6, blur: 8, core: null, inner: false });
        break;
      case 'harbinger': {
        neon(c, cc => pathStar(cc, 7, R, R * 0.5, -Math.PI / 2), col, { lw: 3.2, blur: 26, core: 'rgba(5,3,8,0.85)' });
        neon(c, cc => pathPoly(cc, 7, R * 0.6, 0), '#ffd166', { lw: 2, blur: 14, core: null, inner: false });
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.26, 0, TAU); }, '#fff', { lw: 2, blur: 12, core: null, inner: false });
        break;
      }
      case 'sentinel': {
        neon(c, cc => pathPoly(cc, 4, R, 0), col, { lw: 3.4, blur: 26, core: 'rgba(2,3,8,0.85)' });
        neon(c, cc => pathPoly(cc, 4, R * 0.72, Math.PI / 4), '#a8dfff', { lw: 2.2, blur: 15, core: null, inner: false });
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.3, 0, TAU); }, '#fff', { lw: 2.2, blur: 14, core: null, inner: false });
        break;
      }
      case 'carver': {
        neon(c, cc => { cc.beginPath(); cc.moveTo(R * 1.6, 0); cc.lineTo(-R * 0.4, R * 1.05); cc.lineTo(-R * 0.9, 0); cc.lineTo(-R * 0.4, -R * 1.05); cc.closePath(); }, col, { lw: 3.2, blur: 24, core: 'rgba(3,5,8,0.85)' });
        neon(c, cc => { cc.beginPath(); cc.moveTo(R * 0.9, 0); cc.lineTo(-R * 0.5, 0); }, '#fff', { lw: 2, blur: 12, core: null, inner: false });
        break;
      }
      case 'choir': {
        neon(c, cc => pathPoly(cc, 5, R * 0.56, -Math.PI / 2), col, o);
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.26, 0, TAU); },
          '#ffffff', { lw: 2, blur: 14, core: null, inner: false });
        break;
      }
      case 'gravewalker': {
        neon(c, cc => pathPoly(cc, 6, R * 0.60, 0), col, o);
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.24, 0, TAU); },
          '#ffd0a0', { lw: 2.2, blur: 14, core: null, inner: false });
        break;
      }
      case 'weep': {
        neon(c, cc => {
          cc.beginPath();
          cc.moveTo(0, -R * 1.5);
          cc.bezierCurveTo(R * 1.05, -R * 0.2, R * 0.95, R * 1.05, 0, R * 1.05);
          cc.bezierCurveTo(-R * 0.95, R * 1.05, -R * 1.05, -R * 0.2, 0, -R * 1.5);
          cc.closePath();
        }, col, { lw: 3.4, blur: 28, core: 'rgba(2,5,8,0.86)' });
        neon(c, cc => { cc.beginPath(); cc.arc(0, R * 0.15, R * 0.42, 0, TAU); }, '#b9ffd9', { lw: 2.2, blur: 16, core: null, inner: false });
        neon(c, cc => { cc.beginPath(); cc.arc(0, R * 0.15, R * 0.16, 0, TAU); }, '#fff', { lw: 2, blur: 12, core: null, inner: false });
        break;
      }
      case 'nullarch': {
        neon(c, cc => pathPoly(cc, 3, R * 1.25, -Math.PI / 2), col, { lw: 3.4, blur: 28, core: 'rgba(4,3,8,0.88)' });
        neon(c, cc => pathPoly(cc, 3, R * 1.25, Math.PI / 2), col, { lw: 3.0, blur: 24, core: null, inner: false });
        neon(c, cc => pathPoly(cc, 6, R * 0.62, 0), '#e9b8ff', { lw: 2.2, blur: 16, core: null, inner: false });
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.24, 0, TAU); }, '#fff', { lw: 2.4, blur: 14, core: null, inner: false });
        break;
      }
      case 'voidheart': {
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * TAU;
          c.save(); c.rotate(a);
          neon(c, cc => {
            cc.beginPath();
            cc.moveTo(R * 0.34, 0);
            cc.quadraticCurveTo(R * 0.9, -R * 0.44, R * 1.5, 0);
            cc.quadraticCurveTo(R * 0.9, R * 0.44, R * 0.34, 0);
            cc.closePath();
          }, col, { lw: 2.8, blur: 26, core: 'rgba(6,3,8,0.85)' });
          c.restore();
        }
        neon(c, cc => {
          cc.beginPath();
          cc.moveTo(0, R * 0.72);
          cc.bezierCurveTo(-R * 1.1, -R * 0.06, -R * 0.5, -R * 0.85, 0, -R * 0.26);
          cc.bezierCurveTo(R * 0.5, -R * 0.85, R * 1.1, -R * 0.06, 0, R * 0.72);
          cc.closePath();
        }, '#ff8fae', { lw: 3, blur: 28, core: 'rgba(8,3,8,0.9)' });
        neon(c, cc => pathStar(cc, 8, R * 0.4, R * 0.16, 0), '#fff', { lw: 2, blur: 16, core: null, inner: false });
        break;
      }
      case 'drifter':
        neon(c, cc => pathPoly(cc, 4, R, 0), col, o);
        neon(c, cc => pathPoly(cc, 4, R * 0.45, 0), col, { lw: 1.6, blur: 8, core: null, inner: false });
        break;
      case 'swarmer':
        neon(c, cc => pathPoly(cc, 3, R * 1.15, -Math.PI / 2), col, { lw: 2.2, blur: 13, core: core });
        break;
      case 'bulwark':
        neon(c, cc => pathPoly(cc, 6, R, 0), col, o);
        neon(c, cc => pathPoly(cc, 6, R * 0.62, Math.PI / 6), col, { lw: 1.8, blur: 9, core: null, inner: false });
        neon(c, cc => pathPoly(cc, 6, R * 0.26, 0), '#fff', { lw: 1.4, blur: 8, core: null, inner: false });
        break;
      case 'spitter':
        neon(c, cc => pathStar(cc, 5, R * 1.2, R * 0.52, -Math.PI / 2), col, o);
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.3, 0, TAU); }, '#fff', { lw: 1.6, blur: 10, core: null, inner: false });
        break;
      case 'splitter':
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R, 0, TAU); }, col, o);
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.58, 0, TAU); }, col, { lw: 1.8, blur: 8, core: null, inner: false });
        neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 0.8, 0); cc.lineTo(R * 0.8, 0); }, col, { lw: 1.4, blur: 6, core: null, inner: false });
        break;
      case 'wraith':
        neon(c, cc => {
          cc.beginPath();
          cc.moveTo(R * 1.5, 0); cc.lineTo(-R * 0.5, R * 0.85);
          cc.lineTo(-R * 0.1, 0); cc.lineTo(-R * 0.5, -R * 0.85);
          cc.closePath();
        }, col, o);
        break;
      case 'warden': {
        neon(c, cc => pathPoly(cc, 8, R, Math.PI / 8), col, { lw: 3.4, blur: 26, core: 'rgba(4,3,8,0.85)' });
        neon(c, cc => pathPoly(cc, 8, R * 0.74, 0), '#ffb347', { lw: 2, blur: 14, core: null, inner: false });
        neon(c, cc => pathPoly(cc, 3, R * 0.42, -Math.PI / 2), '#fff', { lw: 2, blur: 12, core: null, inner: false });
        break;
      }
      case 'bloom': {
        for (let i = 0; i < 6; i++) {
          const a = i / 6 * TAU;
          c.save(); c.rotate(a);
          neon(c, cc => {
            cc.beginPath();
            cc.moveTo(R * 0.28, 0);
            cc.quadraticCurveTo(R * 0.95, -R * 0.62, R * 1.55, 0);
            cc.quadraticCurveTo(R * 0.95, R * 0.62, R * 0.28, 0);
            cc.closePath();
          }, col, { lw: 3, blur: 24, core: 'rgba(6,3,8,0.8)' });
          c.restore();
        }
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.55, 0, TAU); }, '#ffd166', { lw: 3, blur: 26, core: 'rgba(8,3,8,0.9)' });
        neon(c, cc => pathStar(cc, 6, R * 0.44, R * 0.2, 0), '#fff', { lw: 1.8, blur: 14, core: null, inner: false });
        break;
      }
    }
  });
}

/* --------------------------------------------------------------- UI icons */
function drawIcon(c, id, s) {
  const q = Math.round(s);
  const spr = sprite('icon_' + id + '_' + q, q * 2.2, q * 2.2, cc => paintIcon(cc, id, q));
  c.drawImage(spr, -spr.width / 2, -spr.height / 2);
}
function paintIcon(c, id, s) {
  // draws centred in a box of size s (ctx already translated to centre)
  const R = s * 0.34;
  const W = WEAPONS[id], P = PASSIVES[id];
  const evoOf = WEAPON_IDS.find(k => WEAPONS[k].evo.id === id);
  const col = W ? W.color : (P ? P.color : (evoOf ? WEAPONS[evoOf].evo.color : '#fff'));
  const o = { lw: 2.4, blur: 14, core: 'rgba(255,255,255,0.05)' };
  const base = evoOf || id;
  switch (base) {
    case 'toll':
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(-R * 0.75, R * 0.6);
        cc.quadraticCurveTo(-R * 0.7, -R * 0.9, 0, -R * 1.0);
        cc.quadraticCurveTo(R * 0.7, -R * 0.9, R * 0.75, R * 0.6);
        cc.closePath();
      }, col, o);
      neon(c, cc => { cc.beginPath(); cc.arc(0, R * 0.8, R * 0.2, 0, TAU); }, '#fff', { lw: 1.6, blur: 10, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 1.35, -0.6, 0.6); cc.moveTo(0, 0); }, col, { lw: 1.4, blur: 8, core: null, inner: false });
      break;
    case 'brand':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 1.1, 0, TAU); }, col, { lw: 1.6, blur: 9, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 0.6, -R * 0.6); cc.lineTo(R * 0.6, R * 0.6); cc.moveTo(R * 0.6, -R * 0.6); cc.lineTo(-R * 0.6, R * 0.6); }, col, { lw: 3, blur: 14, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.2, 0, TAU); }, '#fff', { lw: 1.6, blur: 10, core: null, inner: false });
      break;
    case 'quake':
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.3, R * 0.55); cc.lineTo(-R * 0.4, R * 0.2); cc.lineTo(-R * 0.6, -R * 0.3); cc.lineTo(R * 0.3, -R * 0.7); cc.lineTo(R * 0.1, -R * 0.1); cc.lineTo(R * 1.3, -R * 0.5); }, col, { lw: 2.6, blur: 13, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.0, R * 1.15); cc.lineTo(R * 1.0, R * 1.15); }, col, { lw: 1.6, blur: 8, core: null, inner: false });
      break;
    case 'splice':
      neon(c, cc => { cc.beginPath(); cc.arc(-R * 0.9, -R * 0.5, R * 0.3, 0, TAU); }, col, { lw: 2, blur: 11, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(R * 0.9, R * 0.5, R * 0.3, 0, TAU); }, col, { lw: 2, blur: 11, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 0.62, -R * 0.34); cc.lineTo(-R * 0.1, -R * 0.5); cc.lineTo(R * 0.1, R * 0.16); cc.lineTo(R * 0.62, R * 0.34); }, '#fff', { lw: 2, blur: 11, core: null, inner: false });
      break;
    case 'shroud':
      neon(c, cc => pathBlob(cc, R * 1.05, 11, 0.26, 77), col, { lw: 2.2, blur: 15, core: 'rgba(160,180,220,0.10)' });
      neon(c, cc => pathBlob(cc, R * 0.5, 8, 0.3, 21), col, { lw: 1.5, blur: 8, core: null, inner: false });
      break;
    case 'pendulum':
      neon(c, cc => { cc.beginPath(); cc.moveTo(0, -R * 1.25); cc.lineTo(R * 0.5, R * 0.45); }, col, { lw: 2.2, blur: 11, core: null, inner: false });
      neon(c, cc => pathPoly(cc, 6, R * 0.42, 0.3), col, { lw: 2.4, blur: 15, core: 'rgba(255,255,255,0.06)' });
      neon(c, cc => { cc.beginPath(); cc.arc(0, -R * 1.25, R * 0.16, 0, TAU); }, '#fff', { lw: 1.6, blur: 9, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, -R * 1.25, R * 1.5, 0.5, 1.35); }, col, { lw: 1.3, blur: 7, core: null, inner: false });
      break;
    case 'siphon':
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.25, 0); cc.lineTo(R * 1.25, 0); }, col, { lw: 3.4, blur: 16, core: null, inner: false });
      for (let i = 0; i < 3; i++) {
        neon(c, cc => { cc.beginPath(); cc.arc(-R * 0.6 + i * R * 0.6, 0, R * (0.34 - i * 0.08), 0, TAU); }, col, { lw: 1.7, blur: 10, core: null, inner: false });
      }
      break;
    case 'undertow':
      for (let i = 0; i < 3; i++) {
        const y = (i - 1) * R * 0.62;
        neon(c, cc => {
          cc.beginPath();
          cc.moveTo(-R * 1.3, y);
          cc.quadraticCurveTo(-R * 0.4, y - R * 0.4, R * 0.3, y);
          cc.quadraticCurveTo(R * 0.8, y + R * 0.4, R * 1.3, y);
        }, col, { lw: 2.4, blur: 12, core: null, inner: false });
      }
      break;
    case 'sunder':
      for (let i = 0; i < 5; i++) {
        const a = -0.72 + i * 0.36;
        neon(c, cc => { cc.beginPath(); cc.moveTo(Math.cos(a) * R * 0.3, Math.sin(a) * R * 0.3); cc.lineTo(Math.cos(a) * R * 1.3, Math.sin(a) * R * 1.3); }, col, { lw: 2.2, blur: 10, core: null, inner: false });
      }
      neon(c, cc => { cc.beginPath(); cc.arc(-R * 0.5, 0, R * 0.26, 0, TAU); }, '#fff', { lw: 1.6, blur: 9, core: null, inner: false });
      break;
    case 'pharos':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.34, 0, TAU); }, col, { lw: 2.4, blur: 14, core: 'rgba(255,255,255,0.07)' });
      neon(c, cc => { cc.beginPath(); cc.moveTo(R * 0.3, -R * 0.16); cc.lineTo(R * 1.4, -R * 0.62); cc.lineTo(R * 1.4, R * 0.62); cc.lineTo(R * 0.3, R * 0.16); cc.closePath(); }, col, { lw: 1.8, blur: 12, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 1.05, 2.5, 4.0); }, col, { lw: 1.6, blur: 8, core: null, inner: false });
      break;
    case 'wake':
      for (let i = 0; i < 3; i++) {
        neon(c, cc => { cc.beginPath(); cc.arc(-R * 0.8 + i * R * 0.8, 0, R * (0.32 + i * 0.16), 0, TAU); }, col, { lw: 2.2 - i * 0.3, blur: 12, core: null, inner: false });
      }
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.35, 0); cc.lineTo(-R * 0.95, 0); }, '#fff', { lw: 2.4, blur: 10, core: null, inner: false });
      break;
    case 'harvest':
      neon(c, cc => { cc.beginPath(); cc.arc(0, R * 0.2, R * 0.55, Math.PI * 0.15, Math.PI * 0.85, true); }, col, { lw: 3, blur: 14, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.moveTo(R * 0.52, R * 0.28); cc.lineTo(R * 0.52, -R * 1.2); }, col, { lw: 2.2, blur: 10, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(-R * 0.45, -R * 0.6, R * 0.2, 0, TAU); }, '#fff', { lw: 1.5, blur: 9, core: null, inner: false });
      break;
    case 'ricochet':
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.25, R * 0.9); cc.lineTo(-R * 0.2, -R * 0.5); cc.lineTo(R * 0.5, R * 0.5); cc.lineTo(R * 1.25, -R * 1.0); }, col, { lw: 2.4, blur: 13, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(R * 1.25, -R * 1.0, R * 0.2, 0, TAU); }, '#fff', { lw: 1.5, blur: 9, core: null, inner: false });
      break;
    case 'familiar':
      neon(c, cc => { cc.beginPath(); cc.moveTo(R * 1.15, 0); cc.lineTo(-R * 0.65, R * 0.7); cc.lineTo(-R * 0.25, 0); cc.lineTo(-R * 0.65, -R * 0.7); cc.closePath(); }, col, o);
      neon(c, cc => { cc.beginPath(); cc.arc(-R * 1.0, R * 0.75, R * 0.16, 0, TAU); cc.moveTo(-R * 0.6, -R * 1.0); cc.arc(-R * 0.75, -R * 1.0, R * 0.16, 0, TAU); }, col, { lw: 1.4, blur: 8, core: null, inner: false });
      break;
    case 'thirst':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 1.2, 0, TAU); }, col, { lw: 1.5, blur: 9, core: null, inner: false });
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(0, -R * 1.0);
        cc.bezierCurveTo(R * 0.72, -R * 0.1, R * 0.5, R * 0.85, 0, R * 0.85);
        cc.bezierCurveTo(-R * 0.5, R * 0.85, -R * 0.72, -R * 0.1, 0, -R * 1.0);
        cc.closePath();
      }, col, { lw: 2.2, blur: 14, core: 'rgba(255,255,255,0.06)' });
      break;
    case 'longshot':
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.4, R * 0.5); cc.lineTo(R * 1.4, -R * 0.5); }, col, { lw: 4.5, blur: 18, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(R * 1.0, -R * 0.36, R * 0.4, 0, TAU); }, col, { lw: 1.6, blur: 9, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.moveTo(R * 0.7, -R * 0.36); cc.lineTo(R * 1.3, -R * 0.36); cc.moveTo(R * 1.0, -R * 0.66); cc.lineTo(R * 1.0, -R * 0.06); }, '#fff', { lw: 1.3, blur: 8, core: null, inner: false });
      break;
    case 'glacier':
      for (let i = 0; i < 3; i++) {
        const a = -Math.PI / 2 + (i - 1) * 0.72;
        neon(c, cc => { cc.beginPath(); cc.moveTo(Math.cos(a) * R * 1.2, Math.sin(a) * R * 1.2); cc.lineTo(Math.cos(a + 0.34) * R * 0.34, Math.sin(a + 0.34) * R * 0.34); cc.lineTo(Math.cos(a - 0.34) * R * 0.34, Math.sin(a - 0.34) * R * 0.34); cc.closePath(); }, col, { lw: 2, blur: 11, core: 'rgba(255,255,255,0.06)' });
      }
      break;
    case 'sever':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.95, -2.2, 0.9); }, col, { lw: 3.4, blur: 15, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.moveTo(Math.cos(0.9) * R * 0.95, Math.sin(0.9) * R * 0.95); cc.lineTo(Math.cos(0.9) * R * 1.35, Math.sin(0.9) * R * 1.35); }, col, { lw: 2.4, blur: 10, core: null, inner: false });
      neon(c, cc => pathPoly(cc, 3, R * 0.34, 2.4), col, { lw: 2, blur: 10, core: null, inner: false });
      break;
    case 'beacon':
      neon(c, cc => { cc.beginPath(); cc.moveTo(0, -R * 1.2); cc.lineTo(R * 0.52, R * 0.55); cc.lineTo(-R * 0.52, R * 0.55); cc.closePath(); }, col, o);
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 0.95, R * 1.0); cc.lineTo(R * 0.95, R * 1.0); }, col, { lw: 2.2, blur: 10, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, -R * 0.5, R * 0.16, 0, TAU); }, '#fff', { lw: 1.8, blur: 10, core: null, inner: false });
      break;
    case 'hunger':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 1.15, 0, TAU); }, col, { lw: 1.6, blur: 9, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.72, 0, TAU); }, col, { lw: 2.4, blur: 14, core: 'rgba(0,0,0,0.9)' });
      for (let i = 0; i < 4; i++) {
        const a = i / 4 * TAU + 0.4;
        neon(c, cc => { cc.beginPath(); cc.moveTo(Math.cos(a) * R * 1.5, Math.sin(a) * R * 1.5); cc.lineTo(Math.cos(a) * R * 1.0, Math.sin(a) * R * 1.0); }, col, { lw: 1.8, blur: 8, core: null, inner: false });
      }
      break;
    case 'cinder':
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.1, -R * 0.85); cc.lineTo(R * 1.15, 0); cc.lineTo(-R * 1.1, R * 0.85); cc.closePath(); }, col, { lw: 2.2, blur: 14, core: 'rgba(255,120,40,0.10)' });
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 0.5, -R * 0.32); cc.lineTo(R * 0.75, 0); cc.lineTo(-R * 0.5, R * 0.32); cc.closePath(); }, '#fff', { lw: 1.4, blur: 9, core: null, inner: false });
      break;
    case 'veil':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 1.1, -1.15, 1.15); }, col, { lw: 4.5, blur: 16, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.78, -0.95, 0.95); }, col, { lw: 2, blur: 10, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.22, 0, TAU); }, '#fff', { lw: 1.8, blur: 10, core: null, inner: false });
      break;
    case 'tether':
      neon(c, cc => { cc.beginPath(); cc.arc(-R * 0.75, R * 0.5, R * 0.34, 0, TAU); }, col, { lw: 2.2, blur: 12, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(R * 0.75, -R * 0.5, R * 0.34, 0, TAU); }, col, { lw: 2.2, blur: 12, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 0.5, R * 0.3); cc.lineTo(R * 0.5, -R * 0.3); }, '#fff', { lw: 2.4, blur: 12, core: null, inner: false });
      break;
    case 'verdict':
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 0.42, -R * 1.3); cc.lineTo(R * 0.42, -R * 1.3); cc.lineTo(R * 0.72, R * 1.15); cc.lineTo(-R * 0.72, R * 1.15); cc.closePath(); }, col, { lw: 2.2, blur: 16, core: 'rgba(255,255,255,0.07)' });
      neon(c, cc => { cc.beginPath(); cc.moveTo(0, -R * 1.15); cc.lineTo(0, R * 1.0); }, '#fff', { lw: 1.6, blur: 10, core: null, inner: false });
      break;
    case 'rupture':
      neon(c, cc => pathPoly(cc, 8, R * 0.6, 0), col, o);
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU;
        neon(c, cc => { cc.beginPath(); cc.moveTo(Math.cos(a) * R * 0.85, Math.sin(a) * R * 0.85); cc.lineTo(Math.cos(a) * R * 1.35, Math.sin(a) * R * 1.35); }, col, { lw: 2, blur: 9, core: null, inner: false });
      }
      break;
    case 'starfall':
      for (let i = 0; i < 3; i++) {
        const dx = (i - 1) * R * 0.75, dy = (i % 2 ? -1 : 1) * R * 0.3;
        neon(c, cc => { cc.beginPath(); cc.moveTo(dx - R * 0.5, dy - R * 0.85); cc.lineTo(dx + R * 0.18, dy + R * 0.2); }, col, { lw: 2.4, blur: 11, core: null, inner: false });
        neon(c, cc => { cc.beginPath(); cc.arc(dx + R * 0.22, dy + R * 0.32, R * 0.17, 0, TAU); }, '#fff', { lw: 1.5, blur: 9, core: null, inner: false });
      }
      break;
    /* new passives */
    case 'rime':
      for (let i = 0; i < 3; i++) {
        const a = i / 3 * Math.PI;
        neon(c, cc => { cc.beginPath(); cc.moveTo(-Math.cos(a) * R * 1.2, -Math.sin(a) * R * 1.2); cc.lineTo(Math.cos(a) * R * 1.2, Math.sin(a) * R * 1.2); }, col, { lw: 2.2, blur: 11, core: null, inner: false });
      }
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.28, 0, TAU); }, '#fff', { lw: 1.6, blur: 9, core: null, inner: false });
      break;
    case 'recoil':
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.2, 0); cc.lineTo(R * 0.8, 0); cc.moveTo(R * 0.2, -R * 0.5); cc.lineTo(R * 0.85, 0); cc.lineTo(R * 0.2, R * 0.5); }, col, { lw: 2.6, blur: 12, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.2, -R * 0.65); cc.lineTo(-R * 0.55, -R * 0.65); cc.moveTo(-R * 1.2, R * 0.65); cc.lineTo(-R * 0.55, R * 0.65); }, col, { lw: 1.8, blur: 8, core: null, inner: false });
      break;
    case 'anchor':
      neon(c, cc => { cc.beginPath(); cc.moveTo(0, -R * 1.1); cc.lineTo(0, R * 1.0); }, col, { lw: 2.6, blur: 12, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, R * 0.35, R * 0.85, 0.35, Math.PI - 0.35); }, col, { lw: 2.4, blur: 12, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, -R * 0.85, R * 0.28, 0, TAU); }, '#fff', { lw: 1.8, blur: 9, core: null, inner: false });
      break;
    case 'gravity':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.4, 0, TAU); }, col, { lw: 2.4, blur: 14, core: 'rgba(0,0,0,0.85)' });
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * TAU;
        neon(c, cc => { cc.beginPath(); cc.moveTo(Math.cos(a) * R * 1.35, Math.sin(a) * R * 1.35); cc.lineTo(Math.cos(a) * R * 0.72, Math.sin(a) * R * 0.72); }, col, { lw: 1.9, blur: 9, core: null, inner: false });
      }
      break;
    case 'ember':
      neon(c, cc => { cc.beginPath(); cc.moveTo(0, R * 1.1); cc.bezierCurveTo(-R * 1.05, R * 0.2, -R * 0.15, -R * 0.35, 0, -R * 1.15); cc.bezierCurveTo(R * 0.15, -R * 0.35, R * 1.05, R * 0.2, 0, R * 1.1); cc.closePath(); }, col, o);
      break;
    case 'aegis':
      neon(c, cc => { cc.beginPath(); cc.moveTo(0, -R * 1.2); cc.lineTo(R * 0.95, -R * 0.6); cc.lineTo(R * 0.7, R * 0.75); cc.lineTo(0, R * 1.25); cc.lineTo(-R * 0.7, R * 0.75); cc.lineTo(-R * 0.95, -R * 0.6); cc.closePath(); }, col, o);
      neon(c, cc => { cc.beginPath(); cc.moveTo(0, -R * 0.6); cc.lineTo(0, R * 0.65); }, '#fff', { lw: 1.5, blur: 8, core: null, inner: false });
      break;
    case 'tension':
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.2, R * 0.75); cc.quadraticCurveTo(0, -R * 1.3, R * 1.2, R * 0.75); }, col, { lw: 2.6, blur: 13, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.2, R * 0.75); cc.lineTo(R * 1.2, R * 0.75); }, col, { lw: 1.6, blur: 8, core: null, inner: false });
      break;
    case 'omen':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 1.05, 0, TAU); }, col, { lw: 2.2, blur: 12, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(R * 0.34, -R * 0.2, R * 0.95, 0, TAU); }, '#0a0c1a', { lw: 0.1, blur: 0, core: '#0a0c1a', inner: false });
      neon(c, cc => pathStar(cc, 4, R * 0.34, R * 0.1, -Math.PI / 2), '#fff', { lw: 1.4, blur: 9, core: null, inner: false });
      break;
    case 'volatile':
      neon(c, cc => pathStar(cc, 9, R * 1.2, R * 0.5, 0), col, { lw: 2.2, blur: 14, core: 'rgba(255,120,140,0.10)' });
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.3, 0, TAU); }, '#fff', { lw: 1.8, blur: 10, core: null, inner: false });
      break;
    case 'fate':
      neon(c, cc => pathPoly(cc, 6, R * 1.1, 0), col, { lw: 2, blur: 11, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(-R * 0.35, -R * 0.3, R * 0.15, 0, TAU); cc.moveTo(R * 0.5, R * 0.25); cc.arc(R * 0.35, R * 0.25, R * 0.15, 0, TAU); cc.moveTo(R * 0.15, -R * 0.35); cc.arc(0, -R * 0.35, R * 0.15, 0, TAU); }, '#fff', { lw: 1.5, blur: 9, core: null, inner: false });
      break;
    case 'pulse':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.6, 0, TAU); }, col, o);
      for (let i = 0; i < 3; i++) {
        const a = i / 3 * TAU - 0.4;
        neon(c, cc => { cc.beginPath(); cc.arc(Math.cos(a) * R * 1.05, Math.sin(a) * R * 1.05, R * 0.2, 0, TAU); }, col, { lw: 1.6, blur: 8, core: null, inner: false });
      }
      break;
    case 'lash':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R, -1.0, 1.0); }, col, { lw: 4, blur: 16, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.66, -0.8, 0.8); }, col, { lw: 2.4, blur: 10, core: null, inner: false });
      break;
    case 'prism':
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.1, R * 0.55); cc.lineTo(R * 1.1, -R * 0.55); }, col, { lw: 5, blur: 18, core: null, inner: false });
      neon(c, cc => pathPoly(cc, 3, R * 0.5, -Math.PI / 2), col, { lw: 2, blur: 10, core: null, inner: false });
      break;
    case 'thorns':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.85, 0, TAU); }, col, { lw: 1.6, blur: 8, core: null, inner: false });
      for (let i = 0; i < 4; i++) {
        const a = i / 4 * TAU + 0.4;
        c.save(); c.translate(Math.cos(a) * R * 0.85, Math.sin(a) * R * 0.85); c.rotate(a);
        neon(c, cc => pathPoly(cc, 3, R * 0.3, 0), col, { lw: 1.8, blur: 9, core: null, inner: false });
        c.restore();
      }
      break;
    case 'nova':
      for (let i = 0; i < 3; i++) {
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * (0.35 + i * 0.35), 0, TAU); }, col, { lw: 2.6 - i * 0.6, blur: 14, core: null, inner: false });
      }
      break;
    case 'seeker':
      for (let i = 0; i < 2; i++) {
        c.save(); c.translate(-R * 0.3 + i * R * 0.6, i ? R * 0.35 : -R * 0.35); c.rotate(-0.5);
        neon(c, cc => {
          cc.beginPath(); cc.moveTo(R * 0.62, 0); cc.lineTo(-R * 0.3, R * 0.32); cc.lineTo(-R * 0.1, 0); cc.lineTo(-R * 0.3, -R * 0.32); cc.closePath();
        }, col, { lw: 2, blur: 11, core: 'rgba(255,255,255,0.06)' });
        c.restore();
      }
      break;
    case 'arc':
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(-R, -R * 0.9); cc.lineTo(-R * 0.1, -R * 0.15); cc.lineTo(-R * 0.45, R * 0.1);
        cc.lineTo(R * 0.9, R * 0.95);
      }, col, { lw: 3, blur: 16, core: null, inner: false });
      break;
    case 'mire':
      neon(c, cc => pathBlob(cc, R, 9, 0.4, 7), col, { lw: 2.4, blur: 14, core: 'rgba(120,60,255,0.14)' });
      neon(c, cc => pathBlob(cc, R * 0.45, 7, 0.5, 13), col, { lw: 1.6, blur: 8, core: null, inner: false });
      break;
    /* passives */
    case 'focus':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R, 0, TAU); }, col, { lw: 2, blur: 12, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 1.25, 0); cc.lineTo(-R * 0.4, 0); cc.moveTo(R * 0.4, 0); cc.lineTo(R * 1.25, 0); cc.moveTo(0, -R * 1.25); cc.lineTo(0, -R * 0.4); cc.moveTo(0, R * 0.4); cc.lineTo(0, R * 1.25); }, col, { lw: 2.2, blur: 10, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.16, 0, TAU); }, '#fff', { lw: 2, blur: 10, core: null, inner: false });
      break;
    case 'rapid':
      neon(c, cc => { cc.beginPath(); cc.moveTo(R * 0.25, -R * 1.15); cc.lineTo(-R * 0.55, R * 0.1); cc.lineTo(R * 0.05, R * 0.1); cc.lineTo(-R * 0.25, R * 1.15); cc.lineTo(R * 0.6, -R * 0.15); cc.lineTo(R * 0.0, -R * 0.15); cc.closePath(); }, col, o);
      break;
    case 'reach':
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 1.1, 0, TAU); }, col, { lw: 1.6, blur: 8, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, R * 0.5, 0, TAU); }, col, { lw: 2.2, blur: 12, core: null, inner: false });
      for (let i = 0; i < 4; i++) {
        const a = i / 4 * TAU + Math.PI / 4;
        neon(c, cc => { cc.beginPath(); cc.moveTo(Math.cos(a) * R * 0.62, Math.sin(a) * R * 0.62); cc.lineTo(Math.cos(a) * R * 1.0, Math.sin(a) * R * 1.0); }, col, { lw: 2, blur: 8, core: null, inner: false });
      }
      break;
    case 'haste':
      for (let i = 0; i < 3; i++) {
        neon(c, cc => {
          const y = (i - 1) * R * 0.62;
          cc.beginPath(); cc.moveTo(-R * 1.1 + Math.abs(i - 1) * R * 0.3, y); cc.lineTo(R * 0.95, y);
        }, col, { lw: 2.6, blur: 11, core: null, inner: false });
      }
      break;
    case 'echo':
      for (let i = 0; i < 3; i++) {
        neon(c, cc => { cc.beginPath(); cc.arc(-R * 0.5 + i * R * 0.5, 0, R * (0.34 - i * 0.03), 0, TAU); }, col, { lw: 2, blur: 10, core: null, inner: false });
      }
      break;
    case 'vitality':
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(0, R * 1.05);
        cc.bezierCurveTo(-R * 1.5, R * 0.05, -R * 0.7, -R * 1.15, 0, -R * 0.38);
        cc.bezierCurveTo(R * 0.7, -R * 1.15, R * 1.5, R * 0.05, 0, R * 1.05);
        cc.closePath();
      }, col, o);
      break;
    case 'magnet':
      neon(c, cc => { cc.beginPath(); cc.arc(0, R * 0.15, R * 0.85, Math.PI, 0); }, col, { lw: 4.5, blur: 14, core: null, inner: false });
      neon(c, cc => { cc.beginPath(); cc.moveTo(-R * 0.85, R * 0.15); cc.lineTo(-R * 0.85, R * 0.75); cc.moveTo(R * 0.85, R * 0.15); cc.lineTo(R * 0.85, R * 0.75); }, col, { lw: 4.5, blur: 12, core: null, inner: false });
      break;
    case 'fortune':
      neon(c, cc => pathStar(cc, 4, R * 1.15, R * 0.34, -Math.PI / 2), col, o);
      break;
    default:
      neon(c, cc => pathPoly(cc, 6, R, 0), col, o);
  }
}

/* ========================================================================
   SETTINGS  --  comfort options. Screen shake and flashes make some people
   ill, so all of it is turnable down or off without touching the game.
   ======================================================================== */
const Settings = {
  shake: 1,      // 1 full · 0.5 half · 0 off
  flash: 1,      // 1 full · 0.5 half · 0 off
  effects: 1,    // 1 high · 0 low (also stops the auto-quality dropper fighting you)
  fps: false,
  bloom: 1,      // 1 full · 0.55 subtle · 0 off   -- the WebGL glow pass
  crt: 0,        // 1 on · 0 off                   -- scanlines, vignette, fringing
  cosmos: 1,     // 1 on · 0 off                   -- the shaded starfield
  load() {
    const d = Save.data.set;
    if (!d) return;
    if (typeof d.shake === 'number') this.shake = d.shake;
    if (typeof d.flash === 'number') this.flash = d.flash;
    if (typeof d.effects === 'number') this.effects = d.effects;
    if (typeof d.fps === 'boolean') this.fps = d.fps;
    if (typeof d.bloom === 'number') this.bloom = d.bloom;
    if (typeof d.crt2 === 'number') this.crt = d.crt2;   // crt was the old key, and it defaulted on
    if (typeof d.cosmos === 'number') this.cosmos = d.cosmos;
  },
  save() {
    Save.data.set = { shake: this.shake, flash: this.flash, effects: this.effects, fps: this.fps,
                      bloom: this.bloom, crt2: this.crt, cosmos: this.cosmos };
    Save.save();
  },
  cycle(key) {
    if (key === 'shake' || key === 'flash') {
      this[key] = this[key] === 1 ? 0.5 : (this[key] === 0.5 ? 0 : 1);
    } else if (key === 'effects') {
      this.effects = this.effects ? 0 : 1;
      if (this.effects === 0) { G.quality = 0; Particles.max = 800; Backdrop.lite = true; }
      else { G.quality = 1; Particles.max = 2600; Backdrop.lite = false; }
    } else if (key === 'fps') {
      this.fps = !this.fps;
      G.showFps = this.fps;
    } else if (key === 'bloom') {
      this.bloom = this.bloom === 1 ? 0.55 : (this.bloom === 0.55 ? 0 : 1);
      if (!this.bloom) FX.hide(); else { FX.div = 4; FX.slowN = 0; }
    } else if (key === 'crt') {
      this.crt = this.crt ? 0 : 1;
    } else if (key === 'cosmos') {
      this.cosmos = this.cosmos ? 0 : 1;
      if (!this.cosmos) Cosmos.hide(); else Cosmos.scale = 1;
      UI.lastState = '';
    }
    this.save();
  },
  word(v) { return v === 1 ? 'FULL' : (v === 0.5 ? 'HALF' : 'OFF'); },
  bword(v) { return v === 1 ? 'FULL' : (v === 0.55 ? 'SUBTLE' : 'OFF'); }
};

   It is not one of the PLANETS: it has no relic, it is not counted for
   the conquest total, and its run is not a run -- there is nothing in
   the arena but you and what is already there.
   ------------------------------------------------------------------------ */

  finale: 'sower', finaleNow: 'sower',

const RELIC_BY_ID = Object.create(null);
for (const pl of PLANETS) RELIC_BY_ID[pl.relic] = { id: pl.relic, name: pl.relicName, desc: pl.relicDesc, col: pl.col, from: pl.name };
const RELIC_IDS = PLANETS.map(pl => pl.relic);
const MAX_RELICS = 2;

const Conquest = {
  d() {
    const s = Save.data;
    if (!s.conquest) s.conquest = {};
    const q = s.conquest;
    if (!q.diff) q.diff = 'medium';
    if (!q.conquered) q.conquered = {};
    if (!q.relics) q.relics = {};
    if (!q.equipped) q.equipped = [];
    if (!q.best) q.best = {};
    return q;
  },
  taken(id) { return !!this.d().conquered[id]; },
  has(rid) { return !!this.d().relics[rid]; },
  equipped(rid) { return this.d().equipped.indexOf(rid) >= 0; },
  toggle(rid) {
    const q = this.d(); const i = q.equipped.indexOf(rid);
    if (i >= 0) { q.equipped.splice(i, 1); Save.save(); return 'off'; }
    if (!q.relics[rid]) return 'locked';
    if (q.equipped.length >= MAX_RELICS) q.equipped.shift();
    q.equipped.push(rid); Save.save(); return 'on';
  },
  count() { let n = 0; for (const pl of PLANETS) if (this.taken(pl.id)) n++; return n; },
  hasKey(kid) { const k = KEYS.find(x => x.id === kid); return !!k && this.taken(k.from); },
  keyCount() { let n = 0; for (const k of KEYS) if (this.taken(k.from)) n++; return n; },
  keyWhole() { return this.keyCount() >= KEYS.length; },
  holeDone() { return !!this.d().eventide; },
  takeHole(score, time) {
    const q = this.d();
    const first = !q.eventide;
    q.eventide = 1;
    const b = q.best.eventide || { score: 0, time: 0 };
    if (score > (b.score || 0)) b.score = Math.round(score);
    if (time > (b.time || 0)) b.time = Math.round(time);
    q.best.eventide = b;
    Save.save();
    return first;
  },
  // conquering a world puts its boss into the galaxy's gauntlet pool
  pool(exceptId) {
    const out = WILD_BOSSES.slice();
    for (const pl of PLANETS) {
      if (pl.id === exceptId || !this.taken(pl.id)) continue;
      const b = pl.finaleNow;
      if (b && ENEMY[b] && out.indexOf(b) < 0) out.push(b);
    }
    return out;
  },
  conquer(pl, score, time) {
    const q = this.d();
    const first = !q.conquered[pl.id];
    q.conquered[pl.id] = 1;
    q.relics[pl.relic] = 1;
    const b = q.best[pl.id] || { score: 0, time: 0 };
    if (score > (b.score || 0)) b.score = Math.round(score);
    if (time > (b.time || 0)) b.time = Math.round(time);
    q.best[pl.id] = b;
    Save.save();
    return first;
  }
};


/* the colour a skin shows this instant (VOIDCROWN cycles) */
function skinCol(sk, t) {
  if (sk.oil) {
    const h = 186 + Math.sin((t || 0) * 0.5) * 108;
    const l = 72 + Math.sin((t || 0) * 1.1) * 6;
    return 'hsl(' + h.toFixed(0) + ',100%,' + l.toFixed(0) + '%)';
  }
  if (!sk.rainbow) return sk.col;
  const h = ((t || 0) * 40) % 360;
  return 'hsl(' + h.toFixed(0) + ',100%,78%)';
}

/* draws a skin body centred at the origin, sized to R */
function paintSkin(c, sk, R, t) {
  const col = skinCol(sk, t);
  const core = sk.invert ? sk.core : 'rgba(10,34,66,0.8)';
  const o = { lw: 3, blur: 24, core: core };
  switch (sk.id) {
    case 'seed':
      neon(c, x => pathStar(x, 4, R, R * 0.38, 0), col, o);
      break;
    case 'ember':
      neon(c, x => pathStar(x, 4, R, R * 0.38, 0), col, o);
      neon(c, x => pathPoly(x, 4, R * 0.36, 0), sk.ring, { lw: 2, blur: 12, core: null, inner: false });
      break;
    case 'verdant':
      neon(c, x => pathPoly(x, 6, R * 0.92, 0), col, o);
      for (let i = 0; i < 3; i++) {
        const a = i / 3 * TAU - Math.PI / 2;
        neon(c, x => {
          x.beginPath();
          x.moveTo(0, 0);
          x.quadraticCurveTo(Math.cos(a - 0.5) * R * 0.8, Math.sin(a - 0.5) * R * 0.8, Math.cos(a) * R * 0.86, Math.sin(a) * R * 0.86);
          x.quadraticCurveTo(Math.cos(a + 0.5) * R * 0.8, Math.sin(a + 0.5) * R * 0.8, 0, 0);
        }, sk.ring, { lw: 1.8, blur: 11, core: null, inner: false });
      }
      break;
    case 'amethyst':
      neon(c, x => pathStar(x, 6, R, R * 0.46, -Math.PI / 2), col, o);
      neon(c, x => pathPoly(x, 6, R * 0.44, 0), sk.ring, { lw: 2, blur: 12, core: null, inner: false });
      break;
    case 'cinderglass':
      neon(c, x => pathStar(x, 5, R, R * 0.44, -Math.PI / 2), col, o);
      neon(c, x => {
        x.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = i / 5 * TAU - Math.PI / 2;
          x.moveTo(0, 0);
          x.lineTo(Math.cos(a) * R * 0.82, Math.sin(a) * R * 0.82);
        }
      }, sk.ring, { lw: 1.5, blur: 9, core: null, inner: false });
      break;
    case 'tideborn':
      neon(c, x => pathBlob(x, R * 0.92, 9, 0.16, 41), col, o);
      for (let i = 0; i < 3; i++) {
        neon(c, x => { x.beginPath(); x.arc(0, 0, R * (0.28 + i * 0.22), -1.1, 1.1); }, sk.ring, { lw: 1.8, blur: 10, core: null, inner: false });
      }
      break;
    case 'goldleaf':
      neon(c, x => pathStar(x, 8, R, R * 0.5, 0), col, o);
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.44, 0, TAU); }, sk.ring, { lw: 2, blur: 12, core: null, inner: false });
      neon(c, x => pathPoly(x, 4, R * 0.22, 0), '#fff', { lw: 1.6, blur: 10, core: null, inner: false });
      break;
    case 'nullform':
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.82, 0, TAU); }, sk.ring, { lw: 2.6, blur: 22, core: 'rgba(4,0,12,0.96)' });
      for (let i = 0; i < 4; i++) {
        const a = i / 4 * TAU + Math.PI / 4;
        neon(c, x => {
          x.beginPath();
          x.moveTo(Math.cos(a) * R * 0.7, Math.sin(a) * R * 0.7);
          x.lineTo(Math.cos(a) * R * 1.25, Math.sin(a) * R * 1.25);
        }, col, { lw: 2.4, blur: 14, core: null, inner: false });
      }
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.24, 0, TAU); }, col, { lw: 1.8, blur: 14, core: null, inner: false });
      break;
    case 'bloomheart':
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU;
        c.save(); c.rotate(a);
        neon(c, x => {
          x.beginPath();
          x.moveTo(R * 0.2, 0);
          x.quadraticCurveTo(R * 0.66, -R * 0.44, R * 1.08, 0);
          x.quadraticCurveTo(R * 0.66, R * 0.44, R * 0.2, 0);
          x.closePath();
        }, col, { lw: 2.2, blur: 18, core: 'rgba(30,2,24,0.75)' });
        c.restore();
      }
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.38, 0, TAU); }, sk.ring, { lw: 2.2, blur: 16, core: 'rgba(40,4,30,0.85)' });
      break;
    case 'voidcrown':
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * TAU - Math.PI / 2;
        const long = i % 2 === 0;
        neon(c, x => {
          x.beginPath();
          x.moveTo(Math.cos(a - 0.2) * R * 0.5, Math.sin(a - 0.2) * R * 0.5);
          x.lineTo(Math.cos(a) * R * (long ? 1.3 : 0.95), Math.sin(a) * R * (long ? 1.3 : 0.95));
          x.lineTo(Math.cos(a + 0.2) * R * 0.5, Math.sin(a + 0.2) * R * 0.5);
          x.closePath();
        }, col, { lw: 2.2, blur: 20, core: 'rgba(255,255,255,0.06)' });
      }
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.5, 0, TAU); }, sk.ring, { lw: 2.4, blur: 18, core: 'rgba(12,6,30,0.85)' });
      neon(c, x => pathStar(x, 4, R * 0.3, R * 0.1, 0), '#fff', { lw: 1.8, blur: 14, core: null, inner: false });
      break;

    /* ---------------------------------------------------- mastery skins */
    case 'sprout':
      neon(c, x => pathStar(x, 5, R * 0.88, R * 0.38, -Math.PI / 2), col, o);
      neon(c, x => {
        x.beginPath();
        x.moveTo(0, R * 0.5);
        x.quadraticCurveTo(R * 0.05, R * 0.95, -R * 0.04, R * 1.26);
      }, sk.ring, { lw: 2, blur: 12, core: null, inner: false });
      for (const sgn of [-1, 1]) {
        neon(c, x => {
          x.beginPath();
          x.moveTo(0, R * (sgn > 0 ? 0.82 : 1.02));
          x.quadraticCurveTo(sgn * R * 0.44, R * (sgn > 0 ? 0.62 : 0.84), sgn * R * 0.5, R * (sgn > 0 ? 0.98 : 1.2));
          x.quadraticCurveTo(sgn * R * 0.22, R * (sgn > 0 ? 0.96 : 1.18), 0, R * (sgn > 0 ? 0.82 : 1.02));
          x.closePath();
        }, sk.ring, { lw: 1.5, blur: 10, core: 'rgba(8,26,6,0.6)' });
      }
      break;

    case 'warden':
      neon(c, x => pathPoly(x, 5, R * 0.86, -Math.PI / 2), col, o);
      for (let i = 0; i < 2; i++) {
        neon(c, x => { x.beginPath(); x.arc(0, 0, R * (1.06 + i * 0.22), -0.9 + i * Math.PI, 0.9 + i * Math.PI); },
          sk.ring, { lw: 2.2, blur: 13, core: null, inner: false });
      }
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * TAU - Math.PI / 2;
        neon(c, x => { x.beginPath(); x.arc(Math.cos(a) * R * 0.58, Math.sin(a) * R * 0.58, R * 0.1, 0, TAU); },
          '#fff', { lw: 1.3, blur: 8, core: null, inner: false });
      }
      break;

    case 'thornclad':
      neon(c, x => pathPoly(x, 7, R * 0.72, -Math.PI / 2), col, o);
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * TAU - Math.PI / 2;
        neon(c, x => {
          x.beginPath();
          x.moveTo(Math.cos(a - 0.13) * R * 0.66, Math.sin(a - 0.13) * R * 0.66);
          x.lineTo(Math.cos(a) * R * 1.36, Math.sin(a) * R * 1.36);
          x.lineTo(Math.cos(a + 0.13) * R * 0.66, Math.sin(a + 0.13) * R * 0.66);
          x.closePath();
        }, sk.ring, { lw: 1.9, blur: 13, core: 'rgba(40,10,4,0.6)' });
      }
      for (let i = 0; i < 4; i++) {
        const b = i / 4 * TAU + 0.35;
        neon(c, x => { x.beginPath(); x.arc(0, 0, R * 1.1, b, b + 1.06); }, col, { lw: 1.4, blur: 10, core: null, inner: false });
      }
      neon(c, x => pathPoly(x, 3, R * 0.3, -Math.PI / 2), '#fff', { lw: 1.5, blur: 9, core: null, inner: false });
      break;

    case 'apostate': {
      // the peak. twelve spines, three broken orbits, a sigil that does not sit still
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * TAU - Math.PI / 2;
        const long = i % 2 === 0;
        neon(c, x => {
          x.beginPath();
          x.moveTo(Math.cos(a - 0.1) * R * 0.44, Math.sin(a - 0.1) * R * 0.44);
          x.lineTo(Math.cos(a) * R * (long ? 1.42 : 1.0), Math.sin(a) * R * (long ? 1.42 : 1.0));
          x.lineTo(Math.cos(a + 0.1) * R * 0.44, Math.sin(a + 0.1) * R * 0.44);
          x.closePath();
        }, long ? col : sk.ring, { lw: long ? 2.2 : 1.5, blur: long ? 20 : 12, core: 'rgba(28,0,18,0.62)' });
      }
      for (let ring = 0; ring < 3; ring++) {
        const rr = R * (0.72 + ring * 0.26);
        const dir = ring % 2 ? -1 : 1;
        for (let i = 0; i < 3; i++) {
          const b = i / 3 * TAU + t * 0.55 * dir + ring * 0.4;
          neon(c, x => { x.beginPath(); x.arc(0, 0, rr, b, b + 1.32); },
            ring === 1 ? sk.ring : col, { lw: 1.7, blur: 12, core: null, inner: false });
        }
      }
      c.save(); c.rotate(-t * 0.9);
      neon(c, x => pathStar(x, 8, R * 0.56, R * 0.2, 0), '#fff', { lw: 1.6, blur: 14, core: null, inner: false });
      c.restore();
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.24, 0, TAU); }, sk.ring, { lw: 2, blur: 16, core: 'rgba(255,255,255,0.1)' });
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.09, 0, TAU); }, '#fff', { lw: 1.4, blur: 12, core: null, inner: false });
      break;
    }

    case 'deepmark':
      neon(c, x => pathBlob(x, R * 0.86, 7, 0.2, 77), col, o);
      for (let i = 0; i < 4; i++) {
        neon(c, x => { x.beginPath(); x.arc(0, -R * 0.2, R * (0.42 + i * 0.26), 0.42, Math.PI - 0.42); },
          sk.ring, { lw: 1.7, blur: 11, core: null, inner: false });
      }
      for (let i = 0; i < 3; i++) {
        neon(c, x => {
          x.beginPath();
          x.moveTo(-R * 0.34, -R * 0.34 + i * R * 0.3);
          x.lineTo(0, R * 0.02 + i * R * 0.3);
          x.lineTo(R * 0.34, -R * 0.34 + i * R * 0.3);
        }, '#fff', { lw: 1.4, blur: 9, core: null, inner: false });
      }
      break;

    case 'meridian':
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.8, 0, TAU); }, col, o);
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * TAU - Math.PI / 2;
        const long = i % 2 === 0;
        neon(c, x => {
          x.beginPath();
          x.moveTo(Math.cos(a) * R * 0.76, Math.sin(a) * R * 0.76);
          x.lineTo(Math.cos(a) * R * (long ? 1.3 : 0.98), Math.sin(a) * R * (long ? 1.3 : 0.98));
        }, long ? sk.ring : col, { lw: long ? 2.1 : 1.4, blur: 12, core: null, inner: false });
      }
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.5, -Math.PI * 0.9, -Math.PI * 0.1); }, sk.ring, { lw: 1.8, blur: 11, core: null, inner: false });
      neon(c, x => {
        x.beginPath(); x.moveTo(0, R * 0.34); x.lineTo(0, -R * 0.5); x.lineTo(R * 0.2, -R * 0.2);
      }, '#fff', { lw: 1.5, blur: 10, core: null, inner: false });
      break;

    case 'unbroken':
      neon(c, x => {
        x.beginPath();
        x.moveTo(0, -R * 1.12);
        x.lineTo(R * 0.84, -R * 0.3);
        x.quadraticCurveTo(R * 0.84, R * 0.72, 0, R * 1.14);
        x.quadraticCurveTo(-R * 0.84, R * 0.72, -R * 0.84, -R * 0.3);
        x.closePath();
      }, col, o);
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.56, 0, TAU); }, sk.ring, { lw: 2, blur: 14, core: null, inner: false });
      neon(c, x => {
        x.beginPath(); x.moveTo(-R * 0.26, 0); x.lineTo(-R * 0.06, R * 0.24); x.lineTo(R * 0.3, -R * 0.26);
      }, '#fff', { lw: 2, blur: 12, core: null, inner: false });
      break;

    case 'ascendant':
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 1.02, 0, TAU); }, sk.ring,
        { lw: 1.5, blur: 16, core: 'rgba(22,4,34,0.72)', inner: false });
      for (let i = 0; i < 3; i++) {
        const yy = R * (0.56 - i * 0.42), wd = R * (0.64 - i * 0.14);
        neon(c, x => {
          x.beginPath();
          x.moveTo(-wd, yy);
          x.lineTo(0, yy - R * 0.42);
          x.lineTo(wd, yy);
        }, i === 0 ? col : (i === 1 ? sk.ring : '#ffffff'),
          { lw: 2.5 - i * 0.45, blur: 18 - i * 3, core: null, inner: false });
      }
      break;

    /* ------------------------------------------------- tier two, bought */
    case 'ashfall': {
      // a star that has finished burning and started coming apart
      neon(c, x => pathStar(x, 5, R * 0.94, R * 0.4, -Math.PI / 2), col, o);
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * TAU - Math.PI / 2;
        const d = R * (1.14 + (i % 2) * 0.18);
        neon(c, x => {
          x.beginPath();
          x.moveTo(Math.cos(a) * d, Math.sin(a) * d);
          x.lineTo(Math.cos(a + 0.16) * (d + R * 0.2), Math.sin(a + 0.16) * (d + R * 0.2));
          x.lineTo(Math.cos(a - 0.1) * (d + R * 0.3), Math.sin(a - 0.1) * (d + R * 0.3));
          x.closePath();
        }, sk.ring, { lw: 1.2, blur: 9, core: 'rgba(30,28,26,0.6)' });
      }
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.2, 0, TAU); }, '#fff6ee', { lw: 1.6, blur: 12, core: null, inner: false });
      break;
    }

    case 'prismlight': {
      // one shape, split into its three channels
      const chans = [['#7ef7ff', -2.6, -1.4], ['#ff7ae6', 2.4, 0.6], ['#ffffb0', 0.2, 2.6]];
      for (const [cc2, dx, dy] of chans) {
        c.save(); c.translate(dx, dy);
        neon(c, x => pathStar(x, 4, R * 0.96, R * 0.36, 0), cc2, { lw: 2.2, blur: 20, core: null, inner: false });
        c.restore();
      }
      neon(c, x => pathStar(x, 4, R * 0.7, R * 0.26, 0), '#ffffff', { lw: 1.6, blur: 16, core: 'rgba(12,16,30,0.55)' });
      break;
    }

    case 'ironwake': {
      // a plate, and the seam where it was welded shut
      neon(c, x => pathPoly(x, 6, R * 0.98, Math.PI / 6), col, { lw: 3.2, blur: 18, core: 'rgba(18,20,26,0.92)' });
      neon(c, x => {
        x.beginPath();
        x.moveTo(-R * 0.7, R * 0.3);
        x.lineTo(-R * 0.18, -R * 0.1);
        x.lineTo(R * 0.06, R * 0.24);
        x.lineTo(R * 0.7, -R * 0.34);
      }, sk.ring, { lw: 2.6, blur: 22, core: null, inner: false });
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU + Math.PI / 6;
        neon(c, x => { x.beginPath(); x.arc(Math.cos(a) * R * 0.72, Math.sin(a) * R * 0.72, R * 0.075, 0, TAU); },
          '#c3ccd8', { lw: 1.1, blur: 6, core: null, inner: false });
      }
      break;
    }

    case 'hollowlight': {
      // no body at all, only the edge of one
      neon(c, x => pathStar(x, 6, R, R * 0.46, -Math.PI / 2), col, { lw: 2, blur: 20, core: null, inner: false });
      neon(c, x => pathStar(x, 6, R * 0.66, R * 0.3, -Math.PI / 2), sk.ring, { lw: 1.2, blur: 12, core: null, inner: false });
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.34, 0, TAU); }, col, { lw: 1, blur: 10, core: null, inner: false });
      break;
    }

    case 'lastseed': {
      // the top of the shop: a seed with a full corona
      for (let i = 0; i < 20; i++) {
        const a = i / 20 * TAU;
        const long = i % 2 === 0;
        neon(c, x => {
          x.beginPath();
          x.moveTo(Math.cos(a) * R * 0.86, Math.sin(a) * R * 0.86);
          x.lineTo(Math.cos(a) * R * (long ? 1.5 : 1.18), Math.sin(a) * R * (long ? 1.5 : 1.18));
        }, '#ffffff', { lw: long ? 1.7 : 1.1, blur: long ? 16 : 9, core: null, inner: false });
      }
      neon(c, x => pathStar(x, 4, R * 0.88, R * 0.3, 0), '#ffffff', { lw: 2.6, blur: 26, core: 'rgba(220,230,255,0.14)' });
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.26, 0, TAU); }, '#ffffff', { lw: 2, blur: 20, core: 'rgba(255,255,255,0.55)' });
      break;
    }

    /* ------------------------------------------------ mastery, earned */
    case 'pathless': {
      // a shape that never closes -- it only ever leaves a trace
      for (let i = 0; i < 5; i++) {
        const b = i / 5 * TAU;
        neon(c, x => { x.beginPath(); x.arc(0, 0, R * (0.5 + i * 0.16), b, b + 1.05); },
          i % 2 ? sk.ring : col, { lw: 1.6, blur: 13, core: null, inner: false });
      }
      neon(c, x => {
        x.beginPath();
        x.moveTo(-R * 0.42, R * 0.34); x.lineTo(0, -R * 0.5); x.lineTo(R * 0.42, R * 0.34);
      }, '#ffffff', { lw: 1.5, blur: 12, core: null, inner: false });
      break;
    }

    case 'untolled': {
      // a bell, and a ring around it with the break still in it
      neon(c, x => {
        x.beginPath();
        x.moveTo(-R * 0.2, -R * 0.62);
        x.bezierCurveTo(-R * 0.26, -R * 0.1, -R * 0.76, R * 0.1, -R * 0.84, R * 0.6);
        x.lineTo(R * 0.84, R * 0.6);
        x.bezierCurveTo(R * 0.76, R * 0.1, R * 0.26, -R * 0.1, R * 0.2, -R * 0.62);
        x.closePath();
      }, col, { lw: 2.6, blur: 20, core: 'rgba(26,22,8,0.86)' });
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 1.22, -0.9, Math.PI * 1.62); }, sk.ring, { lw: 1.8, blur: 14, core: null, inner: false });
      neon(c, x => { x.beginPath(); x.arc(0, R * 0.4, R * 0.13, 0, TAU); }, '#f6e8be', { lw: 1.4, blur: 10, core: null, inner: false });
      break;
    }

    case 'deeproot': {
      // husks, opened and kept
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU - Math.PI / 2;
        neon(c, x => {
          x.beginPath();
          x.moveTo(Math.cos(a - 0.3) * R * 0.32, Math.sin(a - 0.3) * R * 0.32);
          x.quadraticCurveTo(Math.cos(a - 0.5) * R * 1.02, Math.sin(a - 0.5) * R * 1.02, Math.cos(a) * R * 1.26, Math.sin(a) * R * 1.26);
          x.quadraticCurveTo(Math.cos(a + 0.5) * R * 1.02, Math.sin(a + 0.5) * R * 1.02, Math.cos(a + 0.3) * R * 0.32, Math.sin(a + 0.3) * R * 0.32);
          x.closePath();
        }, i % 2 ? col : sk.ring, { lw: 1.9, blur: 15, core: 'rgba(16,26,6,0.78)' });
      }
      neon(c, x => pathPoly(x, 6, R * 0.4, Math.PI / 6), '#f4ffd0', { lw: 1.8, blur: 14, core: 'rgba(10,20,4,0.8)' });
      break;
    }

    case 'endurant': {
      // one ring for every minute it took
      for (let i = 0; i < 7; i++) {
        const rr = R * (0.24 + i * 0.19);
        neon(c, x => { x.beginPath(); x.arc(0, 0, rr, 0, TAU); },
          i % 2 ? sk.ring : col, { lw: 2.2 - i * 0.2, blur: 16 - i, core: null, inner: false });
      }
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.12, 0, TAU); }, '#ffffff', { lw: 1.8, blur: 18, core: 'rgba(255,255,255,0.5)' });
      break;
    }

    case 'sunken': {
      // almost nothing, and one light a very long way down
      neon(c, x => pathBlob(x, R * 0.98, 8, 0.13, 313), col, { lw: 2.8, blur: 22, core: 'rgba(3,5,12,0.97)' });
      for (let i = 0; i < 3; i++) {
        neon(c, x => { x.beginPath(); x.arc(0, 0, R * (0.72 - i * 0.2), 0, TAU); },
          sk.ring, { lw: 0.9, blur: 7, core: null, inner: false });
      }
      neon(c, x => { x.beginPath(); x.arc(R * 0.06, R * 0.1, R * 0.09, 0, TAU); }, '#ffffff', { lw: 1.4, blur: 20, core: 'rgba(255,255,255,0.7)' });
      break;
    }

    case 'archivist': {
      // the new peak: sixteen spines, four orbits, one mark per boss
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * TAU - Math.PI / 2;
        const long = i % 2 === 0;
        neon(c, x => {
          x.beginPath();
          x.moveTo(Math.cos(a - 0.08) * R * 0.42, Math.sin(a - 0.08) * R * 0.42);
          x.lineTo(Math.cos(a) * R * (long ? 1.5 : 1.04), Math.sin(a) * R * (long ? 1.5 : 1.04));
          x.lineTo(Math.cos(a + 0.08) * R * 0.42, Math.sin(a + 0.08) * R * 0.42);
          x.closePath();
        }, long ? col : sk.ring, { lw: long ? 2 : 1.3, blur: long ? 20 : 11, core: 'rgba(30,20,2,0.6)' });
      }
      for (let ring = 0; ring < 4; ring++) {
        const rr = R * (0.66 + ring * 0.23);
        for (let i = 0; i < 3; i++) {
          const b = i / 3 * TAU + ring * 0.7;
          neon(c, x => { x.beginPath(); x.arc(0, 0, rr, b, b + 1.1); },
            ring % 2 ? sk.ring : col, { lw: 1.6, blur: 12, core: null, inner: false });
        }
      }
      // one mark per boss taken
      let marks = 0;
      try { marks = bossSeenCount(); } catch (e) { marks = 0; }
      const total = ALL_BOSS_IDS.length;
      for (let i = 0; i < Math.min(total, marks); i++) {
        const a = i / total * TAU - Math.PI / 2;
        neon(c, x => { x.beginPath(); x.arc(Math.cos(a) * R * 0.54, Math.sin(a) * R * 0.54, R * 0.05, 0, TAU); },
          '#ffffff', { lw: 1, blur: 8, core: null, inner: false });
      }
      neon(c, x => pathStar(x, 8, R * 0.4, R * 0.15, 0), '#ffffff', { lw: 1.5, blur: 15, core: null, inner: false });
      break;
    }

    case 'dayzero': {
      const T = t || 0;
      // twelve spikes, alternating long and short, turning slowly
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * TAU + T * 0.22;
        const long = (i % 2) === 0;
        const L = R * (long ? 1.62 : 1.18);
        neon(c, x => {
          x.beginPath();
          x.moveTo(Math.cos(a - 0.07) * R * 0.5, Math.sin(a - 0.07) * R * 0.5);
          x.lineTo(Math.cos(a) * L, Math.sin(a) * L);
          x.lineTo(Math.cos(a + 0.07) * R * 0.5, Math.sin(a + 0.07) * R * 0.5);
          x.closePath();
        }, long ? col : sk.ring, { lw: long ? 1.9 : 1.2, blur: long ? 18 : 10, core: 'rgba(6,10,26,0.55)' });
      }
      // three rings, each turning against the last
      for (let i = 0; i < 3; i++) {
        const dir = i % 2 ? -1 : 1;
        const rr = R * (0.72 + i * 0.26);
        for (let k = 0; k < 3; k++) {
          const b = T * (0.5 + i * 0.35) * dir + k / 3 * TAU;
          neon(c, x => { x.beginPath(); x.arc(0, 0, rr, b, b + 1.24); },
            i === 1 ? sk.ring : col, { lw: 1.7 - i * 0.3, blur: 14 - i * 3, core: null, inner: false });
        }
      }
      // the prism at the middle: one shape, split into three channels.
      // the split scales with R so it reads at tile size as well as in the arena
      const sp = R * 0.17;
      const ch = [['#ff7ae6', -sp * 1.3, -sp * 0.7], ['#9ef7ff', sp * 1.2, sp * 0.4], ['#8dff6b', sp * 0.2, sp * 1.3]];
      for (const [cc2, dx, dy] of ch) {
        c.save(); c.translate(dx, dy);
        neon(c, x => pathStar(x, 6, R * 0.66, R * 0.26, T * 0.4), cc2,
          { lw: 1.6, blur: 14, core: null, inner: false });
        c.restore();
      }
      // a dark well behind the core so the middle has somewhere to sit
      c.save(); c.globalCompositeOperation = 'source-over';
      c.fillStyle = 'rgba(6,8,22,0.78)';
      c.beginPath(); c.arc(0, 0, R * 0.40, 0, TAU); c.fill();
      c.restore();
      neon(c, x => pathStar(x, 6, R * 0.44, R * 0.16, -T * 0.6), '#ffffff',
        { lw: 1.5, blur: 14, core: null, inner: false });
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.13, 0, TAU); }, '#ffffff',
        { lw: 1.6, blur: 18, core: 'rgba(255,255,255,0.9)' });
      break;
    }

    case 'eventide': {
      // a shadow with a ring of light stuck on its lip, and the disc on edge
      c.save(); c.scale(1, 0.17);
      for (let i = 0; i < 3; i++) {
        neon(c, x => { x.beginPath(); x.arc(0, 0, R * (1.45 + i * 0.42), 0, TAU); },
          i === 1 ? '#ff7ae6' : sk.ring, { lw: 2.0 - i * 0.4, blur: 16 - i * 3, core: null, inner: false });
      }
      c.restore();
      for (let i = 0; i < 2; i++) {
        const up = i === 0;
        neon(c, x => { x.beginPath(); x.arc(0, 0, R * 1.16, up ? Math.PI + 0.4 : 0.4, up ? TAU - 0.4 : Math.PI - 0.4); },
          up ? '#9ef7ff' : '#ff7ae6', { lw: 1.6, blur: 14, core: null, inner: false });
      }
      // the shadow itself: filled, and absolutely flat
      c.save();
      c.fillStyle = '#000000';
      c.beginPath(); c.arc(0, 0, R * 0.82, 0, TAU); c.fill();
      c.restore();
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.84, 0, TAU); }, '#ffffff', { lw: 2.2, blur: 22, core: null, inner: false });
      neon(c, x => { x.beginPath(); x.arc(0, 0, R * 0.24, 0, TAU); }, col, { lw: 1.2, blur: 10, core: null, inner: false });
      break;
    }

    default:
      neon(c, x => pathStar(x, 4, R, R * 0.38, 0), col, o);
  }
}

/* the orbiting flourish some skins carry -- drawn live so it turns */
function drawSkinHalo(c, sk, x, y, R, t, scale, squash) {
  if (!sk.halo) return;
  const ringR = 1.85 * (scale === undefined ? 1 : scale);
  const sq = squash === undefined ? 1 : squash;
  const col = sk.rainbow ? skinCol(sk, t) : (sk.haloCol || sk.ring);
  const spin = t * (sk.id === 'voidcrown' ? 1.1 : 0.8);
  const puls = sk.pulse ? 1 + Math.sin(t * 3) * 0.09 : 1;
  c.save();
  c.translate(x, y);
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < sk.halo; i++) {
    const a = spin + i / sk.halo * TAU;
    const rr = R * ringR * puls;
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr * sq;
    c.globalAlpha = 0.75;
    c.fillStyle = col;
    c.shadowColor = col; c.shadowBlur = 10;
    c.beginPath(); c.arc(px, py, R * 0.13, 0, TAU); c.fill();
  }
  c.restore();
}

/* what a finished run is worth */
function shardsFor(score, win, tide) {
  return Math.max(1, Math.floor(score / 300) + (win ? 250 : 0) + Math.floor((tide || 0) * 8));
}

/* ========================================================================
   ENTITIES
   ======================================================================== */
let G = null;   // assigned by the Game module

/* ------------------------------------------------------------ spatial hash */
class Grid {
  constructor(cell) { this.cell = cell; this.map = new Map(); }
  clear() { this.map.clear(); }
  key(cx, cy) { return cx * 73856093 ^ cy * 19349663; }
  insert(e) {
    const cx = Math.floor(e.x / this.cell), cy = Math.floor(e.y / this.cell);
    const k = this.key(cx, cy);
    let a = this.map.get(k);
    if (!a) { a = []; this.map.set(k, a); }
    a.push(e);
    e._cx = cx; e._cy = cy;
  }
  query(x, y, r, out) {
    out.length = 0;
    const c = this.cell;
    const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
    const y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
    for (let cy = y0; cy <= y1; cy++) {
      for (let cx = x0; cx <= x1; cx++) {
        const a = this.map.get(this.key(cx, cy));
        if (a) for (let i = 0; i < a.length; i++) out.push(a[i]);
      }
    }
    return out;
  }
}

/* ----------------------------------------------------------------- player */
class Player {
  constructor(x, y) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.r = 14;
    this.face = -Math.PI / 2;
    this.aim = -Math.PI / 2;
    this.hp = 100; this.maxHp = 100;
    this.inv = 0;
    this.dashCd = 0; this.dashT = 0; this.dashDir = 0;
    this.trail = [];
    this.spin = 0;
    this.hurtFlash = 0;
    this.dead = false;
    this.regenAcc = 0;
    this.pickupPulse = 0;
  }
  get stats() { return G.stats; }
  update(dt) {
    const S = G.stats;
    const mv = Input.move();
    let ax = mv.x, ay = mv.y;

    // dash
    const wantDash = Input.hit('space') || Input.gpPressed[0] || Input.gpPressed[1] || Input.dashTouchTap;
    if (wantDash && this.dashCd <= 0 && !this.dead) {
      let dx = ax, dy = ay;
      if (!dx && !dy) { dx = Math.cos(this.face); dy = Math.sin(this.face); }
      const m = Math.hypot(dx, dy) || 1;
      this.dashDir = Math.atan2(dy / m, dx / m);
      this.dashT = 0.17; this.dashCd = 2.3;
      if (G.rel('blinkstep')) {
        // a hole, not a sprint: instant, and nothing protects you on the way
        const bd = 260;
        let nx2 = this.x + Math.cos(this.dashDir) * bd, ny2 = this.y + Math.sin(this.dashDir) * bd;
        const mm = Math.hypot(nx2, ny2), lim = G.arenaR - 26;
        if (mm > lim) { nx2 = nx2 / mm * lim; ny2 = ny2 / mm * lim; }
        for (let i = 0; i < 14; i++) Particles.spark(this.x, this.y, rnd(TAU), rnd(80, 260), { col: '#63ffc9', life: rnd(0.15, 0.4), w: 2.4 });
        this.x = nx2; this.y = ny2; this.dashT = 0;
        Particles.ring(this.x, this.y, 8, 120, { col: '#63ffc9', life: 0.4, w: 4 });
      } else this.inv = Math.max(this.inv, 0.34);
      if (G.runStats) G.runStats.dashes++;
      Sound.dash();
      Cam.shake(0.16);
      for (let i = 0; i < 16; i++) {
        Particles.spark(this.x, this.y, this.dashDir + Math.PI + rnd(-0.7, 0.7), rnd(120, 380), { col: skinCol(currentSkin(), G.time), life: rnd(0.15, 0.4), w: 2.4 });
      }
      Particles.ring(this.x, this.y, 10, 62, { col: currentSkin().ring, life: 0.3, w: 3 });
    }
    this.dashCd = Math.max(0, this.dashCd - dt);
    if (G.spinF) {
      const dR = Math.hypot(this.x, this.y);
      if (dR > 10) { this.x += (-this.y / dR) * G.spinF * dt; this.y += (this.x / dR) * G.spinF * dt; }
    }
    if (G.pullF && G.pullTo) {
      const px2 = G.pullTo.x - this.x, py2 = G.pullTo.y - this.y, pm = Math.hypot(px2, py2);
      if (pm > 6) { this.x += px2 / pm * G.pullF * dt; this.y += py2 / pm * G.pullF * dt; }
    }

    let spd = S.speed * (G.moveMul || 1);
    if (G.freezeT > 0) spd = 0;
    if (G.rime > 0) spd *= Math.max(0.3, 1 - G.rime * 0.06);
    if (this.dashT > 0) {
      this.dashT -= dt;
      spd = S.speed * 4.4;
      ax = Math.cos(this.dashDir); ay = Math.sin(this.dashDir);
      if ((G.frame & 1) === 0) {
        Particles.spark(this.x, this.y, this.dashDir + Math.PI + rnd(-0.4, 0.4), rnd(60, 190), { col: '#bffcff', life: 0.22, w: 2 });
      }
    }
    const tvx = ax * spd, tvy = ay * spd;
    const acc = this.dashT > 0 ? 40 : 17;
    const k = 1 - Math.exp(-acc * dt);
    this.vx += (tvx - this.vx) * k;
    this.vy += (tvy - this.vy) * k;
    this.x += this.vx * dt; this.y += this.vy * dt;

    // arena bounds
    const d = Math.hypot(this.x, this.y);
    if (d > G.arenaR - this.r) {
      const a = Math.atan2(this.y, this.x);
      this.x = Math.cos(a) * (G.arenaR - this.r);
      this.y = Math.sin(a) * (G.arenaR - this.r);
      this.vx *= 0.4; this.vy *= 0.4;
    }

    if (Math.hypot(this.vx, this.vy) > 12) this.face = Math.atan2(this.vy, this.vx);
    // aim: mouse if used, else nearest enemy, else facing
    if (Input.pointerT > 0 && !Input.touch.active) {
      this.aim = Math.atan2(Input.my - VH / 2 + (Cam.y - this.y) * Cam.zoom, Input.mx - VW / 2 + (Cam.x - this.x) * Cam.zoom);
    } else {
      const t = G.nearestEnemy(this.x, this.y, 900);
      this.aim = t ? Math.atan2(t.y - this.y, t.x - this.x) : this.face;
    }

    this.spin += dt * (1.6 + Math.hypot(this.vx, this.vy) * 0.006);
    this.inv = Math.max(0, this.inv - dt);
    this.hurtFlash = Math.max(0, this.hurtFlash - dt * 3);
    this.pickupPulse = Math.max(0, this.pickupPulse - dt * 4);

    // regen
    if (S.regen > 0 && this.hp < this.maxHp) {
      this.regenAcc += S.regen * dt;
      if (this.regenAcc >= 1) { const n = Math.floor(this.regenAcc); this.regenAcc -= n; this.heal(n, true); }
    }

    // trail
    {
      const sk2 = currentSkin();
      const TRc = sk2.trail;
      if (TRc) {
        /* distance-sampled: the ribbon is the same length on a 144Hz monitor
           as on a 30fps laptop, which a per-frame push is not. */
        const step = TRc.step || 5;
        const n0 = this.trail.length;
        const moved = n0 ? Math.hypot(this.x - this.trail[n0 - 2], this.y - this.trail[n0 - 1]) : 1e9;
        if (moved >= step) { this.trail.push(this.x, this.y); this.trailIdle = 0; }
        else {
          // standing still: let it run out behind you rather than hang there
          this.trailIdle = (this.trailIdle || 0) + dt;
          while (this.trailIdle > 0.022 && this.trail.length > 2) { this.trail.splice(0, 2); this.trailIdle -= 0.022; }
        }
        const cap = (TRc.len || 13) * 2;
        while (this.trail.length > cap) this.trail.splice(0, 2);
      } else {
        this.trail.push(this.x, this.y);
        while (this.trail.length > 26) this.trail.splice(0, 2);
      }
      if (sk2.trail && sk2.trail.spark && G.quality > 0) {
        const sp = Math.hypot(this.vx || 0, this.vy || 0);
        this.sparkT = (this.sparkT || 0) - dt;
        if (this.sparkT <= 0 && sp > 40) {
          this.sparkT = sk2.trail.spark;
          const a = Math.atan2(-(this.vy || 0), -(this.vx || 0)) + rnd(-0.8, 0.8);
          const cols = sk2.trail.cols;
          Particles.spark(this.x, this.y, a, rnd(40, 190),
            { col: cols[(rand() * cols.length) | 0], life: rnd(0.25, 0.6), w: rnd(1.4, 2.6) });
        }
      }
    }
  }
  damage(n, from) {
    if (this.inv > 0 || this.dead || G.over) return;
    // NULLPLATE: one hit shrugged off every six seconds
    if (G.rel('nullplate') && G.time >= (G.relicT.nullplate || 0)) {
      G.relicT.nullplate = G.time + 6;
      this.inv = Math.max(this.inv, 0.4);
      Sound.ui(true);
      Particles.ring(this.x, this.y, 14, 96, { col: '#c56bff', life: 0.4, w: 4 });
      Pops.add(this.x, this.y - 22, 'NULLED', { col: '#c56bff', size: 16, vy: -100 });
      return;
    }
    n = Math.max(1, Math.round(n * (G.stats ? G.stats.dr : 1)));
    if (G.rel('counterturn') && from && from.contact) n = Math.round(n * 1.25);
    for (const e2 of G.enemies) {
      if (e2.def.bossKind === 'witness' && !e2.dead && e2.echoes && e2.echoes.length) { e2.echoTouched = 1; break; }
    }
    // EMBERSKIN: being hit sets you alight, and that burns them back
    if (G.rel('emberskin')) {
      G.relicT.ember = G.time + 3;
      Particles.ring(this.x, this.y, 10, 150, { col: '#ff9a3c', life: 0.45, w: 5 });
    }
    this.hp -= n;
    this.inv = 0.62;
    this.hurtFlash = 1;
    Sound.hurt();
    Pet.poke('hurt');
    Cam.shake(0.42);
    Flash.hit('#ff2d55', 0.16);
    Flash.vignette('rgba(255,40,80,0.5)', 0.62);
    G.hitstop = Math.max(G.hitstop, 0.06);
    Pops.add(this.x, this.y - 22, '-' + n, { col: '#ff7a90', size: 20, vy: -110 });
    for (let i = 0; i < 20; i++) Particles.spark(this.x, this.y, rnd(TAU), rnd(90, 300), { col: '#ff5470', life: rnd(0.2, 0.5), w: 2.4 });
    Particles.ring(this.x, this.y, 12, 76, { col: '#ff5470', life: 0.34, w: 4 });
    if (this.hp <= 0) {
      this.hp = 0;
      if (G.cov('lastleaf') && !G.relicT.leafUsed) {
        G.relicT.leafUsed = 1;
        this.hp = this.maxHp; this.inv = 3;
        G.banner('THE LAST LEAF', '#ffffff');
        Flash.hit('#ffffff', 0.6); Cam.shake(0.8);
        Particles.ring(this.x, this.y, 20, 460, { col: '#ffffff', life: 1, w: 9 });
        return;
      }
      // SECOND BREATH: one refusal per run
      if (G.rel('secondbreath') && !G.relicT.breathUsed) {
        G.relicT.breathUsed = 1;
        this.hp = 1; this.inv = 3;
        G.banner('SECOND BREATH', '#cfe9ff');
        Flash.hit('#cfe9ff', 0.5); Cam.shake(0.7);
        Particles.ring(this.x, this.y, 20, 420, { col: '#cfe9ff', life: 0.9, w: 8 });
        return;
      }
      if (G.revives > 0) { G.revives--; G.rebloom(); return; }
      G.gameOver(false);
    }
  }
  heal(n, quiet) {
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + n);
    const got = Math.round(this.hp - before);
    if (got > 0 && !quiet) {
      Pops.add(this.x, this.y - 26, '+' + got, { col: PAL.xp, size: 18 });
      Particles.ring(this.x, this.y, 10, 60, { col: PAL.xp, life: 0.4, w: 3 });
    }
  }
  draw(c) {
    const flick = this.inv > 0 && (Math.floor(G.time * 26) % 2 === 0);
    // trail
    c.save();
    c.globalCompositeOperation = 'lighter';
    const sk = currentSkin();
    const skc = skinCol(sk, G.time);
    const TR = sk.trail;
    if (TR && this.trail.length >= 8) {
      const P = this.trail, n = P.length / 2;
      c.lineCap = 'round'; c.lineJoin = 'round';
      /* One stroked path per age band instead of one per segment: the band
         edges are hidden by the glow, and it costs about a dozen strokes
         instead of a hundred. Each band is drawn through the midpoints of
         its segments with quadratic curves, so the ribbon is a curve rather
         than a chain of straight bits. */
      const BANDS = G.quality > 1 ? 6 : (G.quality > 0 ? 5 : 4);
      const NC = TR.cols.length;
      const walk = G.time * 2.2;
      const band = (i0, i1, wMul, aMul, blur, forceCol, ci0) => {
        if (i1 - i0 < 1) return;
        c.beginPath();
        c.moveTo(P[i0 * 2], P[i0 * 2 + 1]);
        for (let i = i0 + 1; i < i1; i++) {
          const mx = (P[(i - 1) * 2] + P[i * 2]) * 0.5;
          const my = (P[(i - 1) * 2 + 1] + P[i * 2 + 1]) * 0.5;
          c.quadraticCurveTo(P[(i - 1) * 2], P[(i - 1) * 2 + 1], mx, my);
        }
        c.lineTo(P[(i1 - 1) * 2], P[(i1 - 1) * 2 + 1]);
        const t = i1 / (n - 1);
        const ci = forceCol || TR.cols[(((ci0 | 0) % NC) + NC) % NC];
        c.strokeStyle = ci;
        c.shadowColor = ci;
        c.shadowBlur = blur;
        c.globalAlpha = aMul * (0.10 + t * t * 0.90);
        c.lineWidth = Math.max(0.6, TR.w * wMul * (0.14 + t * 0.96));
        c.stroke();
      };
      for (let b = 0; b < BANDS; b++) {
        // one segment of overlap so the bands do not show a seam
        const i0 = Math.max(0, Math.floor(b * (n - 1) / BANDS) - 1);
        const i1 = Math.min(n, Math.floor((b + 1) * (n - 1) / BANDS) + 1);
        // the whole palette is laid along the ribbon and then walks along it,
        // so it always reads as a spectrum rather than one colour at a time
        const ci0 = (b / BANDS) * NC + walk;
        band(i0, i1, 1.0, 0.30, 16, null, ci0);       // the soft body
        band(i0, i1, 0.34, 0.85, 6, null, ci0);        // the colour core
      }
      // a hot white filament down the newest third, so it has a leading edge
      band(Math.max(0, Math.floor(n * 0.62)), n, 0.15, 0.95, 10, '#ffffff', 0);
      c.shadowBlur = 0;
    } else {
      for (let i = 0; i < this.trail.length; i += 2) {
        const t = i / this.trail.length;
        c.globalAlpha = t * t * 0.32;
        c.fillStyle = skc;
        const r = 3 + t * 7;
        c.beginPath(); c.arc(this.trail[i], this.trail[i + 1], r, 0, TAU); c.fill();
      }
    }
    c.restore();

    if (flick) return;
    // rainbow skins can't be cached by id alone, so bucket the hue
    let key = 'player_body_' + sk.id;
    if (sk.rainbow) key += '_' + (Math.floor(G.time * 40) % 360 / 12 | 0);
    if (sk.oil) key += '_o' + (Math.floor(G.time * 6) % 48);
    if (sk.id === 'archivist') { try { key += '_' + bossSeenCount(); } catch (e) { } }
    const s = sprite(key, 88, 88, cc => paintSkin(cc, sk, 19.5, G.time));
    const ring = sprite('player_ring_' + sk.id, 74, 74, cc => {
      neon(cc, x => pathPoly(x, 3, 25, 0), sk.ring, { lw: 1.6, blur: 10, core: null, inner: false });
    });
    const core = glowSprite(sk.core);

    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.9 + Math.sin(G.time * 6) * 0.08;
    c.drawImage(core, this.x - 34, this.y - 34, 68, 68);
    c.restore();

    drawSprite(c, ring, this.x, this.y, -this.spin * 0.7, 1, 0.7);
    drawSprite(c, s, this.x, this.y, this.spin, 1, 1);
    drawSkinHalo(c, sk, this.x, this.y, 19.5, G.time);

    if (this.hurtFlash > 0) {
      c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = this.hurtFlash * 0.8;
      c.drawImage(glowSprite('#ff5470'), this.x - 40, this.y - 40, 80, 80);
      c.restore();
    }
    // dash cooldown ring
    if (this.dashCd > 0) {
      const p = 1 - this.dashCd / 2.3;
      c.save();
      c.strokeStyle = sk.ring; c.globalAlpha = 0.55; c.lineWidth = 2.4; c.lineCap = 'round';
      c.beginPath(); c.arc(this.x, this.y, 25, -Math.PI / 2, -Math.PI / 2 + p * TAU); c.stroke();
      c.restore();
    } else {
      c.save();
      c.globalAlpha = 0.45 + Math.sin(G.time * 7) * 0.2;
      c.strokeStyle = skc; c.lineWidth = 1.6;
      c.beginPath(); c.arc(this.x, this.y, 25, 0, TAU); c.stroke();
      c.restore();
    }
    if (this.inv > 0.05) {
      c.save();
      c.globalAlpha = Math.min(0.55, this.inv);
      c.strokeStyle = '#ffffff'; c.lineWidth = 2;
      c.beginPath(); c.arc(this.x, this.y, 30 + (1 - this.inv) * 6, 0, TAU); c.stroke();
      c.restore();
    }
  }
}

/* --------------------------------------------------------------- companion */
const Pet = {
  x: 0, y: 0, vx: 0, vy: 0, face: 0, bob: 0, alpha: 1,
  flinch: 0, spin: 0, tuck: 0, bright: 0,
  reset(x, y) { this.x = x - 50; this.y = y; this.vx = this.vy = 0; this.flinch = this.spin = this.tuck = this.bright = 0; this.alpha = 1; this.hist = []; },
  poke(what) {
    if (what === 'hurt') this.flinch = 0.55;
    else if (what === 'level') this.spin = 1;
    else if (what === 'boss') this.tuck = 1.6;
    else if (what === 'mote') this.bright = 0.5;
  },
  update(dt, p) {
    const pet = currentPet();
    if (!pet || pet.form === 'none') return;
    // spring-damped lag is what makes it read as a creature rather than a HUD bit
    const want = 54 + Math.sin(G.time * 0.7) * 6;
    const ang = Math.atan2(this.y - p.y, this.x - p.x);
    const tx = p.x + Math.cos(ang) * want, ty = p.y + Math.sin(ang) * want;
    const k = 9.0, d = 0.72;
    this.vx += ((tx - this.x) * k - this.vx * k * d) * dt;
    this.vy += ((ty - this.y) * k - this.vy * k * d) * dt;
    if (this.tuck > 0) { this.vx += (p.x - this.x) * 6 * dt; this.vy += (p.y - this.y) * 6 * dt; }
    this.x += this.vx * dt; this.y += this.vy * dt;
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > 22) this.face = Math.atan2(this.vy, this.vx);
    this.bob += dt * (pet.form === 'herald' ? 0 : 2.2);
    this.flinch = Math.max(0, this.flinch - dt * 1.6);
    this.spin = Math.max(0, this.spin - dt * 1.4);
    this.tuck = Math.max(0, this.tuck - dt);
    this.bright = Math.max(0, this.bright - dt * 1.6);
    if (!this.hist) this.hist = [];
    this.hist.push(this.x, this.y);
    if (this.hist.length > 18) this.hist.splice(0, 2);
    // readability: step aside when the screen fills up, and vanish in a burn phase
    let want2 = 1;
    const busy = G.ebullets.length;
    if (busy > 40) want2 = 0.3;
    if (G.boss && !G.boss.dead && G.boss.hp / G.boss.maxHp < 0.2) want2 = 0;
    if (Save.data.petMode === 0.5) want2 *= 0.45;
    this.alpha += (want2 - this.alpha) * Math.min(1, dt * 2.5);
  },
  draw(c) {
    const pet = currentPet();
    if (!pet || pet.form === 'none' || Save.data.petMode === 0) return;
    if (this.alpha < 0.02) return;
    const dy = Math.sin(this.bob) * 2.4;
    // a short wake, so it reads as something moving through the dark
    if (this.hist && this.hist.length >= 4 && G.quality > 0) {
      c.save();
      c.globalCompositeOperation = 'lighter';
      const n = this.hist.length / 2;
      for (let i = 1; i < n; i++) {
        const tt = i / (n - 1);
        c.globalAlpha = this.alpha * tt * tt * 0.34;
        c.strokeStyle = pet.col;
        c.lineWidth = 0.6 + tt * 2.6;
        c.lineCap = 'round';
        c.beginPath();
        c.moveTo(this.hist[(i - 1) * 2], this.hist[(i - 1) * 2 + 1]);
        c.lineTo(this.hist[i * 2], this.hist[i * 2 + 1]);
        c.stroke();
      }
      c.restore();
    }
    petShape(c, pet, this.x, this.y + dy, this.alpha, this.face, this.flinch, this.spin, this.bright, G.time);
  }
};

function petShape(c, pet, x, y, alpha, face, flinch, spin, bright, t) {
  const col = pet.col, f = pet.form;
  if (f === 'none') return;
  c.save();
  c.globalAlpha = alpha;
  c.translate(x, y);

  /* every pet gets the same two things underneath it: a soft aura so it
     reads against a busy floor, and a squash when it flinches. Only then
     does its own shape get drawn on top. */
  const R = 9 + bright * 2.4;
  const sq = 1 + flinch * 0.30, sqy = 1 - flinch * 0.24;
  c.save();
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = alpha * (0.20 + bright * 0.35);
  c.drawImage(glowSprite(col), -R * 2.6, -R * 2.6, R * 5.2, R * 5.2);
  c.restore();

  if (spin > 0) c.rotate((1 - spin) * TAU);
  c.scale(sq, sqy);

  const lw = { lw: 1.8, blur: 12 + bright * 10, core: 'rgba(6,8,20,0.6)' };
