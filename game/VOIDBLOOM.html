<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04050d">
<title>VOIDBLOOM</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04050d;
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none}
  #game{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair;
    image-rendering:auto}
  #cosmos{position:fixed;inset:0;width:100vw;height:100vh;display:none;z-index:0;pointer-events:none}
  #cosmos.on{display:block}
  #game{position:fixed;inset:0;z-index:1}
  #fx{position:fixed;inset:0;width:100vw;height:100vh;display:none;z-index:2;
      pointer-events:none;mix-blend-mode:screen}
  #fx.on{display:block}
  #grille{position:fixed;inset:0;z-index:3;pointer-events:none;display:none;
          opacity:0;transition:opacity .35s ease}
  #grille.on{display:block;opacity:1}
  /* the scanline pitch is in device-independent px so it reads the same
     on a laptop panel and on a 4K monitor */
  #grille .scan{position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.30) 0px, rgba(0,0,0,0.30) 1px,
      rgba(0,0,0,0.00) 1px, rgba(0,0,0,0.00) 3px);
    mix-blend-mode:multiply;opacity:.46}
  #grille .vig{position:absolute;inset:0;
    background:radial-gradient(ellipse 78% 78% at 50% 48%,
      rgba(0,0,0,0) 38%, rgba(0,0,0,0.22) 72%, rgba(0,0,0,0.62) 100%)}
  #grille .bezel{position:absolute;inset:0;
    box-shadow:inset 0 0 120px rgba(4,6,18,0.85), inset 0 0 26px rgba(120,200,255,0.05)}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;color:#7d86ab;letter-spacing:.4em;font-size:13px;font-weight:700;
    background:radial-gradient(ellipse 60% 60% at 50% 46%, #0b0d22 0%, #05060f 60%, #030409 100%);z-index:9;
    opacity:1;transition:opacity .38s ease}
  #boot.gone{display:none}
  #boot.fade{opacity:0}
  #boot .halo{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s ease}
  #boot .sub{letter-spacing:.34em;font-size:clamp(17px,3.4vmin,26px);font-weight:900;color:#dfe7ff;min-height:1em}
  #boot .bar{position:relative;width:min(300px,54vmin);height:2px;border-radius:2px;
    background:rgba(255,255,255,0.10);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:0;background:#9ef7ff;
    box-shadow:0 0 12px currentColor;transition:width .12s linear}
  #boot svg{width:min(290px,50vmin);height:min(290px,50vmin);display:block;overflow:visible}
  #boot .cap{animation:vbpulse 2.1s ease-in-out infinite}
  @keyframes vbpulse{0%,100%{opacity:.42}50%{opacity:.95}}
  #grille .noise{position:absolute;inset:0;width:100%;height:100%;opacity:.055;
    mix-blend-mode:overlay;pointer-events:none}
  @media (prefers-reduced-motion: reduce){ #boot .cap{animation:none;opacity:.8} }
</style>
</head>
<body>
<canvas id="cosmos"></canvas>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>
<div id="grille">
  <div class="scan"></div>
  <svg class="noise" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true">
    <filter id="vbNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" seed="7"/>
      <feColorMatrix type="saturate" values="0.12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.9"/></feComponentTransfer>
    </filter>
    <rect width="100%" height="100%" filter="url(#vbNoise)"/>
  </svg>
  <div class="vig"></div><div class="bezel"></div>
</div>
<div id="boot">
  <div class="halo"></div>
  <svg viewBox="-130 -130 260 260" xmlns="http://www.w3.org/2000/svg" aria-label="VOIDBLOOM">
    <defs>
      <radialGradient id="vbCore" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="30%"  stop-color="#9ef7ff" stop-opacity="0.55"/>
        <stop offset="70%"  stop-color="#7a3bff" stop-opacity="0.16"/>
        <stop offset="100%" stop-color="#7a3bff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="vbEdge" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"   stop-color="#6a2bff"/>
        <stop offset="45%"  stop-color="#c46bff"/>
        <stop offset="100%" stop-color="#9ef7ff"/>
      </linearGradient>
      <linearGradient id="vbEdge2" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"   stop-color="#1c3f6e"/>
        <stop offset="60%"  stop-color="#2fd0c8"/>
        <stop offset="100%" stop-color="#8dff6b"/>
      </linearGradient>
      <linearGradient id="vbRing" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#9ef7ff"/>
        <stop offset="50%"  stop-color="#ff7ae6"/>
        <stop offset="100%" stop-color="#8dff6b"/>
      </linearGradient>
      <filter id="vbGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="2.6" result="b1"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b2"/>
        <feMerge>
          <feMergeNode in="b2"/><feMergeNode in="b1"/>
          <feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="vbWarp" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" result="t">
          <animate attributeName="baseFrequency" dur="21s" values="0.018;0.029;0.018" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <path id="vbP" d="M0,-4 C 24,-28 29,-68 0,-106 C -29,-68 -24,-28 0,-4 Z"/>
      <path id="vbQ" d="M0,-3 C 15,-20 18,-44 0,-68 C -18,-44 -15,-20 0,-3 Z"/>
    </defs>

    <!-- the bloom: outlines, not bodies. Eight long petals turning one way,
         eight short ones turning the other, both pushed about by turbulence -->
    <g filter="url(#vbWarp)">
      <g filter="url(#vbGlow)" fill="#2a0f5c" fill-opacity="0.20"
         stroke="url(#vbEdge)" stroke-width="1.5" stroke-linejoin="round" opacity="0.92">
        <use href="#vbP" transform="rotate(0)"/>   <use href="#vbP" transform="rotate(45)"/>
        <use href="#vbP" transform="rotate(90)"/>  <use href="#vbP" transform="rotate(135)"/>
        <use href="#vbP" transform="rotate(180)"/> <use href="#vbP" transform="rotate(225)"/>
        <use href="#vbP" transform="rotate(270)"/> <use href="#vbP" transform="rotate(315)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="54s" repeatCount="indefinite"/>
      </g>
      <g filter="url(#vbGlow)" fill="none" stroke="url(#vbEdge2)" stroke-width="1.1" opacity="0.6">
        <use href="#vbQ" transform="rotate(22.5)"/>  <use href="#vbQ" transform="rotate(67.5)"/>
        <use href="#vbQ" transform="rotate(112.5)"/> <use href="#vbQ" transform="rotate(157.5)"/>
        <use href="#vbQ" transform="rotate(202.5)"/> <use href="#vbQ" transform="rotate(247.5)"/>
        <use href="#vbQ" transform="rotate(292.5)"/> <use href="#vbQ" transform="rotate(337.5)"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="33s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- three orbits, counter-turning, in front of the bloom -->
    <g fill="none" filter="url(#vbGlow)">
      <circle r="60" stroke="url(#vbRing)" stroke-width="1.4" stroke-opacity="0.85"
              stroke-dasharray="48 14 8 14" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle r="82" stroke="#9ef7ff" stroke-width="1" stroke-opacity="0.6"
              stroke-dasharray="4 13" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle r="112" stroke="#ff7ae6" stroke-width="0.9" stroke-opacity="0.38"
              stroke-dasharray="2 22" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </circle>
      <path d="M 0 -96 A 96 96 0 0 1 68 -68" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.9" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.05;0.95;0.05" dur="3.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- motes riding the orbits -->
    <g filter="url(#vbGlow)">
      <circle r="2.8" fill="#9ef7ff" cx="60" cy="0">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.1" fill="#ff7ae6" cx="-82" cy="0">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle r="1.7" fill="#8dff6b" cx="0" cy="112">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- the seed -->
    <circle r="46" fill="url(#vbCore)">
      <animate attributeName="r" values="40;52;40" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <g filter="url(#vbGlow)">
      <path d="M0,-21 L12,0 L0,21 L-12,0 Z" fill="#04050d" fill-opacity="0.55"
            stroke="#ffffff" stroke-width="1.7" stroke-opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="13s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#ffffff" fill-opacity="0.95"/>
    </g>
  </svg>
  <div class="sub"></div>
  <div class="cap">LOADING</div>
  <div class="bar"><i></i></div>
</div>
<script>
(function(){
'use strict';

/* ========================================================================
   VOIDBLOOM  --  core: math, rng, sprites, shapes, text, input
   ======================================================================== */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sat = v => v < 0 ? 0 : (v > 1 ? 1 : v);
/* ------------------------------------------------------------------- rng
   Everything random in the game goes through rand(). Normally that is just
   Math.random; in a Daily Challenge it becomes a seeded generator, so every
   player gets byte-identical spawns, drafts and boss order for that date. */
let _seed = 0, _seeded = false;
function seedRun(n) { _seed = (n >>> 0) || 1; _seeded = true; }
function unseedRun() { _seeded = false; }
function rand() {
  if (!_seeded) return Math.random();
  _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
/* the day's key, in UTC so the whole world plays the same run */
function dailyKey(d) {
  d = d || new Date();
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
function dailySeed(key) {
  let h = 2166136261;
  for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

const rnd = (a = 1, b) => b === undefined ? rand() * a : a + rand() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b));
const pick = arr => arr[(rand() * arr.length) | 0];
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
const fmtNum = n => {
  n = Math.round(n);
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k';
  return String(n);
};

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------------------------------------------------------------- palette */
const PAL = {
  bg0: '#04050d', bg1: '#0a0a1c', bg2: '#140b26',
  player: '#9ef7ff', playerCore: '#ffffff', playerDeep: '#1d6fa8',
  xp: '#7dffb0', hp: '#ff5470', gold: '#ffd166',
  text: '#dfe7ff', dim: '#7d86ab', danger: '#ff4d6d', boss: '#ff4fd8'
};

/* ------------------------------------------------------------ sprite cache */
const _sprites = new Map();
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  return c;
}
function sprite(key, w, h, draw) {
  let s = _sprites.get(key);
  if (s) return s;
  s = makeCanvas(w, h);
  const c = s.getContext('2d');
  c.translate(s.width / 2, s.height / 2);
  draw(c);
  _sprites.set(key, s);
  return s;
}
function drawSprite(ctx, s, x, y, rot, scale, alpha) {
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (scale !== undefined && scale !== 1) ctx.scale(scale, scale);
  if (alpha !== undefined && alpha !== 1) ctx.globalAlpha *= alpha;
  ctx.drawImage(s, -s.width / 2, -s.height / 2);
  ctx.restore();
}

/* ----------------------------------------------------------------- shapes */
function pathPoly(c, n, r, rot = 0, squash = 1) {
  c.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * TAU;
    const x = Math.cos(a) * r, y = Math.sin(a) * r * squash;
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  }
  c.closePath();
}
function pathStar(c, n, r1, r2, rot = 0) {
  c.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i / (n * 2) * TAU;
    const r = i % 2 ? r2 : r1;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  }
  c.closePath();
}
function pathBlob(c, r, n, wob, seed) {
  const R = mulberry32(seed);
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    const rr = r * (1 - wob / 2 + R() * wob);
    pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
  }
  c.beginPath();
  c.moveTo((pts[0][0] + pts[n - 1][0]) / 2, (pts[0][1] + pts[n - 1][1]) / 2);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  c.closePath();
}

/** Standard neon look: dark core + bright double stroke + glow. */
function neon(c, pathFn, color, opt = {}) {
  const lw = opt.lw === undefined ? 2.4 : opt.lw;
  const blur = opt.blur === undefined ? 14 : opt.blur;
  const core = opt.core === undefined ? 'rgba(6,8,20,0.72)' : opt.core;
  c.save();
  pathFn(c);
  if (core) { c.fillStyle = core; c.fill(); }
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.shadowColor = color; c.shadowBlur = blur;
  c.strokeStyle = color; c.lineWidth = lw;
  c.stroke();
  c.shadowBlur = blur * 0.5;
  c.stroke();
  if (opt.inner !== false) {
    c.shadowBlur = 0;
    c.strokeStyle = opt.innerColor || 'rgba(255,255,255,0.85)';
    c.lineWidth = Math.max(0.7, lw * 0.32);
    c.stroke();
  }
  c.restore();
}

/* ------------------------------------------------------------------- text */
const FONT = '"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
const FONT_MONO = 'ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace';

function setFont(c, size, weight, mono) {
  c.font = (weight || 600) + ' ' + size + 'px ' + (mono ? FONT_MONO : FONT);
}
function text(c, str, x, y, o) {
  o = o || {};
  const size = o.size || 16;
  setFont(c, size, o.weight || 600, o.mono);
  c.textAlign = o.align || 'left';
  c.textBaseline = o.baseline || 'alphabetic';
  c.save();
  if (o.alpha !== undefined) c.globalAlpha *= o.alpha;
  if (o.glow) { c.shadowColor = o.glow === true ? (o.color || PAL.text) : o.glow; c.shadowBlur = o.blur || 14; }
  if (o.stroke) { c.lineWidth = o.strokeW || 3; c.strokeStyle = o.stroke; c.lineJoin = 'round'; c.strokeText(str, x, y); }
  c.fillStyle = o.color || PAL.text;
  c.fillText(str, x, y);
  if (o.glow) { c.shadowBlur = (o.blur || 14) * 0.5; c.fillText(str, x, y); }
  c.restore();
}
function tracked(c, str, x, y, o) {
  o = o || {};
  const size = o.size || 16, tr = o.track === undefined ? size * 0.16 : o.track;
  setFont(c, size, o.weight || 700, o.mono);
  let w = 0;
  for (const ch of str) w += c.measureText(ch).width + tr;
  w -= tr;
  let cx = o.align === 'center' ? x - w / 2 : (o.align === 'right' ? x - w : x);
  if (!o.measureOnly) {
    for (const ch of str) {
      const oo = Object.assign({}, o); oo.align = 'left'; oo.size = size;
      text(c, ch, cx, y, oo);
      setFont(c, size, o.weight || 700, o.mono);
      cx += c.measureText(ch).width + tr;
    }
  }
  return w;
}
function wrapText(c, str, x, y, maxW, lh, o) {
  o = o || {};
  setFont(c, o.size || 12, o.weight || 600, o.mono);
  const words = String(str).split(' ');
  let line = '', ly = y;
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + ' ' + words[i] : words[i];
    if (c.measureText(test).width > maxW && line) {
      text(c, line, x, ly, o); line = words[i]; ly += lh;
      setFont(c, o.size || 12, o.weight || 600, o.mono);
    } else line = test;
  }
  if (line) text(c, line, x, ly, o);
  return ly;
}
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ------------------------------------------------------------------ input */
const Input = {
  keys: Object.create(null),
  pressed: Object.create(null),
  prevGp: Object.create(null),
  gpPressed: Object.create(null),
  mx: 0, my: 0, mdown: false, mclick: false, mmoved: false,
  text: '', textOn: false, textMax: 20,
  touch: { active: false, id: -1, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0 },
  dashTouch: false, dashTouchTap: false, anyKey: false, usedPointer: false, pointerT: 0,

  init(canvas) {
    const norm = e => {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      return k === ' ' ? 'space' : k;
    };
    addEventListener('keydown', e => {
      const k = norm(e);
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'space', 'Tab', '/', 'Backspace'].indexOf(k) >= 0) e.preventDefault();
      if (this.textOn) {
        if (k === 'Backspace') this.text = this.text.slice(0, -1);
        else if (e.key && e.key.length === 1 && this.text.length < this.textMax &&
                 /[A-Za-z0-9 _-]/.test(e.key)) this.text += e.key.toUpperCase();
      }
      if (!this.keys[k]) this.pressed[k] = true;
      this.keys[k] = true;
      this.anyKey = true;
    });
    addEventListener('keyup', e => { this.keys[norm(e)] = false; });
    addEventListener('blur', () => { this.keys = Object.create(null); this.mdown = false; });

    const pos = e => {
      const r = canvas.getBoundingClientRect();
      this.mx = (e.clientX - r.left) / r.width * VW;
      this.my = (e.clientY - r.top) / r.height * VH;
    };
    canvas.addEventListener('mousemove', e => { pos(e); this.mmoved = true; this.usedPointer = true; this.pointerT = 3.2; });
    canvas.addEventListener('mousedown', e => { pos(e); this.mdown = true; this.mclick = true; this.usedPointer = true; this.pointerT = 3.2; });
    addEventListener('mouseup', () => { this.mdown = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    const tpos = (t, r) => ({ x: (t.clientX - r.left) / r.width * VW, y: (t.clientY - r.top) / r.height * VH });
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      for (const t of e.changedTouches) {
        const p = tpos(t, r);
        if (p.x > VW * 0.62 && p.y > VH * 0.55) { this.dashTouch = true; this.dashTouchTap = true; }
        else if (!this.touch.active) {
          this.touch.active = true; this.touch.id = t.identifier;
          this.touch.ox = p.x; this.touch.oy = p.y; this.touch.x = p.x; this.touch.y = p.y;
        }
        this.mx = p.x; this.my = p.y; this.mdown = true; this.mclick = true;
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      for (const t of e.changedTouches) {
        if (t.identifier === this.touch.id) { const p = tpos(t, r); this.touch.x = p.x; this.touch.y = p.y; }
      }
    }, { passive: false });
    const endTouch = e => {
      e.preventDefault();
      for (const t of e.changedTouches) if (t.identifier === this.touch.id) { this.touch.active = false; this.touch.id = -1; }
      if (e.touches.length === 0) { this.dashTouch = false; this.mdown = false; }
    };
    canvas.addEventListener('touchend', endTouch, { passive: false });
    canvas.addEventListener('touchcancel', endTouch, { passive: false });
  },

  pollGamepad() {
    const g = this.gamepad();
    this.gpPressed = Object.create(null);
    if (!g) { this.prevGp = Object.create(null); return; }
    for (let i = 0; i < g.buttons.length; i++) {
      const d = g.buttons[i].pressed;
      if (d && !this.prevGp[i]) this.gpPressed[i] = true;
      this.prevGp[i] = d;
    }
  },
  move() {
    let x = 0, y = 0;
    if (this.keys['a'] || this.keys['ArrowLeft']) x -= 1;
    if (this.keys['d'] || this.keys['ArrowRight']) x += 1;
    if (this.keys['w'] || this.keys['ArrowUp']) y -= 1;
    if (this.keys['s'] || this.keys['ArrowDown']) y += 1;
    const gp = this.gamepad();
    if (gp) {
      const gx = Math.abs(gp.axes[0]) > .22 ? gp.axes[0] : 0;
      const gy = Math.abs(gp.axes[1]) > .22 ? gp.axes[1] : 0;
      if (gx || gy) { x = gx; y = gy; }
      if (gp.buttons[14] && gp.buttons[14].pressed) x = -1;
      if (gp.buttons[15] && gp.buttons[15].pressed) x = 1;
      if (gp.buttons[12] && gp.buttons[12].pressed) y = -1;
      if (gp.buttons[13] && gp.buttons[13].pressed) y = 1;
    }
    if (this.touch.active) {
      let dx = this.touch.x - this.touch.ox, dy = this.touch.y - this.touch.oy;
      const m = Math.hypot(dx, dy), R = 62;
      if (m > R) { dx = dx / m * R; dy = dy / m * R; }
      this.touch.dx = dx; this.touch.dy = dy;
      if (m > 7) { x = dx / R; y = dy / R; }
    }
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    return { x: x, y: y, m: Math.min(1, m) };
  },
  gamepad() {
    if (!navigator.getGamepads) return null;
    const gs = navigator.getGamepads();
    for (const g of gs) if (g && g.connected) return g;
    return null;
  },
  down() { for (let i = 0; i < arguments.length; i++) if (this.keys[arguments[i]]) return true; return false; },
  hit() { for (let i = 0; i < arguments.length; i++) if (this.pressed[arguments[i]]) return true; return false; },
  endFrame() {
    this.pressed = Object.create(null);
    this.mclick = false; this.anyKey = false; this.dashTouchTap = false;
  }
};

/* ------------------------------------------------------------ persistence */
const Save = {
  key: 'voidbloom.save.v1',
  data: { best: 0, bestTime: 0, runs: 0, wins: 0, kills: 0, mute: false, seen: false, lastDiff: 'medium', diffBest: {}, diffTime: {}, diffWins: {}, diffTide: {}, shards: 0, owned: ['seed'], skin: 'seed', dailyLog: [], achs: {}, bossSeen: {}, conquest: null, pets: null, pet: 'mote', petMode: 1, petStats: null },
  dailyRec(key) {
    if (!this.data.dailyLog) this.data.dailyLog = [];
    let r = this.data.dailyLog.find(x => x.d === key);
    if (!r) { r = { d: key, best: 0, time: 0, runs: 0, cleared: 0 }; this.data.dailyLog.push(r); }
    while (this.data.dailyLog.length > 14) this.data.dailyLog.shift();
    return r;
  },
  load() {
    try { const s = localStorage.getItem(this.key); if (s) Object.assign(this.data, JSON.parse(s)); }
    catch (e) { }
    // an existing save predates pets entirely -- fill it in rather than migrate
    if (!Array.isArray(this.data.pets)) this.data.pets = ['mote'];
    if (!this.data.pet) this.data.pet = 'mote';
    if (this.data.petMode === undefined) this.data.petMode = 1;
    if (!this.data.petStats) this.data.petStats = {};
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { } }
};

/* ========================================================================
   AUDIO  --  fully synthesised: no asset files, ever.
   ======================================================================== */
const Sound = {
  ctx: null, master: null, sfxBus: null, musBus: null, noise: null,
  ok: false, muted: false, started: false,
  _budget: 0, _lastAt: Object.create(null),
  intensity: 0, targetIntensity: 0,

  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = new AC();
      this.ctx = c;
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 24; comp.ratio.value = 6;
      comp.attack.value = 0.004; comp.release.value = 0.22;
      const m = c.createGain(); m.gain.value = 0.9;
      m.connect(comp); comp.connect(c.destination);
      this.master = m;
      this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.85; this.sfxBus.connect(m);
      this.musBus = c.createGain(); this.musBus.gain.value = 0.0; this.musBus.connect(m);
      // reverb-ish: short feedback delay on the music bus
      const dly = c.createDelay(1.0); dly.delayTime.value = 0.28;
      const fb = c.createGain(); fb.gain.value = 0.32;
      const wet = c.createGain(); wet.gain.value = 0.3;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      this.musBus.connect(dly); dly.connect(lp); lp.connect(fb); fb.connect(dly); lp.connect(wet); wet.connect(m);
      this.sfxBus.connect(dly);
      // noise buffer
      const n = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
      const d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = rand() * 2 - 1;
      this.noise = n;
      this.ok = true;
      this.setMuted(Save.data.mute);
    } catch (e) { this.ok = false; }
  },
  resume() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    this.started = true;
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.02);
  },
  toggleMute() { this.setMuted(!this.muted); Save.data.mute = this.muted; Save.save(); },
  frame() { this._budget = 14; },
  _can(tag, gap) {
    if (!this.ok || this.muted) return false;
    if (this._budget <= 0) return false;
    const t = this.ctx.currentTime;
    if (gap && this._lastAt[tag] !== undefined && t - this._lastAt[tag] < gap) return false;
    this._lastAt[tag] = t; this._budget--;
    return true;
  },

  _env(node, t, a, d, peak) {
    const g = node.gain;
    g.setValueAtTime(0.0001, t);
    g.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  _tone(opt) {
    const c = this.ctx, t = opt.t || c.currentTime;
    const o = c.createOscillator();
    o.type = opt.type || 'sine';
    o.frequency.setValueAtTime(opt.f, t);
    if (opt.f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, opt.f2), t + (opt.slide || opt.d || .1));
    const g = c.createGain();
    this._env(g, t, opt.a === undefined ? 0.005 : opt.a, opt.d || 0.12, opt.v === undefined ? 0.3 : opt.v);
    let last = o;
    if (opt.filter) {
      const f = c.createBiquadFilter(); f.type = opt.filter; f.frequency.value = opt.ff || 1200;
      f.Q.value = opt.q || 1; o.connect(f); last = f;
      if (opt.ff2) f.frequency.exponentialRampToValueAtTime(Math.max(40, opt.ff2), t + (opt.d || .12));
    }
    last.connect(g); g.connect(opt.bus || this.sfxBus);
    o.start(t); o.stop(t + (opt.a || 0.005) + (opt.d || 0.12) + 0.05);
    return o;
  },
  _noiseHit(opt) {
    const c = this.ctx, t = opt.t || c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    s.playbackRate.value = opt.rate || 1;
    const f = c.createBiquadFilter();
    f.type = opt.filter || 'bandpass';
    f.frequency.setValueAtTime(opt.ff || 1400, t);
    if (opt.ff2) f.frequency.exponentialRampToValueAtTime(Math.max(60, opt.ff2), t + (opt.d || .12));
    f.Q.value = opt.q || 1.2;
    const g = c.createGain();
    this._env(g, t, opt.a === undefined ? 0.002 : opt.a, opt.d || 0.1, opt.v === undefined ? 0.25 : opt.v);
    s.connect(f); f.connect(g); g.connect(opt.bus || this.sfxBus);
    s.start(t); s.stop(t + (opt.d || 0.1) + 0.08);
  },

  /* ------------------------------------------------------------- sfx api */
  hit(pitch) {
    if (!this._can('hit', 0.018)) return;
    const p = 1 + (pitch || 0) * 0.25;
    this._noiseHit({ ff: 2600 * p, ff2: 700, d: 0.055, v: 0.1, q: 0.9 });
    this._tone({ type: 'square', f: 420 * p, f2: 190, d: 0.05, v: 0.05 });
  },
  crit() {
    if (!this._can('crit', 0.05)) return;
    this._tone({ type: 'triangle', f: 1200, f2: 2400, d: 0.09, v: 0.14 });
    this._noiseHit({ ff: 5200, ff2: 1400, d: 0.09, v: 0.08 });
  },
  kill(big) {
    if (!this._can('kill', big ? 0 : 0.03)) return;
    this._noiseHit({ ff: big ? 900 : 1700, ff2: 120, d: big ? 0.42 : 0.16, v: big ? 0.28 : 0.13, filter: 'lowpass', q: 1 });
    this._tone({ type: 'sine', f: big ? 180 : 300, f2: big ? 42 : 70, d: big ? 0.4 : 0.14, v: big ? 0.28 : 0.1 });
  },
  shoot(kind) {
    if (!this._can('sh' + (kind || 0), 0.045)) return;
    const c = this.ctx;
    if (kind === 'beam') { this._tone({ type: 'sawtooth', f: 900, f2: 260, d: 0.16, v: 0.08, filter: 'lowpass', ff: 3000, ff2: 500 }); }
    else if (kind === 'arc') { this._noiseHit({ ff: 4200, ff2: 1800, d: 0.12, v: 0.09, q: 6 }); }
    else if (kind === 'nova') { this._tone({ type: 'sine', f: 120, f2: 480, d: 0.34, v: 0.16 }); this._noiseHit({ ff: 400, ff2: 3000, d: 0.34, v: 0.07 }); }
    else if (kind === 'lash') { this._noiseHit({ ff: 900, ff2: 3400, d: 0.13, v: 0.09, q: 1.6 }); }
    else this._tone({ type: 'triangle', f: 660, f2: 330, d: 0.07, v: 0.07 });
  },
  pickup(n) {
    if (!this._can('pk', 0.028)) return;
    const step = [0, 2, 4, 7, 9, 12, 14, 16][Math.min(7, (n || 0) % 8)];
    this._tone({ type: 'triangle', f: 520 * Math.pow(2, step / 12), d: 0.11, v: 0.07, a: 0.002 });
  },
  coin() {
    if (!this._can('coin', 0.04)) return;
    const t = this.ctx.currentTime;
    this._tone({ type: 'square', f: 990, d: 0.06, v: 0.06, t: t });
    this._tone({ type: 'square', f: 1480, d: 0.11, v: 0.06, t: t + 0.055 });
  },
  hurt() {
    if (!this._can('hurt', 0.12)) return;
    this._tone({ type: 'sawtooth', f: 220, f2: 55, d: 0.3, v: 0.3, filter: 'lowpass', ff: 900, ff2: 180 });
    this._noiseHit({ ff: 500, ff2: 90, d: 0.3, v: 0.16, filter: 'lowpass' });
  },
  dash() {
    if (!this._can('dash', 0.08)) return;
    this._noiseHit({ ff: 300, ff2: 4200, d: 0.2, v: 0.1, q: 0.8 });
  },
  levelUp() {
    if (!this.ok || this.muted) return;
    const t = this.ctx.currentTime;
    [0, 4, 7, 12].forEach((s, i) => {
      this._tone({ type: 'triangle', f: 392 * Math.pow(2, s / 12), d: 0.5, v: 0.11, t: t + i * 0.07, a: 0.006 });
    });
  },
  achieve() {
    if (!this.ok || this.muted) return;
    const t = this.ctx.currentTime;
    [0, 5, 12].forEach((n, i) => {
      this._tone({ type: 'triangle', f: 587 * Math.pow(2, n / 12), d: 0.42, v: 0.1, t: t + i * 0.055, a: 0.004 });
    });
    this._tone({ type: 'sine', f: 1760, d: 0.5, v: 0.045, t: t + 0.11, a: 0.01 });
  },
  ui(sel) {
    if (!this._can('ui', 0.03)) return;
    this._tone({ type: 'square', f: sel ? 780 : 480, f2: sel ? 1170 : 520, d: 0.07, v: 0.05 });
  },
  bossHorn() {
    if (!this.ok || this.muted) return;
    const t = this.ctx.currentTime;
    [55, 82.4, 110].forEach((f, i) => {
      this._tone({ type: 'sawtooth', f: f, d: 1.6, v: 0.2, a: 0.12, t: t + i * 0.02, filter: 'lowpass', ff: 700, ff2: 2400 });
    });
    this._noiseHit({ ff: 200, ff2: 60, d: 1.5, v: 0.14, filter: 'lowpass' });
  },
  fanfare(win) {
    if (!this.ok || this.muted) return;
    const t = this.ctx.currentTime;
    const seq = win ? [0, 7, 12, 16, 19, 24] : [0, -3, -5, -8];
    seq.forEach((s, i) => {
      this._tone({ type: win ? 'triangle' : 'sawtooth', f: 330 * Math.pow(2, s / 12), d: win ? 0.7 : 1.1, v: 0.13, t: t + i * 0.13, a: 0.01, filter: 'lowpass', ff: 2600 });
    });
  },

  /* ----------------------------------------------------------- the music */
  mus: { next: 0, step: 0, bpm: 104, on: false },
  startMusic() {
    if (!this.ok) return;
    this.mus.on = true; this.mus.step = 0;
    this.mus.next = this.ctx.currentTime + 0.1;
    this.musBus.gain.setTargetAtTime(0.55, this.ctx.currentTime, 1.2);
  },
  stopMusic(fast) {
    if (!this.ok) return;
    this.mus.on = false;
    this.musBus.gain.setTargetAtTime(0, this.ctx.currentTime, fast ? 0.08 : 0.5);
  },
  setIntensity(v) { this.targetIntensity = sat(v); },
  tickMusic() {
    if (!this.ok || !this.mus.on) return;
    this.intensity += (this.targetIntensity - this.intensity) * 0.02;
    const c = this.ctx, m = this.mus;
    const spb = 60 / (m.bpm + this.intensity * 22) / 4; // 16th note
    while (m.next < c.currentTime + 0.25) {
      this._schedStep(m.step, m.next, spb);
      m.step++;
      m.next += spb;
    }
  },
  _schedStep(step, t, spb) {
    const I = this.intensity;
    const bar = (step / 16) | 0;
    const s = step % 16;
    const prog = [0, -4, -7, -5];               // Am F C(ish) Dm-ish walk
    const root = 55 * Math.pow(2, prog[bar % 4] / 12);
    const bus = this.musBus;
    const SCALE = [0, 2, 3, 5, 7, 8, 10];

    // ---- bass
    if (s % 4 === 0) {
      const o = this.ctx.createOscillator(); o.type = 'sawtooth';
      const o2 = this.ctx.createOscillator(); o2.type = 'sawtooth'; o2.detune.value = 9;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(180 + I * 500, t); f.Q.value = 4;
      const g = this.ctx.createGain();
      const v = 0.16 + I * 0.05;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + spb * 3.4);
      o.frequency.value = root; o2.frequency.value = root;
      o.connect(f); o2.connect(f); f.connect(g); g.connect(bus);
      o.start(t); o2.start(t); o.stop(t + spb * 4); o2.stop(t + spb * 4);
    }
    // ---- pad (sustained, every bar)
    if (s === 0) {
      [0, 3, 7, 10].forEach((iv, i) => {
        const o = this.ctx.createOscillator(); o.type = 'triangle';
        o.frequency.value = root * 4 * Math.pow(2, iv / 12);
        o.detune.value = (i - 1.5) * 6;
        const g = this.ctx.createGain();
        const v = 0.028 + I * 0.02;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(v, t + 0.5);
        g.gain.exponentialRampToValueAtTime(0.0001, t + spb * 15);
        o.connect(g); g.connect(bus);
        o.start(t); o.stop(t + spb * 16);
      });
    }
    // ---- kick
    if (I > 0.08 && (s === 0 || s === 6 || s === 10)) {
      const o = this.ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.32, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.28);
    }
    // ---- hat
    if (I > 0.25 && s % 2 === 1) {
      const src = this.ctx.createBufferSource(); src.buffer = this.noise;
      src.playbackRate.value = 1.7;
      const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
      const g = this.ctx.createGain();
      const v = 0.035 + I * 0.03;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      src.connect(f); f.connect(g); g.connect(bus);
      src.start(t); src.stop(t + 0.09);
    }
    // ---- arp
    if (I > 0.45 && s % 2 === 0) {
      const n = SCALE[(step * 3) % 7];
      const o = this.ctx.createOscillator(); o.type = 'square';
      o.frequency.value = root * 8 * Math.pow(2, n / 12);
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.value = 1400 + I * 3200; f.Q.value = 6;
      const g = this.ctx.createGain();
      const v = 0.03 + I * 0.028;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + spb * 1.6);
      o.connect(f); f.connect(g); g.connect(bus);
      o.start(t); o.stop(t + spb * 2);
    }
    // ---- snare
    if (I > 0.6 && (s === 4 || s === 12)) {
      const src = this.ctx.createBufferSource(); src.buffer = this.noise;
      const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.7;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      src.connect(f); f.connect(g); g.connect(bus);
      src.start(t); src.stop(t + 0.2);
    }
  }
};

   FX  --  particles, damage numbers, camera, shake, background

/* radial glow sprite, tinted at draw time via globalCompositeOperation */
function glowSprite(color) {
  return sprite('glow_' + color, 128, 128, c => {
    const g = c.createRadialGradient(0, 0, 0, 0, 0, 64);
    g.addColorStop(0, color);
    g.addColorStop(0.25, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.globalAlpha = 1;
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, 64, 0, TAU); c.fill();
  });
}

const Particles = {
  pool: [], live: [], max: 2600,
  get() {
    let p = this.pool.pop();
    if (!p) p = {};
    this.live.push(p);
    return p;
  },
  clear() { while (this.live.length) this.pool.push(this.live.pop()); },

  spark(x, y, a, spd, o) {
    o = o || {};
    if (this.live.length > this.max) return;
    const p = this.get();
    p.t = 'spark'; p.x = x; p.y = y;
    p.vx = Math.cos(a) * spd; p.vy = Math.sin(a) * spd;
    p.life = p.max = o.life || rnd(0.22, 0.5);
    p.col = o.col || '#fff'; p.w = o.w || 2; p.len = o.len || 1;
    p.drag = o.drag === undefined ? 3.4 : o.drag;
    p.grav = o.grav || 0;
    return p;
  },
  shard(x, y, a, spd, o) {
    o = o || {};
    if (this.live.length > this.max) return;
    const p = this.get();
    p.t = 'shard'; p.x = x; p.y = y;
    p.vx = Math.cos(a) * spd; p.vy = Math.sin(a) * spd;
    p.life = p.max = o.life || rnd(0.3, 0.6);
    p.col = o.col || '#fff'; p.r = o.r || rnd(2.5, 5);
    p.rot = rnd(TAU); p.spin = rnd(-9, 9);
    p.drag = o.drag === undefined ? 2.2 : o.drag;
    p.sides = o.sides || 3;
    return p;
  },
  ring(x, y, r0, r1, o) {
    o = o || {};
    const p = this.get();
    p.t = 'ring'; p.x = x; p.y = y;
    p.r0 = r0; p.r1 = r1;
    p.life = p.max = o.life || 0.4;
    p.col = o.col || '#fff'; p.w = o.w || 3;
    p.vx = o.vx || 0; p.vy = o.vy || 0;
    p.squash = o.squash || 1;
    return p;
  },
  puff(x, y, o) {
    o = o || {};
    if (this.live.length > this.max) return;
    const p = this.get();
    p.t = 'puff'; p.x = x; p.y = y;
    p.vx = o.vx || rnd(-14, 14); p.vy = o.vy || rnd(-14, 14);
    p.life = p.max = o.life || rnd(0.5, 1.1);
    p.col = o.col || '#7b5cff'; p.r = o.r || rnd(8, 20);
    p.grow = o.grow === undefined ? 26 : o.grow;
    p.alpha = o.alpha === undefined ? 0.5 : o.alpha;
    return p;
  },
  burst(x, y, n, col, o) {
    o = o || {};
    for (let i = 0; i < n; i++) {
      const a = o.dir === undefined ? rnd(TAU) : o.dir + rnd(-(o.spread || 0.6), (o.spread || 0.6));
      this.spark(x, y, a, rnd(o.spd0 || 90, o.spd1 || 320), { col: col, life: rnd(0.2, o.life || 0.55), w: o.w || 2, len: o.len || 1.4 });
    }
  },
  update(dt) {
    for (let i = this.live.length - 1; i >= 0; i--) {
      const p = this.live[i];
      p.life -= dt;
      if (p.life <= 0) { this.live.splice(i, 1); this.pool.push(p); continue; }
      if (p.t === 'ring') { p.x += p.vx * dt; p.y += p.vy * dt; continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.grav) p.vy += p.grav * dt;
      if (p.drag) { const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f; }
      if (p.t === 'shard') p.rot += p.spin * dt;
      if (p.t === 'puff') p.r += p.grow * dt;
    }
  },
  draw(c) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.lineCap = 'round';
    for (const p of this.live) {
      const k = p.life / p.max;
      if (p.t === 'puff') {
        const s = glowSprite(p.col);
        c.globalAlpha = p.alpha * k * k;
        const sc = p.r / 48;
        c.drawImage(s, p.x - 64 * sc, p.y - 64 * sc, 128 * sc, 128 * sc);
      } else if (p.t === 'spark') {
        c.globalAlpha = k;
        c.strokeStyle = p.col;
        c.lineWidth = p.w * (0.35 + k * 0.65);
        c.beginPath();
        c.moveTo(p.x, p.y);
        c.lineTo(p.x - p.vx * 0.018 * p.len, p.y - p.vy * 0.018 * p.len);
        c.stroke();
      } else if (p.t === 'shard') {
        c.globalAlpha = k;
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.strokeStyle = p.col; c.lineWidth = 1.8;
        c.fillStyle = 'rgba(0,0,0,0.35)';
        pathPoly(c, p.sides, p.r * (0.35 + k * 0.65));
        c.fill(); c.stroke();
        c.restore();
      } else if (p.t === 'ring') {
        const e = 1 - k;
        c.globalAlpha = k * k;
        c.strokeStyle = p.col;
        c.lineWidth = p.w * k;
        c.save(); c.translate(p.x, p.y); c.scale(1, p.squash);
        c.beginPath(); c.arc(0, 0, lerp(p.r0, p.r1, easeOut(e)), 0, TAU); c.stroke();
        c.restore();
      }
    }
    c.restore();
  }
};

/* ------------------------------------------------------------ pop numbers */
const Pops = {
  live: [],
  add(x, y, str, o) {
    o = o || {};
    if (this.live.length > 190) this.live.shift();
    this.live.push({
      x: x + rnd(-6, 6), y: y, s: str,
      vx: o.vx === undefined ? rnd(-26, 26) : o.vx,
      vy: o.vy === undefined ? rnd(-96, -68) : o.vy,
      life: o.life || 0.72, max: o.life || 0.72,
      col: o.col || '#fff', size: o.size || 15, crit: o.crit || false
    });
  },
  clear() { this.live.length = 0; },
  update(dt) {
    for (let i = this.live.length - 1; i >= 0; i--) {
      const p = this.live[i];
      p.life -= dt;
      if (p.life <= 0) { this.live.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 190 * dt; p.vx *= Math.exp(-2 * dt);
    }
  },
  draw(c) {
    for (const p of this.live) {
      const k = p.life / p.max;
      const pop = p.crit ? 1 + (1 - k) * 0.25 : 1;
      const sz = p.size * (k > .8 ? 0.6 + (1 - k) * 2 : 1) * pop;
      text(c, p.s, p.x, p.y, {
        size: sz, weight: p.crit ? 900 : 800, align: 'center', color: p.col,
        alpha: Math.min(1, k * 2.2), stroke: 'rgba(2,3,10,0.85)', strokeW: 3.5,
        glow: p.crit ? p.col : null, blur: 10
      });
    }
  }
};

/* ----------------------------------------------------------------- camera */
const Cam = {
  x: 0, y: 0, tx: 0, ty: 0, trauma: 0, shakeX: 0, shakeY: 0, zoom: 1, tzoom: 1, ang: 0,
  reset(x, y) { this.x = this.tx = x; this.y = this.ty = y; this.trauma = 0; this.zoom = this.tzoom = 1; },
  shake(v) { this.trauma = Math.min(1, this.trauma + v); },
  update(dt, tx, ty, lookx, looky) {
    this.tx = tx + (lookx || 0); this.ty = ty + (looky || 0);
    const k = 1 - Math.exp(-9 * dt);
    this.x += (this.tx - this.x) * k;
    this.y += (this.ty - this.y) * k;
    this.zoom += (this.tzoom - this.zoom) * (1 - Math.exp(-3 * dt));
    this.trauma = Math.max(0, this.trauma - dt * 1.7);
    const t = this.trauma * this.trauma;
    const sh = Settings.shake;
    this.shakeX = rnd(-1, 1) * 26 * t * sh;
    this.shakeY = rnd(-1, 1) * 26 * t * sh;
    this.ang = rnd(-1, 1) * 0.012 * t * sh;
  }
};

/* ------------------------------------------------------------- full flash */
const Flash = {
  a: 0, col: '#fff', vig: 0, vigCol: PAL.hp,
  hit(col, a) { this.col = col; this.a = Math.max(this.a, a * Settings.flash); },
  // the damage vignette is how you know you were hit, so it never goes fully dark
  vignette(col, a) { this.vigCol = col; this.vig = Math.max(this.vig, a * Math.max(0.45, Settings.flash)); },
  update(dt) { this.a = Math.max(0, this.a - dt * 3.4); this.vig = Math.max(0, this.vig - dt * 2.6); },
  draw(c) {
    if (this.a > 0.001) {
      c.save(); c.globalCompositeOperation = 'lighter';
      c.globalAlpha = this.a; c.fillStyle = this.col;
      c.fillRect(0, 0, VW, VH); c.restore();
    }
    if (this.vig > 0.001) {
      const g = c.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.24, VW / 2, VH / 2, Math.max(VW, VH) * 0.62);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, this.vigCol);
      c.save(); c.globalAlpha = this.vig; c.fillStyle = g;
      c.fillRect(0, 0, VW, VH); c.restore();
    }
  }
};

/* ------------------------------------------------------------- background */
const Backdrop = {
  layers: [], nebulae: [], built: false, lite: false,
  build() {
    if (this.built) return;
    this.built = true;
    const defs = [
      { n: 190, par: 0.12, size: [0.6, 1.3], col: ['#5a6ea8', '#7f8fd0', '#4b5c92'], tile: 700 },
      { n: 120, par: 0.30, size: [0.9, 2.0], col: ['#9fb4ff', '#cfe0ff', '#7c93e0'], tile: 620 },
      { n: 46, par: 0.55, size: [1.4, 2.9], col: ['#ffffff', '#bfe6ff', '#ffe6c9'], tile: 540 }
    ];
    this.layers = defs.map((d, li) => {
      const t = makeCanvas(d.tile, d.tile);
      const c = t.getContext('2d');
      const R = mulberry32(1337 + li * 977);
      for (let i = 0; i < d.n; i++) {
        const x = R() * d.tile, y = R() * d.tile;
        const r = d.size[0] + R() * (d.size[1] - d.size[0]);
        const col = d.col[(R() * d.col.length) | 0];
        c.globalAlpha = 0.35 + R() * 0.65;
        c.fillStyle = col;
        c.shadowColor = col; c.shadowBlur = r * 3.2;
        c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
      }
      return { canvas: t, par: d.par, size: d.tile };
    });
    const R = mulberry32(90210);
    for (let i = 0; i < 9; i++) {
      this.nebulae.push({
        x: (R() - 0.5) * 5200, y: (R() - 0.5) * 5200,
        r: 460 + R() * 900,
        col: ['rgba(88,40,160,0.30)', 'rgba(20,80,150,0.26)', 'rgba(150,30,110,0.20)', 'rgba(20,120,120,0.18)'][(R() * 4) | 0],
        par: 0.62 + R() * 0.2, ph: R() * TAU, sp: 0.06 + R() * 0.1
      });
    }
  },
  draw(c, time) {
    this.build();
    const g = c.createLinearGradient(0, 0, VW * 0.35, VH);
    g.addColorStop(0, PAL.bg0); g.addColorStop(0.55, PAL.bg1);
    g.addColorStop(1, CUR_SKY && CUR_SKY.bg0 ? CUR_SKY.bg0 : SKY_BASE.bg2);
    c.fillStyle = g; c.fillRect(0, 0, VW, VH);

    // nebulae (world space, parallaxed)
    c.save();
    c.globalCompositeOperation = 'lighter';
    if (!this.lite) for (const n of this.nebulae) {
      const sx = VW / 2 + (n.x - Cam.x * n.par) * Cam.zoom;
      const sy = VH / 2 + (n.y - Cam.y * n.par) * Cam.zoom;
      const r = n.r * Cam.zoom * (1 + Math.sin(time * n.sp + n.ph) * 0.06);
      if (sx < -r || sx > VW + r || sy < -r || sy > VH + r) continue;
      c.drawImage(glowSprite(n.col), sx - r, sy - r, r * 2, r * 2);
    }
    c.restore();

    // star layers
    c.save();
    for (let li = 0; li < this.layers.length; li++) {
      if (this.lite && li === 0) continue;
      const L = this.layers[li];
      const ox = -(Cam.x * L.par) % L.size, oy = -(Cam.y * L.par) % L.size;
      const p = c.createPattern(L.canvas, 'repeat');
      c.save();
      c.translate(ox, oy);
      c.fillStyle = p;
      c.fillRect(-ox - L.size, -oy - L.size, VW + L.size * 2, VH + L.size * 2);
      c.restore();
    }
    c.restore();
    // a world tints the sky it hangs in -- strongest at the edges, so the
    // middle of the screen (where you actually read bullets) stays clean
    if (CUR_SKY && CUR_SKY.wash) {
      c.save();
      const wg = c.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.16, VW / 2, VH / 2, Math.max(VW, VH) * 0.72);
      wg.addColorStop(0, 'rgba(0,0,0,0)');
      wg.addColorStop(0.45, CUR_SKY.wash.replace(/[\d.]+\)$/, '0.10)'));
      wg.addColorStop(1, CUR_SKY.wash);
      c.fillStyle = wg; c.fillRect(0, 0, VW, VH);
      c.restore();
    }
  }
};

/* --------------------------------------------------------- world grid/arena */
function drawArena(c, time, radius) {
  const S = CUR_SKY;
  const ringCol  = S && S.ring ? S.ring : 'rgba(90,120,220,0.10)';
  const spokeCol = S && S.ring ? S.ring.replace(/[\d.]+\)$/, '0.055)') : 'rgba(90,120,220,0.055)';
  const wallCol  = S && S.wall ? S.wall : 'rgba(120,90,255,0.5)';
  const coreCol  = S && S.wallCore ? S.wallCore : 'rgba(220,200,255,0.5)';
  const glowCol  = S && S.glow ? S.glow : '#7b5cff';
  const spokeN   = S && S.spokes !== undefined ? S.spokes : 12;
  const gap      = S && S.gap ? S.gap : 400;
  c.save();
  c.globalCompositeOperation = 'lighter';
  // faint concentric rings
  c.strokeStyle = ringCol;
  c.lineWidth = 1.4;
  for (let r = gap; r < radius; r += gap) {
    c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke();
  }
  // spokes
  c.strokeStyle = spokeCol;
  const spin = (typeof G !== 'undefined' && G.arenaSpin) ? G.arenaSpin : 0;
  for (let i = 0; i < spokeN; i++) {
    const a = i / spokeN * TAU + spin;
    c.beginPath(); c.moveTo(Math.cos(a) * 260, Math.sin(a) * 260);
    c.lineTo(Math.cos(a) * radius, Math.sin(a) * radius); c.stroke();
  }
  // boundary
  const pulse = 0.55 + Math.sin(time * 1.6) * 0.14;
  c.globalAlpha = pulse;
  c.strokeStyle = wallCol;
  c.shadowColor = glowCol; c.shadowBlur = 22;
  c.lineWidth = 5;
  c.beginPath(); c.arc(0, 0, radius, 0, TAU); c.stroke();
  c.lineWidth = 1.6;
  c.strokeStyle = coreCol;
  c.beginPath(); c.arc(0, 0, radius, 0, TAU); c.stroke();
  c.globalAlpha = 1;
  // dashes just outside
  c.shadowBlur = 0;
  c.strokeStyle = S && S.wall ? S.wall.replace(/[\d.]+\)$/, '0.22)') : 'rgba(160,120,255,0.22)';
  c.lineWidth = 12;
  c.setLineDash([26, 40]);
  c.lineDashOffset = -time * 26;
  c.beginPath(); c.arc(0, 0, radius + 22, 0, TAU); c.stroke();
  c.setLineDash([]);
  c.restore();
}

/* =======================================================================
   BossFX -- the parts that make a boss read as a creature and not a badge

   Everything here draws in a LOCAL space centred on 0,0, so a boss block
   does: c.save(); c.translate(this.x, this.y); ...; c.restore().

   All motion is driven off G.time, never off frame count, so it runs at
   the same speed on a 30fps laptop and a 144Hz monitor.
   ======================================================================= */
const BossFX = {

  /* A body that never sits still. Two incommensurate sines, so the loop
     is long enough that the eye never catches it repeating. */
  breathe(t, rate, amt) {
    return 1 + Math.sin(t * rate) * amt + Math.sin(t * rate * 1.73 + 1.3) * amt * 0.42;
  },

  /* Ease for a wind-up: slow gather, fast release. */
  gather(u) { return u < 0.7 ? (u / 0.7) * (u / 0.7) : 1 - (u - 0.7) / 0.3; },

  /* ------------------------------------------------------------------
     A jointed limb.

     The wave travels: each joint lags the one before it by `phase`, which
     is what separates a tentacle from a rigid stick on a hinge. Returns
     the tip so the caller can hang a claw or an eye off the end.
     ------------------------------------------------------------------ */
  limb(c, o) {
    const segs = o.segs || 5;
    const taper = o.taper === undefined ? 0.88 : o.taper;
    const amp = o.amp === undefined ? 0.34 : o.amp;
    const phase = o.phase === undefined ? 0.9 : o.phase;
    const speed = o.speed === undefined ? 2.2 : o.speed;
    const t = o.t || 0;
    let px = o.x || 0, py = o.y || 0, a = o.ang || 0, L = o.len || 14;
    const lw0 = o.lw === undefined ? 3.0 : o.lw;
    for (let i = 0; i < segs; i++) {
      a += amp * Math.sin(t * speed - i * phase + (o.off || 0)) + (o.curl || 0);
      const nx = px + Math.cos(a) * L, ny = py + Math.sin(a) * L;
      const w = lw0 * (1 - i / segs * 0.72);
      const x0 = px, y0 = py, x1 = nx, y1 = ny;
      neon(c, cc => { cc.beginPath(); cc.moveTo(x0, y0); cc.lineTo(x1, y1); },
        o.col, { lw: Math.max(0.8, w), blur: o.blur === undefined ? 14 : o.blur, core: null, inner: false });
      // a knuckle at every joint reads as a real articulation, not a bend
      if (o.joints !== false && i < segs - 1) {
        neon(c, cc => { cc.beginPath(); cc.arc(x1, y1, Math.max(1, w * 0.5), 0, TAU); },
          o.jointCol || o.col, { lw: 1, blur: 7, core: null, inner: false });
      }
      px = nx; py = ny; L *= taper;
    }
    return { x: px, y: py, a: a };
  },

  /* One shell of a layered body. Drawn as an arc set with gaps so the
     layer beneath shows through -- depth without a second canvas. */
  shell(c, o) {
    const n = o.arcs || 3, gap = o.gap === undefined ? 0.5 : o.gap;
    const span = TAU / n - gap;
    for (let i = 0; i < n; i++) {
      const a0 = (o.rot || 0) + i / n * TAU;
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, o.r, a0, a0 + span); },
        o.col, { lw: o.lw === undefined ? 2.4 : o.lw, blur: o.blur === undefined ? 16 : o.blur, core: null, inner: false });
    }
  },

  /* An eye that finds the player. A boss with one of these stops being a
     shape and becomes a thing that knows you are there. */
  eye(c, o) {
    const x = o.x || 0, y = o.y || 0, r = o.r || 10;
    const open = o.open === undefined ? 1 : Math.max(0, Math.min(1, o.open));
    const col = o.col || '#ffffff';
    if (open < 0.12) {
      neon(c, cc => { cc.beginPath(); cc.moveTo(x - r, y); cc.quadraticCurveTo(x, y + r * 0.22, x + r, y); },
        col, { lw: 2, blur: 12, core: null, inner: false });
      return;
    }
    // the lens
    neon(c, cc => {
      cc.beginPath();
      cc.moveTo(x - r, y);
      cc.quadraticCurveTo(x, y - r * 0.92 * open, x + r, y);
      cc.quadraticCurveTo(x, y + r * 0.92 * open, x - r, y);
      cc.closePath();
    }, col, { lw: o.lw === undefined ? 2.2 : o.lw, blur: 16, core: o.core || 'rgba(4,6,18,0.86)' });
    // the pupil rides toward whatever it is looking at
    const la = o.look || 0;
    const px = x + Math.cos(la) * r * 0.36, py = y + Math.sin(la) * r * 0.30 * open;
    neon(c, cc => { cc.beginPath(); cc.ellipse(px, py, r * 0.34, r * 0.34 * open, 0, 0, TAU); },
      o.iris || '#dfefff', { lw: 1.6, blur: 12, core: 'rgba(6,8,20,0.8)' });
    neon(c, cc => { cc.beginPath(); cc.arc(px, py, r * 0.13, 0, TAU); },
      '#ffffff', { lw: 1.4, blur: 14, core: null, inner: false });
  },

  /* An armour plate: dark body, hot leading edge. The shmup rule -- put a
     bright value hard against a dark one and the shape reads instantly. */
  plate(c, o) {
    const pts = o.pts;
    neon(c, cc => {
      cc.beginPath(); cc.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) cc.lineTo(pts[i][0], pts[i][1]);
      cc.closePath();
    }, o.col, { lw: o.lw === undefined ? 2.2 : o.lw, blur: o.blur === undefined ? 15 : o.blur,
                core: o.core === undefined ? 'rgba(6,8,20,0.82)' : o.core });
    if (o.edge) {
      neon(c, cc => { cc.beginPath(); cc.moveTo(pts[0][0], pts[0][1]); cc.lineTo(pts[1][0], pts[1][1]); },
        o.edge, { lw: 1.6, blur: 11, core: null, inner: false });
    }
  },

  /* A ribbon that lags behind the body -- follow-through, the cheapest
     way to make something feel like it has mass. */
  streamer(c, o) {
    const n = o.segs || 9;
    const t = o.t || 0;
    c.beginPath();
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const d = (o.len || 40) * u;
      const sway = Math.sin(t * (o.speed || 3) - u * (o.phase || 4)) * (o.amp || 10) * u;
      const a = (o.ang || 0);
      const x = Math.cos(a) * d - Math.sin(a) * sway;
      const y = Math.sin(a) * d + Math.cos(a) * sway;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.strokeStyle = o.col; c.shadowColor = o.col; c.shadowBlur = o.blur === undefined ? 12 : o.blur;
    c.lineWidth = o.lw === undefined ? 2 : o.lw; c.lineCap = 'round';
    c.globalAlpha = (o.alpha === undefined ? 0.75 : o.alpha);
    c.stroke();
    c.globalAlpha = 1; c.shadowBlur = 0;
  },

  /* A jaw or shutter: two halves that open on a value 0..1. */
  jaw(c, o) {
    const open = Math.max(0, Math.min(1, o.open === undefined ? 0.3 : o.open));
    const spread = (o.spread || 0.5) * open;
    for (const side of [-1, 1]) {
      c.save();
      c.rotate(side * spread);
      const R = o.r || 20;
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(0, 0);
        cc.quadraticCurveTo(R * 0.7, side * R * 0.36, R * (o.reach || 1.25), side * R * 0.10);
        cc.quadraticCurveTo(R * 0.7, side * R * 0.06, 0, 0);
        cc.closePath();
      }, o.col, { lw: o.lw === undefined ? 2.4 : o.lw, blur: 16, core: o.core || 'rgba(10,4,14,0.85)' });
      // teeth along the inner edge
      if (o.teeth) {
        for (let i = 1; i <= o.teeth; i++) {
          const u = i / (o.teeth + 1);
          const tx = R * (o.reach || 1.25) * u, ty = side * R * (0.10 + 0.20 * (1 - u));
          neon(c, cc => { cc.beginPath(); cc.moveTo(tx, ty); cc.lineTo(tx + R * 0.05, ty - side * R * 0.15); },
            o.toothCol || '#ffffff', { lw: 1.2, blur: 8, core: null, inner: false });
        }
      }
      c.restore();
    }
  },

  /* Light gathering before something happens -- the tell. */
  charge(c, o) {
    const u = Math.max(0, Math.min(1, o.u || 0));
    if (u <= 0.001) return;
    const R = o.r || 30;
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
      const ph = (u * 2 + i / 4) % 1;
      c.globalAlpha = (1 - ph) * 0.5 * u;
      c.strokeStyle = o.col; c.lineWidth = 1.6;
      c.beginPath(); c.arc(0, 0, R * (0.4 + ph * 2.2), 0, TAU); c.stroke();
    }
    c.globalAlpha = u * 0.85;
    c.drawImage(glowSprite(o.col), -R * u * 1.4, -R * u * 1.4, R * u * 2.8, R * u * 2.8);
    c.restore();
  }
};


/* =======================================================================
   Abstract motion motifs.

   Each one draws AROUND and OVER the cached body, in a local space centred
   on the boss. None of them make the boss a creature -- there are no faces
   and no limbs anywhere in here -- they just refuse to let it sit still.

   `- i * phase` appears in every sequential loop below. That term is what
   makes motion travel through a body instead of every part twitching in
   unison, and it is the whole difference between a living object and a
   rotating badge.
   ======================================================================= */
const BossMotif = {

  /* Nested rings turning against each other, with debris riding them. */
  orbital(c, o) {
    const t = o.t, r = o.r, col = o.col, n = o.rings || 3;
    for (let i = 0; i < n; i++) {
      const rr = r * (0.80 + i * 0.30);          // closer in: it was a halo
      const dir = i % 2 ? -1 : 1;
      const rot = t * (0.30 + i * 0.16) * dir;
      const arcs = 2 + i;
      const span = TAU / arcs - (0.55 + i * 0.12);
      for (let k = 0; k < arcs; k++) {
        const a0 = rot + k / arcs * TAU;
        neon(c, cc => { cc.beginPath(); cc.arc(0, 0, rr, a0, a0 + span); },
          i === 1 ? (o.alt || '#ffffff') : col,
          { lw: 3.6 - i * 0.5, blur: 17 - i * 2, core: null, inner: false });
      }
      // one shard per ring, riding it, tumbling on its own
      const sa = rot + 0.4;
      const sx = Math.cos(sa) * rr, sy = Math.sin(sa) * rr;
      c.save(); c.translate(sx, sy); c.rotate(t * (1.4 + i));
      neon(c, cc => pathPoly(cc, 3 + i, r * 0.14, 0), o.alt || '#ffffff',
        { lw: 2.2, blur: 13, core: 'rgba(2,3,8,0.7)' });
      c.restore();
    }
    // a live centre, spinning against the rings
    neon(c, cc => pathStar(cc, 3, r * 0.34, r * 0.13, -t * 0.9), o.alt || '#ffffff',
      { lw: 2.0, blur: 16, core: null, inner: false });
  },

  /* Aperture blades, breathing open and shut. */
  iris(c, o) {
    const t = o.t, r = o.r, col = o.col, n = o.blades || 7;
    const open = 0.5 + 0.5 * Math.sin(t * (o.rate || 1.1));
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + t * 0.12;
      c.save();
      c.rotate(a);
      const reach = r * (0.42 + 0.72 * (1 - open));
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(r * 1.24, -r * 0.16);
        cc.lineTo(reach, 0);
        cc.lineTo(r * 1.24, r * 0.16);
        cc.closePath();
      }, col, { lw: 2.2, blur: 14, core: 'rgba(2,3,8,0.8)' });
      c.restore();
    }
    // the slit at the middle: hot when shut, a void when wide
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, r * (0.10 + 0.34 * open), 0, TAU); },
      open > 0.6 ? (o.alt || '#ffffff') : col,
      { lw: 2.0, blur: 18, core: 'rgba(0,0,0,0.9)' });
  },

  /* Petals opening one after another, never all together. */
  bloom(c, o) {
    const t = o.t, r = o.r, col = o.col, n = o.petals || 6;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + t * (o.spin || 0.18);
      // the travelling wave: each petal takes its turn
      const op = 0.34 + 0.66 * (0.5 + 0.5 * Math.sin(t * (o.rate || 1.6) - i * 1.05));
      c.save();
      c.rotate(a);
      const L = r * (0.80 + op * 0.78), W = r * (0.20 + op * 0.26);
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(r * 0.22, 0);
        cc.quadraticCurveTo(L * 0.55, -W, L, 0);
        cc.quadraticCurveTo(L * 0.55, W, r * 0.22, 0);
        cc.closePath();
      }, i % 2 ? col : (o.alt || col), { lw: 3.0, blur: 17, core: 'rgba(2,3,8,0.86)' });
      // a hot vein up the petal, brightest when it is widest open
      c.globalAlpha = op;
      neon(c, cc => { cc.beginPath(); cc.moveTo(r * 0.28, 0); cc.lineTo(L * 0.88, 0); },
        o.alt || '#ffffff', { lw: 1.5, blur: 11, core: null, inner: false });
      c.globalAlpha = 1;
      c.restore();
    }
    // the seed at the middle, breathing with the petals
    const sw2 = 0.5 + 0.5 * Math.sin(t * (o.rate || 1.6));
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, r * (0.16 + sw2 * 0.07), 0, TAU); },
      o.alt || '#ffffff', { lw: 2.4, blur: 18, core: 'rgba(2,3,8,0.7)' });
  },

  /* Shards falling inward forever, and the core that is eating them. */
  collapse(c, o) {
    const t = o.t, r = o.r, col = o.col, n = o.shards || 9;
    for (let i = 0; i < n; i++) {
      const u = 1 - ((t * (o.rate || 0.42) + i / n) % 1);   // 1 outside -> 0 at the core
      const a = i * 2.399 + t * 0.30;                        // golden angle, never a ring
      const d = r * (0.34 + u * 2.15);
      const sx = Math.cos(a) * d, sy = Math.sin(a) * d;
      c.save();
      c.translate(sx, sy);
      c.rotate(a + t * 1.6);
      c.globalAlpha = Math.min(1, (1 - u) * 1.8) * 0.95;
      // it stretches as it is pulled in
      c.scale(1 + (1 - u) * 2.2, 1);
      neon(c, cc => pathPoly(cc, 3, r * 0.13, 0), i % 3 ? col : (o.alt || '#ffffff'),
        { lw: 2.3, blur: 12, core: null, inner: false });
      c.restore();
    }
    c.globalAlpha = 1;
    // the rim of whatever they are falling into, and the light bending at it
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, r * (0.46 + Math.sin(t * 2.2) * 0.025), 0, TAU); },
      o.alt || '#ffffff', { lw: 3.0, blur: 24, core: 'rgba(0,0,0,0.96)' });
    c.save();
    c.globalAlpha = 0.5;
    c.strokeStyle = col; c.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      const a = t * 0.8 + i / 3 * TAU;
      c.beginPath(); c.arc(0, 0, r * (0.60 + i * 0.16), a, a + 1.6); c.stroke();
    }
    c.restore();
  },

  /* A beat: the core gathers, then throws a ring off itself. */
  pulse(c, o) {
    const t = o.t, r = o.r, col = o.col;
    const rate = o.rate || 1.4;
    const beat = (t * rate) % 1;
    // rings already thrown
    for (let i = 0; i < 3; i++) {
      const ph = (beat + i / 3) % 1;
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = (1 - ph) * (1 - ph) * 0.95;
      c.strokeStyle = i === 0 ? (o.alt || '#ffffff') : col;
      c.shadowColor = col; c.shadowBlur = 14;
      c.lineWidth = 6.5 * (1 - ph) + 0.8;        // it was a hairline
      c.beginPath(); c.arc(0, 0, r * (0.55 + ph * 1.75), 0, TAU); c.stroke();
      c.restore();
    }
    /* Spokes that punch out on the beat. Rings alone made this the thinnest
       of the motifs -- the body had nothing around it but circles. */
    const n = o.spokes || 8;
    const hit = Math.pow(Math.max(0, 1 - beat * 3.2), 2);      // sharp on the strike
    for (let i = 0; i < n; i++) {
      const a2 = i / n * TAU + t * 0.22;
      // long enough to be part of the body BETWEEN beats, not just on them:
      // caught at rest, CHOIR and GRAVEWALKER were a polygon inside two rings
      const inner = r * 0.55;
      const outer = r * (1.06 + hit * 0.85 + 0.12 * Math.sin(t * 2 - i * 0.6));
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(Math.cos(a2) * inner, Math.sin(a2) * inner);
        cc.lineTo(Math.cos(a2) * outer, Math.sin(a2) * outer);
      }, i % 2 ? col : (o.alt || '#ffffff'),
         { lw: 1.4 + hit * 2.6, blur: 10 + hit * 12, core: null, inner: false });
    }
    // a ring of plates that counter-turns, so the middle has mass
    for (let i = 0; i < 3; i++) {
      const a3 = -t * 0.5 + i / 3 * TAU;
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, r * 0.50, a3, a3 + 1.35); },
        col, { lw: 3.0, blur: 14, core: null, inner: false });
    }

    // the gather: squeeze in hard just before the throw
    const gather = Math.pow(Math.max(0, Math.sin(beat * Math.PI)), 3);
    neon(c, cc => { cc.beginPath(); cc.arc(0, 0, r * (0.72 - gather * 0.22), 0, TAU); },
      col, { lw: 3.2 + gather * 3.4, blur: 16 + gather * 20, core: null, inner: false });
    // the light it is about to spend, gathered at the middle
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = gather * 0.30;   // glowSprite carries diffraction spikes:
    // at high alpha they blow out into a white cross across the whole arena
    c.drawImage(glowSprite(col), -r * 0.70, -r * 0.70, r * 1.4, r * 1.4);
    c.restore();
  },

  /* A stack of plates with a wave shearing up through it. */
  spire(c, o) {
    const t = o.t, r = o.r, col = o.col, n = o.plates || 5;
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1);
      const yy = r * (0.92 - u * 1.84);
      const w = r * (0.92 - Math.abs(u - 0.5) * 0.72);
      const shear = Math.sin(t * (o.rate || 2.0) - i * 0.85) * r * 0.20;   // the wave travels up
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(-w + shear, yy);
        cc.lineTo(w + shear, yy);
        cc.lineTo(w * 0.82 + shear, yy + r * 0.20);
        cc.lineTo(-w * 0.82 + shear, yy + r * 0.20);
        cc.closePath();
      }, i % 2 ? col : (o.alt || col), { lw: 2.0, blur: 13, core: 'rgba(2,3,8,0.84)' });
      neon(c, cc => { cc.beginPath(); cc.moveTo(-w + shear, yy); cc.lineTo(w + shear, yy); },
        o.alt || '#ffffff', { lw: 1.2, blur: 9, core: null, inner: false });
    }
  },

  /* A ring whose gap opens like something deciding to bite. */
  maw(c, o) {
    const t = o.t, r = o.r, col = o.col, n = o.teeth || 14;
    const open = Math.pow(0.5 + 0.5 * Math.sin(t * (o.rate || 0.9)), 2);
    const gap = 0.35 + open * 1.25;
    const spin = t * 0.22;
    for (let half = 0; half < 2; half++) {
      const dir = half ? 1 : -1;
      const a0 = spin + dir * gap;
      const a1 = spin + dir * (Math.PI - 0.06);
      neon(c, cc => { cc.beginPath(); cc.arc(0, 0, r * 1.02, Math.min(a0, a1), Math.max(a0, a1)); },
        col, { lw: 3.0, blur: 16, core: null, inner: false });
      // inward spikes along the rim
      const steps = Math.max(2, Math.round(n / 2));
      for (let i = 0; i <= steps; i++) {
        const a = a0 + (a1 - a0) * (i / steps);
        const len = r * (0.16 + 0.10 * Math.sin(t * 3 - i * 0.7));
        neon(c, cc => {
          cc.beginPath();
          cc.moveTo(Math.cos(a) * r * 1.02, Math.sin(a) * r * 1.02);
          cc.lineTo(Math.cos(a) * (r * 1.02 - len), Math.sin(a) * (r * 1.02 - len));
        }, o.alt || '#ffffff', { lw: 1.8, blur: 10, core: null, inner: false });
      }
    }
    // the throat
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.22 + open * 0.4;
    c.drawImage(glowSprite(o.alt || col), -r * 0.7, -r * 0.7, r * 1.4, r * 1.4);
    c.restore();
  },

  /* Arcs that strike between nodes and die. */
  storm(c, o) {
    const t = o.t, r = o.r, col = o.col, n = o.nodes || 6;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + t * 0.26;
      const d = r * (1.05 + Math.sin(t * 1.7 + i * 2.1) * 0.22);
      pts.push([Math.cos(a) * d, Math.sin(a) * d]);
      neon(c, cc => { cc.beginPath(); cc.arc(Math.cos(a) * d, Math.sin(a) * d, r * 0.07, 0, TAU); },
        col, { lw: 1.8, blur: 12, core: 'rgba(2,3,8,0.7)' });
    }
    // a bolt lives for a moment between one pair, then jumps to another
    for (let k = 0; k < 2; k++) {
      const slot = Math.floor(t * (o.rate || 5) + k * 3.7);
      const i0 = slot % n, i1 = (slot * 3 + 1 + k) % n;
      if (i0 === i1) continue;
      const life = 1 - ((t * (o.rate || 5) + k * 3.7) % 1);
      const A = pts[i0], B = pts[i1];
      c.save();
      c.globalAlpha = life * 0.9;
      c.strokeStyle = o.alt || '#ffffff'; c.shadowColor = col; c.shadowBlur = 16;
      c.lineWidth = 1.8;
      c.beginPath();
      c.moveTo(A[0], A[1]);
      for (let j = 1; j < 5; j++) {
        const u = j / 5;
        const jx = A[0] + (B[0] - A[0]) * u, jy = A[1] + (B[1] - A[1]) * u;
        const off = (Math.sin(slot * 7.3 + j * 4.1) * r * 0.16) * (1 - Math.abs(u - 0.5) * 2);
        c.lineTo(jx + off, jy - off);
      }
      c.lineTo(B[0], B[1]);
      c.stroke();
      c.restore();
    }
  }
};

/* Which motif each boss wears, and how it is tuned. Colours come from the
   boss itself; `alt` is the one accent each is allowed so nothing is mono. */
/* How the BODY itself moves on its motif's beat. Without this the body is a
   stamp with decoration around it; with it, the whole creature acts at once.
   Returns [scaleX, scaleY]. */
function bossBodyBeat(k, t) {
  const MO = BOSS_MOTIF[k];
  if (!MO) return null;
  const rate = MO.rate || 1.2;
  switch (MO.m) {
    case 'pulse': {
      const beat = (t * rate) % 1;
      const gather = Math.pow(Math.max(0, Math.sin(beat * Math.PI)), 3);
      // squeeze down, then snap wide as the ring leaves
      const snap = beat < 0.06 ? (1 - beat / 0.06) * 0.22 : 0;
      return [1 - gather * 0.13 + snap, 1 - gather * 0.13 + snap * 0.6];
    }
    case 'bloom': {
      const o2 = 0.5 + 0.5 * Math.sin(t * rate);
      return [1 + o2 * 0.10, 1 + o2 * 0.10];
    }
    case 'collapse': {
      const d = 0.5 + 0.5 * Math.sin(t * rate * 2.2);
      return [1 - d * 0.07, 1 + d * 0.05];      // pulled thin, the way light is
    }
    case 'iris': {
      const o2 = 0.5 + 0.5 * Math.sin(t * rate);
      return [1 + o2 * 0.07, 1 - o2 * 0.05];
    }
    case 'maw': {
      const o2 = Math.pow(0.5 + 0.5 * Math.sin(t * rate), 2);
      return [1 - o2 * 0.06, 1 + o2 * 0.14];    // it gapes
    }
    case 'spire': {
      return [1 + Math.sin(t * rate) * 0.05, 1 - Math.sin(t * rate) * 0.05];
    }
    case 'storm': {
      const j = Math.sin(t * 37.0) * Math.sin(t * 11.0);
      return [1 + j * 0.022, 1 - j * 0.022];    // it never settles
    }
    default: {
      const b = BossFX.breathe(t, 1.1, 0.03);
      return [b, b];
    }
  }
}

const BOSS_MOTIF = {
  choir:     { m: 'pulse',    rate: 1.5, alt: '#ffffff' },
  grave:     { m: 'pulse',    rate: 0.8, alt: '#ff3d2e' },
  weep:      { m: 'collapse', rate: 0.55, shards: 8, alt: '#b9ffd9' },
  null:      { m: 'collapse', rate: 0.40, shards: 11, alt: '#e9b8ff' },
  loom:      { m: 'orbital',  rings: 4, alt: '#ffffff' },
  carrion:   { m: 'bloom',    petals: 7, rate: 1.3, alt: '#ffe66d' },
  orrery:    { m: 'orbital',  rings: 3, alt: '#fff6d0' },
  husk:      { m: 'spire',    plates: 5, rate: 2.2, alt: '#ffd0b8' },
  bloom:     { m: 'bloom',    petals: 8, rate: 1.5, alt: '#ffd166' },
  void:      { m: 'collapse', rate: 0.5, shards: 10, alt: '#ff8fae' },
  mirror:    { m: 'iris',     blades: 8, rate: 0.9, alt: '#ffffff' },
  crown:     { m: 'storm',    nodes: 7, rate: 4.0, alt: '#fff3a3' },
  longnight: { m: 'collapse', rate: 0.32, shards: 12, alt: '#9fb0ff' },
  antiphon:  { m: 'pulse',    rate: 2.1, alt: '#ffd0e8' },
  cultivar:  { m: 'bloom',    petals: 6, rate: 1.1, alt: '#eaff8a' },
  toll:      { m: 'pulse',    rate: 0.7, alt: '#f6e8be' },
  hoarfrost: { m: 'storm',    nodes: 8, rate: 3.2, alt: '#ffffff' },
  gyre:      { m: 'orbital',  rings: 4, alt: '#ffd166' },
  /* THE MAW keeps its own bespoke art -- a motif on top fought with it */
  witness:   { m: 'iris',     blades: 6, rate: 0.7, alt: '#cfe0ff' },
  tithe:     { m: 'spire',    plates: 6, rate: 1.6, alt: '#f6e8be' },
  aperture:  { m: 'iris',     blades: 9, rate: 1.3, alt: '#c9a3ff' }
};

/* ------------------------------------------------------------ enemy sprite */
function enemySprite(def, hurt) {
  const key = 'e_' + def.id + (hurt ? '_h' : '');
  const R = def.r;
  const pad = def.bossKind === 'maw' ? R * 2.2 + 30 : 26;
  const S = (R + pad) * 2;
  const col = hurt ? '#ffffff' : def.col;
  const core = hurt ? 'rgba(255,255,255,0.9)' : 'rgba(2,3,8,0.78)';
  return sprite(key, S, S, c => {
