   ----------------------------------------------------------------------- */
const FACET_R = [1.06, 0.88, 1.0, 0.82, 1.08, 0.9, 0.96, 0.84, 1.02];


/* the black hole, painted on the 2D canvas when there is no shader */
function drawBlackHole2D(c, x, y, r, t) {
  c.save();
  c.translate(x, y);
  const hot = '#b8ecff', cool = '#ff47bd';

  // outer bloom
  const g = c.createRadialGradient(0, 0, r * 0.9, 0, 0, r * 4.4);
  g.addColorStop(0, 'rgba(190,150,255,0.30)');
  g.addColorStop(0.42, 'rgba(150,90,255,0.10)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 4.4, 0, TAU); c.fill();

  c.globalCompositeOperation = 'lighter';
  // the far half of the disc, lensed over the top and under the bottom
  c.lineWidth = Math.max(1.4, r * 0.17);
  for (let i = 0; i < 2; i++) {
    const up = i === 0;
    const grd = c.createLinearGradient(-r, 0, r, 0);
    grd.addColorStop(0, cool); grd.addColorStop(1, hot);
    c.strokeStyle = grd; c.globalAlpha = up ? 0.85 : 0.55;
    c.beginPath();
    c.arc(0, 0, r * 1.42, up ? Math.PI + 0.35 : 0.35, up ? TAU - 0.35 : Math.PI - 0.35);
    c.stroke();
  }
  c.globalAlpha = 1;

  // the flat disc, seen nearly edge on
  c.save();
  c.scale(1, 0.155);
  for (let i = 0; i < 3; i++) {
    const rr = r * (1.5 + i * 0.75);
    const grd = c.createLinearGradient(-rr, 0, rr, 0);
    grd.addColorStop(0, cool); grd.addColorStop(0.5, '#ffffff'); grd.addColorStop(1, hot);
    c.strokeStyle = grd;
    c.globalAlpha = 0.75 - i * 0.2;
    c.lineWidth = (r * 0.9) / (1 + i * 0.5) / 0.155 * 0.14;
    c.beginPath(); c.arc(0, 0, rr, 0, TAU); c.stroke();
  }
  c.restore();
  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';

  // the shadow -- opaque, so nothing behind it survives
  c.fillStyle = '#000000';
  c.beginPath(); c.arc(0, 0, r * 1.005, 0, TAU); c.fill();

  // the photon ring on its lip
  c.globalCompositeOperation = 'lighter';
  c.strokeStyle = '#ffffff'; c.lineWidth = Math.max(1.2, r * 0.05);
  c.shadowColor = '#cfe8ff'; c.shadowBlur = r * 0.9;
  c.beginPath(); c.arc(0, 0, r * 1.02, 0, TAU); c.stroke();
  c.shadowBlur = 0;
  c.restore();
}

function drawPlanetBody(c, x, y, r, pl, t, rot) {
  if (pl.hole) { drawBlackHole2D(c, x, y, r, t); return; }
  const b = pl.body, R = mulberry32(pl.id.length * 7919 + pl.mx);
  rot = rot || 0;
  const faceted = b.feat === 'facets', gear = b.feat === 'gear', bite = b.feat === 'bite';
  const ringed = b.feat === 'cap' || b.feat === 'lattice';

  const hr = r * (pl.press ? 2.4 : 1.8);
  const h = c.createRadialGradient(x, y, r * 0.82, x, y, hr);
  h.addColorStop(0, pl.col + '40'); h.addColorStop(0.5, pl.col + '14'); h.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = h; c.beginPath(); c.arc(x, y, hr, 0, TAU); c.fill();

  if (b.feat === 'pulse') {
    for (let q = 0; q < 2; q++) {
      const ph = (t * 0.3 + q * 0.5) % 1;
      c.strokeStyle = pl.col; c.globalAlpha = (1 - ph) * 0.45; c.lineWidth = 1.6;
      c.beginPath(); c.arc(x, y, r * (1.05 + ph * 1.3), 0, TAU); c.stroke();
    }
    c.globalAlpha = 1;
  }

  const ringHalf = front => {
    c.save(); c.translate(x, y); c.rotate(-0.36); c.scale(1, 0.24);
    const cols = b.feat === 'cap' ? ['rgba(214,244,255,0.9)', 'rgba(214,244,255,0.35)']
                                  : ['rgba(238,196,255,0.7)', 'rgba(238,196,255,0.26)'];
    c.strokeStyle = front ? cols[0] : cols[1];
    c.lineWidth = b.feat === 'cap' ? 2.6 : 1.3;
    const a0 = front ? 0 : Math.PI, a1 = front ? Math.PI : TAU;
    c.beginPath(); c.arc(0, 0, r * 1.62, a0, a1); c.stroke();
    c.lineWidth *= 0.7;
    c.beginPath(); c.arc(0, 0, r * 1.94, a0, a1); c.stroke();
    if (b.feat === 'cap') { c.lineWidth *= 0.6; c.beginPath(); c.arc(0, 0, r * 2.18, a0, a1); c.stroke(); }
    c.restore();
  };
  if (ringed) ringHalf(false);

  c.save();
  if (faceted) {
    c.beginPath();
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * TAU - 0.42, rr = r * FACET_R[i];
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath();
  } else if (bite) {
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.arc(x + r * 0.66, y - r * 0.34, r * 0.66, 0, TAU);
  } else { c.beginPath(); c.arc(x, y, r, 0, TAU); }
  c.clip(bite ? 'evenodd' : 'nonzero');

  const sg = c.createRadialGradient(x - r * 0.36, y - r * 0.40, r * 0.05, x, y, r * 1.22);
  sg.addColorStop(0, b.light); sg.addColorStop(0.44, b.base); sg.addColorStop(1, b.dark);
  c.fillStyle = sg; c.fillRect(x - r * 1.35, y - r * 1.35, r * 2.7, r * 2.7);

  c.save();
  const F = b.feat;
  if (F === 'blotch') {
    for (let i = 0; i < 12; i++) {
      const lon = R() * TAU, lat = (R() - 0.5) * 1.6, w = r * (0.16 + R() * 0.22), hh = r * (0.10 + R() * 0.15);
      const ca = Math.cos(lon + rot); if (ca <= 0.04) continue;
      c.fillStyle = 'rgba(9,46,19,0.6)'; c.globalAlpha = Math.min(1, ca * 1.6);
      c.beginPath(); c.ellipse(x + Math.sin(lon + rot) * r * Math.cos(lat), y + Math.sin(lat) * r, w * ca, hh, 0, 0, TAU); c.fill();
    }
    c.globalAlpha = 1;
  } else if (F === 'cracks') {
    for (let i = 0; i < 9; i++) {
      const lon = R() * TAU, ca = Math.cos(lon + rot); if (ca <= 0.06) continue;
      let cx = x + Math.sin(lon + rot) * r * 0.9, cy = y - r + R() * r * 1.9;
      c.globalAlpha = Math.min(1, ca * 1.7);
      c.strokeStyle = '#ff9138'; c.shadowColor = '#ff6412'; c.shadowBlur = r * 0.45;
      c.lineWidth = Math.max(0.5, r * 0.032);
      c.beginPath(); c.moveTo(cx, cy);
      for (let k = 0; k < 4; k++) { cx += (R() - 0.5) * r * 0.42 * ca; cy += (R() * 0.9 - 0.2) * r * 0.34; c.lineTo(cx, cy); }
      c.stroke();
    }
    c.shadowBlur = 0; c.globalAlpha = 1;
  } else if (F === 'bands') {
    for (let i = 0; i < 9; i++) {
      const ly = -1 + i * 0.235;
      c.fillStyle = i % 2 ? 'rgba(178,255,246,0.14)' : 'rgba(3,44,44,0.34)';
      c.beginPath(); c.ellipse(x, y + ly * r, r * Math.sqrt(Math.max(0.02, 1 - ly * ly)) * 1.02, r * 0.085, 0, 0, TAU); c.fill();
    }
    c.fillStyle = 'rgba(220,255,252,0.28)';
    c.beginPath(); c.ellipse(x + Math.sin(rot * 0.6) * r * 0.3, y - r * 0.12, r * 0.3, r * 0.13, 0.4, 0, TAU); c.fill();
  } else if (F === 'craters') {
    for (let i = 0; i < 22; i++) {
      const lon = R() * TAU, lat = (R() - 0.5) * 1.75, cr = r * (0.06 + R() * 0.15);
      const ca = Math.cos(lon + rot); if (ca <= 0.06) continue;
      const cx = x + Math.sin(lon + rot) * r * Math.cos(lat), cy = y + Math.sin(lat) * r;
      c.globalAlpha = Math.min(1, ca * 1.7);
      c.fillStyle = 'rgba(38,44,58,0.6)';
      c.beginPath(); c.ellipse(cx, cy, cr * ca, cr, 0, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(238,246,255,0.45)'; c.lineWidth = Math.max(0.5, r * 0.024);
      c.beginPath(); c.ellipse(cx, cy, cr * ca, cr, 0, Math.PI * 0.95, Math.PI * 1.95); c.stroke();
    }
    c.globalAlpha = 1;
  } else if (F === 'srings') {
    c.strokeStyle = 'rgba(180,228,255,0.38)';
    for (let i = 1; i <= 5; i++) {
      const ly = -0.9 + i * 0.3;
      c.lineWidth = Math.max(0.6, r * 0.04);
      c.beginPath(); c.ellipse(x, y + ly * r, r * Math.sqrt(Math.max(0.02, 1 - ly * ly)) * 0.98, r * 0.07, 0, 0, TAU); c.stroke();
    }
    const pw = (t * 0.5) % 1;
    c.strokeStyle = 'rgba(200,238,255,' + ((1 - pw) * 0.5) + ')'; c.lineWidth = Math.max(0.8, r * 0.05);
    c.beginPath(); c.arc(x, y, r * pw, 0, TAU); c.stroke();
  } else if (faceted) {
    // a cut stone, not a fan: an inner table, then crown facets out to the girdle
    const tx = x - r * 0.16, ty = y - r * 0.20, ti = 0.42;
    const shade = (lit, a) => 'rgba(' + Math.round(40 + lit * 200) + ',' + Math.round(12 + lit * 154) + ',' + Math.round(88 + lit * 156) + ',' + a + ')';
    for (let i = 0; i < 9; i++) {
      const a1 = i / 9 * TAU - 0.42, a2 = (i + 1) / 9 * TAU - 0.42;
      const r1 = r * FACET_R[i % 9], r2 = r * FACET_R[(i + 1) % 9];
      const o1x = x + Math.cos(a1) * r1, o1y = y + Math.sin(a1) * r1;
      const o2x = x + Math.cos(a2) * r2, o2y = y + Math.sin(a2) * r2;
      const i1x = tx + Math.cos(a1) * r1 * ti, i1y = ty + Math.sin(a1) * r1 * ti;
      const i2x = tx + Math.cos(a2) * r2 * ti, i2y = ty + Math.sin(a2) * r2 * ti;
      const mid = (a1 + a2) / 2;
      const lit = Math.pow(Math.max(0, 0.5 + 0.5 * Math.cos(mid + 2.4)), 1.7);
      c.fillStyle = shade(lit, 0.72 + lit * 0.28);
      c.beginPath(); c.moveTo(i1x, i1y); c.lineTo(o1x, o1y); c.lineTo(o2x, o2y); c.lineTo(i2x, i2y);
      c.closePath(); c.fill();
      c.strokeStyle = 'rgba(226,186,255,' + (0.10 + lit * 0.30) + ')'; c.lineWidth = Math.max(0.5, r * 0.016); c.stroke();
    }
    // the table
    c.beginPath();
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * TAU - 0.42, rr = r * FACET_R[i % 9] * ti;
      const px2 = tx + Math.cos(a) * rr, py2 = ty + Math.sin(a) * rr;
      i ? c.lineTo(px2, py2) : c.moveTo(px2, py2);
    }
    c.closePath();
    const tg2 = c.createRadialGradient(tx - r * 0.1, ty - r * 0.12, 0, tx, ty, r * 0.6);
    tg2.addColorStop(0, 'rgba(244,214,255,0.95)'); tg2.addColorStop(1, 'rgba(150,84,214,0.9)');
    c.fillStyle = tg2; c.fill();
    c.strokeStyle = 'rgba(240,214,255,0.55)'; c.lineWidth = Math.max(0.6, r * 0.02); c.stroke();
  } else if (F === 'lattice') {
    c.strokeStyle = 'rgba(242,204,255,0.4)'; c.lineWidth = Math.max(0.5, r * 0.028);
    for (let i = -5; i <= 5; i++) {
      const off = i * r * 0.26 + Math.sin(rot) * r * 0.1;
      c.beginPath(); c.moveTo(x - r * 1.2, y + off - r * 0.5); c.lineTo(x + r * 1.2, y + off + r * 0.5); c.stroke();
      c.beginPath(); c.moveTo(x - r * 1.2, y + off + r * 0.5); c.lineTo(x + r * 1.2, y + off - r * 0.5); c.stroke();
    }
  } else if (F === 'cap') {
    c.fillStyle = 'rgba(255,255,255,0.94)';
    c.beginPath(); c.ellipse(x, y - r * 0.84, r * 0.72, r * 0.26, 0, 0, TAU); c.fill();
    c.globalAlpha = 0.55; c.beginPath(); c.ellipse(x, y + r * 0.9, r * 0.56, r * 0.2, 0, 0, TAU); c.fill(); c.globalAlpha = 1;
    c.strokeStyle = 'rgba(226,246,255,0.3)'; c.lineWidth = Math.max(0.5, r * 0.03);
    for (let i = 0; i < 4; i++) {
      const ly = -0.45 + i * 0.3;
      c.beginPath(); c.ellipse(x, y + ly * r, r * Math.sqrt(Math.max(0.02, 1 - ly * ly)) * 0.96, r * 0.06, 0, 0, TAU); c.stroke();
    }
  } else if (gear) {
    c.strokeStyle = 'rgba(58,40,12,0.8)'; c.lineWidth = Math.max(0.7, r * 0.055);
    c.beginPath(); c.arc(x, y, r * 0.58, 0, TAU); c.stroke();
    c.beginPath(); c.arc(x, y, r * 0.3, 0, TAU); c.stroke();
    c.save(); c.translate(x, y); c.rotate(t * 0.5);
    c.strokeStyle = '#ffe9c0'; c.lineWidth = Math.max(1, r * 0.075); c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -r * 0.7); c.stroke();
    c.rotate(t * 1.1); c.lineWidth = Math.max(0.8, r * 0.05);
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -r * 0.42); c.stroke();
    c.lineCap = 'butt'; c.restore();
  } else if (F === 'petals') {
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * TAU + t * 0.14;
      c.fillStyle = 'rgba(255,146,238,' + (0.2 + 0.22 * Math.abs(Math.sin(a))) + ')';
      c.beginPath(); c.ellipse(x + Math.cos(a) * r * 0.46, y + Math.sin(a) * r * 0.46, r * 0.44, r * 0.2, a, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(255,190,246,0.3)'; c.lineWidth = Math.max(0.5, r * 0.02); c.stroke();
    }
    const cg = c.createRadialGradient(x, y, 0, x, y, r * 0.34);
    cg.addColorStop(0, '#ffffff'); cg.addColorStop(1, 'rgba(255,180,240,0)');
    c.fillStyle = cg; c.beginPath(); c.arc(x, y, r * 0.34, 0, TAU); c.fill();
  } else if (bite) {
    c.strokeStyle = '#ff4f7f'; c.shadowColor = '#ff2d6d'; c.shadowBlur = r * 0.7;
    c.lineWidth = Math.max(0.9, r * 0.075);
    c.beginPath(); c.arc(x + r * 0.66, y - r * 0.34, r * 0.66, 0, TAU); c.stroke();
    c.shadowBlur = 0;
    c.strokeStyle = 'rgba(255,120,150,0.35)'; c.lineWidth = Math.max(0.5, r * 0.03);
    for (let i = 0; i < 5; i++) {
      const a = 1.6 + i * 0.42;
      c.beginPath(); c.moveTo(x + Math.cos(a) * r * 0.2, y + Math.sin(a) * r * 0.2);
      c.lineTo(x + Math.cos(a) * r * 0.95, y + Math.sin(a) * r * 0.95); c.stroke();
    }
  }
  c.restore();

  if (!faceted) {
    const tg = c.createRadialGradient(x - r * 0.42, y - r * 0.48, r * 0.08, x, y, r * 1.12);
    tg.addColorStop(0, 'rgba(0,0,0,0)'); tg.addColorStop(0.5, 'rgba(0,0,0,0)'); tg.addColorStop(1, 'rgba(0,0,0,0.66)');
    c.fillStyle = tg; c.fillRect(x - r * 1.35, y - r * 1.35, r * 2.7, r * 2.7);
  }
  c.restore();

  if (gear) {
    c.save(); c.translate(x, y); c.rotate(t * 0.16);
    c.fillStyle = '#8a6122';
    for (let i = 0; i < 16; i++) { c.save(); c.rotate(i / 16 * TAU); c.fillRect(-r * 0.1, -r * 1.16, r * 0.2, r * 0.2); c.restore(); }
    c.restore();
  }
  if (ringed) ringHalf(true);

  if (!faceted) {
    c.strokeStyle = pl.col; c.globalAlpha = 0.45; c.lineWidth = Math.max(0.7, r * 0.05);
    c.beginPath();
    if (bite) c.arc(x, y, r * 0.985, 0.28, TAU - 0.72); else c.arc(x, y, r * 0.985, 0, TAU);
    c.stroke(); c.globalAlpha = 1;
  }

  for (let m = 0; m < b.moons; m++) {
    const ma = t * (0.32 + m * 0.2) + m * 2.3, md = r * (1.75 + m * 0.5);
    const mx = x + Math.cos(ma) * md, my = y + Math.sin(ma) * md * 0.5, mr = Math.max(1.5, r * 0.13);
    const mg = c.createRadialGradient(mx - mr * 0.4, my - mr * 0.4, 0, mx, my, mr);
    mg.addColorStop(0, m ? '#c6d2e4' : '#e0cbb0'); mg.addColorStop(1, m ? '#4a5468' : '#5c4a34');
    c.fillStyle = mg; c.beginPath(); c.arc(mx, my, mr, 0, TAU); c.fill();
  }

  if (pl.press) {
    c.strokeStyle = pl.col; c.globalAlpha = 0.38; c.lineWidth = 1;
    c.setLineDash([5, 6]); c.lineDashOffset = -t * 9;
    c.beginPath(); c.arc(x, y, r * 1.45, 0, TAU); c.stroke();
    c.setLineDash([]); c.globalAlpha = 1;
  }
}


/* ------------------------------------------------------- WebGL plumbing */

const _rgbaCache = Object.create(null);
function cssRGBA(str, fallback) {
  if (!str) return fallback || [0, 0, 0, 0];
  let v = _rgbaCache[str];
  if (v) return v;
  if (str.charAt(0) === '#') { const h = hexRGB(str); v = [h[0], h[1], h[2], 1]; }
  else {
    const m = /rgba?\(([^)]+)\)/.exec(str);
    if (!m) v = fallback || [0, 0, 0, 0];
    else {
      const q = m[1].split(',').map(x => parseFloat(x));
      v = [(q[0] || 0) / 255, (q[1] || 0) / 255, (q[2] || 0) / 255, q.length > 3 ? q[3] : 1];
    }
  }
  _rgbaCache[str] = v;
  return v;
}
const _hexCache = Object.create(null);
function hexRGB(hex) {
  let v = _hexCache[hex];
  if (v) return v;
  let h = (hex || '#ffffff').replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  v = [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  _hexCache[hex] = v;
  return v;
}
function glShader(gl, type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.warn('shader:', gl.getShaderInfoLog(sh));
    gl.deleteShader(sh);
    return null;
  }
  return sh;
}
function glProgram(gl, vsSrc, fsSrc) {
  const vs = glShader(gl, gl.VERTEX_SHADER, vsSrc);
  if (!vs) return null;
  const fs = glShader(gl, gl.FRAGMENT_SHADER, fsSrc);
  if (!fs) { gl.deleteShader(vs); return null; }
  const pr = gl.createProgram();
  gl.attachShader(pr, vs); gl.attachShader(pr, fs);
  gl.bindAttribLocation(pr, 0, 'aPos');
  gl.linkProgram(pr);
  gl.deleteShader(vs); gl.deleteShader(fs);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) {
    console.warn('link:', gl.getProgramInfoLog(pr));
    return null;
  }
  return pr;
}

/* ========================================================================
   COSMOS  --  a WebGL deep field.

   One fullscreen fragment shader. It draws a domain-warped nebula, four
   layers of twinkling stars, the galactic plane, and up to twelve worlds
   as properly lit spheres with their own surface rules, cloud decks,
   night sides, atmospheres and ring systems -- plus one "hero" world at
   higher detail for the dossier screen.

   It is a backdrop and nothing more. Every pixel that can kill you is
   still drawn by the 2D canvas on top. If WebGL is missing the layer
   never turns on and the old 2D map draws exactly as it did.
   ======================================================================== */
const COSMOS_VS = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

const COSMOS_FS = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform vec3  uPos[12];      // x, y in canvas pixels (y down), radius
uniform vec3  uCol[12];
uniform float uType[12];
uniform float uTaken[12];
uniform float uSel;
uniform vec4  uHero;         // x, y, radius, surface type   (radius <= 0: none)
uniform vec3  uHeroCol;
uniform float uHeroLit;      // 1 once the world has been taken
uniform float uDeep;         // 0 galaxy page, 1 dossier -- darkens the field
uniform float uQual;         // 1 full, 0.5 reduced

const float TAU = 6.2831853;

float h11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx)*0.1031); q += dot(q, q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float h31(vec3 p){ p = fract(p*0.1031); p += dot(p, p.yzx+33.33); return fract((p.x+p.y)*p.z); }

float vn(vec3 x){
  vec3 i = floor(x), f = fract(x);
  f = f*f*(3.0-2.0*f);
  float a = mix(mix(h31(i),                    h31(i+vec3(1.0,0.0,0.0)), f.x),
                mix(h31(i+vec3(0.0,1.0,0.0)),  h31(i+vec3(1.0,1.0,0.0)), f.x), f.y);
  float b = mix(mix(h31(i+vec3(0.0,0.0,1.0)),  h31(i+vec3(1.0,0.0,1.0)), f.x),
                mix(h31(i+vec3(0.0,1.0,1.0)),  h31(i+vec3(1.0,1.0,1.0)), f.x), f.y);
  return mix(a, b, f.z);
}
float fbm3(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<3;i++){ s+=a*vn(p); p=p*2.07+13.7; a*=0.5; } return s; }
float fbm4(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<4;i++){ s+=a*vn(p); p=p*2.03+11.3; a*=0.5; } return s; }
float fbm5(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*vn(p); p=p*2.11+7.9;  a*=0.5; } return s; }
// ridged noise gives the nebula its filaments instead of cotton wool
float ridge(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<4;i++){ s += a*(1.0-abs(vn(p)*2.0-1.0)); p=p*2.17+3.3; a*=0.5; } return s; }

mat3 rotY(float a){ float c=cos(a), s=sin(a); return mat3(c,0.0,-s, 0.0,1.0,0.0, s,0.0,c); }
mat3 rotX(float a){ float c=cos(a), s=sin(a); return mat3(1.0,0.0,0.0, 0.0,c,s, 0.0,-s,c); }

/* ------------------------------------------------------- the deep field */
vec3 deepField(vec2 uv, vec2 px){
  float t = uTime * 0.012;
  vec3 col = vec3(0.010, 0.012, 0.026);

  // domain warp: one turbulence field pushes the coordinates of the next,
  // which is what turns smooth noise into filaments and cavities
  vec3 q = vec3(uv * 1.45, t);
  vec3 w = vec3(fbm3(q*1.05), fbm3(q*1.05 + 19.3), fbm3(q*0.85 + 41.7)) - 0.5;
  vec3 wp = q + w * 1.9;

  float n1 = fbm4(wp * 1.30);
  float n2 = fbm4(wp * 2.05 + 27.1);
  float n3 = ridge(wp * 3.10 + 63.3) * 0.55;

  float d1 = smoothstep(0.44, 0.96, n1);
  float d2 = smoothstep(0.52, 1.02, n2);
  float d3 = smoothstep(0.52, 0.95, n3);

  col += vec3(0.42, 0.08, 0.78) * d1 * 0.62;          // violet
  col += vec3(0.02, 0.44, 0.86) * d2 * 0.50;          // cyan
  col += vec3(0.95, 0.10, 0.52) * d3 * 0.30 * uQual;  // magenta filaments
  // hot cores where two sheets overlap
  col += vec3(0.85, 0.70, 1.00) * pow(d1*d2, 2.2) * 0.65;

  // the galactic plane, tilted
  float band = exp(-pow((uv.y*1.18 + uv.x*0.30) * 2.35, 2.0));
  col += vec3(0.15, 0.19, 0.42) * band * (0.34 + 0.42*fbm3(vec3(uv*3.4, t*2.0)));

  // four star layers, near ones bigger and slower to twinkle
  for(int L=0; L<4; L++){
    float fl = float(L);
    float cell = 17.0 + fl*26.0;
    vec2 gp = px / cell;
    vec2 gi = floor(gp), gf = fract(gp);
    // check this cell and 8 neighbors to prevent star clipping at edges
    for(int ox=-1; ox<=1; ox++){
      for(int oy=-1; oy<=1; oy++){
        vec2 ngi = gi + vec2(float(ox), float(oy));
        float h = h21(ngi + fl*57.3);
        float cut = 0.885 - fl*0.045;
        if(h > cut){
          vec2 c2 = vec2(h21(ngi+11.7+fl), h21(ngi+23.9+fl));
          vec2 dv = (gf - vec2(float(ox), float(oy))) - c2;
          float d = length(dv);
          float mag = (h - cut) / (1.0 - cut);
          float tw = 0.58 + 0.42*sin(uTime*(0.8 + h*3.4) + h*61.0);
          // smaller inner radius (0.08 -> 0.03) for sharper, smaller stars
          float core = smoothstep(0.08 - fl*0.015, 0.0, d) * (0.25 + mag*0.8) * tw;
          float ct = h21(ngi + 5.1 + fl);
          vec3 sc = ct < 0.18 ? vec3(1.00,0.72,0.52)
                  : ct > 0.86 ? vec3(0.70,0.82,1.00)
                              : vec3(0.92,0.95,1.00);
          col += sc * core * (0.45 + fl*0.25);
          if(mag > 0.82 && L < 2){
            float sp = max(0.0, 1.0 - abs(dv.x)*20.0) * max(0.0, 1.0 - abs(dv.y)*3.0)
                     + max(0.0, 1.0 - abs(dv.y)*20.0) * max(0.0, 1.0 - abs(dv.x)*3.0);
            col += sc * sp * 0.20 * tw;
          }
        }
      }
    }
  }

  // dust lanes drifting across everything
  float dust = fbm3(vec3(uv*6.2 + vec2(t*2.4, -t*1.7), t));
  col += vec3(0.09,0.11,0.25) * smoothstep(0.60, 1.0, dust) * 0.55;
  col *= mix(1.0, 0.34, uDeep);
  return col;
}

/* ------------------------------------------------- per-world surfaces */
vec3 surface(int ty, vec3 n, vec3 base, float tt, out float emis){
  vec3 pn = n * 2.05;
  float f = fbm5(pn);
  vec3 c = base;
  emis = 0.0;

  if(ty==0){                                    // VERDANCE: overgrown
    float land = smoothstep(0.44, 0.60, f);
    float deep = smoothstep(0.66, 0.86, f);
    c = mix(base*0.16, base*0.95, land);
    c = mix(c, base*1.45, deep*0.7);
    c += vec3(0.55,1.0,0.45) * smoothstep(0.88, 0.99, fbm4(pn*3.4)) * 0.55;
    emis = smoothstep(0.90, 1.0, fbm4(pn*4.1)) * 0.5;
  } else if(ty==1){                             // CINDERHOLT: lava in the cracks
    float cr = abs(fbm4(pn*1.55) - 0.5);
    float glow = smoothstep(0.055, 0.0, cr);
    float fine = smoothstep(0.030, 0.0, abs(fbm4(pn*4.2)-0.5));
    c = mix(base*0.11, base*0.52, smoothstep(0.36,0.72,f));
    c += vec3(1.0,0.40,0.09) * glow * 2.6 + vec3(1.0,0.74,0.22) * fine * 1.2;
    emis = glow*1.5 + fine*0.8;
  } else if(ty==2){                             // WEEPING COAST: ocean + squalls
    float b = sin(n.y*8.0 + f*2.6 + n.x*1.7);
    c = mix(base*0.30, base*1.15, 0.5+0.5*b);
    c = mix(c, vec3(0.05,0.22,0.34), smoothstep(0.40,0.62,f)*0.55);
    float cloud = smoothstep(0.50,0.80, fbm4(pn*1.85 + vec3(tt*0.045,0.0,0.0)));
    c = mix(c, vec3(0.86,0.98,1.00), cloud*0.50);
  } else if(ty==3){                             // OSSUARY: cratered, dead
    // fbm4 lands around 0.47 with very little past 0.62, so the old crater
    // bands at 0.56-0.84 almost never fired and this world barely had a
    // surface at all. Everything here is centred on where the noise lives.
    float cr = fbm4(pn*3.1);
    float pit = smoothstep(0.40,0.50,cr) - smoothstep(0.50,0.61,cr);
    c = mix(base*0.34, base*0.96, f);
    c -= base * pit * 0.62;                                  // the floor of the crater
    float rim = smoothstep(0.030, 0.0, abs(cr - 0.505));     // and the lip around it
    c += vec3(1.0,0.98,0.94) * rim * 0.70;
    float small = smoothstep(0.028, 0.0, abs(fbm4(pn*6.4) - 0.47));
    c += vec3(0.95,0.97,1.0) * small * 0.35;
    c -= base * smoothstep(0.50, 0.62, fbm4(pn*8.5)) * 0.20; // dust in the lows
  } else if(ty==4){                             // CHORUS DEEP: standing waves
    float w = sin(n.y*15.0 - tt*0.75 + f*1.8);
    float w2 = sin(n.x*11.0 + tt*0.5 + f*1.2);
    c = mix(base*0.24, base*1.20, 0.5+0.5*w*w2);
    float crest = smoothstep(0.86,1.0, 0.5+0.5*w);
    c += base*crest*0.9; emis = crest*0.7;
  } else if(ty==5){                             // NULLSPIRE: crystal facets
    vec3 g = floor(n*4.5)/4.5;
    float fa = h31(g*13.0);
    c = base * (0.30 + fa*1.30);
    float edge = smoothstep(0.42, 0.5, max(abs(fract(n.x*4.5)-0.5), abs(fract(n.y*4.5)-0.5)));
    c += vec3(0.88,0.80,1.0) * step(0.94, fa) * 0.8 + base*edge*0.5;
    emis = step(0.94, fa)*0.8;
  } else if(ty==6){                             // GREAT LOOM: bound in a lattice
    float gx = abs(fract(n.x*6.5)-0.5), gy = abs(fract(n.y*6.5)-0.5);
    float g = smoothstep(0.44,0.50,max(gx,gy));
    c = mix(base*0.24, base*0.82, f);
    c += base * g * 1.35; emis = g*0.9;
  } else if(ty==7){                             // PALE ORBIT: ice and caps
    float ice = smoothstep(0.40,0.68,f);
    c = mix(base*0.42, vec3(0.90,0.97,1.0), ice*0.72);
    float cap = smoothstep(0.60, 0.86, abs(n.y));
    c = mix(c, vec3(1.0), cap);
    c += base * smoothstep(0.024,0.0,abs(fbm4(pn*3.6 + n.x*0.8)-0.5)) * 0.95;   // pressure ridges
  } else if(ty==8){                             // BRASS MERIDIAN: machined
    float b = sin(n.y*19.0 + n.x*2.4);
    float seam = smoothstep(0.90,1.0,0.5+0.5*sin(n.y*19.0 + n.x*2.4 + tt*0.6));
    c = mix(base*0.30, base*1.05, 0.5+0.5*b);
    c += vec3(1.0,0.86,0.52) * seam * 0.75;
    c += vec3(1.0,0.95,0.8) * step(0.965, h31(floor(n*9.0)*7.0)) * 0.5;
    emis = seam*0.6;
  } else if(ty==9){                             // TOLLING DARK: bronze gone green
    float pa = smoothstep(0.44,0.70,fbm4(pn*1.7));
    c = mix(base*0.26, vec3(0.18,0.60,0.44), pa);
    c += base*0.26;
    // the verdigris breaks along hard edges, and the bare bronze under it
    // catches the light in flecks -- both fixed to the shell, both legible
    c += vec3(0.72,1.0,0.86) * smoothstep(0.020, 0.0, abs(fbm4(pn*3.4) - 0.55)) * 0.85;
    c += vec3(1.0,0.86,0.52) * step(0.955, h31(floor(n*13.0)*5.0)) * 0.75;
    c += vec3(0.7,1.0,0.85) * smoothstep(0.84,1.0,fbm4(pn*2.7)) * 0.55;
  } else if(ty==10){                            // MAWSTEAD: raw, lit from within
    float v = smoothstep(0.34,0.70,f);
    c = mix(base*0.07, base*0.80, v);
    float vein = smoothstep(0.62,0.96,fbm4(pn*1.9 + n.x*1.2));
    c += vec3(1.0,0.12,0.32) * vein * 2.0;
    c += vec3(1.0,0.55,0.30) * smoothstep(0.86,1.0,fbm4(pn*3.8)) * 0.9;
    emis = vein*1.8;
  } else {                                      // BLOOMHEART: a swirl with a core
    float ang = atan(n.y, n.x);
    float rr = length(n.xy);
    float sw = sin(ang*4.0 + rr*8.0 - tt*0.45 + f*1.6);
    c = mix(base*0.26, base*1.25, 0.5+0.5*sw);
    float core = smoothstep(0.52, 0.0, rr);
    c += vec3(1.0,0.72,0.96) * core * 1.15;
    emis = core*1.1 + smoothstep(0.9,1.0,0.5+0.5*sw)*0.4;
  }
  return c;
}

/* the thing at the centre of the sector. rs is the shadow radius.
   rgb is what it gives off; a is how much of the sky behind it is gone. */
vec4 blackHole(vec2 d, float rs, float tt){
  float r = length(d);
  if(r > rs*8.0) return vec4(0.0);
  vec3 acc = vec3(0.0);

  vec3 hot  = vec3(0.62, 0.92, 1.00);     // the limb turning towards you
  vec3 cool = vec3(1.00, 0.16, 0.70);     // the limb turning away
  float dop = smoothstep(-1.0, 1.0, d.x / (rs*2.1));
  vec3  dc  = mix(cool, hot, dop);
  float beam = mix(0.42, 1.62, dop);      // relativistic beaming

  // the flat disc: squashed almost to a line, banded, turning
  vec2 q = vec2(d.x, d.y / 0.155);
  float rq = length(q) / rs;
  float ang = atan(q.y, q.x);
  float band = fbm4(vec3(ang*1.7, rq*2.2 - tt*0.85, tt*0.11));
  float disc = smoothstep(1.18, 1.44, rq) * (1.0 - smoothstep(2.5, 4.1, rq));
  disc *= 0.42 + 0.86*band;

  // the far half of it, bent up over the top and under the bottom
  float h = r / rs;
  float halo = smoothstep(1.01, 1.24, h) * (1.0 - smoothstep(1.85, 2.75, h));
  halo *= smoothstep(0.08, 0.62, abs(d.y) / (rs*0.85));
  halo *= 0.48 + 0.80*fbm4(vec3(atan(d.y, d.x)*2.1, h*3.4 - tt*0.7, tt*0.09));

  acc += dc * (disc*1.30 + halo*1.15) * beam;

  // nothing escapes the shadow, and the photon ring sits on its lip
  float inside = 1.0 - smoothstep(rs*0.955, rs*1.015, r);
  acc *= (1.0 - inside);
  acc += vec3(1.0) * exp(-pow((r - rs*1.012)/(rs*0.028), 2.0)) * 2.35;
  acc += dc * exp(-pow((r - rs*1.09)/(rs*0.085), 2.0)) * 0.90 * beam;
  return vec4(acc, inside);
}

/* shade one world; returns rgb, writes coverage into a */
vec4 world(vec2 d, float r, vec3 base, int ty, float taken, float tt, float idx){
  float dist = length(d);
  vec3 acc = vec3(0.0);

  // atmospheric bloom around the limb -- this is what makes it read as neon
  float halo = exp(-pow(max(0.0, dist - r*0.90) / (r*0.86), 1.28));
  acc += base * halo * (0.50 + 0.34*taken);
  // and a hard, thin shell right on the edge: the line that says 'arcade'
  float shell = exp(-pow((dist - r*1.005) / (r*0.075), 2.0));
  acc += base * shell * 0.85;

  vec3 L = normalize(vec3(-0.46, 0.52, 0.72));

  if(dist < r + 1.5){
    vec2 q = d / r;
    float qq = min(dot(q,q), 1.0);
    float z = sqrt(max(0.0001, 1.0 - qq));
    vec3 n = normalize(vec3(q.x, -q.y, z));           // screen y is down
    float spin = (0.155 + fract(idx*0.41)*0.10) * (1.0 + (1.0 - smoothstep(24.0, 72.0, r)) * 0.62);
    vec3 sn = rotX(-0.38) * rotY(tt*spin + idx*1.71) * n;

    float emis = 0.0;
    vec3 c = surface(ty, sn, base, tt, emis);

    // cheap bump: nudge the normal by the surface gradient so the
    // terminator picks up relief instead of being a clean arc
    float e = 0.035;
    float ha = fbm4(sn*4.0), hb = fbm4((sn + vec3(e,0.0,0.0))*4.0), hc = fbm4((sn + vec3(0.0,e,0.0))*4.0);
    vec3 bn = normalize(n + vec3((hb-ha)*2.2, (hc-ha)*2.2, 0.0));

    float diff = max(0.0, dot(bn, L));
    float wrap = max(0.0, (dot(n, L) + 0.30) / 1.30);  // soft terminator
    float spec = pow(max(0.0, dot(reflect(-L, bn), vec3(0.0,0.0,1.0))), 30.0);
    float fres = pow(1.0 - z, 3.0);
    float night = smoothstep(0.16, -0.10, dot(n, L));

    vec3 lit = c * (0.085 + diff*0.85 + wrap*0.30);
    lit += vec3(1.0) * spec * 0.30 * step(float(ty), 8.5);
    lit += c * emis * (0.45 + night*1.60);             // emissive burns through the night side
    lit += base * fres * 2.70;                         // the neon limb
    lit += base * 0.055;

    // a bite out of THE MAWSTEAD -- a gouge, not a disc pasted on top:
    // dark raw interior, molten strands in it, and a hot lip at the break
    if(ty==10){
      vec2 bq = (d - vec2(r*0.46, -r*0.27)) / (r*0.64);
      float bd = length(bq);
      if(bd < 1.06){
        float deep = 1.0 - smoothstep(0.0, 1.0, bd);
        vec3 inner = vec3(0.020, 0.004, 0.012);
        float strand = smoothstep(0.62, 1.0, fbm4(vec3(bq*3.4, tt*0.06)));
        inner += base * strand * (0.35 + deep*1.5);
        inner += base * pow(deep, 3.0) * 0.55;
        float lip = exp(-pow((bd - 0.97)/0.085, 2.0));
        inner += base * lip * 3.1;
        lit = mix(inner, lit, smoothstep(0.97, 1.06, bd));
      }
    }
    acc = mix(acc, lit, smoothstep(r + 1.2, r - 1.2, dist));
  }

  // ring systems: the ice world and the loom
  if(ty==7 || ty==6){
    vec2 rq = vec2(d.x, d.y/0.24);
    float rr = length(rq) / r;
    float inner = (ty==7) ? 1.42 : 1.52;
    float outer = (ty==7) ? 2.18 : 2.06;
    if(rr > inner && rr < outer){
      float band = 0.45 + 0.55*abs(sin(rr*39.0)) * (0.6 + 0.4*h11(floor(rr*39.0)));
      float gap  = smoothstep(0.02, 0.10, abs(rr - mix(inner,outer,0.44)));
      float a = smoothstep(inner, inner+0.07, rr) * smoothstep(outer, outer-0.14, rr) * gap;
      // the far half passes behind the planet
      float behind = (d.y < 0.0 && dist < r) ? 0.0 : 1.0;
      // and the planet throws a shadow across the near half
      float shade = (d.y > 0.0 && abs(d.x) < r*0.92) ? 0.42 : 1.0;
      acc += base * a * band * 0.72 * behind * shade;
    }
  }
  return vec4(acc, 1.0);
}

void main(){
  vec2 px = gl_FragCoord.xy;
  vec2 pxT = vec2(px.x, uRes.y - px.y);
  vec2 uv = (px - 0.5*uRes) / uRes.y;

  // light that passes near the hole is bent around it, so the starfield
  // behind gets sampled from further out the closer it is to the lip
  vec2 pxS = px, uvS = uv;
  if(uHero.z > 0.0 && uHero.w > 11.5){
    vec2 hb = vec2(uHero.x, uRes.y - uHero.y);
    vec2 dl = px - hb;
    float rl = max(length(dl), 0.75);
    float rn = rl + (uHero.z*uHero.z*1.45) / rl;
    pxS = hb + dl / rl * rn;
    uvS = (pxS - 0.5*uRes) / uRes.y;
  }
  vec3 col = deepField(uvS, pxS);

  for(int i=0;i<12;i++){
    vec3 P = uPos[i];
    if(P.z <= 0.0) continue;
    vec2 d = pxT - P.xy;
    if(dot(d,d) > P.z*P.z*11.0) continue;
    col += world(d, P.z, uCol[i], int(uType[i]+0.5), uTaken[i], uTime, float(i)).rgb;
    if(abs(float(i) - uSel) < 0.5){
      float dist = length(d);
      float ring = abs(dist - P.z*1.52);
      col += uCol[i] * exp(-ring*0.14) * (0.22 + 0.18*sin(uTime*3.0));
    }
  }

  if(uHero.z > 0.0){
    vec2 d = pxT - uHero.xy;
    if(uHero.w > 11.5){
      vec4 bh = blackHole(d, uHero.z, uTime);
      col = col * (1.0 - bh.a) + bh.rgb;       // the sky behind it is gone
    }
    else if(dot(d,d) < uHero.z*uHero.z*11.0)
      col += world(d, uHero.z, uHeroCol, int(uHero.w+0.5), uHeroLit, uTime, 3.0).rgb;
  }

  // filmic-ish shoulder so neon rolls off instead of clipping flat white
  col = col / (1.0 + col*0.40);
  col = pow(max(col, 0.0), vec3(0.90));
  // a little vignette, and dither to kill banding in the nebula
  float vig = 1.0 - 0.30*pow(length(uv*vec2(0.82,1.0)), 2.3);
  col *= vig;
  col += (h21(px) - 0.5) * 0.0045;
  gl_FragColor = vec4(col, 1.0);
}`;


/* ------------------------------------------------------------------------
   ARENA  --  the sky you actually play under.

   Same canvas and same context as the galaxy; a second program. It draws
   the parallaxed deep field behind the arena, tinted by whichever world you
   are standing on, plus the dark beyond the wall. Everything that can kill
   you is still 2D line work drawn on top of it, and this layer is kept
   deliberately dim and low-contrast in the middle of the screen so it never
   competes with a bullet.
   ------------------------------------------------------------------------ */
/* what hangs in each world's air */
const SKY_MOOD = {
  verdance: 3, cinderholt: 1, weepingcoast: 4, ossuary: 2, chorusdeep: 4, nullspire: 5,
  greatloom: 5, paleorbit: 2, brassmeridian: 5, tollingdark: 1, mawstead: 1, bloomheart: 3,
  eventide: 6
};
const ARENA_FS = `
precision highp float;
uniform vec2  uRes;        // device pixels
uniform float uScale;      // device pixels per css pixel
uniform vec2  uHalf;       // css pixels: VW/2, VH/2
uniform float uTime;
uniform vec2  uCam;
uniform float uZoom, uAng;
uniform vec3  uBg0, uBg1, uBg2;
uniform vec4  uWash;       // rgb + strength
uniform vec3  uRing;       // the world's accent, for the glow at the centre
uniform float uArena;      // arena radius, world units
uniform float uLite;
uniform float uMood;       // 0 none, 1 ember, 2 fall, 3 spore, 4 rise, 5 spark
uniform vec3  uMoodCol;

float h21a(vec2 p){ vec3 q = fract(vec3(p.xyx)*0.1031); q += dot(q, q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float h31a(vec3 p){ p = fract(p*0.1031); p += dot(p, p.yzx+33.33); return fract((p.x+p.y)*p.z); }
float vna(vec3 x){
  vec3 i = floor(x), f = fract(x);
  f = f*f*(3.0-2.0*f);
  float a = mix(mix(h31a(i),                   h31a(i+vec3(1.0,0.0,0.0)), f.x),
                mix(h31a(i+vec3(0.0,1.0,0.0)), h31a(i+vec3(1.0,1.0,0.0)), f.x), f.y);
  float b = mix(mix(h31a(i+vec3(0.0,0.0,1.0)), h31a(i+vec3(1.0,0.0,1.0)), f.x),
                mix(h31a(i+vec3(0.0,1.0,1.0)), h31a(i+vec3(1.0,1.0,1.0)), f.x), f.y);
  return mix(a, b, f.z);
}
float fbma(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<4;i++){ s+=a*vna(p); p=p*2.05+9.1; a*=0.5; } return s; }

void main(){
  vec2 px = gl_FragCoord.xy;
  vec2 pxT = vec2(px.x, uRes.y - px.y) / uScale;      // css pixels, y down
  vec2 sp = pxT - uHalf;                              // offset from screen centre
  float ca = cos(-uAng), sa = sin(-uAng);
  sp = vec2(sp.x*ca - sp.y*sa, sp.x*sa + sp.y*ca);
  vec2 uv = pxT / (uHalf*2.0);

  // the ground colour: a diagonal wash between the world's two darks
  vec3 col = mix(uBg0, uBg1, clamp(uv.y*0.85 + uv.x*0.30, 0.0, 1.0));
  col = mix(col, uBg2, smoothstep(0.45, 1.15, uv.y + uv.x*0.25));

  // how far out this pixel is. Everything the world tints is multiplied by
  // it, so the centre of the screen -- where bullets are read -- stays bare.
  float edge = clamp(pow(length((uv - 0.5) * vec2(1.05, 1.0)) * 1.46, 2.0), 0.0, 1.0);
  float out1 = 0.10 + edge * 0.90;

  // two nebula sheets, far away, so they barely move
  vec2 np = (sp / uZoom + uCam * 0.62) * 0.00105;
  float t = uTime * 0.015;
  vec3 wv = vec3(fbma(vec3(np*1.7, t)), fbma(vec3(np*1.7 + 13.3, t)), 0.0) - 0.5;
  float n1 = fbma(vec3(np + wv.xy*0.70, t*0.6));
  float n2 = fbma(vec3(np*2.3 + 27.7 + wv.yx*0.5, t*0.4));
  vec3 neb = uWash.rgb;
  col += neb * smoothstep(0.54, 1.04, n1) * 0.62 * uWash.a * out1;
  col += neb * smoothstep(0.66, 1.10, n2) * 0.38 * uWash.a * uLite * out1;
  col += uRing * smoothstep(0.80, 1.06, n1*n2*1.7) * 0.26 * uLite * out1;

  // three star layers, parallaxed against the camera
  for(int L=0; L<3; L++){
    float fl = float(L);
    float par = 0.12 + fl*0.22;
    float cell = 30.0 + fl*22.0;
    vec2 g = (sp + uCam*par*uZoom) / cell;
    vec2 gi = floor(g), gf = fract(g);
    float h = h21a(gi + fl*71.3);
    float cut = 0.90 - fl*0.05;
    if(h > cut){
      vec2 c2 = vec2(h21a(gi+7.1+fl), h21a(gi+19.7+fl));
      float d = length((gf - c2) * vec2(1.0, 1.0));
      float mag = (h - cut) / (1.0 - cut);
      float tw = 0.6 + 0.4*sin(uTime*(0.7 + h*2.6) + h*53.0);
      float core = smoothstep(0.13 - fl*0.02, 0.0, d) * (0.28 + mag*0.85) * tw;
      float ct = h21a(gi + 3.3 + fl);
      vec3 sc = ct < 0.2 ? vec3(1.0,0.80,0.62) : (ct > 0.85 ? vec3(0.72,0.84,1.0) : vec3(0.90,0.94,1.0));
      col += sc * core * (0.34 + fl*0.30);
    }
  }

  // where the arena is centred, a soft well of the world's own light
  vec2 originS = (-uCam) * uZoom;
  float dOrigin = length(sp - originS) / max(1.0, uHalf.y);
  col += uRing * exp(-dOrigin*1.75) * 0.085;

  // and past the wall, the dark
  float rw = length(sp / uZoom + uCam);
  float out0 = smoothstep(uArena*0.99, uArena*1.30, rw);
  col = mix(col, col*0.16 + vec3(0.004,0.004,0.012), out0);
  col += uRing * out0 * 0.05 * (0.5 + 0.5*sin(uTime*0.7 + rw*0.01));

  // and the frame itself takes the world's colour
  col += uWash.rgb * edge * uWash.a * 0.85;
  col *= 1.0 - 0.30*edge;

  // ---------------------------------------------------------------- air
  if(uMood > 0.5){
    int md = int(uMood + 0.5);
    vec2 dir = vec2(0.0, -1.0);
    float spd = 0.06, size = 0.040, amt = 0.30, wob = 0.10;
    vec3 mc = uMoodCol;
    vec2 squash = vec2(1.0, 1.0);
    if(md == 1){ dir = vec2(0.10,-1.0); spd = 0.085; size = 0.030; amt = 0.55; wob = 0.16;
                 mc = mix(uMoodCol, vec3(1.0,0.52,0.12), 0.62); }
    else if(md == 2){ dir = vec2(0.16, 1.0); spd = 0.055; size = 0.034; amt = 0.34; wob = 0.13;
                 mc = mix(uMoodCol, vec3(0.92,0.96,1.0), 0.72); }
    else if(md == 3){ dir = vec2(-0.42,-0.62); spd = 0.032; size = 0.046; amt = 0.34; wob = 0.20; }
    else if(md == 4){ dir = vec2(0.05,-1.0); spd = 0.028; size = 0.044; amt = 0.30; wob = 0.26;
                 mc = mix(uMoodCol, vec3(0.80,0.95,1.0), 0.45); }
    else if(md == 5){ dir = vec2(1.0, 0.06); spd = 0.30; size = 0.055; amt = 0.40; wob = 0.03;
                 squash = vec2(0.30, 3.4); }

    vec2 mp = sp + uCam * 0.70 * uZoom;
    if(md == 6){
      // differential rotation -- the closer in, the faster it turns
      float rr2 = length(mp) + 240.0;
      float aa = uTime * 0.10 + 52000.0 / rr2;
      float cc2 = cos(aa), ss2 = sin(aa);
      mp = vec2(mp.x*cc2 - mp.y*ss2, mp.x*ss2 + mp.y*cc2);
      dir = vec2(0.0, -1.0); spd = 0.012; size = 0.038; amt = 0.42; wob = 0.05;
      squash = vec2(1.0, 1.0);
      mc = mix(uMoodCol, vec3(0.80, 0.92, 1.0), 0.35);
    }
    for(int k=0; k<2; k++){
      float fk = float(k);
      float cell = 104.0 + fk*76.0;
      vec2 gp = mp / cell + dir * uTime * spd * (1.0 + fk*0.55) + fk*13.7;
      vec2 gi = floor(gp), gf = fract(gp);
      float h = h21a(gi + fk*29.1);
      if(h > 0.62){
        vec2 c2 = vec2(h21a(gi+4.3+fk), h21a(gi+8.9+fk));
        c2.x += sin(uTime*(0.45 + h*1.3) + h*37.0) * wob;
        c2.y += cos(uTime*(0.33 + h*0.9) + h*21.0) * wob * 0.5;
        float d = length((gf - c2) * squash);
        float sz = size * (0.6 + h*0.8) * (1.0 - fk*0.28);
        float a = smoothstep(sz, 0.0, d) * (0.45 + h*0.75);
        col += mc * a * amt * (1.0 - fk*0.42) * uLite;
      }
    }
  }

  col += (h21a(px) - 0.5) * 0.0055;
  gl_FragColor = vec4(max(col, 0.0), 1.0);
}`;

const Cosmos = {
  cv: null, gl: null, prog: null, buf: null, u: null, ok: false, tried: false, on: false,
  scale: 1, slow: 0, give: 0,
  init() {
    if (this.tried) return this.ok;
    this.tried = true;
    try {
      const cv = document.getElementById('cosmos');
      if (!cv) return false;
      const opt = { antialias: false, alpha: false, depth: false, stencil: false,
                    preserveDrawingBuffer: false, powerPreference: 'high-performance' };
      const gl = cv.getContext('webgl', opt) || cv.getContext('experimental-webgl', opt);
      if (!gl) return false;
      const prog = glProgram(gl, COSMOS_VS, COSMOS_FS);
      if (!prog) return false;
      gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const U = n => gl.getUniformLocation(prog, n);
      this.cv = cv; this.gl = gl; this.prog = prog; this.buf = buf;
      this.u = { res: U('uRes'), time: U('uTime'), pos: U('uPos'), col: U('uCol'),
                 type: U('uType'), taken: U('uTaken'), sel: U('uSel'),
                 hero: U('uHero'), heroCol: U('uHeroCol'), heroLit: U('uHeroLit'),
                 deep: U('uDeep'), qual: U('uQual') };
      this._pos = new Float32Array(36); this._col = new Float32Array(36);
      this._ty = new Float32Array(12); this._tk = new Float32Array(12);
      // the arena sky shares this context
      const ap = glProgram(gl, COSMOS_VS, ARENA_FS);
      if (ap) {
        this.aProg = ap;
        const A = n => gl.getUniformLocation(ap, n);
        this.uA = { res: A('uRes'), scale: A('uScale'), half: A('uHalf'), time: A('uTime'),
                    cam: A('uCam'), zoom: A('uZoom'), ang: A('uAng'),
                    bg0: A('uBg0'), bg1: A('uBg1'), bg2: A('uBg2'),
                    wash: A('uWash'), ring: A('uRing'), arena: A('uArena'), lite: A('uLite'),
                    mood: A('uMood'), moodCol: A('uMoodCol') };
      }
      this.ok = true;
      return true;
    } catch (e) { return false; }
  },
  show() {
    if (!Settings.cosmos) return false;
    if (!this.init()) return false;
    if (!this.on) { this.cv.classList.add('on'); this.on = true; }
    return true;
  },
  hide() { if (this.on && this.cv) { this.cv.classList.remove('on'); this.on = false; } },
  adapt(fps) {
    if (!this.ok || !this.on) return;
    if (!this._warmup) { this._warmup = 0; }
    this._warmup = Math.min(180, this._warmup + 1);
    if (this._warmup < 180) return;
    if (fps < 44) {
      this.slow++;
      if (this.slow > 3) {
        this.slow = 0;
        if (this.scale > 0.40) this.scale = Math.max(0.40, this.scale - 0.15);
        else if (++this.give > 8) { Settings.cosmos = 0; this.hide(); }
      }
    } else if (fps > 57 && this.scale < 1) { this.scale = Math.min(1, this.scale + 0.06); }
  },
  // the in-run sky. Cheap on purpose: this one runs sixty times a second
  // while the game is being played.
  renderArena(t) {
    if (!this.ok || !this.aProg || !this.on) return;
    const gl = this.gl, cv = this.cv;
    const dpr = Math.min(DPR, 1.0) * this.scale;
    const w = Math.max(1, Math.round(VW * dpr)), h = Math.max(1, Math.round(VH * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.viewport(0, 0, w, h);
    gl.useProgram(this.aProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    const loc = gl.getAttribLocation(this.aProg, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const S = CUR_SKY;
    const b0 = hexRGB(PAL.bg0), b1 = hexRGB(PAL.bg1);
    const b2 = hexRGB(S && S.bg0 ? S.bg0 : SKY_BASE.bg2);
    const wash = cssRGBA(S && S.wash ? S.wash : 'rgba(30,40,110,0.16)', [0.12, 0.16, 0.42, 0.16]);
    const ring = cssRGBA(S && S.wall ? S.wall : 'rgba(120,90,255,0.5)', [0.47, 0.35, 1, 0.5]);
    const u = this.uA;
    gl.uniform2f(u.res, w, h);
    gl.uniform1f(u.scale, dpr);
    gl.uniform2f(u.half, VW / 2, VH / 2);
    gl.uniform1f(u.time, t);
    gl.uniform2f(u.cam, Cam.x, Cam.y);
    gl.uniform1f(u.zoom, Cam.zoom || 1);
    gl.uniform1f(u.ang, Cam.ang || 0);
    gl.uniform3f(u.bg0, b0[0], b0[1], b0[2]);
    gl.uniform3f(u.bg1, b1[0], b1[1], b1[2]);
    gl.uniform3f(u.bg2, b2[0], b2[1], b2[2]);
    gl.uniform4f(u.wash, wash[0], wash[1], wash[2], Math.min(0.85, wash[3] * 2.0));
    gl.uniform3f(u.ring, ring[0] * ring[3] * 0.8, ring[1] * ring[3] * 0.8, ring[2] * ring[3] * 0.8);
    gl.uniform1f(u.arena, G.arenaR || 3000);
    gl.uniform1f(u.lite, G.quality > 0 ? 1 : 0);
    const pid = G.planet ? G.planet.id : null;
    const mood = pid && SKY_MOOD[pid] ? SKY_MOOD[pid] : 0;
    const mcol = hexRGB(G.planet ? G.planet.col : '#9ef7ff');
    gl.uniform1f(u.mood, mood);
    gl.uniform3f(u.moodCol, mcol[0], mcol[1], mcol[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  },

  // planets: array of {x,y,r,col,type,taken} in CSS pixels. hero: {x,y,r,col,type,taken} or null
  render(t, planets, sel, hero, deep) {
    if (!this.ok || !this.on) return;
    const gl = this.gl, cv = this.cv;
    const dpr = Math.min(DPR, 1.5) * this.scale;
    const w = Math.max(1, Math.round(VW * dpr)), h = Math.max(1, Math.round(VH * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.viewport(0, 0, w, h);
    gl.useProgram(this.prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    const loc = gl.getAttribLocation(this.prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    for (let i = 0; i < 12; i++) {
      const q = planets && planets[i];
      if (!q) { this._pos[i * 3 + 2] = 0; this._ty[i] = 0; this._tk[i] = 0; continue; }
      this._pos[i * 3] = q.x * dpr;
      this._pos[i * 3 + 1] = q.y * dpr;
      this._pos[i * 3 + 2] = q.r * dpr;
      const rgb = hexRGB(q.col);
      this._col[i * 3] = rgb[0]; this._col[i * 3 + 1] = rgb[1]; this._col[i * 3 + 2] = rgb[2];
      this._ty[i] = q.type; this._tk[i] = q.taken ? 1 : 0;
    }
    gl.uniform2f(this.u.res, w, h);
    gl.uniform1f(this.u.time, t);
    gl.uniform3fv(this.u.pos, this._pos);
    gl.uniform3fv(this.u.col, this._col);
    gl.uniform1fv(this.u.type, this._ty);
    gl.uniform1fv(this.u.taken, this._tk);
    gl.uniform1f(this.u.sel, sel === undefined ? -1 : sel);
    if (hero) {
      gl.uniform4f(this.u.hero, hero.x * dpr, hero.y * dpr, hero.r * dpr, hero.type);
      const hr = hexRGB(hero.col);
      gl.uniform3f(this.u.heroCol, hr[0], hr[1], hr[2]);
      gl.uniform1f(this.u.heroLit, hero.taken ? 1 : 0);
    } else {
      gl.uniform4f(this.u.hero, 0, 0, 0, 0);
      gl.uniform3f(this.u.heroCol, 0, 0, 0);
      gl.uniform1f(this.u.heroLit, 0);
    }
    gl.uniform1f(this.u.deep, deep ? 1 : 0);
    gl.uniform1f(this.u.qual, G.quality > 0 ? 1 : 0.5);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
};

/* the twelve worlds, positioned for the galaxy page */
function cosmosPlanets(X) {
  const out = [];
  for (let i = 0; i < PLANETS.length && i < 12; i++) {
    const pl = PLANETS[i];
    out.push({
      x: X.ox + pl.mx * X.s, y: X.oy + pl.my * X.s,
      r: THREAT_RAD[pl.threat] * X.s * 1.05,
      col: pl.col, type: i, taken: Conquest.taken(pl.id)
    });
  }
  return out;
}


/* ========================================================================
   FX  --  the bloom rig.

   Everything in VOIDBLOOM is drawn as neon line work on a 2D canvas. That
   canvas is handed to WebGL once a frame at quarter resolution, run through
   a soft-knee bright pass and two gaussian blurs, given a little chromatic
   separation and an anamorphic streak, and screen-blended back over the
   original. The 2D image stays perfectly sharp underneath -- all this adds
   is the light coming off it, which is the thing a real arcade cabinet did
   and a flat canvas cannot.

   Costs one small texture upload and about six quarter-res passes. If any
   of it fails the layer simply never turns on.
   ======================================================================== */
const FX_VS = `
attribute vec2 aPos;
varying vec2 vUV;
void main(){ vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FX_BRIGHT = `
precision mediump float;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uThresh, uKnee;
varying vec2 vUV;
void main(){
  vec3 c = texture2D(uTex, vUV + uTexel*vec2(-0.5,-0.5)).rgb
         + texture2D(uTex, vUV + uTexel*vec2( 0.5,-0.5)).rgb
         + texture2D(uTex, vUV + uTexel*vec2(-0.5, 0.5)).rgb
         + texture2D(uTex, vUV + uTexel*vec2( 0.5, 0.5)).rgb;
  c *= 0.25;
  float br = max(c.r, max(c.g, c.b));
  float soft = clamp(br - uThresh + uKnee, 0.0, 2.0*uKnee);
  soft = soft*soft / (4.0*uKnee + 0.0001);
  float w = max(soft, br - uThresh) / max(br, 0.0001);
  // push saturation a touch so the halo keeps the colour of the line
  vec3 o = c * w;
  float l = dot(o, vec3(0.299, 0.587, 0.114));
  gl_FragColor = vec4(mix(vec3(l), o, 1.22), 1.0);
}`;

const FX_BLUR = `
precision mediump float;
uniform sampler2D uTex;
uniform vec2 uDir;
varying vec2 vUV;
void main(){
  vec3 s = texture2D(uTex, vUV).rgb * 0.227027;
  s += (texture2D(uTex, vUV + uDir*1.3846154).rgb + texture2D(uTex, vUV - uDir*1.3846154).rgb) * 0.3162162;
  s += (texture2D(uTex, vUV + uDir*3.2307692).rgb + texture2D(uTex, vUV - uDir*3.2307692).rgb) * 0.0702703;
  gl_FragColor = vec4(s, 1.0);
}`;

const FX_COMP = `
precision mediump float;
uniform sampler2D uTight;
uniform sampler2D uWide;
uniform vec2 uTexel;
uniform float uAmt, uAber, uStreak, uTime;
varying vec2 vUV;
void main(){
  vec2 d = vUV - 0.5;
  float k = uAber * (0.35 + dot(d,d) * 2.6);       // nothing at the centre, fringe at the edge
  vec3 t, w;
  t.r = texture2D(uTight, 0.5 + d*(1.0 + k)).r;
  t.g = texture2D(uTight, vUV).g;
  t.b = texture2D(uTight, 0.5 + d*(1.0 - k)).b;
  w.r = texture2D(uWide, 0.5 + d*(1.0 + k*1.9)).r;
  w.g = texture2D(uWide, vUV).g;
  w.b = texture2D(uWide, 0.5 + d*(1.0 - k*1.9)).b;

  // anamorphic streak -- the horizontal flare a tube throws off a bright line.
  // taken from the tight pass so it follows the shape, and squared so only
  // genuinely hot pixels smear.
  vec3 st = vec3(0.0);
  for(int i=1;i<=6;i++){
    float f = float(i);
    float fall = 1.0 / (1.0 + f*f*0.42);
    vec3 a = texture2D(uTight, vUV + vec2(uTexel.x*f*9.0, 0.0)).rgb;
    vec3 b = texture2D(uTight, vUV - vec2(uTexel.x*f*9.0, 0.0)).rgb;
    st += (a*a + b*b) * fall;
  }
  st *= 0.085 * uStreak;

  vec3 o = (t * 0.90 + w * 0.62) * uAmt + st * vec3(0.62, 0.80, 1.0);
  gl_FragColor = vec4(max(o, 0.0), 1.0);
}`;

const FX = {
  cv: null, gl: null, ok: false, tried: false, on: false,
  div: 4, amt: 1.0, slowN: 0, fastN: 0,
  init() {
    if (this.tried) return this.ok;
    this.tried = true;
    try {
      const cv = document.getElementById('fx');
      if (!cv) return false;
      const opt = { antialias: false, alpha: false, depth: false, stencil: false,
                    premultipliedAlpha: false, powerPreference: 'high-performance' };
      const gl = cv.getContext('webgl', opt) || cv.getContext('experimental-webgl', opt);
      if (!gl) return false;
      this.pBright = glProgram(gl, FX_VS, FX_BRIGHT);
      this.pBlur = glProgram(gl, FX_VS, FX_BLUR);
      this.pComp = glProgram(gl, FX_VS, FX_COMP);
      if (!this.pBright || !this.pBlur || !this.pComp) return false;
      this.buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      this.src = this.mkTex(gl);
      this.A = this.mkTarget(gl); this.B = this.mkTarget(gl); this.C = this.mkTarget(gl);
      this.scratch = makeCanvas(8, 8);
      this.sctx = this.scratch.getContext('2d', { alpha: true, willReadFrequently: false });
      this.cv = cv; this.gl = gl;
      this.ok = true;
      return true;
    } catch (e) { return false; }
  },
  mkTex(gl) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  },
  mkTarget(gl) {
    const tex = this.mkTex(gl);
    const fb = gl.createFramebuffer();
    return { tex: tex, fb: fb, w: 0, h: 0 };
  },
  sizeTarget(t, w, h) {
    const gl = this.gl;
    if (t.w === w && t.h === h) return;
    t.w = w; t.h = h;
    gl.bindTexture(gl.TEXTURE_2D, t.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  },
  bindQuad(prog) {
    const gl = this.gl;
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    const loc = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  },
  pass(prog, target, setUniforms) {
    const gl = this.gl;
    this.bindQuad(prog);
    if (target) { gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb); gl.viewport(0, 0, target.w, target.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.cv.width, this.cv.height); }
    setUniforms(gl, prog);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  },
  show() { if (!this.on && this.cv) { this.cv.classList.add('on'); this.on = true; } },
  hide() { if (this.on && this.cv) { this.cv.classList.remove('on'); this.on = false; } },

  run(strength) {
    if (!Settings.bloom || G.quality < 0) { this.hide(); return; }
    if (!this.init()) return;
    const gl = this.gl, cv = this.cv;
    const ow = Math.max(64, Math.round(VW)), oh = Math.max(64, Math.round(VH));
    if (cv.width !== ow || cv.height !== oh) { cv.width = ow; cv.height = oh; }

    const w2 = Math.max(8, Math.round(cvs.width / this.div));
    const h2 = Math.max(8, Math.round(cvs.height / this.div));
    if (this.scratch.width !== w2 || this.scratch.height !== h2) {
      this.scratch.width = w2; this.scratch.height = h2;
    }
    // the one copy of the frame -- cheap because it lands quarter size
    this.sctx.globalCompositeOperation = 'copy';
    this.sctx.drawImage(cvs, 0, 0, w2, h2);

    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.bindTexture(gl.TEXTURE_2D, this.src);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.scratch);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);

    this.sizeTarget(this.A, w2, h2);
    this.sizeTarget(this.B, w2, h2);
    this.sizeTarget(this.C, w2, h2);
    gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);

    const self = this;
    const tex = (unit, t) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); };

    // bright pass
    this.pass(this.pBright, this.A, (g, pr) => {
      tex(0, self.src);
      g.uniform1i(g.getUniformLocation(pr, 'uTex'), 0);
      g.uniform2f(g.getUniformLocation(pr, 'uTexel'), 1 / w2, 1 / h2);
      g.uniform1f(g.getUniformLocation(pr, 'uThresh'), 0.62);
      g.uniform1f(g.getUniformLocation(pr, 'uKnee'), 0.20);
    });
    // tight: one gaussian pair -> C
    this.pass(this.pBlur, this.B, (g, pr) => {
      tex(0, self.A.tex); g.uniform1i(g.getUniformLocation(pr, 'uTex'), 0);
      g.uniform2f(g.getUniformLocation(pr, 'uDir'), 1.15 / w2, 0);
    });
    this.pass(this.pBlur, this.C, (g, pr) => {
      tex(0, self.B.tex); g.uniform1i(g.getUniformLocation(pr, 'uTex'), 0);
      g.uniform2f(g.getUniformLocation(pr, 'uDir'), 0, 1.15 / h2);
    });
    // wide: blur the tight result again, further -> A
    this.pass(this.pBlur, this.B, (g, pr) => {
      tex(0, self.C.tex); g.uniform1i(g.getUniformLocation(pr, 'uTex'), 0);
      g.uniform2f(g.getUniformLocation(pr, 'uDir'), 3.4 / w2, 0);
    });
    this.pass(this.pBlur, this.A, (g, pr) => {
      tex(0, self.B.tex); g.uniform1i(g.getUniformLocation(pr, 'uTex'), 0);
      g.uniform2f(g.getUniformLocation(pr, 'uDir'), 0, 3.4 / h2);
    });
    // composite to the screen
    const amt = (strength === undefined ? 1 : strength) * this.amt * Settings.bloom;
    this.pass(this.pComp, null, (g, pr) => {
      tex(0, self.C.tex); g.uniform1i(g.getUniformLocation(pr, 'uTight'), 0);
      tex(1, self.A.tex); g.uniform1i(g.getUniformLocation(pr, 'uWide'), 1);
      g.uniform2f(g.getUniformLocation(pr, 'uTexel'), 1 / w2, 1 / h2);
      g.uniform1f(g.getUniformLocation(pr, 'uAmt'), amt);
      g.uniform1f(g.getUniformLocation(pr, 'uAber'), Settings.crt ? 0.0032 : 0.0);
      g.uniform1f(g.getUniformLocation(pr, 'uStreak'), Settings.crt ? 0.95 : 0.35);
      g.uniform1f(g.getUniformLocation(pr, 'uTime'), G.uiT);
    });
    this.show();
  },

  // if the machine cannot keep up, give the frame back before the game stutters
  adapt(fps) {
    if (!this.ok || !this.on) return;
    if (fps < 46) {
      this.slowN++; this.fastN = 0;
      if (this.slowN > 4) {
        this.slowN = 0;
        if (this.div < 6) this.div++;
        else { Settings.bloom = 0; this.hide(); }
      }
    } else if (fps > 57) {
      this.fastN++; this.slowN = 0;
      if (this.fastN > 10 && this.div > 4) { this.fastN = 0; this.div--; }
    }
  }
};


/* the tube itself: scanlines, aperture grille, roll and vignette. Pure CSS
   over the top of everything, so it costs nothing per frame. */
const Grille = {
  el: null, on: null,
  sync(st) {
    if (this.el === null) this.el = document.getElementById('grille') || false;
    if (!this.el) return;
    const want = !!Settings.crt;
    if (want !== this.on) {
      this.on = want;
      this.el.classList.toggle('on', want);
    }
  }
};


/* ------------------------------------------------------------------------
   DESCENT  --  the beat between pressing LAUNCH and being in the arena.

   It reuses the boot screen, which already has the sigil and already sits
   above every canvas; all that is added is the world's name, a bar, and a
   wash of that world's colour. The run is not started until the screen has
   had its moment, so none of it is played behind the overlay.
   ------------------------------------------------------------------------ */
const Descent = {
  el: null, halo: null, cap: null, sub: null, bar: null,
  t: 0, dur: 0, go: null, out: 0,

  grab() {
    if (this.el !== null) return;
    this.el = document.getElementById('boot') || false;
    if (!this.el) return;
    this.halo = this.el.querySelector('.halo');
    this.cap = this.el.querySelector('.cap');
    this.sub = this.el.querySelector('.sub');
    this.bar = this.el.querySelector('.bar i');
  },

  start(planetId, diff) {
    this.grab();
    const pl = PLANET_BY_ID[planetId];
    if (!this.el || !pl) { G.reset(diff, planetId); return; }
    this.go = { id: planetId, diff: diff };
    this.dur = this.t = 1.7;
    this.out = 0;
    if (this.sub) {
      this.sub.textContent = pl.name;
      this.sub.style.color = pl.col;
      this.sub.style.textShadow = '0 0 26px ' + pl.col;
    }
    if (this.cap) this.cap.textContent = pl.hole ? 'GOING ALL THE WAY DOWN' : 'MAKING PLANETFALL';
    if (this.halo) {
      this.halo.style.background = 'radial-gradient(ellipse 56% 56% at 50% 44%, ' +
        pl.col + '30 0%, rgba(0,0,0,0) 68%)';
      this.halo.style.opacity = '1';
    }
    if (this.bar) { this.bar.style.background = pl.col; this.bar.style.width = '0'; }
    this.el.classList.remove('gone', 'fade');
    Sound.ui(true);
  },

  busy() { return !!this.go; },

  tick(dt) {
    if (!this.go && this.out <= 0) return;
    if (this.go) {
      this.t -= dt;
      if (this.bar) this.bar.style.width = Math.round(clamp(1 - this.t / this.dur, 0, 1) * 100) + '%';
      if (this.t <= 0) {
        const g = this.go;
        this.go = null;
        G.reset(g.diff, g.id);
        this.out = 0.44;
        if (this.el) this.el.classList.add('fade');
      }
    } else {
      this.out -= dt;
      if (this.out <= 0 && this.el) {
        this.el.classList.add('gone');
        if (this.halo) this.halo.style.opacity = '0';
        if (this.sub) this.sub.textContent = '';
      }
    }
  }
};


/* ========================================================================
   CODES  --  short strings that hand out something the game cannot give
   you any other way. Type one in SETTINGS > CODES.

   ------------------------------------------------------------------------
   ADDING YOUR OWN
   ------------------------------------------------------------------------
   The table below stores a HASH of each code, not the code itself, so
   nobody can read the list straight out of the page source. To add one:

     1. open the game, press F12, and in the console run
            VOIDBLOOM.codeHash('YOURCODEHERE')
        which prints something like "1f4a2b9".
     2. add a line to CODE_LIST with that hash in `h`.

   Case, spaces, dashes and underscores are all ignored, so VOIDBLOOM,
   void bloom and Void-Bloom are the same code.

   What a code can hand out:
     shards: 500            spendable in the skin and pet shops
     skin:   'ashfall'      unlocks it outright, no matter its price
     pet:    'chronid'      same
     msg:    'text'         the line shown when it lands
   Give it as many of those as you like. A code can only ever be used once
   per save, and `name` is what the REDEEMED list shows afterwards.
   ======================================================================== */
function codeHash(str) {
  const k = String(str || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  let h = 2166136261;
  for (let i = 0; i < k.length; i++) { h ^= k.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}

const CODE_LIST = [
  { h: codeHash('VOIDBLOOM'),     name: 'VOIDBLOOM',     shards: 500,
    msg: 'For turning up.' },
  { h: codeHash('AGARDENGROWS'),  name: 'A GARDEN GROWS', shards: 1500,
    msg: 'A garden grows in the dark.' },
  { h: codeHash('FIRSTLIGHT'),    name: 'FIRST LIGHT',   shards: 300, pet: 'cinder',
    msg: 'An ember that never quite went out.' },
  { h: codeHash('THESOWERKNOWS'), name: 'THE SOWER',     shards: 1000, pet: 'chronid',
    msg: 'It was always going to be you.' },
  { h: codeHash('OG_PLAYERZ'),    name: 'DAY ZERO',      shards: 2000, skin: 'dayzero',
    msg: 'You were here before the dark had a name.' }
  /* your own go here, e.g.
  , { h: 'PASTE_THE_HASH_HERE', name: 'LAUNCH DAY', shards: 2000, skin: 'ashfall',
      msg: 'Thanks for playing on day one.' }
  */
];
const CODE_BY_H = Object.create(null);
for (const c of CODE_LIST) CODE_BY_H[c.h] = c;

const Codes = {
  done() {
    const d = Save.data;
    if (!d.codes) d.codes = {};
    return d.codes;
  },
  used(h) { return !!this.done()[h]; },
  count() { let n = 0; for (const k in this.done()) n++; return n; },
  list() {
    const out = [];
    for (const c of CODE_LIST) if (this.used(c.h)) out.push(c.name);
    return out;
  },
  redeem(raw) {
    const k = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!k) return { ok: false, msg: 'type something first', col: PAL.dim };
    const h = codeHash(k);
    const c = CODE_BY_H[h];
    if (!c) return { ok: false, msg: 'that is not a code', col: PAL.danger };
    if (this.used(h)) return { ok: false, msg: 'already redeemed on this save', col: '#ffb347' };

    const d = Save.data;
    const got = [];
    if (c.shards) { d.shards = (d.shards || 0) + c.shards; got.push('+' + fmtNum(c.shards) + ' SHARDS'); }
    if (c.skin) {
      if (!Array.isArray(d.owned)) d.owned = ['seed'];
      if (d.owned.indexOf(c.skin) < 0) d.owned.push(c.skin);
      const sk = SKINS.find(x => x.id === c.skin);
      got.push('SKIN · ' + (sk ? sk.name : c.skin.toUpperCase()));
    }
    if (c.pet) {
      if (!Array.isArray(d.pets)) d.pets = ['mote'];
      if (d.pets.indexOf(c.pet) < 0) d.pets.push(c.pet);
      const pt = PETS.find(x => x.id === c.pet);
      got.push('PET · ' + (pt ? pt.name : c.pet.toUpperCase()));
    }
    this.done()[h] = 1;
    Save.save();
    Sound.achieve();
    return { ok: true, msg: c.msg || 'redeemed', got: got, name: c.name, col: '#8dff6b' };
  }
};

const MAP_W = 1000, MAP_H = 690;
const THREAT_RAD = [0, 22, 26, 30, 35, 41, 34];
function mapXform() {
  const sc = Math.min((VW - 70) / MAP_W, (VH - 170) / MAP_H);
  return { s: sc, ox: VW / 2 - MAP_W / 2 * sc, oy: (VH * 0.5 + 18) - MAP_H / 2 * sc };
}

const UI = {
  sels: Object.create(null), hoverIdx: -1, lastState: '', lockT: 0,
  panelPulse: 0,

  /* ------------------------------------------------------------- helpers */
  begin(state) {
    if (this.lastState !== state) {
      this.lastState = state; this.hoverIdx = -1; this.lockT = 0.35;
      this.sels[state] = 0;
    }
  },
  menu(c, items, x, y, gap, opt) {
    opt = opt || {};
    const id = opt.id || 'm';
    const passive = !!opt.passive;
    if (this.sels[id] === undefined) this.sels[id] = 0;
    let sel = Math.min(this.sels[id], items.length - 1);
    const size = opt.size || 26;
    let hover = -1;
    if (!passive) {
      for (let i = 0; i < items.length; i++) {
        const iy = y + i * gap;
        const w = opt.w || 340;
        if (Input.mx > x - w / 2 && Input.mx < x + w / 2 && Input.my > iy - gap * 0.42 && Input.my < iy + gap * 0.42) hover = i;
      }
      if (hover >= 0 && hover !== this.hoverIdx && Input.mmoved) { sel = hover; Sound.ui(false); }
      this.hoverIdx = hover;
      if (Input.hit('ArrowDown', 's') || Input.gpPressed[13]) { sel = (sel + 1) % items.length; Sound.ui(false); }
      if (Input.hit('ArrowUp', 'w') || Input.gpPressed[12]) { sel = (sel + items.length - 1) % items.length; Sound.ui(false); }
    }
    let fire = !passive && this.lockT <= 0 && (Input.hit('Enter', 'space') || Input.gpPressed[0]);
    if (!passive && this.lockT <= 0 && Input.mclick && hover >= 0) { sel = hover; fire = true; }
    this.sels[id] = sel;

    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const iy = y + i * gap;
      const on = i === sel && !passive;
      const label = typeof it.label === 'function' ? it.label() : it.label;
      if (on) {
        c.save();
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = 0.14 + Math.sin(G.uiT * 5) * 0.04;
        c.fillStyle = it.color || PAL.player;
        roundRect(c, x - (opt.w || 340) / 2, iy - gap * 0.4, opt.w || 340, gap * 0.8, 10);
        c.fill();
        c.restore();
      }
      tracked(c, label, x, iy + size * 0.34, {
        size: size, weight: on ? 800 : 600, align: 'center',
        color: on ? (it.color || '#fff') : PAL.dim,
        glow: on ? (it.color || PAL.player) : null, blur: 16, track: size * 0.14
      });
      if (on) {
        const bob = Math.sin(G.uiT * 6) * 3;
        const hw = (opt.w || 340) / 2;
        tracked(c, '<', x - hw + 18 - bob, iy + size * 0.34, { size: size * 0.8, align: 'center', color: it.color || PAL.player, glow: true });
        tracked(c, '>', x + hw - 18 + bob, iy + size * 0.34, { size: size * 0.8, align: 'center', color: it.color || PAL.player, glow: true });
      }
    }
    if (fire && items[sel]) { Sound.ui(true); items[sel].act(); return true; }
    return false;
  },

  /* --------------------------------------------------------------- world */
  world(c) {
    if (Cosmos.aProg !== undefined && Cosmos.show()) {
      c.clearRect(0, 0, VW, VH);
      Cosmos.renderArena(G.time);
    } else {
      Cosmos.hide();
      Backdrop.draw(c, G.time);
    }
    c.save();
    c.translate(VW / 2 + Cam.shakeX, VH / 2 + Cam.shakeY);
    c.rotate(Cam.ang);
    c.scale(Cam.zoom, Cam.zoom);
    c.translate(-Cam.x, -Cam.y);

    drawArena(c, G.time, G.arenaR);

    const vx0 = Cam.x - VW / 2 / Cam.zoom - 140, vx1 = Cam.x + VW / 2 / Cam.zoom + 140;
    const vy0 = Cam.y - VH / 2 / Cam.zoom - 140, vy1 = Cam.y + VH / 2 / Cam.zoom + 140;
    const inView = o => o.x > vx0 && o.x < vx1 && o.y > vy0 && o.y < vy1;

    // pre-filter large arrays once per frame
    const visPools = [], visGadgets = [], visPickups = [], visEnemies = [], visShots = [], visEBullets = [];
    for (const p of G.pools) if (inView(p)) visPools.push(p);
    for (const g of G.gadgets) if (g.kind !== 'chain' && inView(g)) visGadgets.push(g);
    for (const p of G.pickups) if (inView(p)) visPickups.push(p);
    for (const e of G.enemies) if (inView(e)) visEnemies.push(e);
    for (const s of G.shots) if (inView(s)) visShots.push(s);
    for (const b of G.ebullets) if (inView(b)) visEBullets.push(b);

    for (const p of visPools) p.draw(c);
    for (const g of visGadgets) g.draw(c);
    for (const p of visPickups) p.draw(c);
    if (G.state !== 'title') Pet.draw(c);

    // boss telegraph beams under enemies
    for (const f of G.fx) {
      if (f.t !== 'tele') continue;
      const k = f.life / f.max;
      c.save();
      c.translate(f.x, f.y); c.rotate(f.a);
      c.globalCompositeOperation = 'lighter';
      if (!f.fired) {
        c.globalAlpha = 0.28 * (1 - k) + 0.1;
        c.fillStyle = f.col;
        c.fillRect(0, -f.w / 2 * 0.3, f.len, f.w * 0.3);
      } else {
        c.globalAlpha = k / 0.34;
        c.fillStyle = f.col; c.shadowColor = f.col; c.shadowBlur = 30;
        c.fillRect(0, -f.w / 2, f.len, f.w);
        c.fillStyle = '#fff';
        c.fillRect(0, -f.w * 0.16, f.len, f.w * 0.32);
      }
      c.restore();
    }

    for (const e of visEnemies) e.draw(c);
    Weapons.drawFx(c);
    for (const s of visShots) s.draw(c);
    for (const b of visEBullets) b.draw(c);
    Weapons.drawThirst(c);
    Weapons.drawSiphon(c);
    Weapons.drawPendulum(c);
    Weapons.drawThorns(c);
    Weapons.drawVeil(c);
    Weapons.drawPharos(c);
    for (const g of G.gadgets) if (g.kind === 'chain') g.draw(c);
    G.drawSilence(c);
    Particles.draw(c);
    if (!G.player.dead || G.state === 'win') G.player.draw(c);
    Pops.draw(c);

    // off-screen boss / elite markers
    for (const e of G.enemies) {
      if (!(e.elite || e.boss) || inView(e)) continue;
      const a = Math.atan2(e.y - Cam.y, e.x - Cam.x);
      const rx = (VW / 2 - 40) / Cam.zoom, ry = (VH / 2 - 40) / Cam.zoom;
      const mx = Cam.x + Math.cos(a) * Math.min(rx, ry) * 0.98;
      const my = Cam.y + Math.sin(a) * Math.min(rx, ry) * 0.98;
      c.save();
      c.translate(mx, my); c.rotate(a);
      c.globalAlpha = 0.6 + Math.sin(G.uiT * 8) * 0.2;
      neon(c, cc => pathPoly(cc, 3, 13, 0), e.def.col, { lw: 2, blur: 12, core: null, inner: false });
      c.restore();
    }
    c.restore();
  },

  /* ----------------------------------------------------------------- hud */
  bar(c, x, y, w, h, frac, col, bg) {
    c.save();
    c.fillStyle = bg || 'rgba(255,255,255,0.08)';
    roundRect(c, x, y, w, h, h / 2); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.14)'; c.lineWidth = 1; c.stroke();
    if (frac > 0) {
      c.save();
      roundRect(c, x, y, w, h, h / 2); c.clip();
      c.fillStyle = col;
      c.shadowColor = col; c.shadowBlur = 14;
      c.fillRect(x, y, w * sat(frac), h);
      c.globalAlpha = 0.35;
      c.fillStyle = '#fff';
      c.fillRect(x, y, w * sat(frac), h * 0.4);
      c.restore();
    }
    c.restore();
  },
  hud(c) {
    const p = G.player;
    const hs = clamp(Math.min(VW / 1280, VH / 760), 0.6, 1);
    const narrow = VW < 700;
    const pad = 22 * hs + 4;
    const menuBtnH = 34 * hs;
    // ---- life
    const hw = narrow ? VW * 0.46 : Math.min(300, VW * 0.28);
    const bh = 15 * hs, xh = 9 * hs;
    this.bar(c, pad, pad, hw, bh, p.hp / p.maxHp, PAL.hp);
    text(c, Math.ceil(p.hp) + ' / ' + p.maxHp, pad + 9 * hs, pad + bh / 2 + 0.5, { size: 11.5 * hs, weight: 800, color: '#fff', baseline: 'middle', alpha: 0.95 });
    this.bar(c, pad, pad + bh + 7 * hs, hw, xh, G.xp / G.xpNeed, PAL.xp);
    tracked(c, G.D.name, pad, pad + bh + 7 * hs + xh + 16 * hs, { size: 11 * hs, weight: 800, align: 'left', color: G.D.color, alpha: 0.78, track: 3 });
    // level badge
    c.save();
    c.translate(pad + hw + 24 * hs, pad + bh * 0.9);
    neon(c, cc => pathPoly(cc, 6, 19 * hs, Math.PI / 6), PAL.xp, { lw: 2, blur: 12, core: 'rgba(6,20,12,0.8)' });
    text(c, String(G.level), 0, 0, { size: 16 * hs, weight: 900, align: 'center', baseline: 'middle', color: '#eaffef' });
    c.restore();

    // ---- timer (top centre)
    const D = G.D;
    const tcol = G.boss ? G.boss.def.col : (!G.endless && G.time >= BOSS_T - 30 ? '#ffd166' : PAL.text);
    const ty = narrow ? pad + bh + xh + 40 * hs : pad + 22 * hs;
    tracked(c, fmtTime(G.time), VW / 2, ty, { size: 30 * hs, weight: 800, align: 'center', color: tcol, glow: tcol, blur: 12, mono: true, track: 2 });
    if (G.endless) {
      const frac = 1 - sat(G.tideT / (D.tideEvery || 20));
      tracked(c, 'TIDE \u00d7' + G.tide, VW / 2, ty + 19 * hs, { size: 13 * hs, weight: 900, align: 'center', color: D.color, glow: D.color, blur: 10, track: 3 });
      const tw = 116 * hs;
      this.bar(c, VW / 2 - tw / 2, ty + 25 * hs, tw, 4 * hs, frac, D.color, 'rgba(60,0,44,0.5)');
    } else if (!G.bossSpawned && !G.boss && G.solo) {
      text(c, 'IT IS ALREADY DOWN THERE', VW / 2, ty + 17 * hs, { size: 11 * hs, weight: 700, align: 'center', color: PAL.dim, alpha: 0.85 });
    } else if (!G.bossSpawned && !G.boss) {
      let nextT = BOSS_T, nextN = 'BLOOM';
      for (const g of GAUNTLET) { if (G.time < g.t) { nextT = g.t; nextN = ENEMY[g.id].name.replace('THE ', ''); break; } }
      const left = Math.max(0, nextT - G.time);
      text(c, left > 0 ? nextN + ' IN ' + fmtTime(left) : '', VW / 2, ty + 17 * hs, { size: 11 * hs, weight: 700, align: 'center', color: PAL.dim, alpha: 0.85 });
    }
    if (G.revives > 0) {
      c.save(); c.translate(pad + hw + 24 * hs, pad + bh * 0.9 + 34 * hs);
      drawIcon(c, 'vitality', 20 * hs);
      c.restore();
      text(c, '\u00d7' + G.revives, pad + hw + 38 * hs, pad + bh * 0.9 + 38 * hs, { size: 12 * hs, weight: 900, color: PAL.xp });
    }

    // ---- boss bar
    if (G.boss && !G.boss.dead) {
      const bcol = G.boss.def.col;
      const bw = Math.min(620, VW * 0.72), bx = VW / 2 - bw / 2, by = ty + (G.endless ? 56 : 30) * hs;
      const more = G.bossCount() - 1;
      const isSower = G.boss.def.bossKind === 'sower';
      const sTitle = isSower ? (SOWER_FORMS[G.boss.form | 0] || SOWER_FORMS[0]).title : '';
      tracked(c, (isSower ? sTitle : G.boss.def.name) + (G.boss.shielded > 0 ? '   \u2014 SHIELDED' : '') + (more > 0 ? '   +' + more + ' MORE' : ''), VW / 2, by - 6, { size: 13 * hs, weight: 800, align: 'center', color: bcol, glow: bcol, blur: 10 });
      this.bar(c, bx, by, bw, 12 * hs, G.boss.hp / G.boss.maxHp, bcol, 'rgba(60,0,40,0.55)');
      if (isSower) {
        // one pip per body it still has to be talked out of
        const nF = SOWER_FORMS.length, cur = G.boss.form | 0;
        for (let i = 0; i < nF; i++) {
          const px2 = bx + bw + 12 * hs + i * 13 * hs;
          c.save();
          c.globalAlpha = i < cur ? 0.28 : 1;
          c.strokeStyle = i <= cur ? bcol : 'rgba(150,158,190,0.7)';
          c.fillStyle = i === cur ? bcol : 'rgba(0,0,0,0)';
          c.lineWidth = 1.4;
          c.beginPath(); c.arc(px2, by + 6 * hs, 4 * hs, 0, TAU);
          if (i === cur) c.fill();
          c.stroke(); c.restore();
        }
      }
      for (let i = 1; i < 3; i++) {
        c.save(); c.globalAlpha = 0.5; c.strokeStyle = '#000'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(bx + bw * i / 3, by); c.lineTo(bx + bw * i / 3, by + 12 * hs); c.stroke(); c.restore();
      }
    }

    // ---- menu button (top-right, click/tap to pause)
    if (G.state === 'playing') {
      const mbR = 17 * hs, mbx = VW - pad - mbR, mby = pad + mbR;
      const mbHover = Math.hypot(Input.mx - mbx, Input.my - mby) <= mbR + 4;
      c.save();
      c.globalAlpha = mbHover ? 1 : 0.75;
      c.fillStyle = 'rgba(10,12,26,0.6)';
      c.beginPath(); c.arc(mbx, mby, mbR, 0, TAU); c.fill();
      c.strokeStyle = mbHover ? PAL.player : 'rgba(255,255,255,0.35)';
      c.lineWidth = 2;
      if (mbHover) { c.shadowColor = PAL.player; c.shadowBlur = 12; }
      c.stroke();
      c.fillStyle = mbHover ? '#fff' : 'rgba(255,255,255,0.85)';
      c.fillRect(mbx - mbR * 0.32, mby - mbR * 0.4, mbR * 0.22, mbR * 0.8);
      c.fillRect(mbx + mbR * 0.1, mby - mbR * 0.4, mbR * 0.22, mbR * 0.8);
      c.restore();
      if (mbHover && Input.mclick) { Sound.ui(false); G.state = 'paused'; UI.lastState = ''; }
    }

    // ---- score / kills
    tracked(c, fmtNum(G.score), VW - pad, pad + 16 * hs + menuBtnH, { size: 26 * hs, weight: 800, align: 'right', color: PAL.gold, glow: PAL.gold, blur: 10, mono: true, track: 1 });
    // the multiplier shares the kills line -- the combo counter owns the space below
    text(c, G.kills + ' slain', VW - pad, pad + 33 * hs + menuBtnH, { size: 12 * hs, weight: 700, align: 'right', color: PAL.dim });
    if (D.scoreMul !== 1) {
      const sm = D.scoreMul * (G.endless ? (1 + G.tide * 0.02) : 1);
      const lbl = '\u00d7' + (sm >= 10 ? sm.toFixed(0) : sm.toFixed(sm % 1 ? 1 : 0)) + ' SCORE';
      const kw = (G.kills + ' slain').length * 6.4 * hs + 14 * hs;
      text(c, lbl, VW - pad - kw, pad + 33 * hs + menuBtnH, { size: 11 * hs, weight: 900, align: 'right', color: D.color, alpha: 0.95 });
    }
    if (G.combo > 4) {
      const k = sat(G.comboT / 2.6);
      const mult = 1 + Math.min(G.combo, 60) * 0.02 + G.time / 420;
      tracked(c, 'x' + mult.toFixed(2), VW - pad, pad + 60 * hs + menuBtnH, {
        size: (19 + Math.min(6, G.combo * 0.08)) * hs, weight: 900, align: 'right',
        color: '#fff', glow: PAL.gold, blur: 14, alpha: 0.4 + k * 0.6
      });
      text(c, 'STREAK ' + G.combo, VW - pad, pad + 75 * hs + menuBtnH, { size: 10.5 * hs, weight: 700, align: 'right', color: PAL.dim, alpha: 0.4 + k * 0.6 });
    }

    // ---- weapons rail
    const items = [];
    for (const w of G.weapons) items.push({ id: w.evolved ? WEAPONS[w.id].evo.id : w.id, lv: w.level, evo: w.evolved, col: weaponColor(w) });
    const pids = Object.keys(G.passives);
    for (const id of pids) items.push({ id: id, lv: G.passives[id], evo: false, col: PASSIVES[id].color, small: true });
    const perRow = Math.max(5, Math.floor((VW - pad * 2 + 6) / (50 * hs)));
    const bs = Math.min(44 * hs, (VW - pad * 2 - 6 * (perRow - 1)) / perRow);
    const gapx = 6 * hs;
    const rows = Math.ceil(items.length / perRow);
    const bx = pad, by0 = VH - pad - bs - (rows - 1) * (bs + gapx);
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const x = bx + (i % perRow) * (bs + gapx);
      const by = by0 + Math.floor(i / perRow) * (bs + gapx);
      c.save();
      c.globalAlpha = 0.9;
      c.fillStyle = 'rgba(10,12,26,0.55)';
      roundRect(c, x, by, bs, bs, 9); c.fill();
      c.strokeStyle = it.evo ? it.col : 'rgba(255,255,255,0.13)';
      c.lineWidth = it.evo ? 2 : 1;
      if (it.evo) { c.shadowColor = it.col; c.shadowBlur = 12; }
      c.stroke();
      c.restore();
