      c.save(); c.translate(x + bs / 2, by + bs / 2 - bs * 0.07);
      drawIcon(c, it.id, bs * 0.62);
      c.restore();
      // pips
      for (let k = 0; k < 5; k++) {
        const px = x + bs * 0.14 + k * bs * 0.15, py = by + bs - bs * 0.14;
        c.beginPath(); c.arc(px, py, bs * 0.045, 0, TAU);
        c.fillStyle = k < it.lv ? it.col : 'rgba(255,255,255,0.16)';
        c.fill();
      }
    }

    // ---- rerolls / ascension
    if (G.rerolls > 0) {
      text(c, 'REROLLS ' + G.rerolls, VW - pad, VH - pad - 2, { size: 11 * hs, weight: 700, align: 'right', color: PAL.dim, alpha: 0.75 });
    }
    // the pacts you have made, so you can see what you are living with
    if (G.actII) {
      const ids = Object.keys(G.covs || {});
      if (ids.length) {
        let cx2 = pad;
        for (const id of ids) {
          const cv = COV_BY_ID[id]; if (!cv) continue;
          const w2 = tracked(c, cv.name, 0, 0, { size: 9 * hs, weight: 800, track: 1.8, measureOnly: true });
          tracked(c, cv.name, cx2, VH - pad - 20 * hs, { size: 9 * hs, weight: 800, color: cv.col, track: 1.8, alpha: 0.85 });
          cx2 += w2 + 14 * hs;
        }
      }
      tracked(c, 'OVERGROWTH ' + G.og, pad, VH - pad - 34 * hs, { size: 10 * hs, weight: 900, color: '#8dff6b', track: 2.6, alpha: 0.9 });
    }
    // HOARFROST's rime, and being frozen by it, both need to be legible
    if (G.rime > 0 || G.freezeT > 0) {
      const rx = VW / 2, ry = VH - 96 * hs;
      const n = 12, bw = 9 * hs, gp = 3 * hs, tw = n * bw + (n - 1) * gp;
      for (let i = 0; i < n; i++) {
        c.fillStyle = i < G.rime ? '#a8e6ff' : 'rgba(40,54,70,0.7)';
        c.fillRect(rx - tw / 2 + i * (bw + gp), ry, bw, 5 * hs);
      }
      tracked(c, G.freezeT > 0 ? 'FROZEN' : 'RIME', rx, ry - 7 * hs, {

    }

      const a = Math.min(inK, outK);
      const bossRoom = (G.boss && !G.boss.dead) ? 34 * hs : 0;

      c.strokeStyle = PAL.player; c.lineWidth = 2;
      c.beginPath(); c.arc(Input.touch.ox, Input.touch.oy, 62, 0, TAU); c.stroke();
      c.globalAlpha = 0.6;
      c.beginPath(); c.arc(Input.touch.ox + Input.touch.dx, Input.touch.oy + Input.touch.dy, 24, 0, TAU); c.fill();

  /* ----------------------------------------------------------------- pets */
  pets(c) {
    this.begin('pets');
    const t = G.uiT, d = Save.data;
    c.save();
    c.fillStyle = 'rgba(4,5,12,0.9)'; c.fillRect(0, 0, VW, VH);

    tracked(c, 'PETS', VW / 2, 50, { size: Math.min(28, VW * 0.042), weight: 900, align: 'center', color: '#9ef7ff', glow: '#9ef7ff', blur: 16, track: 9 });
    text(c, 'Purely cosmetic. They never fight, and they get out of the way when it matters.',
      VW / 2, 72, { size: 12.5, weight: 700, align: 'center', color: PAL.dim });
    tracked(c, fmtNum(d.shards || 0) + ' SHARDS', VW / 2, 92, { size: 11.5, weight: 900, align: 'center', color: '#c9a3ff', track: 3 });

    const cols = VW < 900 ? 3 : 4;
    const gw = Math.min(VW - 60, cols * 210), cw = gw / cols - 12;
    const rows = Math.ceil(PETS.length / cols);
    const top = 112, maxH = VH - top - 78;
    const chh = Math.max(84, Math.min(118, maxH / rows - 10));
    const gx = VW / 2 - gw / 2, gy = top + Math.max(0, (maxH - (rows * (chh + 10) - 10)) / 2);

    if (this.sels.pets === undefined) this.sels.pets = 0;
    let hover = -1;
    for (let i = 0; i < PETS.length; i++) {
      const x = gx + (i % cols) * (cw + 12), y = gy + ((i / cols) | 0) * (chh + 10);
      if (Input.mx >= x && Input.mx <= x + cw && Input.my >= y && Input.my <= y + chh) hover = i;
    }
    if (hover >= 0 && Input.mmoved) this.sels.pets = hover;
    const sel = Math.min(this.sels.pets, PETS.length - 1);

    for (let i = 0; i < PETS.length; i++) {
      const pt = PETS[i];
      const owned = petOwned(pt.id), on = d.pet === pt.id;
      const mastery = pt.price < 0;
      const x = gx + (i % cols) * (cw + 12), y = gy + ((i / cols) | 0) * (chh + 10);
      c.save();
      c.fillStyle = on ? 'rgba(14,20,28,0.96)' : (owned ? 'rgba(11,13,22,0.9)' : 'rgba(8,9,16,0.55)');
      roundRect(c, x, y, cw, chh, 5); c.fill();
      c.strokeStyle = !owned ? 'rgba(48,54,78,0.9)' : (on ? pt.col : 'rgba(70,78,110,0.9)');
      c.lineWidth = on ? 1.9 : 1.1;
      if (!owned) c.setLineDash([4, 4]);
      roundRect(c, x, y, cw, chh, 5); c.stroke(); c.setLineDash([]);
      if (i === sel) {
        c.strokeStyle = owned ? pt.col : 'rgba(120,132,175,1)';
        c.globalAlpha = 0.45 + Math.sin(t * 4) * 0.2; c.lineWidth = 1;
        roundRect(c, x - 3, y - 3, cw + 6, chh + 6, 7); c.stroke(); c.globalAlpha = 1;
      }
      c.restore();

      // a live preview of the thing itself
      if (owned && pt.form !== 'none') {
        c.save();
        c.globalCompositeOperation = 'lighter';
        petShape(c, pt, x + cw / 2, y + 34 + Math.sin(t * 2 + i) * 2.5, 1, 0, 0, 0, 0, t + i);
        c.restore();
      } else if (!owned) {
        tracked(c, '?', x + cw / 2, y + 40, { size: 20, weight: 900, align: 'center', color: 'rgba(80,90,124,1)', track: 2 });
      }

      tracked(c, owned ? pt.name : '? ? ?', x + cw / 2, y + chh - 28,
        { size: 10, weight: 800, align: 'center', color: owned ? pt.col : 'rgba(80,90,124,1)', track: 1.8 });
      let sub2;
      if (on) sub2 = 'WORN';
      else if (owned) sub2 = 'equip';
      else if (mastery) sub2 = pt.reqText;
      else sub2 = fmtNum(pt.price) + ' shards';
      text(c, sub2, x + cw / 2, y + chh - 12,
        { size: 9.5, weight: 700, align: 'center', color: on ? PAL.gold : (owned ? PAL.dim : (mastery ? 'rgba(120,132,175,0.9)' : ((d.shards || 0) >= pt.price ? '#8dff6b' : '#7d5c6a'))) });
    }

    const cur = PETS[sel];
    text(c, cur.blurb, VW / 2, VH - 44, { size: 12.5, weight: 700, align: 'center', color: 'rgba(160,170,200,0.95)' });
    text(c, 'ENTER to equip or buy  ·  H to hide pets  ·  BACKSPACE to go back',
      VW / 2, VH - 22, { size: 12, weight: 700, align: 'center', color: PAL.dim });
    c.restore();

    if (this.lockT > 0) return;
    const move = dd => { this.sels.pets = (sel + dd + PETS.length) % PETS.length; Sound.ui(true); };
    if (Input.hit('ArrowRight') || Input.hit('d')) move(1);
    if (Input.hit('ArrowLeft') || Input.hit('a')) move(-1);
    if (Input.hit('ArrowDown') || Input.hit('s')) move(cols);
    if (Input.hit('ArrowUp') || Input.hit('w')) move(-cols);
    if (Input.hit('h')) {
      d.petMode = d.petMode === 1 ? 0.5 : (d.petMode === 0.5 ? 0 : 1);
      Save.save(); Sound.ui(true); this.lockT = 0.18;
    }
    const click = Input.mclick && hover >= 0;
    if (click) this.sels.pets = hover;
    if (click || Input.hit('Enter') || Input.hit('space') || Input.gpPressed[0]) {
      const pt = PETS[Math.min(this.sels.pets, PETS.length - 1)];
      this.lockT = 0.18;
      if (petOwned(pt.id)) { d.pet = pt.id; Save.save(); Sound.ui(true); }
      else if (pt.price > 0 && (d.shards || 0) >= pt.price) {
        d.shards -= pt.price; d.pets.push(pt.id); d.pet = pt.id; Save.save();
        Sound.levelUp();
      } else Sound.ui(false);
    }
  },

    this.dim(c, 0.86);
    tracked(c, 'A COVENANT', VW / 2, VH * 0.2, { size: Math.min(32, VW * 0.045), weight: 900, align: 'center', color: PAL.boss, glow: PAL.boss, blur: 20, track: 9 });

      roundRect(c, x, gy, cw, ch, 8); c.stroke();
      c.restore();

      c.save(); c.strokeStyle = 'rgba(60,68,98,0.9)'; c.lineWidth = 1;

      tracked(c, 'YOU GIVE UP', x + 20, gy + ch - 74, { size: 9, weight: 800, color: '#ff8f6b', track: 2.2 });
      wrapText(c, cv.cost, x + 20, gy + ch - 56, cw - 40, 15, { size: 12.5, weight: 700, color: '#f0cfc2' });
    }

    text(c, 'arrows to choose  ·  ENTER to swear it', VW / 2, gy + ch + 40, { size: 13, weight: 700, align: 'center', color: PAL.dim });

    if (this.lockT > 0 || !n) return;
    if (Input.hit('ArrowRight') || Input.hit('d')) { this.sels.cov = (sel + 1) % n; Sound.ui(true); }
    if (Input.hit('ArrowLeft') || Input.hit('a')) { this.sels.cov = (sel + n - 1) % n; Sound.ui(true); }
    for (let i = 0; i < n; i++) if (Input.hit(String(i + 1))) { this.sels.cov = i; }
    const click = Input.mclick && hover >= 0;
    if (click) this.sels.cov = hover;
    if (click || Input.hit('Enter') || Input.hit('space') || Input.gpPressed[0]) {
      G.takeCovenant(cards[Math.min(this.sels.cov, n - 1)].id);
      this.lockT = 0.2; Sound.levelUp();
    }

  /* --------------------------------------------------------------- relics */
  relics(c) {
    this.begin('relics');
    const t = G.uiT, q = Conquest.d();
    c.save();
    c.fillStyle = 'rgba(4,5,12,0.9)'; c.fillRect(0, 0, VW, VH);

    tracked(c, 'RELICS', VW / 2, 52, { size: Math.min(28, VW * 0.042), weight: 900, align: 'center', color: PAL.gold, glow: PAL.gold, blur: 16, track: 8 });
    text(c, 'Two at a time. Every one of them costs you something.', VW / 2, 74, { size: 12.5, weight: 700, align: 'center', color: PAL.dim });

    // the two slots
    const slotW = 190, slotH = 34, sy = 96;
    for (let i = 0; i < MAX_RELICS; i++) {
      const sx = VW / 2 - (MAX_RELICS * (slotW + 12) - 12) / 2 + i * (slotW + 12);
      const rid = q.equipped[i];
      const R = rid && RELIC_BY_ID[rid];
      c.save();
      c.fillStyle = R ? 'rgba(14,16,28,0.95)' : 'rgba(10,11,20,0.6)';
      roundRect(c, sx, sy, slotW, slotH, 4); c.fill();
      c.strokeStyle = R ? R.col : 'rgba(60,68,98,0.8)'; c.lineWidth = 1.2;
      if (!R) c.setLineDash([4, 4]);
      roundRect(c, sx, sy, slotW, slotH, 4); c.stroke();
      c.setLineDash([]); c.restore();
      tracked(c, R ? R.name : 'EMPTY SLOT', sx + slotW / 2, sy + 22, { size: 11, weight: 800, align: 'center', color: R ? R.col : 'rgba(90,100,135,1)', track: 2.4 });
    }

    // the grid
    const cols = VW < 900 ? 2 : 3;
    const gw = Math.min(VW - 70, cols * 330), cw = gw / cols - 12;
    const rows = Math.ceil(RELIC_IDS.length / cols);
    const top = sy + slotH + 26, maxH = VH - top - 56;
    const chh = Math.max(70, Math.min(104, maxH / rows - 10));
    const gx = VW / 2 - gw / 2;
    const gy = top + Math.max(0, (maxH - (rows * (chh + 10) - 10)) / 2);

    if (this.sels.relics === undefined) this.sels.relics = 0;
    let hover = -1;
    for (let i = 0; i < RELIC_IDS.length; i++) {
      const cx = gx + (i % cols) * (cw + 12), cy = gy + ((i / cols) | 0) * (chh + 10);
      if (Input.mx >= cx && Input.mx <= cx + cw && Input.my >= cy && Input.my <= cy + chh) hover = i;
    }
    if (hover >= 0 && Input.mmoved) this.sels.relics = hover;
    const sel = Math.min(this.sels.relics, RELIC_IDS.length - 1);

    for (let i = 0; i < RELIC_IDS.length; i++) {
      const rid = RELIC_IDS[i], R = RELIC_BY_ID[rid];
      const owned = Conquest.has(rid), on = Conquest.equipped(rid);
      const cx = gx + (i % cols) * (cw + 12), cy = gy + ((i / cols) | 0) * (chh + 10);
      const isSel = i === sel;
      c.save();
      c.fillStyle = on ? 'rgba(22,20,11,0.95)' : (owned ? 'rgba(12,14,24,0.9)' : 'rgba(8,9,16,0.55)');
      roundRect(c, cx, cy, cw, chh, 4); c.fill();
      c.strokeStyle = !owned ? 'rgba(48,54,78,0.9)' : (on ? R.col : 'rgba(70,78,110,0.9)');
      c.lineWidth = on ? 1.8 : 1.1;
      if (!owned) c.setLineDash([4, 4]);
      roundRect(c, cx, cy, cw, chh, 4); c.stroke();
      c.setLineDash([]);
      if (isSel) {
        c.strokeStyle = owned ? R.col : 'rgba(120,132,175,1)';
        c.globalAlpha = 0.45 + Math.sin(t * 4) * 0.2; c.lineWidth = 1;
        roundRect(c, cx - 3, cy - 3, cw + 6, chh + 6, 6); c.stroke(); c.globalAlpha = 1;
      }
      c.restore();

      tracked(c, owned ? R.name : '? ? ?', cx + 13, cy + 21, { size: 11, weight: 800, color: owned ? R.col : 'rgba(80,90,124,1)', track: 2.2 });
      if (on) tracked(c, 'EQUIPPED', cx + cw - 13, cy + 21, { size: 9, weight: 800, align: 'right', color: PAL.gold, track: 2 });
      if (owned) {
        wrapText(c, R.desc, cx + 13, cy + 40, cw - 26, 14, { size: 11, weight: 600, color: 'rgba(156,166,198,0.95)' });
      } else {
        text(c, 'Conquer ' + R.from + ' to take it.', cx + 13, cy + 42, { size: 11, weight: 600, color: 'rgba(74,82,116,1)' });
      }
    }

    text(c, 'ENTER to equip or remove  ·  BACKSPACE to go back', VW / 2, VH - 24, { size: 12, weight: 700, align: 'center', color: PAL.dim });
    c.restore();

    if (this.lockT > 0) return;
    const move = d => { this.sels.relics = (sel + d + RELIC_IDS.length) % RELIC_IDS.length; Sound.ui(true); };
    if (Input.hit('ArrowRight') || Input.hit('d')) move(1);
    if (Input.hit('ArrowLeft') || Input.hit('a')) move(-1);
    if (Input.hit('ArrowDown') || Input.hit('s')) move(cols);
    if (Input.hit('ArrowUp') || Input.hit('w')) move(-cols);
    const click = Input.mclick && hover >= 0;
    if (click) this.sels.relics = hover;
    if (click || Input.hit('Enter') || Input.hit('space') || Input.gpPressed[0]) {
      const r = Conquest.toggle(RELIC_IDS[Math.min(this.sels.relics, RELIC_IDS.length - 1)]);
      Sound.ui(r !== 'locked');
      this.lockT = 0.16;
    }
  },

  /* ------------------------------------------------------ conquest map */
  conquest(c) {
    this.begin('conquest');
    const t = G.uiT, X = mapXform();
    if (this.sels.conq === undefined) this.sels.conq = 0;

    const cos = Cosmos.show();
    c.save();
    if (!cos) { c.fillStyle = 'rgba(4,5,12,0.72)'; c.fillRect(0, 0, VW, VH); }

    tracked(c, 'CONQUEST', VW / 2, 54, { size: Math.min(30, VW * 0.045), weight: 900, align: 'center', color: '#9ef7ff', glow: '#9ef7ff', blur: 18, track: 8 });
    {
      const QD = DIFFS[Conquest.d().diff] || DIFFS.medium;
      const left = Conquest.count() + ' of ' + PLANETS.length + ' worlds taken  ·  ';
      setFont(c, 12.5, 700);
      const lw = c.measureText(left).width;      // text() has no measureOnly; tracked() does
      const rw = tracked(c, QD.name, 0, 0, { size: 12.5, weight: 900, track: 2, measureOnly: true });
      const x0 = VW / 2 - (lw + rw + 14) / 2;
      text(c, left, x0, 76, { size: 12.5, weight: 700, color: PAL.dim });
      const cx0 = x0 + lw - 4, cy0 = 63;
      c.save();
      c.fillStyle = 'rgba(10,12,24,0.7)';
      c.strokeStyle = QD.color; c.globalAlpha = 0.7; c.lineWidth = 1;
      roundRect(c, cx0, cy0, rw + 18, 19, 3); c.fill(); c.stroke();
      c.restore();
      tracked(c, QD.name, cx0 + (rw + 18) / 2, 76.5, { size: 12.5, weight: 900, align: 'center', color: QD.color, track: 2 });
      this._diffHit = [cx0, cy0, cx0 + rw + 18, cy0 + 19];
    }
    this.keyStrip(c, VW / 2, 96);

    // threat rings
    c.save(); c.translate(X.ox + MAP_W / 2 * X.s, X.oy + MAP_H / 2 * X.s);
    c.strokeStyle = cos ? 'rgba(140,185,240,0.23)' : 'rgba(32,38,60,0.9)'; c.lineWidth = 1;
    for (const r of [115, 196, 272, 346, 420]) { c.beginPath(); c.arc(0, 0, r * X.s, 0, TAU); c.stroke(); }
    c.restore();

    // pick by pointer -- EVENTIDE sits at the origin, index PLANETS.length
    const evR = THREAT_RAD[EVENTIDE.threat] * X.s;
    const evX = X.ox + EVENTIDE.mx * X.s, evY = X.oy + EVENTIDE.my * X.s;
    let hover = -1;
    for (let i = 0; i < PLANETS.length; i++) {
      const pl = PLANETS[i];
      const px = X.ox + pl.mx * X.s, py = X.oy + pl.my * X.s;
      const r = THREAT_RAD[pl.threat] * X.s;
      if (Math.hypot(Input.mx - px, Input.my - py) < r + 22 * X.s) hover = i;
    }
    if (Math.hypot(Input.mx - evX, Input.my - evY) < evR + 20 * X.s) hover = PLANETS.length;
    if (hover >= 0 && Input.mmoved) this.sels.conq = hover;
    let sel = Math.min(this.sels.conq, PLANETS.length);

    for (let i = 0; i < PLANETS.length; i++) {
      const pl = PLANETS[i];
      const px = X.ox + pl.mx * X.s, py = X.oy + pl.my * X.s;
      const r = THREAT_RAD[pl.threat] * X.s;
      const on = i === sel;
      if (on) {
        c.save(); c.globalAlpha = 0.5 + Math.sin(t * 3.4) * 0.18;
        c.strokeStyle = pl.col; c.lineWidth = 1.4;
        c.setLineDash([4, 5]); c.lineDashOffset = -t * 22;
        c.beginPath(); c.arc(px, py, r + 13 * X.s, 0, TAU); c.stroke();
        c.setLineDash([]); c.restore();
      }
      if (!cos) drawPlanetBody(c, px, py, r, pl, t, t * (0.17 + (i % 5) * 0.035));
      const lsz = Math.max(9, 10.5 * X.s), ly = py + r + 21 * X.s;
      if (cos) tracked(c, pl.name, px, ly, { size: lsz, weight: 800, align: 'center', color: '#04060f', glow: '#04060f', blur: 7, track: 2.2 });
      tracked(c, pl.name, px, ly, { size: lsz, weight: 800, align: 'center', color: pl.col, track: 2.2, alpha: on ? 1 : 0.85 });
      if (Conquest.taken(pl.id)) {
        c.save(); c.strokeStyle = pl.col; c.globalAlpha = 0.9; c.lineWidth = 1.8; c.lineCap = 'round';
        c.beginPath(); c.arc(px, py, r + 7 * X.s, 0, TAU); c.globalAlpha = 0.6; c.stroke();
        c.globalAlpha = 1; c.beginPath();
        c.moveTo(px + r + 3 * X.s, py - r - 6 * X.s);
        c.lineTo(px + r + 6.5 * X.s, py - r - 2.5 * X.s);
        c.lineTo(px + r + 12 * X.s, py - r - 10 * X.s);
        c.stroke(); c.restore();
      }
    }

    // the hole at the middle of the chart. It has always been drawn there;
    // now it has a name, and once the key is whole it opens.
    {
      const whole = Conquest.keyWhole();
      const on = sel === PLANETS.length;
      if (on) {
        c.save(); c.globalAlpha = 0.5 + Math.sin(t * 3.4) * 0.18;
        c.strokeStyle = whole ? EVENTIDE.col : PAL.dim; c.lineWidth = 1.4;
        c.setLineDash([4, 5]); c.lineDashOffset = -t * 22;
        c.beginPath(); c.arc(evX, evY, evR + 15 * X.s, 0, TAU); c.stroke();
        c.setLineDash([]); c.restore();
      }
      if (!cos) drawBlackHole2D(c, evX, evY, evR, t);
      const nm = whole ? 'EVENTIDE' : 'SEALED';
      const lc = whole ? EVENTIDE.col : 'rgba(150,158,190,0.95)';
      const lsz2 = Math.max(9, 10.5 * X.s), ly2 = evY + evR + 34 * X.s;
      if (cos) tracked(c, nm, evX, ly2, { size: lsz2, weight: 800, align: 'center', color: '#04060f', glow: '#04060f', blur: 7, track: 2.2 });
      tracked(c, nm, evX, ly2, { size: lsz2, weight: 800, align: 'center', color: lc, track: 2.2, alpha: on ? 1 : 0.85 });
      if (!whole) {
        tracked(c, Conquest.keyCount() + ' / 3', evX, ly2 + 14 * X.s,
          { size: Math.max(8, 9 * X.s), weight: 800, align: 'center', color: PAL.dim, track: 2 });
      } else if (Conquest.holeDone()) {
        c.save(); c.strokeStyle = EVENTIDE.col; c.globalAlpha = 0.9; c.lineWidth = 1.8; c.lineCap = 'round';
        c.beginPath();
        c.moveTo(evX + evR + 3 * X.s, evY - evR - 6 * X.s);
        c.lineTo(evX + evR + 6.5 * X.s, evY - evR - 2.5 * X.s);
        c.lineTo(evX + evR + 12 * X.s, evY - evR - 10 * X.s);
        c.stroke(); c.restore();
      }
    }

    if (cos) Cosmos.req = { planets: cosmosPlanets(X), sel: sel, deep: 0,
      hero: { x: evX, y: evY, r: evR, col: EVENTIDE.col, type: 12, taken: 1 } };

    // what you are carrying
    const eq = Conquest.d().equipped;
    let et = 'RELICS  [R]   ';
    if (!eq.length) et += 'none equipped';
    else et += eq.map(r => (RELIC_BY_ID[r] ? RELIC_BY_ID[r].name : r)).join('  \u00b7  ');
    tracked(c, et, VW / 2, VH - 46, { size: 10.5, weight: 800, align: 'center', color: eq.length ? PAL.gold : PAL.dim, track: 2.4, alpha: 0.95 });
    text(c, 'arrows or mouse to choose  ·  ENTER to survey  ·  T for difficulty  ·  BACKSPACE to leave',
      VW / 2, VH - 26, { size: 12, weight: 700, align: 'center', color: PAL.dim });
    c.restore();

    if (this.lockT > 0) return;
    if (Input.hit('r')) { G.state = 'relics'; this.lastState = ''; Sound.ui(true); return; }
    if (Input.hit('t') || (Input.mclick && this._diffHit &&
        Input.mx > this._diffHit[0] && Input.mx < this._diffHit[2] &&
        Input.my > this._diffHit[1] && Input.my < this._diffHit[3])) {
      // the campaign's difficulty had no way to change at all before this
      const ring = DIFF_IDS.filter(k => !DIFFS[k].endless && !DIFFS[k].daily);
      const q = Conquest.d();
      const at = Math.max(0, ring.indexOf(q.diff));
      q.diff = ring[(at + 1) % ring.length];
      Save.save();
      G.banner('CONQUEST · ' + DIFFS[q.diff].name, DIFFS[q.diff].color);
      Sound.ui(true);
      return;
    }
    const nSpots = PLANETS.length + 1;
    if (Input.hit('ArrowRight') || Input.hit('d') || Input.gpPressed[15]) { this.sels.conq = (sel + 1) % nSpots; Sound.ui(true); }
    if (Input.hit('ArrowLeft') || Input.hit('a') || Input.gpPressed[14]) { this.sels.conq = (sel + nSpots - 1) % nSpots; Sound.ui(true); }
    if (Input.hit('ArrowDown') || Input.hit('s')) { this.sels.conq = Math.min(nSpots - 1, sel + 3); Sound.ui(true); }
    if (Input.hit('ArrowUp') || Input.hit('w')) { this.sels.conq = Math.max(0, sel - 3); Sound.ui(true); }
    const clicked = Input.mclick && hover >= 0;
    if (clicked) this.sels.conq = hover;
    if (clicked || Input.hit('Enter') || Input.hit('space') || Input.gpPressed[0]) {
      G.state = 'planet'; this.lastState = ''; this.lockT = 0.18; Sound.ui(true);
    }
  },

  /* three fragments, drawn as three slots that fill in */
  keyStrip(c, cx, cy) {
    const n = KEYS.length;
    const gap = 92, w = n * gap;
    const whole = Conquest.keyWhole();
    for (let i = 0; i < n; i++) {
      const k = KEYS[i];
      const held = Conquest.taken(k.from);
      const x = cx - w / 2 + gap * i + gap / 2;
      c.save();
      c.translate(x, cy);
      c.globalAlpha = held ? 1 : 0.42;
      neon(c, cc => {
        cc.beginPath();
        cc.moveTo(0, -8); cc.lineTo(6.5, -2.5); cc.lineTo(4.4, 7.5);
        cc.lineTo(-4.4, 7.5); cc.lineTo(-6.5, -2.5); cc.closePath();
      }, held ? k.col : '#3a4162', { lw: 1.5, blur: held ? 12 : 4, core: held ? 'rgba(10,12,24,0.75)' : null, inner: false });
      if (held) neon(c, cc => { cc.beginPath(); cc.arc(0, 0, 2.2, 0, TAU); }, '#ffffff',
        { lw: 1.2, blur: 8, core: null, inner: false });
      c.restore();
      tracked(c, held ? k.name : '???', x, cy + 22,
        { size: 8.5, weight: 800, align: 'center', color: held ? k.col : PAL.dim, track: 1.8, alpha: held ? 0.95 : 0.6 });
    }
    if (whole) {
      tracked(c, 'THE KEY IS WHOLE', cx, cy + 40,
        { size: 9, weight: 900, align: 'center', color: EVENTIDE.col, glow: EVENTIDE.col, blur: 10, track: 3 });
    }
  },

  /* --------------------------------------------------- planet dossier */
  planetView(c) {
    if ((this.sels.conq || 0) >= PLANETS.length) return this.holeView(c);
    this.begin('planet');
    const t = G.uiT;
    const pl = PLANETS[Math.min(this.sels.conq || 0, PLANETS.length - 1)];
    const taken = Conquest.taken(pl.id);

    const cos = Cosmos.show();
    c.save();
    if (!cos) { c.fillStyle = 'rgba(4,5,12,0.93)'; c.fillRect(0, 0, VW, VH); }

    const narrow = VW < 820;
    const bodyR = Math.min(narrow ? VW * 0.15 : VW * 0.105, VH * 0.165);
    const bx = narrow ? VW / 2 : VW * 0.245, by = narrow ? VH * 0.25 : VH * 0.5;

    // orbit path + survey craft
    c.save(); c.translate(bx, by); c.rotate(-0.3); c.scale(1, 0.3);
    c.strokeStyle = pl.col; c.globalAlpha = 0.22; c.lineWidth = 1;
    c.beginPath(); c.arc(0, 0, bodyR * 1.5, 0, TAU); c.stroke();
    c.restore();
    const oa = t * 0.5, od = bodyR * 1.5;
    const ox = bx + Math.cos(oa) * od * Math.cos(0.3) + Math.sin(oa) * od * 0.3 * Math.sin(0.3);
    const oy = by - Math.cos(oa) * od * Math.sin(0.3) + Math.sin(oa) * od * 0.3 * Math.cos(0.3);
    c.fillStyle = pl.col; c.globalAlpha = Math.sin(oa) > 0 ? 1 : 0.35;
    c.beginPath(); c.arc(ox, oy, 2.6, 0, TAU); c.fill(); c.globalAlpha = 1;

    if (cos) Cosmos.req = { planets: null, sel: -1, deep: 1,
      hero: { x: bx, y: by, r: bodyR * 1.04, col: pl.col,
              type: Math.min(11, PLANETS.indexOf(pl)), taken: taken } };
    else drawPlanetBody(c, bx, by, bodyR, pl, t, t * 0.19);

    // dossier
    const px = narrow ? 28 : VW * 0.47;
    const pw = narrow ? VW - 56 : Math.min(470, VW * 0.44);
    let y = narrow ? VH * 0.46 : VH * 0.5 - 158;

    // over a live starfield the text needs something to sit on
    if (cos) {
      c.save();
      const sx0 = px - 30, sy0 = y - 46, sw = pw + 60, sh = VH - sy0 - 26;
      const gg = c.createLinearGradient(sx0, 0, sx0 + sw, 0);
      gg.addColorStop(0, 'rgba(4,6,16,0)');
      gg.addColorStop(0.16, 'rgba(4,6,16,0.90)');
      gg.addColorStop(0.84, 'rgba(4,6,16,0.90)');
      gg.addColorStop(1, 'rgba(4,6,16,0)');
      c.fillStyle = gg; c.fillRect(sx0, sy0, sw, sh);
      c.restore();
    }

    tracked(c, taken ? '✓ CONQUERED' : 'SECTOR UNSURVEYED', px, y, { size: 10, weight: 800, color: taken ? '#8dff6b' : PAL.dim, track: 3 });
    y += 30;
    tracked(c, pl.name, px, y + 10, { size: Math.min(34, pw * 0.085), weight: 900, color: pl.col, glow: pl.col, blur: 14, track: 2 });
    y += 34;
    text(c, pl.flav, px, y + 6, { size: 13, weight: 600, color: PAL.dim, italic: true });
    y += 26;

    const row = (label, draw) => {
      c.save(); c.strokeStyle = 'rgba(40,46,70,0.9)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(px, y); c.lineTo(px + pw, y); c.stroke(); c.restore();
      y += 10;
      tracked(c, label, px, y + 14.5, { size: 9.5, weight: 800, color: PAL.dim, track: 2.4 });
      draw(px + 88, y);
      y += 34;
    };
    const box = (bx2, by2, label, col, dashed) => {
      const tw = tracked(c, label, 0, 0, { size: 9.5, weight: 800, track: 1.6, measureOnly: true });
      const bw = Math.max(28, tw + 18), bh = 21;
      c.save();
      c.fillStyle = dashed ? 'rgba(0,0,0,0)' : 'rgba(12,14,25,0.9)';
      roundRect(c, bx2, by2, bw, bh, 3); c.fill();
      c.strokeStyle = col; c.globalAlpha = dashed ? 0.55 : 0.85; c.lineWidth = 1;
      if (dashed) c.setLineDash([3, 3]);
      roundRect(c, bx2, by2, bw, bh, 3); c.stroke();
      c.setLineDash([]); c.restore();
      tracked(c, label, bx2 + bw / 2, by2 + 14.5, { size: 9.5, weight: 800, align: 'center', color: col, track: 1.6 });
      return bw + 7;
    };

    row('THREAT', (sx, sy) => {
      for (let i = 0; i < 5; i++) {
        text(c, '★', sx + i * 17, sy + 16, { size: 16, weight: 900, color: i < pl.threat ? pl.col : 'rgba(50,56,80,1)' });
      }
      tracked(c, pl.threat + ' / 5', sx + 96, sy + 15, { size: 9.5, weight: 800, color: PAL.dim, track: 2 });
    });
    row('LOCALS', (sx, sy) => {
      let dx = 0;
      for (const l of pl.loc) dx += box(sx + dx, sy, taken ? l.toUpperCase() : '?', taken ? '#c4cadf' : PAL.dim, !taken);
    });
    row('FINALE', (sx, sy) => {
      const nm = ENEMY[pl.finaleNow] ? ENEMY[pl.finaleNow].name : pl.finale.toUpperCase();
      box(sx, sy, taken ? nm : '?', pl.col, !taken);
    });
    row('GAUNTLET', (sx, sy) => {
      box(sx, sy, '4 DRAWN · POOL OF ' + Conquest.pool(pl.id).length, PAL.dim, false);
    });
    row('RELIC', (sx, sy) => {
      box(sx, sy, taken ? pl.relicName : '?', PAL.gold, !taken);
    });
    if (taken) {
      text(c, pl.relicDesc, px, y + 12, { size: 11.5, weight: 600, color: 'rgba(160,170,200,0.9)' });
      y += 24;
    }
    const b = Conquest.d().best[pl.id];
    if (b && b.score) {
      text(c, 'best ' + fmtNum(b.score) + '   ·   ' + fmtTime(b.time || 0), px, y + 14, { size: 11.5, weight: 700, color: PAL.dim });
    }
    y += 30;

    const items = [
      { label: taken ? 'RUN AGAIN' : 'LAUNCH', color: pl.col, act: () => { Sound.resume(); Descent.start(pl.id, Conquest.d().diff); } },
      { label: 'SECTOR MAP', color: PAL.dim, act: () => { G.state = 'conquest'; UI.lastState = ''; } }
    ];
    this.menu(c, items, px + pw / 2, y + 22, 34, { size: 15, w: Math.min(300, pw), id: 'planetgo' });
    if (pl.press) tracked(c, 'OFFERS PRESS ON', px, y + 74, { size: 9.5, weight: 800, color: '#ff4fd8', track: 2.4, alpha: 0.9 });
    c.restore();
  },


  /* ------------------------------------------------------- EVENTIDE dossier
     The chart has drawn rings around this point since the first run. This is
     the screen that finally names it. Sealed until the key is whole; there is
     no relic on the other side of it and no gauntlet in front of it. */
  holeView(c) {
    this.begin('planet');
    const t = G.uiT;
    const pl = EVENTIDE;
    const whole = Conquest.keyWhole();
    const done = Conquest.holeDone();
    const cos = Cosmos.show();

    c.save();
    if (!cos) { c.fillStyle = 'rgba(3,3,10,0.94)'; c.fillRect(0, 0, VW, VH); }

    const narrow = VW < 820;
    const bodyR = Math.min(narrow ? VW * 0.095 : VW * 0.062, VH * 0.105);
    const bx = narrow ? VW / 2 : VW * 0.225, by = narrow ? VH * 0.24 : VH * 0.5;

    // the twelve worlds, reduced to one ring falling in
    c.save(); c.translate(bx, by); c.rotate(-0.3); c.scale(1, 0.3);
    c.strokeStyle = pl.col; c.globalAlpha = 0.20; c.lineWidth = 1;
    c.beginPath(); c.arc(0, 0, bodyR * 2.4, 0, TAU); c.stroke();
    c.restore();
    const oa = -t * 0.62, od = bodyR * 2.4;
    const ox = bx + Math.cos(oa) * od * Math.cos(0.3) + Math.sin(oa) * od * 0.3 * Math.sin(0.3);
    const oy = by - Math.cos(oa) * od * Math.sin(0.3) + Math.sin(oa) * od * 0.3 * Math.cos(0.3);
    c.fillStyle = pl.col; c.globalAlpha = Math.sin(oa) > 0 ? 1 : 0.3;
    c.beginPath(); c.arc(ox, oy, 2.6, 0, TAU); c.fill(); c.globalAlpha = 1;

    if (cos) Cosmos.req = { planets: null, sel: -1, deep: 1,
      hero: { x: bx, y: by, r: bodyR, col: pl.col, type: 12, taken: 1 } };
    else drawBlackHole2D(c, bx, by, bodyR, t);

    const px = narrow ? 28 : VW * 0.47;
    const pw = narrow ? VW - 56 : Math.min(470, VW * 0.44);
    let y = narrow ? VH * 0.45 : VH * 0.5 - 168;

    if (cos) {
      c.save();
      const sx0 = px - 62, sy0 = y - 52, sw = pw + 110, sh = VH - sy0 - 22;
      const gg = c.createLinearGradient(sx0, 0, sx0 + sw, 0);
      gg.addColorStop(0, 'rgba(3,4,12,0)');
      gg.addColorStop(0.13, 'rgba(3,4,12,0.96)');
      gg.addColorStop(0.87, 'rgba(3,4,12,0.96)');
      gg.addColorStop(1, 'rgba(3,4,12,0)');
      c.fillStyle = gg; c.fillRect(sx0, sy0, sw, sh);
      c.restore();
    }

    tracked(c, done ? '✓ PUT OUT' : (whole ? 'THE WAY IS OPEN' : 'SEALED'), px, y,
      { size: 10, weight: 800, color: done ? '#8dff6b' : (whole ? pl.col : PAL.dim), track: 3 });
    y += 30;
    tracked(c, pl.name, px, y + 10, { size: Math.min(34, pw * 0.085), weight: 900, color: pl.col, glow: pl.col, blur: 16, track: 2 });
    y += 34;
    text(c, pl.flav, px, y + 6, { size: 13, weight: 600, color: PAL.dim, italic: true });
    y += 26;

    const row = (label, draw, h) => {
      c.save(); c.strokeStyle = 'rgba(40,46,70,0.9)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(px, y); c.lineTo(px + pw, y); c.stroke(); c.restore();
      y += 10;
      tracked(c, label, px, y + 14.5, { size: 9.5, weight: 800, color: PAL.dim, track: 2.4 });
      draw(px + 112, y);
      y += (h || 34);
    };
    const box = (bx2, by2, label, col, dashed) => {
      const tw = tracked(c, label, 0, 0, { size: 9.5, weight: 800, track: 1.6, measureOnly: true });
      const bw = Math.max(28, tw + 18), bh = 21;
      c.save();
      c.fillStyle = dashed ? 'rgba(0,0,0,0)' : 'rgba(12,14,25,0.9)';
      roundRect(c, bx2, by2, bw, bh, 3); c.fill();
      c.strokeStyle = col; c.globalAlpha = dashed ? 0.55 : 0.85; c.lineWidth = 1;
      if (dashed) c.setLineDash([3, 3]);
      roundRect(c, bx2, by2, bw, bh, 3); c.stroke();
      c.setLineDash([]); c.restore();
      tracked(c, label, bx2 + bw / 2, by2 + 14.5, { size: 9.5, weight: 800, align: 'center', color: col, track: 1.6 });
      return bw + 7;
    };

    row('THE KEY', (sx, sy) => {
      let dx = 0;
      for (const k of KEYS) {
        const held = Conquest.taken(k.from);
        dx += box(sx + dx, sy, held ? k.name : '?', held ? k.col : PAL.dim, !held);
      }
    });
    row('THREAT', (sx, sy) => {
      tracked(c, 'ABSOLUTE', sx, sy + 15, { size: 13, weight: 900, color: pl.col, glow: pl.col, blur: 12, track: 3 });
      tracked(c, 'past the last star on the chart', sx + 124, sy + 15, { size: 9.5, weight: 700, color: PAL.dim, track: 1.4 });
    });
    row('WHAT WAITS', (sx, sy) => {
      box(sx, sy, done ? 'THE SOWER' : '?', pl.col, !done);
      if (done) tracked(c, 'FOUR FORMS', sx + 110, sy + 14.5, { size: 9.5, weight: 800, color: PAL.dim, track: 2 });
    });
    row('THE RULE', (sx, sy) => {
      text(c, 'Nothing else lives down here.', sx, sy + 12, { size: 11.5, weight: 700, color: 'rgba(170,178,208,0.95)' });
      text(c, 'It will not stay dead the first three times.', sx, sy + 28, { size: 11.5, weight: 700, color: 'rgba(170,178,208,0.95)' });
    }, 50);

    const b = Conquest.d().best.eventide;
    if (b && b.score) {
      text(c, 'best ' + fmtNum(b.score) + '   ·   ' + fmtTime(b.time || 0), px, y + 14, { size: 11.5, weight: 700, color: PAL.dim });
    }
    y += 30;

    const items = [];
    if (whole) {
      items.push({ label: done ? 'DESCEND AGAIN' : 'DESCEND', color: pl.col,
                   act: () => { Sound.resume(); Descent.start('eventide', Conquest.d().diff); } });
    } else {
      items.push({ label: 'THE KEY IS NOT WHOLE  ' + Conquest.keyCount() + '/3', color: PAL.dim,
                   act: () => { Sound.ui(false); G.banner('TAKE THE THREE DEEPEST WORLDS', PAL.dim); } });
    }
    items.push({ label: 'SECTOR MAP', color: PAL.dim, act: () => { G.state = 'conquest'; UI.lastState = ''; } });
    this.menu(c, items, px + pw / 2, y + 22, 34, { size: 15, w: Math.min(320, pw), id: 'holego' });
    if (!whole) {
      const missing = KEYS.filter(k => !Conquest.taken(k.from)).map(k => PLANET_BY_ID[k.from].name);
      tracked(c, 'STILL STANDING: ' + missing.join('  ·  '), px, y + 76,
        { size: 9.5, weight: 800, color: '#ff9a3c', track: 2.2, alpha: 0.9 });
    }
    c.restore();
  },


  leaveCodes() {
    Input.textOn = false; Input.text = ''; this.codeMsg = null;
    G.state = 'settings'; this.lastState = ''; Sound.ui(false);
  },

  /* ------------------------------------------------------------- codes */
  codes(c) {
    this.begin('codes');
    this.dim(c, 0.82);
    Input.textOn = true;

    const w = Math.min(560, VW - 40), h = Math.min(470, VH - 32);
    const x = VW / 2 - w / 2, y = VH / 2 - h / 2;
    this.panel(c, x, y, w, h, 'rgba(201,163,255,0.30)');
    tracked(c, 'CODES', VW / 2, y + 44, { size: 24, weight: 900, align: 'center', color: '#c9a3ff', glow: '#c9a3ff', blur: 18, track: 7 });
    text(c, 'for things the game will not hand you any other way', VW / 2, y + 65,
      { size: 11.5, weight: 600, align: 'center', color: PAL.dim });

    // the field
    const fw = w - 92, fx = x + 46, fy = y + 96;
    c.save();
    c.fillStyle = 'rgba(8,10,20,0.85)';
    roundRect(c, fx, fy, fw, 44, 5); c.fill();
    c.strokeStyle = '#c9a3ff'; c.globalAlpha = 0.55; c.lineWidth = 1.2;
    roundRect(c, fx, fy, fw, 44, 5); c.stroke();
    c.restore();
    const typed = Input.text || '';
    tracked(c, typed, fx + 16, fy + 29, { size: 18, weight: 900, color: '#eaf2ff', track: 3.4, mono: true });
    if ((G.uiT * 2) % 2 < 1) {
      const tw = tracked(c, typed, 0, 0, { size: 18, weight: 900, track: 3.4, mono: true, measureOnly: true });
      c.save(); c.fillStyle = '#c9a3ff'; c.globalAlpha = 0.9;
      c.fillRect(fx + 18 + tw, fy + 12, 2, 22); c.restore();
    }
    if (!typed) text(c, 'type a code', fx + 18, fy + 29, { size: 14, weight: 600, color: PAL.dim, alpha: 0.6 });

    text(c, 'ENTER to redeem  ·  BACKSPACE to erase', VW / 2, fy + 66,
      { size: 11.5, weight: 700, align: 'center', color: PAL.dim });

    // whatever the last attempt said
    let my = fy + 104;
    if (this.codeMsg) {
      tracked(c, this.codeMsg.head, VW / 2, my, { size: 13, weight: 900, align: 'center',
        color: this.codeMsg.col, glow: this.codeMsg.col, blur: 12, track: 3 });
      my += 22;
      if (this.codeMsg.body) {
        text(c, this.codeMsg.body, VW / 2, my, { size: 12.5, weight: 600, align: 'center', color: PAL.text, alpha: 0.85, italic: true });
        my += 20;
      }
      for (const g of (this.codeMsg.got || [])) {
        tracked(c, g, VW / 2, my, { size: 11.5, weight: 800, align: 'center', color: PAL.gold, track: 2.4 });
        my += 18;
      }
    }

    // what this save has already taken
    const had = Codes.list();
    const ly = y + h - 108;
    c.save(); c.globalAlpha = 0.14; c.strokeStyle = '#fff'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x + 46, ly - 14); c.lineTo(x + w - 46, ly - 14); c.stroke(); c.restore();
    tracked(c, 'REDEEMED  ' + had.length + ' / ' + CODE_LIST.length, VW / 2, ly + 2,
      { size: 10, weight: 800, align: 'center', color: PAL.dim, track: 2.6 });
    text(c, had.length ? had.join('   ·   ') : 'none yet', VW / 2, ly + 22,
      { size: 11.5, weight: 700, align: 'center', color: had.length ? '#8dff6b' : PAL.dim, alpha: 0.9 });

    const bw = 200, bh = 32, bx2 = VW / 2 - bw / 2, by2 = y + h - 56;
    const overBack = Input.mx > bx2 && Input.mx < bx2 + bw && Input.my > by2 && Input.my < by2 + bh;
    c.save();
    c.strokeStyle = overBack ? '#c9a3ff' : 'rgba(120,128,160,0.5)';
    c.globalAlpha = overBack ? 0.9 : 0.5; c.lineWidth = 1;
    roundRect(c, bx2, by2, bw, bh, 4); c.stroke(); c.restore();
    tracked(c, 'BACK  \u00b7  ESC', VW / 2, by2 + 21, { size: 13, weight: 800, align: 'center',
      color: overBack ? '#c9a3ff' : PAL.dim, track: 3 });

    if (this.lockT > 0) return;
    if (Input.mclick && overBack) { this.leaveCodes(); return; }
    if (Input.hit('Enter')) {
      const r = Codes.redeem(Input.text);
      this.codeMsg = {
        head: r.ok ? (r.name + '  —  REDEEMED') : r.msg.toUpperCase(),
        body: r.ok ? r.msg : '',
        got: r.got || [], col: r.col
      };
      if (r.ok) { Input.text = ''; Flash.hit('#c9a3ff', 0.25); }
      else Sound.ui(false);
    }
  },

  /* -------------------------------------------------------- daily challenge */
  daily(c) {
    this.begin('daily');
    this.dim(c, 0.78);
    const D = DIFFS.daily;
    const key = dailyKey();
    const rec = Save.dailyRec(key);
    const w = Math.min(660, VW - 36), h = Math.min(452, VH - 32);
    const x = VW / 2 - w / 2, y = VH / 2 - h / 2;
    this.panel(c, x, y, w, h, 'rgba(255,179,71,0.32)');

    tracked(c, 'DAILY CHALLENGE', VW / 2, y + 42, { size: Math.min(25, w * 0.045), weight: 900, align: 'center', color: D.color, glow: D.color, blur: 18, track: 6 });
    text(c, key + '   ·   the same run for everyone, everywhere', VW / 2, y + 62, { size: 11.5, weight: 700, align: 'center', color: PAL.dim });

    let ly = y + 96;
    const words = D.blurb.split(' ');
    const budget = Math.max(20, Math.floor((w - 90) / 7.4));
    let line = ''; const lines = [];
    for (const wd of words) {
      const t2 = line ? line + ' ' + wd : wd;
      if (t2.length > budget) { lines.push(line); line = wd; } else line = t2;
    }
    if (line) lines.push(line);
    for (const l of lines) { text(c, l, VW / 2, ly, { size: 13, weight: 600, align: 'center', color: PAL.text, alpha: 0.88 }); ly += 19; }
    ly += 8;

    for (const d2 of D.detail) {
      neon(c, cc => { cc.beginPath(); cc.arc(x + 46, ly - 4, 2.6, 0, TAU); }, D.color, { lw: 1.4, blur: 8, core: null, inner: false });
      text(c, d2, x + 60, ly, { size: 12.5, weight: 700, color: D.color, alpha: 0.92 });
      ly += 21;
    }

    ly += 14;
    c.save(); c.globalAlpha = 0.14; c.strokeStyle = '#fff'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x + 46, ly - 10); c.lineTo(x + w - 46, ly - 10); c.stroke(); c.restore();

    // today's card
    const cw = (w - 92) / 3;
    const cells = [
      ['TODAY’S BEST', rec.best ? fmtNum(rec.best) : '—'],
      ['SURVIVED', rec.time ? fmtTime(rec.time) : '—'],
      ['ATTEMPTS', String(rec.runs || 0)]
    ];
    for (let i = 0; i < cells.length; i++) {
      const cx = x + 46 + i * cw;
      text(c, cells[i][0], cx + cw / 2, ly + 6, { size: 10, weight: 800, align: 'center', color: PAL.dim });
      tracked(c, cells[i][1], cx + cw / 2, ly + 30, { size: 20, weight: 900, align: 'center', color: rec.best ? PAL.gold : PAL.dim, mono: true, track: 1 });
    }
    ly += 54;

    // the last few days, so a streak is visible
    const hist = (Save.data.dailyLog || []).slice(-6);
    if (hist.length) {
      text(c, 'RECENT DAYS', VW / 2, ly + 12, { size: 10, weight: 800, align: 'center', color: PAL.dim });
      let hx = VW / 2 - (hist.length * 74) / 2;
      for (const hrec of hist) {
        text(c, hrec.d.slice(5), hx + 37, ly + 30, { size: 10.5, weight: 700, align: 'center', color: PAL.dim, alpha: 0.8 });
        text(c, fmtNum(hrec.best), hx + 37, ly + 45, { size: 12, weight: 900, align: 'center', color: hrec.d === key ? D.color : PAL.text, alpha: 0.9, mono: true });
        hx += 74;
      }
    }

    this.menu(c, [
      { label: rec.runs ? 'RUN IT AGAIN' : 'BEGIN THE DAILY', color: D.color, act: () => { Sound.resume(); G.reset('daily'); } },
      { label: 'BACK', color: PAL.dim, act: () => { G.state = 'title'; UI.lastState = ''; } }
    ], VW / 2, y + h - 62, 38, { size: 19, w: w - 120, id: 'daily' });
  },

      VW / 2, y + h - 22, { size: 10.5, weight: 700, align: 'center', color: PAL.dim, alpha: 0.65 });
  },

  /* ------------------------------------------------------------ skin shop */
  skins(c) {
    this.begin('skins');
    this.dim(c, 0.82);
    const d = Save.data;
    const w = Math.min(940, VW - 32);
    const ownsIt = id => (d.owned || []).indexOf(id) >= 0;
    const SHOP = SKINS.filter(s => s.price >= 0 && (!s.secret || ownsIt(s.id)));
    const MAST = SKINS.filter(s => s.price < 0 && (!s.secret || ownsIt(s.id)));
    // how many tiles there actually are -- a hidden secret skin is in
    // SKINS but not in either wall, so NSK overruns the grid
    const NSK = SHOP.length + MAST.length;
    const cols = w < 400 ? 3 : (w < 760 ? 4 : 5);
    const sRows = Math.ceil(SHOP.length / cols);
    const mRows = Math.ceil(MAST.length / cols);
    const rows = sRows + mRows;
    const gap = 9;
    const headH = 74, footH = 104, labelH = 22;

    // what the grid would like, and what the window will actually allow
    const cwMax = (w - 52 - gap * (cols - 1)) / cols;
    const chWant = Math.min(112, cwMax * 1.02);
    const wantH = headH + labelH * 2 + rows * chWant + gap * (rows - 1) + footH;
    const h = Math.min(VH - 24, Math.max(360, wantH));
    const x = VW / 2 - w / 2, y = VH / 2 - h / 2;
    this.panel(c, x, y, w, h, 'rgba(255,209,102,0.28)');
    tracked(c, 'SKINS', VW / 2, y + 38, { size: Math.min(24, w * 0.036), weight: 900, align: 'center', color: PAL.gold, glow: PAL.gold, blur: 18, track: 7 });
    tracked(c, fmtNum(d.shards || 0), x + w - 24, y + 36, { size: 21, weight: 900, align: 'right', color: '#c9a3ff', glow: '#c9a3ff', blur: 12, track: 1, mono: true });
    text(c, 'SHARDS', x + w - 24, y + 52, { size: 10, weight: 800, align: 'right', color: PAL.dim, alpha: 0.85 });

    const headTop = y + headH;
    const room = (y + h - footH) - headTop - labelH * 2 - gap * (rows - 1);
    let ch = Math.max(40, Math.min(chWant, room / rows));
    let cw = Math.min(ch / 1.02, cwMax);
    ch = Math.min(ch, cw * 1.02);
    const gw = cols * cw + (cols - 1) * gap;
    const gx = VW / 2 - gw / 2;
    const sy = headTop + labelH;
    const my = sy + sRows * (ch + gap) + labelH;

    const slot = i => {
      const shop = i < SHOP.length;
      const k = shop ? i : i - SHOP.length;
      const col = k % cols, row = Math.floor(k / cols);
      return {
        sk: shop ? SHOP[k] : MAST[k], shop: shop, col: col,
        gr: shop ? row : sRows + row,
        cx: gx + col * (cw + gap),
        cy: (shop ? sy : my) + row * (ch + gap)
      };
    };
    const atRC = (gr, col) => {
      for (let i = 0; i < NSK; i++) { const s = slot(i); if (s.gr === gr && s.col === col) return i; }
      for (let i = NSK - 1; i >= 0; i--) { const s = slot(i); if (s.gr === gr) return i; }
      return -1;
    };

    const backHover = Input.mx > VW / 2 - 70 && Input.mx < VW / 2 + 70 && Input.my > y + h - 30 && Input.my < y + h - 2;
    if (backHover && Input.mclick && this.lockT <= 0) { Sound.ui(true); G.state = 'title'; UI.lastState = ''; return; }

    if (this.sels.skins === undefined) this.sels.skins = 0;
    let sel = clamp(this.sels.skins, 0, NSK - 1);
    let hover = -1;
    for (let i = 0; i < NSK; i++) {
      const s = slot(i);
      if (Input.mx > s.cx && Input.mx < s.cx + cw && Input.my > s.cy && Input.my < s.cy + ch) hover = i;
    }
    if (hover >= 0 && hover !== this.hoverIdx && Input.mmoved) { sel = hover; Sound.ui(false); }
    this.hoverIdx = hover;
    if (Input.hit('ArrowRight', 'd') || Input.gpPressed[15]) { sel = (sel + 1) % NSK; Sound.ui(false); }
    if (Input.hit('ArrowLeft', 'a') || Input.gpPressed[14]) { sel = (sel + NSK - 1) % NSK; Sound.ui(false); }
    if (Input.hit('ArrowDown', 's') || Input.gpPressed[13]) { const s = slot(sel); const n = atRC(Math.min(rows - 1, s.gr + 1), s.col); if (n >= 0) sel = n; Sound.ui(false); }
    if (Input.hit('ArrowUp', 'w') || Input.gpPressed[12]) { const s = slot(sel); const n = atRC(Math.max(0, s.gr - 1), s.col); if (n >= 0) sel = n; Sound.ui(false); }
    this.sels.skins = sel;

    const owned = id => id === 'seed' || (d.owned || []).indexOf(id) >= 0;
    let fire = this.lockT <= 0 && (Input.hit('Enter', 'space') || Input.gpPressed[0]);
    if (this.lockT <= 0 && Input.mclick && hover >= 0) { sel = hover; this.sels.skins = sel; fire = true; }
    if (fire) {
      const sk = slot(sel).sk;
      if (owned(sk.id)) {
        d.skin = sk.id; Save.save(); Sound.ui(true);
        this.toast = { s: sk.name + ' EQUIPPED', col: sk.col, t: 1.6 };
      } else if (sk.price < 0) {
        Sound.hurt();
        this.toast = { s: 'LOCKED — ' + sk.req, col: PAL.hp, t: 1.8 };
      } else if ((d.shards || 0) >= sk.price) {
        d.shards -= sk.price;
        if (!d.owned) d.owned = [];
        d.owned.push(sk.id);
        d.skin = sk.id;
        Save.save();
        Sound.fanfare(true);
        Flash.hit(sk.col, 0.3);
        this.toast = { s: sk.name + ' UNLOCKED', col: sk.col, t: 2.2 };
        Ach.sweepMeta();
      } else {
        Sound.hurt();
        this.toast = { s: 'NOT ENOUGH SHARDS', col: PAL.hp, t: 1.4 };
      }
    }

    // ---- section labels
    const lbl = (s, yy, col, note) => {
      tracked(c, s, gx, yy, { size: 10.5, weight: 900, color: col, track: 3, alpha: 0.95 });
      c.save(); c.globalAlpha = 0.16; c.strokeStyle = col; c.lineWidth = 1;
      c.beginPath(); c.moveTo(gx + tracked(c, s, 0, 0, { size: 10.5, weight: 900, track: 3, measureOnly: true }) + 12, yy - 4);
      c.lineTo(gx + gw, yy - 4); c.stroke(); c.restore();
      if (note) text(c, note, gx + gw, yy, { size: 9.5, weight: 700, align: 'right', color: PAL.dim, alpha: 0.7 });
    };
    lbl('BOUGHT WITH SHARDS', sy - 8, PAL.gold, 'finish runs to earn them');
    lbl('MASTERY', my - 8, '#ff6bd0', 'earned, never bought');

    // ---- the tiles
    for (let i = 0; i < NSK; i++) {
      const s = slot(i), sk = s.sk;
      const cx = s.cx, cy = s.cy;
      const on = i === sel;
      const has = owned(sk.id);
      const worn = d.skin === sk.id || (!d.skin && sk.id === 'seed');
      const locked = !has && sk.price < 0;
      const afford = sk.price >= 0 && (d.shards || 0) >= sk.price;

      c.save();
      c.fillStyle = has ? 'rgba(16,18,38,0.85)' : 'rgba(10,11,24,0.8)';
      roundRect(c, cx, cy, cw, ch, 11); c.fill();
      c.strokeStyle = worn ? sk.col : (on ? 'rgba(255,255,255,0.5)' : (locked ? 'rgba(255,107,208,0.18)' : 'rgba(255,255,255,0.12)'));
      c.lineWidth = worn || on ? 2 : 1;
      if (worn || on) { c.shadowColor = worn ? sk.col : '#fff'; c.shadowBlur = 16; }
      c.stroke();
      c.restore();

      const pr = cw * 0.17;
      const px = cx + cw / 2, py = cy + ch * 0.33;
      c.save();
      c.translate(px, py);
      if (!has) c.globalAlpha = 0.3;
      const spr = sprite('skin_' + sk.id + '_' + Math.round(pr), pr * 5, pr * 5, cc => paintSkin(cc, sk, pr, 0));
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = (has ? 0.5 : 0.14) + Math.sin(G.uiT * 3 + i) * 0.06;
      c.drawImage(glowSprite(sk.rainbow ? skinCol(sk, G.uiT) : sk.col), -pr * 2, -pr * 2, pr * 4, pr * 4);
      c.restore();
      c.rotate(on ? G.uiT * 0.7 : 0);
      c.drawImage(spr, -spr.width / 2, -spr.height / 2);
      c.restore();
      if (has) drawSkinHalo(c, sk, px, py, pr, G.uiT, 1.2, 0.5);

      const fit = Math.min(1, cw / 132);
      let nSize = 10.5 * fit, nTrack = 1.3 * fit;
      const nW = tracked(c, sk.name, 0, 0, { size: nSize, weight: 900, track: nTrack, measureOnly: true });
      if (nW > cw - 8) { const k = (cw - 8) / nW; nSize *= k; nTrack *= k; }
      tracked(c, sk.name, px, cy + ch * 0.71, {
        size: nSize, weight: 900, align: 'center',
        color: has ? sk.col : PAL.dim, track: nTrack, alpha: has ? 1 : 0.72
      });
      const tag = worn ? 'EQUIPPED' : (has ? 'OWNED' : (locked ? sk.short : fmtNum(sk.price)));
      let tSz = (locked ? 9 : 10) * fit;
      setFont(c, tSz, 800);
      const tW = c.measureText(tag).width;
      if (tW > cw - 8) tSz *= (cw - 8) / tW;
      text(c, tag, px, cy + ch * 0.87, {
        size: tSz, weight: 800, align: 'center',
        color: worn ? '#fff' : (has ? PAL.dim : (locked ? '#ff6bd0' : (afford ? PAL.gold : PAL.hp))),
        alpha: worn ? 1 : 0.9
      });
      if (!has) {
        c.save(); c.globalAlpha = 0.5;
        const lc = locked ? '#ff6bd0' : (afford ? PAL.gold : PAL.hp);
        c.strokeStyle = lc; c.lineWidth = 1.2;
        c.beginPath(); c.arc(cx + cw - 14, cy + 14, 5, 0, TAU); c.stroke();
        c.beginPath(); c.moveTo(cx + cw - 17.4, cy + 14); c.lineTo(cx + cw - 10.6, cy + 14); c.stroke();
        c.restore();
      }
    }

    // ---- blurb for the selected skin
    const s = slot(sel), sk = s.sk;
    const by = y + h - footH + 22;
    tracked(c, sk.name, VW / 2, by, { size: 15, weight: 900, align: 'center', color: sk.col, glow: sk.col, blur: 12, track: 3 });
    text(c, sk.blurb, VW / 2, by + 19, { size: 11.5, weight: 600, align: 'center', color: PAL.text, alpha: 0.82 });
    const has = owned(sk.id);
    const prompt = has ? (d.skin === sk.id ? 'already worn' : 'ENTER to wear')
      : (sk.price < 0 ? 'LOCKED — ' + sk.req
        : ((d.shards || 0) >= sk.price ? 'ENTER to buy for ' + fmtNum(sk.price) : 'you need ' + fmtNum(sk.price - (d.shards || 0)) + ' more shards'));
    text(c, prompt, VW / 2, by + 37, {
      size: 11.5, weight: 800, align: 'center', alpha: 0.92,
      color: has ? PAL.dim : (sk.price < 0 ? '#ff6bd0' : ((d.shards || 0) >= sk.price ? PAL.gold : PAL.hp))
    });

    if (this.toast && this.toast.t > 0) {
      this.toast.t -= 1 / 60;
      tracked(c, this.toast.s, VW / 2, y + h - 40, {
        size: 15, weight: 900, align: 'center', color: this.toast.col,
        glow: this.toast.col, blur: 16, track: 4, alpha: Math.min(1, this.toast.t * 2)
      });
    }
    tracked(c, 'BACK', VW / 2, y + h - 14, {
      size: 14, weight: 900, align: 'center', track: 3,
      color: backHover ? PAL.player : PAL.dim, glow: backHover ? PAL.player : null, blur: 12
    });
    text(c, 'BKSP', VW / 2 + 46, y + h - 14, { size: 10, weight: 800, color: PAL.dim, alpha: 0.5 });
  },

  /* ------------------------------------------------------- achievements */
  achievements(c) {
    if (this.lastState !== 'achievements') Ach.sweepMeta();
    this.begin('achievements');
    this.dim(c, 0.82);
    const w = Math.min(900, VW - 32), h = Math.min(700, VH - 24);
    const x = VW / 2 - w / 2, y = VH / 2 - h / 2;
    this.panel(c, x, y, w, h, 'rgba(255,209,102,0.28)');
    // the counter lives in the corner, so the title has to keep clear of it
    let tiSize = Math.min(23, w * 0.034), tiTrack = 6;
    const tiW = tracked(c, 'ACHIEVEMENTS', 0, 0, { size: tiSize, weight: 900, track: tiTrack, measureOnly: true });
    const tiRoom = w - 226;
    if (tiW > tiRoom) { const k = tiRoom / tiW; tiSize *= k; tiTrack *= k; }
    tracked(c, 'ACHIEVEMENTS', VW / 2, y + 38, { size: tiSize, weight: 900, align: 'center', color: PAL.gold, glow: PAL.gold, blur: 18, track: tiTrack });

    const done = Ach.count();
    tracked(c, done + ' / ' + ACHS.length, x + w - 24, y + 36, {
      size: Math.min(20, w * 0.048), weight: 900, align: 'right', mono: true, track: 1,
      color: done === ACHS.length ? PAL.gold : '#9ef7ff', glow: done === ACHS.length ? PAL.gold : '#9ef7ff', blur: 12
    });
    text(c, 'EARNED', x + w - 24, y + 52, { size: 10, weight: 800, align: 'right', color: PAL.dim, alpha: 0.85 });

    const twoCol = w > 640;
    const cols = twoCol ? 2 : 1;
    const top = y + 74, botR = y + h - 46;
    const rowH = 42;
    const perCol = Math.max(3, Math.floor((botR - top) / rowH));
    const perPage = perCol * cols;
    const pages = Math.ceil(ACHS.length / perPage);
    if (this.achPage === undefined) this.achPage = 0;
    if (Input.hit('ArrowRight', 'd', 'e') || Input.gpPressed[15]) { this.achPage = (this.achPage + 1) % pages; Sound.ui(false); }
    if (Input.hit('ArrowLeft', 'a', 'q') || Input.gpPressed[14]) { this.achPage = (this.achPage + pages - 1) % pages; Sound.ui(false); }
    if (Input.hit('ArrowDown', 's') || Input.gpPressed[13]) { this.achPage = (this.achPage + 1) % pages; Sound.ui(false); }
    if (Input.hit('ArrowUp', 'w') || Input.gpPressed[12]) { this.achPage = (this.achPage + pages - 1) % pages; Sound.ui(false); }
    const page = clamp(this.achPage, 0, pages - 1);

    const colW = (w - 56 - (cols - 1) * 18) / cols;
    for (let k = 0; k < perPage; k++) {
      const idx = page * perPage + k;
      if (idx >= ACHS.length) break;
      const a = ACHS[idx];
      const cIdx = Math.floor(k / perCol), rIdx = k % perCol;
      const ax = x + 28 + cIdx * (colW + 18);
      const ay = top + rIdx * rowH;
      const got = Ach.has(a.id);

      c.save();
      c.fillStyle = got ? 'rgba(20,22,44,0.72)' : 'rgba(10,11,24,0.55)';
      roundRect(c, ax, ay, colW, rowH - 6, 8); c.fill();
      c.globalAlpha = got ? 0.55 : 0.16;
      c.strokeStyle = got ? a.c : '#fff'; c.lineWidth = 1;
      c.stroke();
      c.restore();

      // the star: filled when earned, a hollow outline when not
      c.save();
      c.translate(ax + 20, ay + (rowH - 6) / 2);
      c.globalAlpha = got ? 1 : 0.3;
      neon(c, xx => pathStar(xx, 5, 9.5, 4.2, -Math.PI / 2), got ? a.c : PAL.dim,
        { lw: 1.6, blur: got ? 12 : 0, core: got ? a.c : null, inner: false });
      c.restore();

      tracked(c, a.n, ax + 38, ay + 16, {
        size: 11.5, weight: 900, track: 1.4,
        color: got ? a.c : PAL.dim, glow: got ? a.c : null, blur: 8, alpha: got ? 1 : 0.75
      });
      if (a.skin) {
        text(c, '◆ SKIN', ax + colW - 10, ay + 15, { size: 8.5, weight: 900, align: 'right', color: got ? '#ff6bd0' : PAL.dim, alpha: got ? 0.95 : 0.5 });
      }
      text(c, a.d, ax + 38, ay + 29, { size: 10, weight: 600, color: PAL.text, alpha: got ? 0.8 : 0.5 });

      // progress, for the ones you chip away at
      if (!got && a.prog) {
        const p = a.prog(), frac = clamp(p[0] / p[1], 0, 1);
        const bw = 74, bx = ax + colW - bw - 10, byy = ay + 25;
        c.save();
        c.fillStyle = 'rgba(255,255,255,0.1)'; roundRect(c, bx, byy, bw, 4, 2); c.fill();
        c.fillStyle = a.c; c.globalAlpha = 0.8; roundRect(c, bx, byy, bw * frac, 4, 2); c.fill();
        c.restore();
        text(c, fmtNum(p[0]) + '/' + fmtNum(p[1]), bx + bw, byy - 4, { size: 8.5, weight: 700, align: 'right', color: PAL.dim, alpha: 0.7 });
      }
    }

    if (pages > 1) {
      text(c, '◀   ' + (page + 1) + ' / ' + pages + '   ▶', VW / 2, y + h - 32,
        { size: 11, weight: 800, align: 'center', color: PAL.dim, alpha: 0.8 });
    }

    const backHover = Input.mx > VW / 2 - 70 && Input.mx < VW / 2 + 70 && Input.my > y + h - 28 && Input.my < y + h - 2;
    if (backHover && Input.mclick && this.lockT <= 0) { Sound.ui(true); G.state = 'title'; UI.lastState = ''; return; }
    if (this.lockT <= 0 && (Input.hit('Enter', 'space') || Input.gpPressed[0])) { Sound.ui(true); G.state = 'title'; UI.lastState = ''; return; }
    tracked(c, 'BACK', VW / 2, y + h - 12, {
      size: 14, weight: 900, align: 'center', track: 3,
      color: backHover ? PAL.player : PAL.dim, glow: backHover ? PAL.player : null, blur: 12
    });
    text(c, 'BKSP', VW / 2 + 46, y + h - 12, { size: 10, weight: 800, color: PAL.dim, alpha: 0.5 });
  },

  /* ------------------------------------------------------ difficulty pick */
  select(c) {
    this.begin('select');
    this.dim(c, 0.74);
    const w = Math.min(880, VW - 40), h = Math.min(narrowPick() ? 580 : 476, VH - 36);
    const x = VW / 2 - w / 2, y = VH / 2 - h / 2;
    const narrow = w < 660;
    this.panel(c, x, y, w, h, 'rgba(180,160,255,0.28)');
    tracked(c, 'CHOOSE YOUR DARK', VW / 2, y + 40, { size: Math.min(26, w * 0.038), weight: 900, align: 'center', color: '#c9a3ff', glow: '#c9a3ff', blur: 18, track: 6 });
    text(c, 'one run, no campaign \u2014 and what you pick here is what CONQUEST runs at too',
      VW / 2, y + 62, { size: 11.5, weight: 600, align: 'center', color: PAL.dim });

    const items = [];
    for (const id of DIFF_IDS) {
      const D = DIFFS[id];
      items.push({ label: D.name, color: D.color, act: () => {
        Sound.resume();
        Save.data.lastDiff = id;
        if (!D.endless && !D.daily) Conquest.d().diff = id;   // endless is not a campaign
        Save.save();
        G.reset(id);
      } });
    }
    items.push({ label: 'BACK', color: PAL.dim, act: () => { G.state = 'title'; UI.lastState = ''; } });

    const colX = narrow ? VW / 2 : x + w * 0.245;
    const listY = y + (narrow ? 86 : 104);
    const gap = narrow ? 38 : 46;
    this.menu(c, items, colX, listY, gap, { size: narrow ? 18 : 22, w: narrow ? w - 60 : w * 0.4, id: 'select' });

    const sel = Math.min(this.sels['select'] || 0, DIFF_IDS.length - 1);
    const D = DIFFS[DIFF_IDS[sel]];
    const isBack = (this.sels['select'] || 0) >= DIFF_IDS.length;
    const dx = narrow ? x + 24 : x + w * 0.50;
    const dw = (narrow ? w - 48 : w * 0.44) - 8;
    let dy = narrow ? listY + gap * items.length + 18 : y + 104;

    if (!narrow) {
      c.save(); c.globalAlpha = 0.14; c.strokeStyle = '#fff'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(x + w * 0.47, y + 88); c.lineTo(x + w * 0.47, y + h - 74); c.stroke(); c.restore();
    }
    if (isBack) {
      text(c, 'return to the title', dx, dy + 10, { size: 13, weight: 600, color: PAL.dim });
    } else {
      tracked(c, D.tag, dx, dy, { size: 20, weight: 900, color: D.color, glow: D.color, blur: 14, track: 4 });
      dy += 26;
      const words = D.blurb.split(' ');
      const budget = Math.max(16, Math.floor(dw / 7.8));
      let line = '';
      const lines = [];
      for (const wd of words) {
        const t2 = line ? line + ' ' + wd : wd;
        if (t2.length > budget) { lines.push(line); line = wd; } else line = t2;
      }
      if (line) lines.push(line);
      for (const l of lines) { text(c, l, dx, dy, { size: 13, weight: 600, color: PAL.text, alpha: 0.86 }); dy += 19; }
      dy += 10;
      const room = y + h - 66;
      for (const d2 of D.detail) {
        if (dy > room) break;
        neon(c, cc => { cc.beginPath(); cc.arc(dx + 4, dy - 4, 2.6, 0, TAU); }, D.color, { lw: 1.4, blur: 8, core: null, inner: false });
        text(c, d2, dx + 16, dy, { size: narrow ? 11.5 : 12.5, weight: 700, color: D.color, alpha: 0.92 });
        dy += 21;
      }
      if (dy > room) dy = room;
      const sd = Save.data;
      const best = (sd.diffBest && sd.diffBest[D.id]) || 0;
      const wins = (sd.diffWins && sd.diffWins[D.id]) || 0;
      const bt = (sd.diffTime && sd.diffTime[D.id]) || 0;
      const tide = (sd.diffTide && sd.diffTide[D.id]) || 0;
      dy += 12;
      c.save(); c.globalAlpha = 0.14; c.strokeStyle = '#fff'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(dx, dy - 12); c.lineTo(dx + dw, dy - 12); c.stroke(); c.restore();
      if (best > 0 || bt > 0) {
        text(c, 'BEST ' + fmtNum(best) + '  ·  LONGEST ' + fmtTime(bt) + (D.endless ? ('  ·  TIDE ' + tide) : (wins ? ('  ·  WINS ' + wins) : '')),
          dx, dy + 6, { size: narrow ? 10.5 : 11.5, weight: 700, color: PAL.dim });
      } else {
        text(c, 'never attempted', dx, dy + 6, { size: 11.5, weight: 700, color: PAL.dim, alpha: 0.7 });
      }
    }
    const loops = D && D.endless && !isBack;
    const foot = narrow
      ? (loops ? 'bosses in packs, stronger each pass' : 'four random bosses, then THE BLOOM')
      : (loops ? 'ten bosses in the pool — they arrive in packs, and each pass comes back stronger'
               : 'four of eight bosses, drawn fresh each run: 2:45 · 4:45 · 6:45 · 8:45, then THE BLOOM at 10:30');
    text(c, foot, VW / 2, y + h - 20, { size: narrow ? 10 : 10.5, weight: 700, align: 'center', color: PAL.dim, alpha: 0.72 });
  },

  how(c) {

    const w = Math.min(780, VW - 46), h = Math.min(566, VH - 46);
    const x = VW / 2 - w / 2, y = VH / 2 - h / 2;
    this.panel(c, x, y, w, h);
    tracked(c, 'HOW TO PLAY', VW / 2, y + 40, { size: 24, weight: 900, align: 'center', color: PAL.player, glow: PAL.player, blur: 16, track: 6 });
    const lines = [
      ['MOVE', 'WASD / Arrow keys / left stick / drag on touch'],
      ['DASH', 'SPACE (or A / bottom-right on touch) — brief invulnerability'],
      ['ATTACK', 'Automatic. Everything you own fires on its own timer.'],
      ['GROW', 'Green motes level you up. Pick a boon from the draft.'],
      ['EVOLVE', 'Max a weapon (LV 5), then reach LV 3 on its paired passive'],

  },

  records(c) {

    const w = Math.min(600, VW - 46), h = Math.min(542, VH - 46);
    const x = VW / 2 - w / 2, y = VH / 2 - h / 2;
    this.panel(c, x, y, w, h, 'rgba(255,209,102,0.3)');
    tracked(c, 'RECORDS', VW / 2, y + 42, { size: 24, weight: 900, align: 'center', color: PAL.gold, glow: PAL.gold, blur: 16, track: 6 });
    const d = Save.data;
    const rows = [
      ['RUNS PLAYED', String(d.runs)],
      ['BLOOMS FELLED', String(d.wins)],
      ['TOTAL SLAIN', fmtNum(d.kills)]
    ];
    let ry = y + 76;
