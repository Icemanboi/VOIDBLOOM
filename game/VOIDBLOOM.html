      c.save(); c.globalAlpha = 0.12; c.strokeStyle = '#fff'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(x + 40, ry + 11); c.lineTo(x + w - 40, ry + 11); c.stroke(); c.restore();
      ry += 32;
    }
    ry += 12;
    text(c, 'BY DIFFICULTY', x + 40, ry, { size: 12, weight: 900, color: PAL.gold, alpha: 0.9 });
    text(c, 'BEST', x + w - 172, ry, { size: 10.5, weight: 800, align: 'right', color: PAL.dim });
    text(c, 'TIME', x + w - 96, ry, { size: 10.5, weight: 800, align: 'right', color: PAL.dim });
    text(c, 'WIN', x + w - 40, ry, { size: 10.5, weight: 800, align: 'right', color: PAL.dim });
    ry += 22;
    for (const id of DIFF_IDS) {
      const D = DIFFS[id];
      const best = (d.diffBest && d.diffBest[id]) || 0;
      const bt = (d.diffTime && d.diffTime[id]) || 0;
      const wn = (d.diffWins && d.diffWins[id]) || 0;
      const td = (d.diffTide && d.diffTide[id]) || 0;
      text(c, D.name, x + 40, ry, { size: 13, weight: 900, color: D.color, alpha: best > 0 ? 1 : 0.45 });
      text(c, best ? fmtNum(best) : '—', x + w - 172, ry, { size: 13, weight: 800, align: 'right', color: PAL.text, alpha: best > 0 ? 0.95 : 0.35, mono: true });
      text(c, bt ? fmtTime(bt) : '—', x + w - 96, ry, { size: 13, weight: 800, align: 'right', color: PAL.text, alpha: bt > 0 ? 0.95 : 0.35, mono: true });
      text(c, D.endless ? (td ? ('T' + td) : '—') : (wn ? String(wn) : '—'), x + w - 40, ry, { size: 13, weight: 800, align: 'right', color: D.endless ? D.color : PAL.gold, alpha: (wn || td) ? 0.95 : 0.35, mono: true });
      c.save(); c.globalAlpha = 0.08; c.strokeStyle = '#fff'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(x + 40, ry + 10); c.lineTo(x + w - 40, ry + 10); c.stroke(); c.restore();
      ry += 30;
    }
    this.menu(c, [{ label: 'BACK', color: PAL.player, act: () => { G.state = 'title'; UI.lastState = ''; } }], VW / 2, y + h - 30, 40, { size: 18, w: 200, id: 'records' });
  },

  levelup(c) {
    this.begin('levelup');
    this.dim(c, 0.74);
    const n = G.cards.length;
    const cw = Math.max(96, Math.min(232, (VW - 44) / n - 14)), ch = Math.min(336, Math.max(250, VH * 0.56));
    const gap = Math.min(18, cw * 0.09);
    const total = n * cw + (n - 1) * gap;
    const x0 = VW / 2 - total / 2;
    const y = VH / 2 - ch / 2 + 12;

    const hz = clamp(cw / 232, 0.62, 1);
    tracked(c, G.chestQueue > 0 ? 'RELIC CACHE' : 'LEVEL ' + G.level, VW / 2, y - 42, {
      size: 30 * hz, weight: 900, align: 'center', color: G.chestQueue > 0 ? PAL.gold : PAL.xp,
      glow: G.chestQueue > 0 ? PAL.gold : PAL.xp, blur: 20, track: 7 * hz
    });
    text(c, 'choose a boon', VW / 2, y - 20, { size: 12.5 * hz, weight: 600, align: 'center', color: PAL.dim });

    // hover
    let hover = -1;
    for (let i = 0; i < n; i++) {
      const cx = x0 + i * (cw + gap);
      if (Input.mx > cx && Input.mx < cx + cw && Input.my > y && Input.my < y + ch) hover = i;
    }
    if (hover >= 0 && hover !== this.hoverIdx && Input.mmoved) { G.cardSel = hover; Sound.ui(false); }
    this.hoverIdx = hover;
    if (Input.hit('ArrowRight', 'd') || Input.gpPressed[15]) { G.cardSel = (G.cardSel + 1) % n; Sound.ui(false); }
    if (Input.hit('ArrowLeft', 'a') || Input.gpPressed[14]) { G.cardSel = (G.cardSel + n - 1) % n; Sound.ui(false); }
    for (let i = 0; i < n; i++) if (Input.hit(String(i + 1))) { G.cardSel = i; }

    for (let i = 0; i < n; i++) {
      const card = G.cards[i];
      const on = i === G.cardSel;
      const cx = x0 + i * (cw + gap);
      const lift = on ? 10 : 0;
      c.save();
      c.translate(cx + cw / 2, y + ch / 2 - lift);
      if (on) c.scale(1.045, 1.045);
      c.translate(-cw / 2, -ch / 2);
      // body
      c.save();
      const g = c.createLinearGradient(0, 0, 0, ch);
      g.addColorStop(0, 'rgba(16,18,38,0.97)');
      g.addColorStop(1, 'rgba(8,8,20,0.97)');
      c.fillStyle = g;
      roundRect(c, 0, 0, cw, ch, 14); c.fill();
      c.strokeStyle = on ? card.color : 'rgba(255,255,255,0.13)';
      c.lineWidth = on ? 2.4 : 1.2;
      if (on) { c.shadowColor = card.color; c.shadowBlur = 26; }
      c.stroke();
      c.restore();
      // top wash
      c.save();
      roundRect(c, 0, 0, cw, ch, 14); c.clip();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = on ? 0.2 : 0.09;
      c.drawImage(glowSprite(card.color), cw / 2 - cw * 0.9, -ch * 0.42, cw * 1.8, ch * 0.9);
      c.restore();
      // tag
      const tagW = Math.max(58 * hz, tracked(c, card.tag, 0, 0, { size: 10 * hz, measureOnly: true, track: 1.6 }) + 20 * hz);
      c.save();
      c.globalAlpha = 0.9;
      c.fillStyle = card.kind === 'evo' ? card.color : 'rgba(255,255,255,0.1)';
      roundRect(c, cw / 2 - tagW / 2, 15 * hz, tagW, 19 * hz, 9.5 * hz); c.fill();
      c.restore();
      tracked(c, card.tag, cw / 2, 28.5 * hz, { size: 10 * hz, weight: 800, align: 'center', color: card.kind === 'evo' ? '#12060f' : PAL.text, track: 1.6 });
      // icon
      const iy = ch * 0.33;
      const isz = Math.min(96, cw * 0.46);
      c.save();
      c.translate(cw / 2, iy);
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = on ? 0.5 : 0.28;
      c.drawImage(glowSprite(card.color), -isz * 0.72, -isz * 0.72, isz * 1.44, isz * 1.44);
      c.restore();
      c.save(); c.translate(cw / 2, iy); drawIcon(c, card.id, isz); c.restore();
      // name
      const nsz = Math.min(19, cw * 0.095);
      tracked(c, card.name, cw / 2, ch * 0.565, { size: nsz, weight: 900, align: 'center', color: card.color, glow: on ? card.color : null, blur: 14, track: nsz * 0.12 });
      // desc (wrapped)
      const dsz = Math.min(13, cw * 0.068);
      setFont(c, dsz, 600);
      const words = card.desc.split(' ');
      let line = '', ly = ch * 0.65;
      const maxw = cw - 22;
      for (const wd of words) {
        const test = line ? line + ' ' + wd : wd;
        if (c.measureText(test).width > maxw && line) {
          text(c, line, cw / 2, ly, { size: dsz, weight: 600, align: 'center', color: PAL.text, alpha: 0.85 });
          setFont(c, dsz, 600);
          line = wd; ly += dsz * 1.45;
        } else line = test;
      }
      if (line) text(c, line, cw / 2, ly, { size: dsz, weight: 600, align: 'center', color: PAL.text, alpha: 0.85 });
      // pips
      if (card.kind === 'wup' || card.kind === 'pass' || card.kind === 'wnew') {
        const cur = card.kind === 'wnew' ? 0 : (card.kind === 'wup' ? G.ownedWeapon(card.id).level : (G.passives[card.id] || 0));
        const pw = Math.min(11, cw * 0.055);
        for (let k = 0; k < 5; k++) {
          const px = cw / 2 - pw * 2 + k * pw, py = ch - 26;
          c.beginPath(); c.arc(px, py, pw * 0.31, 0, TAU);
          c.fillStyle = k < cur ? card.color : (k === cur ? '#ffffff' : 'rgba(255,255,255,0.16)');
          if (k === cur) { c.shadowColor = '#fff'; c.shadowBlur = 10; }
          c.fill(); c.shadowBlur = 0;
        }
      }
      if (card.pair && cw > 130) {
        const pd = PASSIVES[card.pair];
        text(c, 'evolves with', cw / 2, ch - 46, { size: 9.5, weight: 700, align: 'center', color: PAL.dim, alpha: 0.75 });
        text(c, pd.name, cw / 2, ch - 35, { size: 11, weight: 900, align: 'center', color: pd.color, alpha: 0.95 });
      }
      // key hint
      text(c, String(i + 1), 11, ch - 11, { size: 11.5, weight: 800, color: 'rgba(255,255,255,0.28)' });
      c.restore();
    }

    // reroll
    const rerollY = Math.min(VH - 16, y + ch + 32);
    const canReroll = G.rerolls > 0;
    tracked(c, canReroll ? 'R  REROLL  (' + G.rerolls + ')' : 'NO REROLLS', VW / 2, rerollY, {
      size: 14, weight: 800, align: 'center', color: canReroll ? PAL.gold : PAL.dim, alpha: canReroll ? 1 : 0.5, track: 2
    });
    if (canReroll && (Input.hit('r') || Input.gpPressed[2] ||
      (Input.mclick && Math.abs(Input.mx - VW / 2) < 90 && Math.abs(Input.my - rerollY + 5) < 16))) {
      G.rerolls--; G.cards = G.buildCards(); G.cardSel = 0; Sound.ui(false);
      return;
    }
    let fire = Input.hit('Enter', 'space') || Input.gpPressed[0];
    if (Input.mclick && hover >= 0) fire = true;
    for (let i = 0; i < n; i++) if (Input.hit(String(i + 1))) fire = true;
    if (fire && this.lockT <= 0) G.takeCard(G.cards[G.cardSel]);
  },

  paused(c) {
    this.begin('paused');
    this.dim(c, 0.66);
    tracked(c, 'PAUSED', VW / 2, VH * 0.3, { size: 44, weight: 900, align: 'center', color: PAL.player, glow: PAL.player, blur: 22, track: 10 });
    text(c, fmtTime(G.time) + '   ·   LV ' + G.level + '   ·   ' + fmtNum(G.score) + ' pts   ·   ' + G.kills + ' slain',
      VW / 2, VH * 0.3 + 30, { size: 13.5, weight: 700, align: 'center', color: PAL.dim });
    this.menu(c, [
      { label: 'RESUME', color: PAL.player, act: () => { G.state = 'playing'; } },
      { label: 'SETTINGS', color: '#8dff6b', act: () => { UI.settingsFrom = 'paused'; G.state = 'settings'; UI.lastState = ''; } },
      { label: 'ABANDON RUN', color: PAL.hp, act: () => { Sound.stopMusic(); G.state = 'title'; UI.lastState = ''; } }
    ], VW / 2, VH * 0.48, 50, { size: 22, w: 340, id: 'paused' });
  },

  endScreen(c, win) {
    this.begin(win ? 'win' : 'dead');
    this.dim(c, win ? 0.5 : 0.62);
    const col = win ? PAL.gold : PAL.hp;
    const DD = G.D;
    const hole = G.planet === EVENTIDE;
    let head = 'THE BLOOM FALLS', sub2 = 'the void is quiet again — for now';
    if (!win) {
      head = G.endless ? 'THE TIDE CLOSES' : (hole ? 'IT KEPT YOU' : 'CONSUMED');
      sub2 = G.endless ? 'nothing holds back a rising tide'
           : (hole ? 'nothing that falls in ever reports back' : 'the garden takes everything eventually');
    } else if (hole) {
      head = 'THE SOWER IS OUT';
      sub2 = 'you went all the way down, and you came back up';
    } else if (G.planet) {
      head = G.planet.name + ' IS YOURS';
      sub2 = 'one more world out of the dark';
    }
    tracked(c, head, VW / 2, VH * 0.22, {
      size: Math.min(52, VW * 0.055 * (head.length > 16 ? 0.82 : 1)), weight: 900, align: 'center', color: hole && win ? EVENTIDE.col : col, glow: hole && win ? EVENTIDE.col : col, blur: 26, track: 9
    });
    text(c, sub2, VW / 2, VH * 0.22 + 28, { size: 13, weight: 600, align: 'center', color: PAL.dim });
    tracked(c, DD.name + ' \u00b7 ' + DD.tag, VW / 2, VH * 0.22 + 48, { size: 11, weight: 900, align: 'center', color: DD.color, alpha: 0.8, track: 4 });

    const w = Math.min(470, VW - 60), h = (G.endless ? 238 : 196) + 42;
    const x = VW / 2 - w / 2, y = VH * 0.31;
    this.panel(c, x, y, w, h, win ? 'rgba(255,209,102,0.32)' : 'rgba(255,84,112,0.28)');
    const sc = Math.round(G.score);
    const pb = (Save.data.diffBest && Save.data.diffBest[G.diff]) || 0;
    const rows = [
      ['SURVIVED', fmtTime(G.time)],
      ['SCORE', fmtNum(sc) + (sc >= pb && sc > 0 ? '   NEW BEST' : '')],
      ['LEVEL', String(G.level)],
      ['SLAIN', String(G.kills)]
    ];
    if (G.endless) rows.push(['TIDE REACHED', '\u00d7' + G.tide]);
    rows.push(['SHARDS EARNED', '+' + fmtNum(G.lastEarned || 0)]);
    let ry = y + 40;
    for (const [k, v] of rows) {
      text(c, k, x + 34, ry, { size: 13, weight: 700, color: PAL.dim });
      text(c, v, x + w - 34, ry, { size: 19, weight: 900, align: 'right', color: v.indexOf('NEW BEST') >= 0 ? PAL.gold : PAL.text, mono: false });
      ry += 42;
    }
    const items = [];
    if (win && G.planet && G.planet.press && !G.actII) {
      items.push({ label: 'PRESS ON', color: PAL.boss, act: () => G.pressOn() });
    }
    if (win && !G.planet) items.push({ label: 'DESCEND DEEPER', color: PAL.boss, act: () => G.goEndless() });
    const again = G.planet ? G.planet.id : null;
    items.push({ label: 'RUN AGAIN', color: G.D.color,
      act: () => CG.midgameAd(() => { if (again) Descent.start(again, G.diff); else G.reset(G.diff); }) });
    if (G.D.daily) items.push({ label: 'DAILY STANDINGS', color: '#ffb347', act: () => { G.state = 'daily'; UI.lastState = ''; } });
    else items.push({ label: 'CHANGE DIFFICULTY', color: '#c9a3ff', act: () => { G.state = 'select'; UI.lastState = ''; } });
    items.push({ label: 'SKINS', color: PAL.gold, act: () => { G.state = 'skins'; UI.lastState = ''; } });
    items.push({ label: 'MAIN MENU', color: PAL.dim, act: () => { G.state = 'title'; UI.lastState = ''; } });
    this.menu(c, items, VW / 2, VH * 0.31 + h + 30, 36, { size: 17, w: 340, id: win ? 'win' : 'dead' });
  }
};


/* ========================================================================
   CRAZYGAMES  --  entirely optional. The SDK is only fetched when the game
   is actually running on their site, so the itch build and a local file
   stay self-contained and offline-clean. Every call is a guarded no-op
   when the SDK is not there.
   ======================================================================== */
const CG_ADS = true;   // set false to ship without between-run ads
const CG = {
  sdk: null, ready: false, playing: false, adBusy: false, wasMuted: false,

  wanted() {
    try {
      const h = location.hostname || '';
      const r = document.referrer || '';
      if (/(^|\.)crazygames\.(com|co\.uk)$/i.test(h)) return true;
      if (/crazygames\./i.test(r)) return true;
      if (/[?&]cg=1(&|$)/.test(location.search)) return true;
    } catch (e) { }
    return false;
  },

  init() {
    if (!this.wanted()) return;
    try {
      const s = document.createElement('script');
      s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
      s.async = true;
      s.onload = () => {
        try {
          this.sdk = window.CrazyGames && window.CrazyGames.SDK;
          if (!this.sdk) return;
          const done = () => { this.ready = true; this.call('game', 'loadingStop'); };
          if (this.sdk.init) { const r = this.sdk.init(); if (r && r.then) r.then(done, () => { }); else done(); }
          else done();
        } catch (e) { }
      };
      s.onerror = () => { };
      document.head.appendChild(s);
    } catch (e) { }
  },

  call(ns, fn, arg) {
    if (!this.ready || !this.sdk || !this.sdk[ns] || !this.sdk[ns][fn]) return null;
    try { return arg === undefined ? this.sdk[ns][fn]() : this.sdk[ns][fn](arg); } catch (e) { return null; }
  },

  /* the frame loop tells us what the game is doing; we tell them */
  setPlaying(on) {
    on = !!on && !this.adBusy;
    if (on === this.playing) return;
    this.playing = on;
    this.call('game', on ? 'gameplayStart' : 'gameplayStop');
  },

  win() { this.call('game', 'happytime'); },

  /* between runs only -- never during play. Falls straight through with no SDK. */
  midgameAd(then) {
    if (!CG_ADS || !this.ready || !this.sdk || !this.sdk.ad || this.adBusy) { then(); return; }
    this.adBusy = true;
    this.setPlaying(false);
    this.wasMuted = Sound.muted;
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      this.adBusy = false;
      try { if (!this.wasMuted) Sound.setMuted(false); } catch (e) { }
      then();
    };
    try { Sound.setMuted(true); } catch (e) { }
    // if their callbacks never come back, do not strand the player
    setTimeout(finish, 30000);
    try {
      this.sdk.ad.requestAd('midgame', {
        adFinished: finish,
        adError: finish,
        adStarted: () => { }
      });
    } catch (e) { finish(); }
  }
};

/* ========================================================================
   MAIN  --  canvas, loop, state routing
   ======================================================================== */
let VW = 1280, VH = 720, DPR = 1;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', { alpha: true, desynchronized: false });

Cam.base = 1;
const _camReset = Cam.reset.bind(Cam);
Cam.reset = function (x, y) { _camReset(x, y); Cam.zoom = Cam.tzoom = Cam.base; };

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = Math.max(320, window.innerWidth);
  VH = Math.max(240, window.innerHeight);
  cvs.width = Math.round(VW * DPR);
  cvs.height = Math.round(VH * DPR);
  cvs.style.width = VW + 'px';
  cvs.style.height = VH + 'px';
  Cam.base = clamp(Math.min(VW / 1280, VH / 720), 0.7, 1.4);
  if (Game.state !== 'playing' && Game.state !== 'paused' && Game.state !== 'levelup') Cam.zoom = Cam.tzoom = Cam.base;
}
addEventListener('resize', resize);

/* ------------------------------------------------------- title ambience */
const Ambient = {
  bits: [],
  init() {
    const kinds = ['drifter', 'swarmer', 'bulwark', 'spitter', 'splitter', 'wraith', 'howler', 'lancer', 'hexer', 'weaver', 'monolith'];
    for (let i = 0; i < 16; i++) {
      this.bits.push({
        id: kinds[i % kinds.length],
        x: rnd(-0.2, 1.2), y: rnd(-0.2, 1.2),
        vx: rnd(-0.012, 0.012), vy: rnd(-0.012, 0.012),
        rot: rnd(TAU), spin: rnd(-0.5, 0.5), s: rnd(0.5, 1.5), a: rnd(0.06, 0.2)
      });
    }
  },
  update(dt) {
    if (!this.bits.length) this.init();
    for (const b of this.bits) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.spin * dt;
      if (b.x < -0.25) b.x = 1.25; if (b.x > 1.25) b.x = -0.25;
      if (b.y < -0.25) b.y = 1.25; if (b.y > 1.25) b.y = -0.25;
    }
  },
  draw(c) {
    for (const b of this.bits) {
      drawSprite(c, enemySprite(ENEMY[b.id], false), b.x * VW, b.y * VH, b.rot, b.s, b.a);
    }
  }
};

/* ------------------------------------------------------------------ loop */
let last = performance.now(), acc = 0, fpsAcc = 0, fpsN = 0, fps = 60;
const STEP = 1 / 60;

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; adaptQuality(); FX.adapt(fps); Cosmos.adapt(fps); }

  Descent.tick(dt);
  Input.pollGamepad();
  if (Descent.busy()) { Input.pressed = Object.create(null); Input.mclick = false; Input.gpPressed = Object.create(null); }
  Input.pointerT = Math.max(0, Input.pointerT - dt);
  UI.lockT = Math.max(0, UI.lockT - dt);
  Sound.frame();
  Sound.tickMusic();
  G.uiT += dt;
  Ach.update(dt);

  const st = G.state;
  CG.setPlaying(st === 'playing');

  // global hotkeys
  if (st !== 'codes') {
    if (Input.hit('m')) { Sound.resume(); Sound.toggleMute(); }
    if (Input.hit('f')) { G.showFps = !G.showFps; Settings.fps = G.showFps; Settings.save(); }
  }
  if (st !== 'codes' && Input.textOn) { Input.textOn = false; Input.text = ''; }
  if ((st === 'select' || st === 'how' || st === 'records' || st === 'skins' || st === 'daily' || st === 'achievements' || st === 'conquest' || st === 'pets') && (Input.hit('Backspace') || Input.hit('Escape') || Input.gpPressed[1])) { G.state = 'title'; UI.lastState = ''; Sound.ui(false); }
  if ((st === 'planet' || st === 'relics') && (Input.hit('Backspace') || Input.hit('Escape') || Input.gpPressed[1])) { G.state = 'conquest'; UI.lastState = ''; Sound.ui(false); }
  if (st === 'codes' && (Input.hit('Escape') || Input.gpPressed[1])) UI.leaveCodes();
  if (st === 'settings' && (Input.hit('Backspace') || Input.hit('Escape') || Input.gpPressed[1])) { G.state = UI.settingsFrom === 'paused' ? 'paused' : 'title'; UI.lastState = ''; Sound.ui(false); }
  if (st === 'playing' && (Input.hit('p') || Input.hit('Escape') || Input.gpPressed[9])) { G.state = 'paused'; UI.lastState = ''; Sound.ui(false); }
  else if (st === 'paused' && (Input.hit('p') || Input.hit('Escape') || Input.gpPressed[9])) { G.state = 'playing'; Sound.ui(false); }

  if (st === 'playing') {
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 5) { G.update(STEP); acc -= STEP; steps++; if (G.state !== 'playing') break; }
    if (acc > 0.5) acc = 0;
    Cam.tzoom = Cam.base * (G.boss && !G.boss.dead ? 0.93 : 1);
  } else if (st === 'covenant') {
    Particles.update(dt * 0.25); Flash.update(dt);
    Cam.update(dt, G.player.x, G.player.y, 0, 0);
  } else if (st === 'levelup' || st === 'paused' || (st === 'settings' && UI.settingsFrom === 'paused')) {
    Particles.update(dt * 0.25);
    Flash.update(dt);
    Cam.update(dt, G.player.x, G.player.y, 0, 0);
  } else if (st === 'dead' || st === 'win') {
    G.time += 0;
    Particles.update(dt);
    Pops.update(dt);
    Flash.update(dt);
    Weapons.updateFx(dt);
    for (let i = G.fx.length - 1; i >= 0; i--) if (G.fx[i].life <= 0) G.fx.splice(i, 1);
    Cam.update(dt, G.player.x, G.player.y, 0, 0);
    if (st === 'win') for (const e of G.enemies) if (!e.dead) e.update(dt * 0.3);
  } else {
    Ambient.update(dt);
    Cam.x = Math.sin(G.uiT * 0.06) * 420;
    Cam.y = Math.cos(G.uiT * 0.045) * 320;
    Cam.zoom = Cam.tzoom = Cam.base;
    Flash.update(dt);
  }

  /* ------------------------------------------------------------- render */
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.imageSmoothingEnabled = true;

  if (st === 'settings' && UI.settingsFrom === 'paused') {
    UI.world(c); UI.hud(c); UI.settings(c);
  } else if (st === 'title' || st === 'how' || st === 'records' || st === 'select' || st === 'skins' || st === 'settings' || st === 'daily' || st === 'achievements' || st === 'conquest' || st === 'planet' || st === 'relics' || st === 'pets' || st === 'codes') {
    Cosmos.req = null;
    const cosOn = Cosmos.show();
    if (cosOn) c.clearRect(0, 0, VW, VH);
    else { Cosmos.hide(); Backdrop.draw(c, G.uiT); }
    Ambient.draw(c);
    if (st === 'title') UI.title(c, false);
    else if (st === 'how') { UI.title(c, true); UI.how(c); }
    else if (st === 'select') { UI.title(c, true); UI.select(c); }
    else if (st === 'skins') { UI.skins(c); }
    else if (st === 'achievements') { UI.achievements(c); }
    else if (st === 'settings') { UI.title(c, true); UI.settings(c); }
    else if (st === 'daily') { UI.daily(c); }
    else if (st === 'conquest') { UI.conquest(c); }
    else if (st === 'planet') { UI.planetView(c); }
    else if (st === 'relics') { UI.relics(c); }
    else if (st === 'codes') { UI.codes(c); }
    else if (st === 'pets') { UI.pets(c); }
    else { UI.title(c, true); UI.records(c); }
    if (cosOn) {
      const q = Cosmos.req;
      Cosmos.render(G.uiT, q && q.planets, q ? q.sel : -1, q && q.hero, q ? q.deep : 0);
    }
  } else {
    UI.world(c);
    UI.hud(c);
    if (st === 'levelup') UI.levelup(c);
    else if (st === 'covenant') UI.covenant(c);
    else if (st === 'paused') UI.paused(c);
    else if (st === 'dead') UI.endScreen(c, false);
    else if (st === 'win') UI.endScreen(c, true);
  }
  if (G.sowerLine && G.sowerLine.t > 0) {
    G.sowerLine.t -= dt;
    const L = G.sowerLine;
    const a = Math.min(1, L.t / 0.8) * Math.min(1, (4.2 - L.t) / 0.35);
    text(c, L.text, VW / 2, VH * 0.63, { size: 15, weight: 700, align: 'center', italic: true,
      color: L.col, alpha: Math.max(0, a) * 0.92 });
  }
  Ach.draw(c);
  Flash.draw(c);

  // subtle grain
  if (G.quality > 0) {
    c.save();
    c.globalAlpha = 0.035;
    c.fillStyle = grainPattern(c);
    c.fillRect(0, 0, VW, VH);
    c.restore();
  }
  // the light coming off everything the 2D canvas just drew
  FX.run(st === 'playing' || st === 'paused' || st === 'levelup' || st === 'covenant'
         || st === 'dead' || st === 'win' ? 1.0 : 0.82);
  Grille.sync(st);

  if (G.showFps) {
    text(c, Math.round(fps) + ' fps' + (G.quality ? '' : ' (lite)'), 8, VH - 8, { size: 11, weight: 700, color: 'rgba(150,170,220,0.7)', mono: true });
  }

  Input.endFrame();
}

let _grain = null;
function grainPattern(c) {
  if (!_grain) {
    const t = makeCanvas(64, 64);
    const g = t.getContext('2d');
    const d = g.createImageData(64, 64);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = 128 + (rand() * 90 - 45);
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
      d.data[i + 3] = 255;
    }
    g.putImageData(d, 0, 0);
    _grain = c.createPattern(t, 'repeat');
  }
  return _grain;
}

let _lowFrames = 0;
function adaptQuality() {
  if (fps < 42) _lowFrames++; else _lowFrames = 0;
  if (_lowFrames >= 3 && G.quality > 0 && Settings.effects) {
    G.quality = 0; Particles.max = 800; G.enemyCap = 200; Backdrop.lite = true;
  } else if (fps > 57 && G.quality === 0 && Settings.effects) {
    // restore the difficulty's own cap, not a hardcoded one
    G.quality = 1; Particles.max = 2600; G.enemyCap = (G.D && G.D.cap) || 340; Backdrop.lite = false;
  }
}

/* ------------------------------------------------------------------ boot */
function boot() {
  G = Game;
  G.uiT = 0;
  Save.load();
  Input.init(cvs);
  resize();
  G.player = new Player(0, 0);
  G.grid = new Grid(90);
  G.recomputeStats();
  Backdrop.build();
  Settings.load();
  G.showFps = Settings.fps;
  if (!Settings.effects) { G.quality = 0; Particles.max = 800; Backdrop.lite = true; }
  Cam.reset(0, 0);
  const kick = () => { Sound.resume(); };
  // in an itch.io / portal iframe the keyboard only reaches us once the frame
  // has focus, and a click on the canvas is the one moment we are allowed to take it
  const grab = () => { try { if (window.self !== window.top) window.focus(); } catch (e) { } };
  addEventListener('pointerdown', grab);
  addEventListener('touchstart', grab, { passive: true });
  addEventListener('pointerdown', kick, { once: true });
  addEventListener('keydown', kick, { once: true });
  addEventListener('touchstart', kick, { once: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.state === 'playing') { G.state = 'paused'; UI.lastState = ''; }
  });
  try {
    window.VOIDBLOOM = {
      Game: Game, Input: Input, Sound: Sound, Particles: Particles, Pops: Pops,
      UI: UI, Weapons: Weapons, Cam: Cam, ENEMY: ENEMY, WEAPONS: WEAPONS,
      Cosmos: Cosmos, FX: FX, Grille: Grille, Codes: Codes, codeHash: codeHash,
      PASSIVES: PASSIVES, Save: Save, Backdrop: Backdrop, Flash: Flash, Cam2: Cam, fps: function () { return fps; },
      SKINS: SKINS, ACHS: ACHS, Ach: Ach, DIFFS: DIFFS, paintSkin: paintSkin, CG: CG,
      Settings: Settings, MID_BOSSES: MID_BOSSES, DAILY_BOSSES: DAILY_BOSSES,
      shardsFor: shardsFor, dailySeed: dailySeed, dailyKey: dailyKey
    };
  } catch (e) { }
  CG.init();
  const bootEl = document.getElementById('boot');
  if (bootEl) bootEl.className = 'gone';
  requestAnimationFrame(frame);
}
boot();
})();
</script>
