name: Build and release

# Runs when you push a tag that looks like v1.0.1
# (and can be run by hand from the Actions tab for a dry run).
#
# How it ships (changed 23 Nov 2026):
#   1. "windows" and "macos" build at the same time but DO NOT publish.
#      Each one just hands its files to the last job.
#   2. "release" waits for BOTH, then makes ONE release for the tag with the
#      Windows installer and the Mac downloads together.
#
# Before this, both builds published by themselves at the same moment, each
# made its own draft release, and you got two drafts with the same tag that
# could not both be posted. If either build fails now, nothing is released.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write        # needed to create the Release and upload the installer

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make sure the tag matches the version in package.json
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag is v$TAG but package.json says $PKG."
            echo "Bump the version in package.json, commit it, then re-tag."
            exit 1
          fi
          echo "version $PKG"

      # Cheap checks that catch the mistakes that actually happen: copying the
      # wrong file in, or copying the instrumented test build by accident.
      # Deliberately not a full Electron run -- a flaky test that blocks a
      # release is worse than no test. Run `npm test` locally for that.
      - name: Sanity-check the game file
        shell: bash
        run: |
          F=game/VOIDBLOOM.html
          test -f "$F" || { echo "::error::$F is missing"; exit 1; }
          SIZE=$(wc -c < "$F")
          echo "game file: $SIZE bytes"
          [ "$SIZE" -gt 100000 ] || { echo "::error::$F is only $SIZE bytes - wrong file?"; exit 1; }
          grep -q "boot();" "$F" || { echo "::error::$F has no boot() call - not a playable build"; exit 1; }
          if grep -q "__VB" "$F"; then
            echo "::error::$F contains the __VB debug hook. That is TEST_BUILD.html, not the shipping file."
            exit 1
          fi
          # publish target must be filled in, or updates silently never arrive
          OWNER=$(node -p "require('./package.json').build.publish[0].owner")
          if [ "$OWNER" = "REPLACE_WITH_YOUR_GITHUB_USERNAME" ]; then
            echo "::error::Set your GitHub username in package.json -> build.publish[0].owner, or auto-update will never find releases."
            exit 1
          fi
          echo "publishing to $OWNER"

      # Build only. The "release" job at the bottom publishes, once both
      # Windows and Mac are done.
      - name: Build the installer
        run: npx electron-builder --win --publish never

      - name: Hand the files to the release job
        uses: actions/upload-artifact@v4
        with:
          name: VOIDBLOOM-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  # ------------------------------------------------------------------ mac
  #
  # A macOS app can only be assembled on macOS -- the .dmg and the .app
  # bundle both need Apple's own tooling -- so this job has to run on a mac
  # runner. GitHub gives those away free on public repositories.
  #
  # It builds unsigned by default, which costs nothing. If an Apple
  # Developer certificate is ever added to the repo secrets, the same job
  # signs and notarizes instead, with no edit needed here.
  macos:
    runs-on: macos-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make sure the tag matches the version in package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag is v$TAG but package.json says $PKG."
            exit 1
          fi
          echo "version $PKG"

      - name: Sanity-check the game file
        run: |
          F=game/VOIDBLOOM.html
          test -f "$F" || { echo "::error::$F is missing"; exit 1; }
          SIZE=$(wc -c < "$F")
          echo "game file: $SIZE bytes"
          [ "$SIZE" -gt 100000 ] || { echo "::error::$F is only $SIZE bytes - wrong file?"; exit 1; }
          grep -q "boot();" "$F" || { echo "::error::$F has no boot() call - not a playable build"; exit 1; }
          if grep -q "__VB" "$F"; then
            echo "::error::$F contains the __VB debug hook. That is TEST_BUILD.html, not the shipping file."
            exit 1
          fi

      # Build only. The "release" job at the bottom publishes.
      - name: Build the mac app
        env:
          # All five are optional. With none of them set the build is
          # unsigned and free; set them and the same command signs and
          # notarizes instead.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Signing certificate found - building signed and notarized."
            npx electron-builder --mac --publish never --config.mac.notarize=true
          else
            echo "No signing certificate - building unsigned. This is the free path."
            echo "Players will need to clear the quarantine flag once; see README."
            # A secret that does not exist arrives as an EMPTY STRING, not as
            # an unset variable -- and electron-builder treats an empty
            # CSC_LINK as "a certificate path was given" (its getCscLink is
            # literally commented "allow to specify as empty string", and its
            # chooseNotNull only skips null/undefined, never ""). It then
            # tries to resolve "" as a file, lands on the checkout directory
            # and dies with "<repo path> not a file".
            #
            # So these have to be removed from the environment, not just left
            # blank, before electron-builder is invoked.
            unset CSC_LINK CSC_KEY_PASSWORD
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            # and stop it hunting the runner keychain for an identity that
            # is not there
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --publish never
          fi

      - name: Hand the files to the release job
        uses: actions/upload-artifact@v4
        with:
          name: VOIDBLOOM-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  # -------------------------------------------------------------- release
  #
  # Runs only after BOTH builds succeeded, and makes ONE release for the tag
  # with everything in it: the Windows installer, both Mac downloads, and
  # latest.yml / latest-mac.yml, which the auto-updater reads.
  #
  # It goes up as a normal published release, so installed copies update
  # straight away. To get a draft you check and post by hand instead, change
  # AS_DRAFT below to "true". (Auto-update ignores a release until it is
  # posted.)
  release:
    needs: [windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Collect the Windows and Mac files
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish one release with everything
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          AS_DRAFT: "false"
        run: |
          set -euo pipefail
          echo "files going into $TAG:"
          ls -la out

          # both sides must be there, or the auto-updater breaks for someone
          test -f out/latest.yml     || { echo "::error::latest.yml (Windows) is missing"; exit 1; }
          test -f out/latest-mac.yml || { echo "::error::latest-mac.yml (Mac) is missing"; exit 1; }
          ls out/*.exe >/dev/null 2>&1 || { echo "::error::the Windows installer is missing"; exit 1; }
          ls out/*.dmg >/dev/null 2>&1 || { echo "::error::the Mac .dmg is missing"; exit 1; }

          # the release notes are the message you typed in UPDATE GAME.bat
          NOTES=$(gh api "repos/$REPO/commits/$GITHUB_SHA" --jq .commit.message)

          # Clear out leftover DRAFTS for this tag (e.g. the duplicate pair the
          # old setup made, or one from an earlier failed run), so there is
          # never more than one release per tag.
          for id in $(gh api "repos/$REPO/releases?per_page=100" \
                        --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id"); do
            echo "removing leftover draft $id for $TAG"
            gh api -X DELETE "repos/$REPO/releases/$id"
          done

          DRAFT_FLAG=""
          if [ "$AS_DRAFT" = "true" ]; then DRAFT_FLAG="--draft"; fi

          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            # a posted release for this tag already exists (re-run): refresh its files
            echo "release $TAG already exists - replacing its files"
            gh release upload "$TAG" out/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" out/* --repo "$REPO" \
              --title "VOIDBLOOM ${TAG#v}" --notes "$NOTES" --verify-tag $DRAFT_FLAG
          fi
          echo "done: https://github.com/$REPO/releases/tag/$TAG"
